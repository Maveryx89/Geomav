<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tour virtual</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="css/tour.css">
</head>
<body>

<div id="pano"></div>

<!-- Pantalla de carga -->
<div id="loader">
  <img id="loaderLogo" alt="" hidden>
  <div id="loaderBar"><span></span></div>
</div>

<!-- Barra superior -->
<header id="topbar">
  <button id="btnMenu" class="icon-btn" aria-label="Escenas" title="Escenas">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div id="titles">
    <div id="tourTitle"></div>
    <div id="sceneName"></div>
  </div>
  <img id="topLogo" alt="" hidden>
</header>

<!-- Menú lateral de escenas -->
<aside id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <input id="search" type="search" placeholder="Buscar escena…" autocomplete="off">
    <button id="btnCloseDrawer" class="icon-btn small" aria-label="Cerrar">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="sectors"></div>
  <ul id="sceneList"></ul>
</aside>

<!-- Barra de controles -->
<nav id="controls">
  <button id="btnPrev" class="icon-btn" aria-label="Anterior" title="Escena anterior">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button id="btnAuto" class="icon-btn" aria-label="Giro automático" title="Giro automático">
    <svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 1 2.1 5M5 12V7M5 12h5"/></svg>
  </button>
  <button id="btnGyro" class="icon-btn" aria-label="Giroscopio" title="Giroscopio" hidden>
    <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>
  </button>
  <button id="btnZoomOut" class="icon-btn" aria-label="Alejar" title="Alejar (−)">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8 11h6"/></svg>
  </button>
  <button id="btnZoomIn" class="icon-btn" aria-label="Acercar" title="Acercar (+)">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8 11h6M11 8v6"/></svg>
  </button>
  <button id="btnShare" class="icon-btn" aria-label="Compartir" title="Compartir">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M8 11l8-4M8 13l8 4"/></svg>
  </button>
  <button id="btnFull" class="icon-btn" aria-label="Pantalla completa" title="Pantalla completa">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="btnNext" class="icon-btn" aria-label="Siguiente" title="Escena siguiente">
    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</nav>

<div id="tip" role="tooltip"></div>
<div id="toast" role="status"></div>

<script src="lib/marzipano.js"></script>
<script src="config.js"></script>
<script src="tour.js"></script>
<script src="js/gyro.js"></script>
<script src="js/tour.js"></script>
<script src="js/teselas.js"></script>
<script src="js/cargar.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
