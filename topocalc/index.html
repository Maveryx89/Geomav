/* Informe tipo "certificado" (carta) para Chequeo de Nivel, de Teodolito y de Estación Total.
   Recalcula desde los campos del formulario con las mismas funciones calcNivelDosEstacas /
   calcDosCaras / calcConstanteEDM, y suma datos opcionales (cliente, equipo, condiciones). */
const VR_TOOLS = ['chequeoNivel','chequeoTeodolito','chequeoEstacion'];
const VR_CFG = {
  chequeoNivel:{tipo:'Nivel', base:['Condición física','Niveles (circular)','Tornillos','Compensador']},
  chequeoTeodolito:{tipo:'Teodolito', base:['Condición física','Nivel tubular / esférico','Tornillos','Plomada óptica / láser']},
  chequeoEstacion:{tipo:'Estación total', base:['Condición física','Nivel tubular / esférico','Tornillos','Plomada óptica / láser']}
};
const VR_APAR = ['Color','Limpieza','Estuche y accesorios'];
const VR_SAVE = ['cliente','rut','operador','lugar'];
function vrEsc(x){ return String(x==null?'':x).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function vrDatosHtml(toolId){
  let sv = {}; try{ sv = JSON.parse(localStorage.getItem('topocalc_vr')||'{}'); }catch(e){}
  const t = (id,label)=>`<div class="field-row"><label for="vr_${id}">${label}</label><input type="text" id="vr_${id}" value="${vrEsc(sv[id]||'')}"></div>`;
  const chk = (p,arr)=>arr.map((x,i)=>`<label class="vr-chk"><input type="checkbox" id="vr_${p}${i}"> ${x}</label>`).join('');
  return `<div class="field-card"><details class="vr-datos"><summary>Datos del informe (opcional)</summary>
    <p class="tool-blurb" style="margin:8px 0 0;">Estos datos solo se usan al presionar “Exportar informe”. Lo que dejes en blanco aparece como “—”.</p>
    <div class="vr-sub">Cliente</div>${t('cliente','Otorgado a')}${t('rut','RUT')}
    <div class="vr-sub">Equipo</div>${t('marca','Marca')}${t('modelo','Modelo')}${t('serie','N° de serie')}${t('caract','Características (aumento, precisión…)')}
    <div class="vr-sub">Condiciones</div>${t('lugar','Lugar')}${t('temp','Temperatura (°C)')}${t('hum','Humedad relativa (%)')}${t('operador','Operador / responsable')}
    <div class="vr-sub">Revisión visual (marca lo que está OK)</div>${chk('b',VR_CFG[toolId].base)}${chk('a',VR_APAR)}
  </details></div>`;
}
function vrWire(){
  VR_SAVE.forEach(id=>{
    const el = document.getElementById('vr_'+id);
    if(!el) return;
    el.addEventListener('input', ()=>{
      try{
        const sv = JSON.parse(localStorage.getItem('topocalc_vr')||'{}');
        sv[id] = el.value; localStorage.setItem('topocalc_vr', JSON.stringify(sv));
      }catch(e){}
    });
  });
}
/* Devuelve el HTML del informe o {error:'...'} si faltan datos */
function buildInformeVerificacion(toolId){
  const cfg = VR_CFG[toolId];
  const g = id=>{ const e=document.getElementById(id); return e?e.value.trim():''; };
  const ck = id=>{ const e=document.getElementById(id); return !!(e && e.checked); };
  const dash = x=> x ? vrEsc(x) : '—';
  const sg = (v,d)=> (v>=0?'+':'−')+fmtNum(Math.abs(v),d);
  const okTd = ok=>`<td class="c ${ok?'vr-ok':'vr-bad'}">${ok?'CONFORME':'AJUSTAR EQUIPO'}</td>`;
  if(!document.querySelector('.tool-view .results')) return {error:'Completa el formulario y presiona Calcular antes de exportar.'};
  let leyenda, proc, datos, resultados, calib, metodo, diagramas = [];
  const c = (t,cls)=>`<td class="c${cls?' '+cls:''}">${t}</td>`;
  const hdr = arr=>`<tr>${arr.map(h=>`<th class="c">${h}</th>`).join('')}</tr>`;
  document.querySelectorAll('.tool-view .plot-wrap svg').forEach(sv=>diagramas.push(sv.outerHTML));
  if(toolId==='chequeoNivel'){
    const D=val('cn_D'), d=val('cn_d'), a1=val('cn_a1'), b1=val('cn_b1'), a2=val('cn_a2'), b2=val('cn_b2');
    if([D,d,a1,b1,a2,b2].some(isNaN) || D<=0 || d<0 || d>=D) return {error:'Revisa las lecturas y distancias antes de exportar.'};
    const r = calcNivelDosEstacas(a1,b1,a2,b2,D,d);
    leyenda = 'GEOMAV VERIFICA EL ERROR DE COLIMACIÓN DEL NIVEL MEDIANTE LA PRUEBA DE LAS DOS ESTACAS, SEGÚN LAS TOLERANCIAS INDICADAS EN ESTE INFORME';
    proc = 'Prueba de las dos estacas';
    calib = [['Horizontalidad (colimación)', r.ok]];
    datos = `<table class="vr-t">${hdr(['POSICIÓN','DISTANCIA NIVEL–A','LECTURA EN A','LECTURA EN B','DESNIVEL A–B'])}
      <tr><td>1 — nivel centrado entre A y B (D = ${fmtNum(D,3)} m)</td>${c(fmtNum(D/2,3)+' m')}${c(fmtNum(a1,4)+' m')}${c(fmtNum(b1,4)+' m')}${c('<b>'+fmtNum(r.dhTrue,4)+' m</b>')}</tr>
      <tr><td>2 — nivel cerca de A</td>${c(fmtNum(d,3)+' m')}${c(fmtNum(a2,4)+' m')}${c(fmtNum(b2,4)+' m')}${c('<b>'+fmtNum(r.dhApp,4)+' m</b>')}</tr></table>`;
    resultados = `<table class="vr-t">${hdr(['ENSAYO','VALOR PATRÓN (POS. 1)','VALOR LEÍDO (POS. 2)','ERROR','TOLERANCIA','RESULTADO'])}
      <tr><td>Desnivel A–B</td>${c(fmtNum(r.dhTrue,4)+' m')}${c(fmtNum(r.dhApp,4)+' m')}${c(sg(r.errMM30,1)+' mm / 30 m','err')}${c('≤ 3 mm / 30 m')}${okTd(r.ok)}</tr>
      <tr><td>Lectura correcta en B (para ajustar)</td>${c('—')}${c(fmtNum(r.bCorrecta,4)+' m')}${c('—')}${c('—')}${c('—')}</tr></table>`;
    metodo = 'Prueba de las dos estacas: posición 1 con el nivel centrado entre A y B (el error de colimación se anula y da el desnivel verdadero); posición 2 con el nivel junto a A.<br>e = [(a2 − b2) − (a1 − b1)] / (dA2 − dB2) &nbsp;·&nbsp; Error a 30 m = e × 30 000 mm &nbsp;·&nbsp; Lectura correcta en B = a2 − (a1 − b1)';
  } else {
    const p = toolId==='chequeoEstacion' ? 'ce' : 'ct';
    const hzFL=readAngleField(p+'_hzfl'), hzFR=readAngleField(p+'_hzfr'), zFL=readAngleField(p+'_zfl'), zFR=readAngleField(p+'_zfr');
    if([hzFL,hzFR,zFL,zFR].some(isNaN)) return {error:'Completa las cuatro lecturas de ambas caras antes de exportar.'};
    const r = calcDosCaras(hzFL,hzFR,zFL,zFR);
    let E = null;
    if(p==='ce'){
      const ab=val('ce_ab'), bc=val('ce_bc'), ac=val('ce_ac');
      if([ab,bc,ac].some(isNaN)) return {error:'Completa las tres distancias del EDM antes de exportar.'};
      E = Object.assign({ab,bc,ac}, calcConstanteEDM(ab,bc,ac));
    }
    leyenda = E ? 'GEOMAV VERIFICA LA COLIMACIÓN HORIZONTAL, EL ÍNDICE VERTICAL Y LA CONSTANTE ADITIVA DEL EDM DEL EQUIPO, SEGÚN LAS TOLERANCIAS INDICADAS EN ESTE INFORME'
                : 'GEOMAV VERIFICA LA COLIMACIÓN HORIZONTAL Y EL ÍNDICE VERTICAL DEL EQUIPO POR EL MÉTODO DE LAS DOS CARAS, SEGÚN LAS TOLERANCIAS INDICADAS EN ESTE INFORME';
    proc = E ? 'Dos caras (CI / CD) + EDM' : 'Dos caras (CI / CD)';
    calib = [['Colimación horizontal (C)', r.okC], ['Índice vertical (i)', r.okI]];
    if(E) calib.push(['Constante EDM (K)', E.ok]);
    datos = `<table class="vr-t">${hdr(['LECTURA','CARA IZQUIERDA (CI)','CARA DERECHA (CD)','DIFERENCIA'])}
      <tr><td>Horizontal a la mira (Hz)</td>${c(fmtAngle(hzFL))}${c(fmtAngle(hzFR))}${c('CD − CI − 180° = '+sg(2*r.Csec,1)+'"')}</tr>
      <tr><td>Vertical cenital a la mira (Z)</td>${c(fmtAngle(zFL))}${c(fmtAngle(zFR))}${c('CI + CD − 360° = '+sg(2*r.isec,1)+'"')}</tr>
      ${E?`<tr><td>Línea base A–B–C (EDM)</td>${c('AB = '+fmtNum(E.ab,4)+' m')}${c('BC = '+fmtNum(E.bc,4)+' m')}${c('AC = '+fmtNum(E.ac,4)+' m')}</tr>`:''}</table>`;
    resultados = `<table class="vr-t">${hdr(['ENSAYO','VALOR PATRÓN','VALOR LEÍDO','ERROR','TOLERANCIA','RESULTADO'])}
      <tr><td>Colimación horizontal (C)</td>${c('CD = CI + 180°')}${c('Hz medio: '+fmtAngle(r.hzMean))}${c(sg(r.Csec,1)+'"','err')}${c('≤ 20"')}${okTd(r.okC)}</tr>
      <tr><td>Índice vertical (i)</td>${c('CI + CD = 360°')}${c('Z corregido: '+fmtAngle(r.zMean))}${c(sg(r.isec,1)+'"','err')}${c('≤ 20"')}${okTd(r.okI)}</tr>
      ${E?`<tr><td>Constante aditiva EDM (K)</td>${c('AB + BC = AC')}${c(fmtNum(E.ab+E.bc,4)+' m (AB+BC)')}${c(sg(E.K*1000,1)+' mm','err')}${c('≤ 5 mm')}${okTd(E.ok)}</tr>`:''}</table>`;
    metodo = 'Dos caras apuntando al mismo punto: C = (Hz_CD − Hz_CI − 180°) / 2 &nbsp;·&nbsp; i = (Z_CI + Z_CD − 360°) / 2.'+(E?' Constante del EDM sobre línea base A–B–C colineal: K = (AB + BC) − AC.':'')+'<br>Valores corregidos: Hz medio = Hz_CI + C &nbsp;·&nbsp; Z corregido = Z_CI − i.';
  }
  const items = (arr)=>arr.map(([t,ok])=>`<p>${t} &nbsp;<b class="${ok?'vr-ok':'vr-bad'}">${ok?'OK':'AJUSTAR'}</b></p>`).join('');
  const chk = (p,arr)=>arr.map((t,i)=>`<p>${t} &nbsp;<b class="${ck('vr_'+p+i)?'vr-ok':'vr-na'}">${ck('vr_'+p+i)?'OK':'—'}</b></p>`).join('');
  const hoy = new Date(), pad = n=>String(n).padStart(2,'0');
  const iso = dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  const prox = new Date(hoy.getFullYear(), hoy.getMonth()+6, Math.min(hoy.getDate(), 28));
  const nInf = `TB-${hoy.getFullYear()}${pad(hoy.getMonth()+1)}${pad(hoy.getDate())}-${pad(hoy.getHours())}${pad(hoy.getMinutes())}`;
  const equipo = [cfg.tipo, g('vr_marca'), g('vr_modelo')].filter(Boolean).map(vrEsc).join(' ');
  const logo = document.querySelector('.brand-logo');
  const caractLines = [`<p>Tipo: ${cfg.tipo}</p>`, g('vr_marca')||g('vr_modelo') ? `<p>Marca / modelo: ${dash([g('vr_marca'),g('vr_modelo')].filter(Boolean).join(' '))}</p>` : '', `<p>N° de serie: ${dash(g('vr_serie'))}</p>`, g('vr_caract')?`<p>${vrEsc(g('vr_caract'))}</p>`:''].join('');
  return `<div class="vr-top">
      <div class="vr-brand">${logo?`<img src="${logo.src}" alt="GEOMAV">`:''}<div><b>GEOMAV</b><i>Topo de Bolsillo</i><small>Cálculos topográficos y geodésicos</small></div></div>
      <div class="vr-marca">${vrEsc(g('vr_marca')).toUpperCase()}</div>
      <div class="vr-right">AÑO: ${hoy.getFullYear()}<br>N° Informe - ${nInf}<u>INFORME DE VERIFICACIÓN</u></div>
    </div><div class="vr-line"></div>
    <table class="vr-meta"><tr><td class="k">OTORGADO A:</td><td>${dash(g('vr_cliente'))}</td><td class="k">RUT:</td><td>${dash(g('vr_rut'))}</td></tr>
      <tr><td class="k">EQUIPO:</td><td>${equipo}</td><td class="k">FECHA DE EMISIÓN:</td><td>${iso(hoy)}</td></tr>
      <tr><td class="k">SERIE:</td><td>${dash(g('vr_serie'))}</td><td class="k">PROCEDIMIENTO:</td><td>${proc}</td></tr></table>

    <div class="vr-sec">RESULTADOS DE LA VERIFICACIÓN</div><div class="vr-gap"></div>${datos}<div class="vr-gap"></div>${resultados}
    ${diagramas.length?`<div class="vr-sec">DIAGRAMA</div><div class="vr-diag">${diagramas.join('')}</div>`:''}

/* ===================== EXPORTAR INFORME / COMPARTIR CAPTURA (genérico) ===================== */
/* Recorre el formulario y los resultados ya en pantalla de la herramienta actual (sin
   volver a calcular nada) para armar el mismo tipo de informe que usamos en la revisión
   en papel: logo, título, datos de entrada, resultados y diagrama(s). */
function collectToolReportData(){
  const container = document.querySelector('.tool-view');
  if(!container) return null;
  const groups = [];
  let current = {header:null, fields:[]};
  container.querySelectorAll('.field-card').forEach(card=>{
    card.querySelectorAll('h3, h4, .field-row').forEach(el=>{
      if(el.tagName==='H3' || el.tagName==='H4'){
        if(current.fields.length) groups.push(current);
        current = {header: el.textContent.trim(), fields: []};
      } else {
        const label = el.querySelector('label');
        const inputs = el.querySelectorAll('input, select');
        if(!label || !inputs.length) return;
        let value;
        if(inputs.length===1){
          const elIn = inputs[0];
          value = elIn.tagName==='SELECT' ? (elIn.options[elIn.selectedIndex]?elIn.options[elIn.selectedIndex].textContent:'') : elIn.value;
        } else {
          value = Array.from(inputs).map(e=>e.value).join(' ');
        }
        current.fields.push({label: label.textContent.trim(), value});
      }
    });
  });
  if(current.fields.length) groups.push(current);

  const resultBlocks = [];
  container.querySelectorAll('.results').forEach(rb=>{
    const rows = [];
    rb.querySelectorAll(':scope > .result-row').forEach(row=>{
      const k = row.querySelector('.k'), v = row.querySelector('.v');
      if(!k || !v) return;
      rows.push({label:k.textContent.trim(), value:v.textContent.trim(), accent:v.classList.contains('accent')});
    });
    if(rows.length) resultBlocks.push(rows);
  });

  const tables = [];
  container.querySelectorAll('table.data-table').forEach(t=>tables.push(t.outerHTML));

  const diagrams = [];
  container.querySelectorAll('.plot-wrap svg').forEach(svg=>diagrams.push(svg.outerHTML));

  return {groups, resultBlocks, tables, diagrams};
}

function wireToolActions(toolId){
  const exportBtn = document.getElementById('btnExportInforme');
  const shareBtn = document.getElementById('btnShareCapture');
  const msg = document.getElementById('actionMsg');
  if(!exportBtn) return;

  exportBtn.addEventListener('click', ()=>{
    if(VR_TOOLS.includes(toolId)){
      const vr = buildInformeVerificacion(toolId);
      if(vr.error){ msg.textContent = vr.error; return; }
      msg.textContent = '';
      let pa = document.getElementById('printArea');
      if(!pa){ pa = document.createElement('div'); pa.id='printArea'; document.body.appendChild(pa); }
      pa.className = 'vr'; pa.innerHTML = vr; document.body.classList.add('vr-printing');
      window.addEventListener('afterprint', ()=>{ pa.className=''; document.body.classList.remove('vr-printing'); }, {once:true});
      window.print();
      return;
    }
    const data = collectToolReportData();
    if(!data || (!data.resultBlocks.length && !data.diagrams.length)){
      msg.textContent = 'Completa el formulario y presiona Calcular antes de exportar.';
      return;
    }
    const logo = document.querySelector('.brand-logo');
    const name = TOOLS[toolId].name;
    const now = new Date();
    const fecha = now.toLocaleDateString('es-CL')+' · '+now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    let html = `<div class="pr-header">
      <div class="pr-header-left">${logo?`<img src="${logo.src}" alt="Topo de Bolsillo">`:''}<div class="pr-brand">Topo de Bolsillo<small>CÁLCULOS TOPOGRÁFICOS Y GEODÉSICOS</small></div></div>
      <div class="pr-meta">Fecha: ${fecha}<br>Sistema angular: ${angleSystem==='cent'?'Centesimal (gon)':'Sexagesimal (° \' \")'}</div>
    </div>
    <h1>${name}</h1>
    <p class="pr-desc">${document.querySelector('.tool-blurb')?document.querySelector('.tool-blurb').textContent:''}</p>`;
    if(data.groups.length){
      html += `<div class="pr-section-label">Datos de entrada</div>`;
      data.groups.forEach(g=>{
        if(g.header) html += `<div style="font-weight:700;font-size:11.5px;margin:6px 0 2px;">${g.header}</div>`;
        html += `<table class="pr-fields">`+g.fields.map(f=>`<tr><td class="k">${f.label}</td><td class="v">${f.value}</td></tr>`).join('')+`</table>`;
      });
    }
    if(data.resultBlocks.length){
      html += `<div class="pr-section-label">Resultados</div>`;
      data.resultBlocks.forEach(rows=>{
        html += `<div class="pr-results">`+rows.map(r=>`<div class="result-row"><span class="k">${r.label}</span><span class="v${r.accent?' accent':''}">${r.value}</span></div>`).join('')+`</div>`;
      });
    }
    if(data.tables.length){
      html += `<div class="pr-section-label">Detalle</div>` + data.tables.join('');
    }
    if(data.diagrams.length){
      html += `<div class="pr-section-label">Diagrama</div>` + data.diagrams.map(svg=>`<div class="plot-wrap" style="max-width:420px;margin:0 auto;">${svg}</div>`).join('');
    }
    html += `<div class="pr-signoff"><div class="box">Firma responsable</div><div class="box">Timbre / Visación</div></div>`;

    let printArea = document.getElementById('printArea');
    if(!printArea){ printArea = document.createElement('div'); printArea.id='printArea'; document.body.appendChild(printArea); }
    printArea.innerHTML = html;
    window.print();
  });

  shareBtn.addEventListener('click', ()=>{
    msg.textContent = 'Preparando captura…';
    const finish = (text)=>{ msg.textContent = text; };
    const doCapture = ()=>{
      const container = document.querySelector('.tool-view');
      const actionBar = container.querySelector('.action-bar');
      actionBar.style.visibility = 'hidden';
      window.html2canvas(container, {backgroundColor: getComputedStyle(document.body).getPropertyValue('--paper') || '#ffffff', scale: 2})
        .then(canvas=>{
          actionBar.style.visibility = '';
          canvas.toBlob(blob=>{
            if(!blob){ finish('No se pudo generar la imagen.'); return; }
            const file = new File([blob], 'geomav-'+toolId+'.png', {type:'image/png'});
            if(navigator.canShare && navigator.canShare({files:[file]})){
              navigator.share({files:[file], title: TOOLS[toolId].name}).then(()=>finish('')).catch(()=>finish(''));
            } else {
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url; a.download = 'geomav-'+toolId+'.png';
              document.body.appendChild(a); a.click(); document.body.removeChild(a);
              setTimeout(()=>URL.revokeObjectURL(url), 1000);
              finish('Imagen descargada.');
            }
          }, 'image/png');
        }).catch(()=>{ actionBar.style.visibility = ''; finish('No se pudo generar la captura.'); });
    };
    if(window.html2canvas){ doCapture(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = doCapture;
    s.onerror = ()=>finish('No se pudo cargar la función de captura (requiere conexión la primera vez).');
    document.head.appendChild(s);
  });
}

/* ===================== EXPORTAR CSV / DESCARGA DE ARCHIVOS ===================== */
function downloadTextFile(filename, text, mimeType){
  const blob = new Blob([text], {type:(mimeType||'text/csv;charset=utf-8;')});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function addCSVButton(container, filename, csvText){
  const btn = document.createElement('button');
  btn.type='button'; btn.className='btn-sm'; btn.style.marginTop='10px';
  btn.textContent='⬇ Exportar CSV';
  btn.addEventListener('click', ()=> downloadTextFile(filename, csvText));
  container.appendChild(btn);
}

/* ---- Exportación a formatos SIG/CAD: DXF (CAD), KML (Google Earth), GPX (GPS) ---- */
function puntosToDXF(puntos){
  let s = '0\nSECTION\n2\nENTITIES\n';
  puntos.forEach(p=>{
    const z = (p.cota!==null && p.cota!==undefined) ? p.cota : 0;
    s += `0\nPOINT\n8\n0\n10\n${p.E}\n20\n${p.N}\n30\n${z}\n`;
    s += `0\nTEXT\n8\nTEXTOS\n10\n${p.E}\n20\n${p.N}\n30\n0\n40\n1\n1\n${p.nombre}\n`;
  });
  s += '0\nENDSEC\n0\nEOF\n';
  return s;
}
function coordsToDXFPolyline(coordE, coordN, closed){
  let s = '0\nSECTION\n2\nENTITIES\n';
  s += `0\nPOLYLINE\n8\n0\n66\n1\n70\n${closed?1:0}\n`;
  for(let i=0;i<coordE.length;i++){
    s += `0\nVERTEX\n8\n0\n10\n${coordE[i]}\n20\n${coordN[i]}\n30\n0\n`;
  }
  s += '0\nSEQEND\n';
  s += '0\nENDSEC\n0\nEOF\n';
  return s;
}
function puntosToKML(puntos, zona, hemi){
  let placemarks = '';
  puntos.forEach(p=>{
    const ll = utmToLatLon(p.E, p.N, zona, hemi);
    const z = (p.cota!==null && p.cota!==undefined) ? p.cota : 0;
    placemarks += `<Placemark><name>${p.nombre}</name><Point><coordinates>${ll.lon},${ll.lat},${z}</coordinates></Point></Placemark>\n`;
  });
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document>\n${placemarks}</Document></kml>`;
}
function coordsToKMLPolygon(coordE, coordN, zona, hemi, nombre){
  const coordsStr = coordE.map((e,i)=>{
    const ll = utmToLatLon(e, coordN[i], zona, hemi);
    return `${ll.lon},${ll.lat},0`;
  }).join(' ');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document>\n<Placemark><name>${nombre||'Poligono'}</name><Polygon><outerBoundaryIs><LinearRing><coordinates>\n${coordsStr}\n</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>\n</Document></kml>`;
}
function puntosToGPX(puntos, zona, hemi){
  let wpts = '';
  puntos.forEach(p=>{
    const ll = utmToLatLon(p.E, p.N, zona, hemi);
    wpts += `<wpt lat="${ll.lat}" lon="${ll.lon}">${(p.cota!==null&&p.cota!==undefined)?`<ele>${p.cota}</ele>`:''}<name>${p.nombre}</name></wpt>\n`;
  });
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Topo de Bolsillo" xmlns="http://www.topografix.com/GPX/1/1">\n${wpts}</gpx>`;
}

/* ---- Captura GPS promediada: toma varias lecturas y promedia lat/lon para mejorar precisión ---- */
function capturarGPSPromediado(numLecturas, onProgress, onDone, onError){
  const lecturas = [];
  const watch = geoWatchPosition(
    (pos)=>{
      lecturas.push({lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy, alt:pos.coords.altitude});
      onProgress(lecturas.length, numLecturas);
      if(lecturas.length>=numLecturas){
        watch.clear();
        const lat = lecturas.reduce((s,l)=>s+l.lat,0)/lecturas.length;
        const lon = lecturas.reduce((s,l)=>s+l.lon,0)/lecturas.length;
        const accProm = lecturas.reduce((s,l)=>s+l.acc,0)/lecturas.length;
        const altValidas = lecturas.filter(l=>l.alt!==null && l.alt!==undefined && isFinite(l.alt));
        const alt = altValidas.length ? altValidas.reduce((s,l)=>s+l.alt,0)/altValidas.length : null;
        onDone({lat, lon, alt, accuracyPromedio:accProm, n:lecturas.length});
      }
    },
    (err)=>{ watch.clear(); onError(err); },
    {enableHighAccuracy:true, maximumAge:0, timeout:30000}
  );
  return watch;
}

/* ===================== LIBRETA DE PUNTOS (compartida entre herramientas) ===================== */
function loadPuntos(){
  try{ return JSON.parse(localStorage.getItem('topocalc-libreta')||'[]'); }catch(e){ return []; }
}
function savePuntosStore(){
  try{ localStorage.setItem('topocalc-libreta', JSON.stringify(PUNTOS)); }catch(e){}
}
let PUNTOS = loadPuntos();
let puntoAutoId = PUNTOS.reduce((m,p)=>Math.max(m,p.id||0),0)+1;
function agregarPunto(nombre, E, N, cota, descripcion){
  const p = {id:puntoAutoId++, nombre: nombre || ('P'+puntoAutoId), E, N, cota: (cota===undefined||cota===null||isNaN(cota))?null:cota, descripcion: descripcion||''};
  PUNTOS.push(p);
  savePuntosStore();
  return p;
}
function eliminarPunto(id){
  PUNTOS = PUNTOS.filter(p=>p.id!==id);
  savePuntosStore();
}
/* Exporta en el formato estándar de equipos GPS/estación total: P,N,E,D,C
   (Punto, Norte, Este, Descripción, Cota). */
function puntosToCSV(puntos){
  const rows = ['P,N,E,D,C'];
  puntos.forEach(p=> rows.push(`${p.nombre},${p.N},${p.E},${p.descripcion||''},${(p.cota!==null&&p.cota!==undefined)?p.cota:''}`));
  return rows.join('\n');
}
/* Alias de columnas reconocidas al importar (insensible a mayúsculas/orden), para aceptar
   tanto el formato de equipos (P,N,E,D,C) como el genérico propio de la app y variantes
   comunes de otros programas (Este/Norte en inglés, Z en vez de Cota, etc.). */
const CSV_COL_ALIASES = {
  punto: ['p','punto','pt','nombre','name','id'],
  norte: ['n','norte','north','y'],
  este: ['e','este','east','x'],
  descripcion: ['d','desc','descripcion','descripción','description','codigo','código','code'],
  cota: ['c','cota','z','elev','elevacion','elevación','elevation','altura','h']
};
function detectCsvColumns(headerParts){
  const map = {};
  headerParts.forEach((h,i)=>{
    const key = h.trim().toLowerCase();
    for(const field in CSV_COL_ALIASES){
      if(map[field]===undefined && CSV_COL_ALIASES[field].includes(key)) map[field]=i;
    }
  });
  return map;
}
function csvToPuntos(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  if(!lines.length) return [];
  const colMap = detectCsvColumns(lines[0].split(',').map(s=>s.trim()));
  const hasHeader = colMap.norte!==undefined && colMap.este!==undefined;
  const out=[];
  for(let i=hasHeader?1:0; i<lines.length; i++){
    const parts = lines[i].split(',').map(s=>s.trim());
    if(!parts.length) continue;
    let nombre, E, N, cota, descripcion;
    if(hasHeader){
      nombre = colMap.punto!==undefined ? parts[colMap.punto] : ('P'+(i));
      N = parseFloat(parts[colMap.norte]);
      E = parseFloat(parts[colMap.este]);
      descripcion = colMap.descripcion!==undefined ? (parts[colMap.descripcion]||'') : '';
      cota = (colMap.cota!==undefined && parts[colMap.cota]!=='') ? parseFloat(parts[colMap.cota]) : null;
    } else {
      // Formato genérico heredado, sin encabezado: nombre,este,norte,cota
      if(parts.length<3) continue;
      nombre = parts[0];
      E = parseFloat(parts[1]); N = parseFloat(parts[2]);
      cota = (parts[3]!==undefined && parts[3]!=='') ? parseFloat(parts[3]) : null;
      descripcion = '';
    }
    if(!isNaN(E) && !isNaN(N)) out.push({nombre, E, N, cota, descripcion});
  }
  return out;
}
/* Exportación a Excel (.xlsx) vía SheetJS, cargado bajo demanda solo al usarse. */
function puntosToXLSX(puntos, filename){
  const build = ()=>{
    const header = ['P (Punto)','N (Norte)','E (Este)','D (Descripción)','C (Cota)'];
    const data = [header, ...puntos.map(p=>[p.nombre, p.N, p.E, p.descripcion||'', (p.cota!==null&&p.cota!==undefined)?p.cota:''])];
    const ws = window.XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{wch:12},{wch:14},{wch:14},{wch:24},{wch:10}];
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, 'Puntos');
    window.XLSX.writeFile(wb, filename);
  };
  if(window.XLSX){ build(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload = build;
  document.head.appendChild(s);
}

/* ---------- MAPA INTERACTIVO (Leaflet, vía CDN) ---------- */
let LEAFLET_LOADED = false;
let LEAFLET_LOADING = null;
function ensureLeaflet(){
  if(LEAFLET_LOADED || (typeof window!=='undefined' && window.L)){ LEAFLET_LOADED=true; return Promise.resolve(); }
  if(LEAFLET_LOADING) return LEAFLET_LOADING;
  LEAFLET_LOADING = new Promise((resolve, reject)=>{
    const cssHref = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    if(!document.querySelector(`link[href="${cssHref}"]`)){
      const link = document.createElement('link');
      link.rel='stylesheet'; link.href=cssHref;
      document.head.appendChild(link);
    }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    script.onload = ()=>{ LEAFLET_LOADED=true; resolve(); };
    script.onerror = ()=>{ LEAFLET_LOADING=null; reject(new Error('No se pudo cargar el mapa (revisa tu conexión a internet).')); };
    document.head.appendChild(script);
  });
  return LEAFLET_LOADING;
}

function poblarGuiaSelect(){
  const sel = document.getElementById('mpGuiaSelect');
  if(!sel) return;
  sel.innerHTML = PUNTOS.length
    ? PUNTOS.map(p=>`<option value="${p.id}">${p.nombre} (${fmtNum(p.E,1)}, ${fmtNum(p.N,1)})</option>`).join('')
    : `<option value="">— sin puntos guardados en la Libreta —</option>`;
}

function toggleGuiarPunto(btn){
  const msg = document.getElementById('mpGuiaMsg');
  if(guiaWatchId !== null){
    guiaWatchId.clear();
    guiaWatchId = null;
    guiaActivo = null;
    btn.textContent = '🧭 Empezar a guiar';
    document.getElementById('mpGuiaResult').style.display='none';
    return;
  }
  const sel = document.getElementById('mpGuiaSelect');
  const id = parseInt(sel.value,10);
  const punto = PUNTOS.find(p=>p.id===id);
  if(!punto){ msg.textContent='Selecciona un punto guardado primero.'; return; }
  const pref = loadMapaZonaPref();
  const targetLL = utmToLatLon(punto.E, punto.N, pref.zona, pref.hemi);
  msg.textContent = '';
  btn.textContent = '⏹ Detener guiado';
  document.getElementById('mpGuiaResult').style.display='';
  guiaWatchId = geoWatchPosition(
    (pos)=>{
      const dist = haversineDist(pos.coords.latitude, pos.coords.longitude, targetLL.lat, targetLL.lon);
      const brg = initialBearing(pos.coords.latitude, pos.coords.longitude, targetLL.lat, targetLL.lon);
      guiaActivo = {nombre:punto.nombre, bearing:brg, distancia:dist};
      const rb = azToRumbo(brg);
      const distEl = document.getElementById('mpGuiaDist');
      const rumboEl = document.getElementById('mpGuiaRumbo');
      const needle = document.getElementById('mpGuiaNeedle');
      if(distEl) distEl.textContent = dist<1000 ? `${fmtNum(dist,1)} m` : `${fmtNum(dist/1000,3)} km`;
      if(rumboEl) rumboEl.textContent = `${fmtNum(brg,1)}° (${rb.ns} ${fmtNum(rb.ang,1)}° ${rb.ew})`;
      if(needle) needle.setAttribute('transform', `rotate(${brg.toFixed(1)} 30 30)`);
    },
    (err)=>{ msg.textContent = `Error de GPS: ${err.message}`; },
    {enableHighAccuracy:true, maximumAge:2000, timeout:10000}
  );
}

function distanciaTotalTrack(pts){
  let total=0;
  for(let i=1;i<pts.length;i++) total += haversineDist(pts[i-1].lat,pts[i-1].lon,pts[i].lat,pts[i].lon);
  return total;
}

function actualizarTrackEnMapa(){
  if(!mapaInstance || typeof L==='undefined') return;
  const latlngs = trackPoints.map(p=>[p.lat,p.lon]);
  if(!trackPolyline){
    trackPolyline = L.polyline(latlngs, {color:'#e53935', weight:3}).addTo(mapaInstance);
  } else {
    trackPolyline.setLatLngs(latlngs);
  }
}

function toggleGrabarRecorrido(btn){
  const msg = document.getElementById('mpTrackMsg');
  if(trackWatchId !== null){
    trackWatchId.clear();
    trackWatchId = null;
    btn.textContent = '🔴 Grabar recorrido';
    msg.textContent = trackPoints.length ? `Grabación detenida: ${trackPoints.length} puntos.` : '';
    mostrarResultadoTrack();
    return;
  }
  trackPoints = [];
  if(trackPolyline && mapaInstance){ mapaInstance.removeLayer(trackPolyline); trackPolyline=null; }
  if(trackAreaPolygon && mapaInstance){ mapaInstance.removeLayer(trackAreaPolygon); trackAreaPolygon=null; }
  document.getElementById('mpTrackAreaRow').style.display='none';
  document.getElementById('mpTrackResult').style.display='none';
  btn.textContent = '⏹ Detener grabación';
  msg.textContent = 'Grabando… camina por el perímetro o recorrido.';
  trackWatchId = geoWatchPosition(
    (pos)=>{
      trackPoints.push({lat:pos.coords.latitude, lon:pos.coords.longitude});
      actualizarTrackEnMapa();
      msg.textContent = `Grabando… ${trackPoints.length} puntos, ${fmtNum(distanciaTotalTrack(trackPoints),1)} m recorridos.`;
    },
    (err)=>{ msg.textContent = `Error de GPS: ${err.message}`; },
    {enableHighAccuracy:true, maximumAge:1000, timeout:15000}
  );
}

function mostrarResultadoTrack(){
  const res = document.getElementById('mpTrackResult');
  if(!res) return;
  if(trackPoints.length<2){ res.style.display='none'; return; }
  res.style.display='';
  document.getElementById('mpTrackDist').textContent = fmtNum(distanciaTotalTrack(trackPoints),1)+' m';
  document.getElementById('mpTrackN').textContent = trackPoints.length;
}

function cerrarTrackYCalcularArea(){
  if(trackPoints.length<3) return;
  const utmPts = trackPoints.map(p=> latLonToUTM(p.lat,p.lon));
  const areaPts = utmPts.map(u=>({e:u.este, n:u.norte}));
  const r = calcAreaCoords(areaPts);
  const areaEl = document.getElementById('mpTrackArea');
  const rowEl = document.getElementById('mpTrackAreaRow');
  if(areaEl) areaEl.textContent = `${fmtNum(r.areaHa,4)} ha (${fmtNum(r.areaM2,1)} m²)`;
  if(rowEl) rowEl.style.display='';
  if(mapaInstance && typeof L!=='undefined'){
    if(trackAreaPolygon) mapaInstance.removeLayer(trackAreaPolygon);
    const latlngs = trackPoints.map(p=>[p.lat,p.lon]);
    trackAreaPolygon = L.polygon(latlngs, {color:'#43a047', fillOpacity:0.25}).addTo(mapaInstance);
  }
}

function guardarTrackEnLibreta(){
  trackPoints.forEach((p,i)=>{
    const u = latLonToUTM(p.lat,p.lon);
    agregarPunto(`T${i+1}`, u.este, u.norte, null);
  });
}

function initMapa(){
  const container = document.getElementById('geomavMap');
  if(!container || typeof L === 'undefined') return;
  container.innerHTML='';
  mapaInstance = L.map(container).setView([-33.4489,-70.6693], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(mapaInstance);
  mapaInstance.on('click', (e)=> onMapaClick(e.latlng));
  drawPuntosEnMapa();
  centrarEnGPS(true);
}

function drawPuntosEnMapa(){
  if(!mapaInstance) return;
  mapaPointMarkers.forEach(m=> mapaInstance.removeLayer(m));
  mapaPointMarkers = [];
  const pref = loadMapaZonaPref();
  const bounds = [];
  PUNTOS.forEach(p=>{
    try{
      const ll = utmToLatLon(p.E, p.N, pref.zona, pref.hemi);
      if(!isFinite(ll.lat) || !isFinite(ll.lon)) return;
      const marker = L.marker([ll.lat, ll.lon]).addTo(mapaInstance);
      marker.bindPopup(`<strong>${p.nombre}</strong><br>E: ${fmtNum(p.E,3)}  N: ${fmtNum(p.N,3)}${(p.cota!==null&&p.cota!==undefined)?'<br>Cota: '+fmtNum(p.cota,2):''}`);
      mapaPointMarkers.push(marker);
      bounds.push([ll.lat, ll.lon]);
    }catch(e){ /* punto con coordenadas inválidas: se omite */ }
  });
  if(bounds.length){
    mapaInstance.fitBounds(bounds, {padding:[30,30], maxZoom:17});
  }
}

function onMapaClick(latlng){
  const info = document.getElementById('mpTapInfo');
  if(!info || !mapaInstance) return;
  const utm = latLonToUTM(latlng.lat, latlng.lng);

    <div class="result-row"><span class="k">Longitud</span><span class="v">${fmtNum(latlng.lng,6)}°</span></div>

    <div class="result-row"><span class="k">Este / Norte UTM</span><span class="v">${fmtNum(utm.este,3)} / ${fmtNum(utm.norte,3)}</span></div>
    <button class="btn-sm" id="btnMPSave" type="button" style="margin-top:6px;">💾 Guardar este punto en la Libreta</button>

/* ===================== BRÚJULA (sensor de orientación del dispositivo) ===================== */
/* onHeading(deg): se llama en cada lectura. onReady(stopFn): se llama una vez listo, con la función para detener. onError(err): permiso denegado o sensor no disponible. */
/* Pista de diagnóstico para cuando el sensor/cámara no responde: la causa más común es abrir el archivo
   localmente (file://) en vez de un sitio https://, donde Chrome/Android bloquea sensores y cámara. */
function pistaOrigenInseguro(){
  return (location.protocol === 'file:')
    ? ' Esto suele pasar cuando esta página se abre como archivo descargado (file://) en vez de un sitio con https:// — el navegador bloquea sensores y cámara en ese caso. Para usarlos, sube este archivo a un hosting con https (por ejemplo GitHub Pages o Netlify Drop) y ábrelo desde ese enlace.'
    : ' Verifica que el navegador tenga permiso para usar sensores de movimiento, o que el dispositivo tenga brújula/magnetómetro.';
}

function iniciarBrujula(onHeading, onReady, onError){
  const attach = ()=>{
    let listo = false;
    const eventName = ('ondeviceorientationabsolute' in window) ? 'deviceorientationabsolute' : 'deviceorientation';
    const handler = (e)=>{
      let heading;
      if(typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)){
        heading = e.webkitCompassHeading;
      } else if(e.alpha !== null && e.alpha !== undefined){
        heading = 360 - e.alpha;
      } else {
        return;
      }
      if(!listo){
        listo = true;
        clearTimeout(timeoutId);
        onReady(()=> window.removeEventListener(eventName, handler));
      }
      onHeading(normDeg(heading));
    };
    window.addEventListener(eventName, handler);
    const timeoutId = setTimeout(()=>{
      if(!listo){
        window.removeEventListener(eventName, handler);
        onError(new Error('No se detectaron lecturas del sensor de orientación.' + pistaOrigenInseguro()));
      }
    }, 4000);
  };
  if(typeof DeviceOrientationEvent === 'undefined'){
    onError(new Error('Este dispositivo o navegador no tiene sensor de orientación disponible.'));
    return;
  }
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(state=>{
      if(state === 'granted') attach();
      else onError(new Error('Permiso de orientación denegado.'));
    }).catch(err=> onError(err));
  } else {
    attach();
  }
}

/* ===================== REALIDAD AUMENTADA (cámara + puntos cardinales superpuestos) ===================== */
const AR_PUNTOS_CARDINALES = [
  {nombre:'N', deg:0},{nombre:'NE', deg:45},{nombre:'E', deg:90},{nombre:'SE', deg:135},
  {nombre:'S', deg:180},{nombre:'SO', deg:225},{nombre:'O', deg:270},{nombre:'NO', deg:315}
];
let arOverlayEl = null;
let arStream = null;
let arStopBrujula = null;

function dibujarArTape(heading){
  const tape = document.getElementById('arTape');
  if(!tape) return;
  const FOV = 65;
  const marcas = AR_PUNTOS_CARDINALES.slice();
  if(guiaActivo){
    marcas.push({nombre:`★ ${guiaActivo.nombre}`, deg:guiaActivo.bearing, destacado:true, distancia:guiaActivo.distancia});
  }
  let html = '';
  marcas.forEach(m=>{
    const rel = ((m.deg - heading + 540) % 360) - 180;
    if(Math.abs(rel) > FOV/2 + 5) return;
    const xPct = 50 + (rel/(FOV/2))*50;
    html += `<div class="ar-mark${m.destacado?' ar-mark-target':''}" style="left:${xPct.toFixed(1)}%;">
      <span class="ar-mark-label">${m.nombre}</span>${m.destacado?`<span class="ar-mark-sub">${m.distancia<1000?fmtNum(m.distancia,0)+' m':fmtNum(m.distancia/1000,2)+' km'}</span>`:''}
    </div>`;
  });
  tape.innerHTML = html;
}

function abrirVistaAR(){
  if(arOverlayEl) return;
  const overlay = document.createElement('div');
  overlay.id = 'arOverlay';
  overlay.innerHTML = `
    <video id="arVideo" autoplay playsinline muted></video>
    <div id="arTape"></div>
    <div id="arMsg" class="proj-msg" style="position:absolute; bottom:16px; left:0; right:0; text-align:center; color:#fff; text-shadow:0 1px 3px #000;"></div>
    <button type="button" id="arCloseBtn">✕</button>`;
  document.body.appendChild(overlay);
  arOverlayEl = overlay;

  document.getElementById('arCloseBtn').addEventListener('click', cerrarVistaAR);

  const msg = document.getElementById('arMsg');
  const agregarMsg = (texto)=>{ msg.textContent = msg.textContent ? `${msg.textContent} — ${texto}` : texto; };

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    agregarMsg('Este navegador no soporta acceso a la cámara.');
  } else {
    pedirPermisoCamara().then(()=>{
      return navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    }).then(stream=>{
      arStream = stream;
      const video = document.getElementById('arVideo');
      if(video) video.srcObject = stream;
    }).catch(err=>{ agregarMsg(`No se pudo acceder a la cámara: ${err.message}.${pistaOrigenInseguro()}`); });
  }

  iniciarBrujula(
    (heading)=> dibujarArTape(heading),
    (stopFn)=>{ arStopBrujula = stopFn; },
    (err)=>{ agregarMsg(err.message); }
  );
}

function cerrarVistaAR(){
  if(arStream){ arStream.getTracks().forEach(t=>t.stop()); arStream=null; }
  if(arStopBrujula){ arStopBrujula(); arStopBrujula=null; }
  if(arOverlayEl){ arOverlayEl.remove(); arOverlayEl=null; }
}

function fieldRow(label, id, value, opts){
  opts = opts || {};
  const type = opts.type || 'number';
  const step = opts.step || 'any';
  return `<div class="field-row"><label for="${id}">${label}</label>
    <input type="${type}" id="${id}" ${type==='number'?`step="${step}"`:''} value="${value!==undefined?value:''}" ${opts.placeholder?`placeholder="${opts.placeholder}"`:''}></div>`;
}

function val(id){ return parseFloat(document.getElementById(id).value); }
function valInt(id){ return parseInt(document.getElementById(id).value,10); }

/* Selector de elipsoide de referencia, reutilizado por las herramientas de geodesia avanzada */
function elipsoidFieldHTML(id, label){
  label = label || 'Elipsoide de referencia';
  return `<div class="field-row"><label for="${id}">${label}</label>
    <select id="${id}"><option value="wgs84" selected>WGS84 / GRS80 (SIRGAS)</option><option value="hayford">Hayford / International 1924 (PSAD56)</option></select></div>`;
}
function readElipsoid(id){
  const v = document.getElementById(id).value;
  return v==='hayford' ? {a:6378388, f:1/297} : {a:6378137, f:1/298.257223563};
}

/* ---------- UTM ---------- */
/* Mini-mapa embebido (OpenStreetMap vía Leaflet, ya usado en Mapa Interactivo — gratuito,
   de código abierto, sin clave de API ni restricciones de uso comercial) para mostrar la
   ubicación de un punto calculado, con las coordenadas UTM superpuestas en pequeño. */
/* Gráfico polar de satélites GNSS (tipo "sky plot"): centro = cenit (elevación 90°),
   borde = horizonte (elevación 0°); el ángulo es el azimut (0°=Norte, arriba). Cada
   satélite se ubica según su posición real informada por el chip GNSS del teléfono. */
function svgSkyPlot(satelites){
  const w=280, h=280, cx=w/2, cy=h/2, R=120;
  const anillos = [0,30,60,90].map(elev=>{
    const r = (90-elev)/90*R;
    return `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }).join('');
  const ejes = `
    <line x1="${cx}" y1="${cy-R}" x2="${cx}" y2="${cy+R}" stroke="var(--line-strong)" stroke-width="1"/>
    <line x1="${cx-R}" y1="${cy}" x2="${cx+R}" y2="${cy}" stroke="var(--line-strong)" stroke-width="1"/>
    <text x="${cx}" y="${cy-R-6}" font-size="10" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">N</text>
    <text x="${cx}" y="${cy+R+14}" font-size="10" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">S</text>
    <text x="${cx-R-10}" y="${cy+3}" font-size="10" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">O</text>
    <text x="${cx+R+10}" y="${cy+3}" font-size="10" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">E</text>`;
  const puntos = (satelites||[]).map(sat=>{
    const r = (90-sat.elevacion)/90*R;
    const ang = toRad(sat.azimut);
    const x = cx + r*Math.sin(ang);
    const y = cy - r*Math.cos(ang);
    // Color según estado: usado en el cálculo (verde-azulado), visible con señal débil (rojo),
    // o visible sin usar con señal aceptable (gris) — igual que el criterio de apps de referencia.
    let color = 'var(--ink-soft)';
    if(sat.usado) color = 'var(--blueprint)';
    else if(sat.snr < 18) color = 'var(--accent)';
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="${color}" fill-opacity=".85" stroke="var(--paper)" stroke-width="1.2"/>
      <text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" font-size="7.5" font-family="var(--font-mono)" fill="var(--paper)" text-anchor="middle">${sat.svid}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${anillos}${ejes}${puntos}</svg>`;
}

/* Mini-mapa GPS del Conversor de Coordenadas. Desde oct-2026 es UN solo mapa, bajo las 3 filas de coordenadas
   (decimal, GMS y UTM); el código lo sigue tratando como lista de ids. Historia: antes eran dos mapas (uno por bloque,
   Grados→UTM y UTM→Grados) y cada mapa se
   centraba en el punto ingresado/calculado de su propio formulario (podía mostrar cualquier cosa,
   válida o sin sentido, según el dato) — ahora ambos comparten UN solo GPS. Activar cualquiera de
   los dos ("Activar GPS") pide permiso de ubicación una sola vez y, en cuanto llega la primera
   posición, los DOS mapas se abren solos con la ubicación en vivo (mismo estilo de marcador
   circular azul que la posición en vivo del Mapa Interactivo) — ya no hace falta activarlos por
   separado. Esto reemplaza también al viejo botón "Usar mi ubicación GPS (promedio continuo)" de
   este bloque (que solo llenaba los campos de latitud/longitud): ya no es necesario, el mapa en
   vivo cumple el mismo propósito de mostrar dónde estás parado. El texto de estado ("Buscando
   señal GPS…", "Ubicación GPS en vivo · ±X m aprox.") reusa el mismo criterio visual que tenía
   ese botón viejo (clase .proj-msg, gris), ahora ubicado arriba de cada mapa en vez de sobre el
   formulario. Se guarda un estado por contenedor (instancia de mapa/marcador Leaflet) en
   miniMapaGpsState — el GPS en sí es un único geoWatchPosition compartido (utmGpsWatch); render()
   lo detiene al salir de la herramienta. */
const miniMapaGpsState = {};
const MINI_MAPA_UTM_IDS = ['miniMapaU1'];
let utmGpsWatch = null;

function resetMiniMapaUTM(containerId){
  const st = miniMapaGpsState[containerId];
  if(st && st.map){ st.map.remove(); }
  miniMapaGpsState[containerId] = {map:null, marker:null, initializing:false};
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = `<div style="padding:14px; text-align:center;">
    <p class="tool-blurb" style="margin:0 0 10px;">Activa el GPS para ver tu ubicación en el mapa.</p>
    <button class="btn-sm" id="${containerId}_btnGps" type="button">📍 Activar GPS</button>
  </div>`;
  document.getElementById(`${containerId}_btnGps`).addEventListener('click', startUtmGps);
}

function stopUtmGps(){
  if(utmGpsWatch){ utmGpsWatch.clear(); utmGpsWatch = null; }
  MINI_MAPA_UTM_IDS.forEach(resetMiniMapaUTM);
}

function mostrarMapaUTM(containerId, pos){
  const st = miniMapaGpsState[containerId] || (miniMapaGpsState[containerId] = {map:null, marker:null, initializing:false});
  const el = document.getElementById(containerId);
  if(!el) return;
  const lat = pos.coords.latitude, lon = pos.coords.longitude, acc = pos.coords.accuracy;
  const statusTxt = (acc!=null && !isNaN(acc)) ? `Ubicación GPS en vivo · ±${fmtNum(acc,0)} m aprox.` : 'Ubicación GPS en vivo.';
  if(st.map){
    st.marker.setLatLng([lat,lon]);
    st.map.setView([lat,lon]);
    const s = document.getElementById(`${containerId}_status`);
    if(s) s.textContent = statusTxt;
    return;
  }
  if(st.initializing) return;
  st.initializing = true;
  el.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 10px;">
      <span class="proj-msg" id="${containerId}_status">Buscando señal GPS…</span>
      <button class="btn-sm" id="${containerId}_btnStop" type="button" style="margin:0;">■ Detener</button>
    </div>
    <div id="${containerId}_mapa" style="height:200px; width:100%;"></div>`;
  document.getElementById(`${containerId}_btnStop`).addEventListener('click', stopUtmGps);
  ensureLeaflet().then(()=>{
    if(!document.getElementById(`${containerId}_mapa`)) return; // el usuario ya salió/reinició mientras cargaba
    st.map = window.L.map(`${containerId}_mapa`, {zoomControl:false, attributionControl:true}).setView([lat,lon], 17);
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom:19
    }).addTo(st.map);
    st.marker = window.L.circleMarker([lat,lon], {radius:8, color:'#1e88e5', fillColor:'#1e88e5', fillOpacity:0.9, weight:2}).addTo(st.map);
    st.initializing = false;
    const s = document.getElementById(`${containerId}_status`);
    if(s) s.textContent = statusTxt;
  }).catch(err=>{
    st.initializing = false;
    el.innerHTML = `<p class="err-msg" style="padding:14px;">${err.message}</p>
      <div style="text-align:center; padding-bottom:10px;"><button class="btn-sm" id="${containerId}_btnRetry" type="button">📍 Reintentar</button></div>`;
    const retryBtn = document.getElementById(`${containerId}_btnRetry`);
    if(retryBtn) retryBtn.addEventListener('click', startUtmGps);
  });
}

function startUtmGps(){
  if(utmGpsWatch) return; // ya activo: la posición que ya está llegando alimenta a ambos mapas
  MINI_MAPA_UTM_IDS.forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.innerHTML = `<p class="proj-msg" style="padding:14px; text-align:center;">Buscando señal GPS…</p>`;
  });
  utmGpsWatch = geoWatchPosition(
    (pos)=> MINI_MAPA_UTM_IDS.forEach(id=> mostrarMapaUTM(id, pos)),
    (err)=>{
      utmGpsWatch = null;
      MINI_MAPA_UTM_IDS.forEach(id=>{
        const st = miniMapaGpsState[id];
        if(st && st.map){ st.map.remove(); st.map = null; st.marker = null; }
        const el = document.getElementById(id);
        if(!el) return;
        el.innerHTML = `<p class="err-msg" style="padding:14px;">No se pudo obtener tu ubicación: ${err.message}</p>
          <div style="text-align:center; padding-bottom:10px;"><button class="btn-sm" id="${id}_btnRetry" type="button">📍 Reintentar</button></div>`;
        const retryBtn = document.getElementById(`${id}_btnRetry`);
        if(retryBtn) retryBtn.addEventListener('click', startUtmGps);
      });
    },
    {enableHighAccuracy:true, maximumAge:2000, timeout:15000}
  );
}

function renderUTM(){
  const body = `
  <div class="field-card">
    <h3>Escribe en cualquiera de las 3 filas — las otras se actualizan solas</h3>
    <h3 style="margin-top:12px;">1 · Grados decimales</h3>
    <div class="field-inline2">
      ${fieldRow('Latitud (°, sur negativo)','u_lat',-35.420410)}
      ${fieldRow('Longitud (°, oeste negativo)','u_lon',-71.673116)}
    </div>
    <h3 style="margin-top:12px;">2 · Grados, minutos y segundos (GMS)</h3>
    <div class="field-inline2">
      ${fieldRow('Latitud','u_dlat','',{type:'text',placeholder:'35°26\'07.22&quot;S'})}
      ${fieldRow('Longitud','u_dlon','',{type:'text',placeholder:'71°40\'35.14&quot;W'})}
    </div>
    <p class="tool-blurb" style="margin:0 0 4px;">Puedes pegar la coordenada completa (ej. 35°26'07.22"S 71°40'35.14"W) en cualquiera de los dos campos.</p>
    <h3 style="margin-top:12px;">3 · UTM</h3>
    <div class="field-inline2">
      ${fieldRow('Este (m)','u_e','')}
      ${fieldRow('Norte (m)','u_n','')}
    </div>
    <div class="field-inline2">
      ${fieldRow('Huso','u_zona','',{type:'number',step:'1'})}
      <div class="field-row"><label for="u_hemi">Hemisferio</label>
        <select id="u_hemi"><option value="S" selected>Sur</option><option value="N">Norte</option></select></div>
    </div>
    <div id="u_msg"></div>
    <button class="btn" id="btnU1" type="button">Calcular</button>
    <div id="resU1"></div>
    <div id="miniMapaU1" class="plot-wrap" style="padding:0; overflow:hidden;"></div>
  </div>
  <div class="field-card" id="gnssCard" style="display:none;">
    <h3>Detalle de satélites GNSS en vivo</h3>
    <p class="tool-blurb" style="margin:0 0 8px;">Cuenta cuántos satélites ve el teléfono de cada sistema (GPS, GLONASS, Galileo, BeiDou, etc.) y cuántos de ellos se están usando realmente en el cálculo de tu ubicación — información de diagnóstico, no cambia la coordenada obtenida. Solo funciona instalada como app (no en el navegador), y requiere Android 7.0 o superior.</p>
    <button class="btn-sm" id="btnGnssStart" type="button">🛰️ Empezar a ver satélites</button>
    <button class="btn-sm" id="btnGnssStop" type="button" style="display:none;">■ Detener</button>
    <div id="gnssResult"></div>
  </div>`;
  toolShell('utm','Convierte una coordenada entre los tres formatos: grados decimales, grados-minutos-segundos (GMS) y UTM sobre elipsoide WGS84 (Gauss-Krüger). Escribe en cualquier fila y las otras dos se completan de inmediato.', body);

  MINI_MAPA_UTM_IDS.forEach(resetMiniMapaUTM);

  /* Panel de detalle GNSS: solo tiene sentido corriendo como app nativa (Android), ya que
     depende de un plugin propio que expone la API GnssStatus — no existe equivalente en
     navegador. Se muestra oculto por defecto y solo aparece si esNativo es verdadero. */
  const gnssPlugin = (CAP && CAP.Plugins) ? CAP.Plugins.GnssInfo : null;
  if(esNativo && gnssPlugin){
    document.getElementById('gnssCard').style.display = '';
    let gnssCallbackId = null;
    const gnssResult = document.getElementById('gnssResult');
    const btnStart = document.getElementById('btnGnssStart');
    const btnStop = document.getElementById('btnGnssStop');
    const drawGnss = (data)=>{
      const filas = (data.constelaciones||[]).map(c=>{
        const pct = c.visibles>0 ? Math.round((c.usados/c.visibles)*100) : 0;
        const color = c.usados>0 ? 'var(--blueprint)' : (c.visibles>0 ? 'var(--ink-soft)' : 'var(--line-strong)');
        return `<tr>
          <td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${color};margin-right:6px;"></span>${c.constelacion}</td>
          <td style="min-width:90px;"><div style="background:var(--line); border-radius:3px; height:6px; overflow:hidden;"><div style="width:${pct}%; height:100%; background:${color};"></div></div></td>
          <td>${c.visibles}</td><td>${c.usados}</td>
        </tr>`;
      }).join('');
      gnssResult.innerHTML = `<div class="results" style="margin-top:12px;">
        <div class="result-row"><span class="k">Satélites visibles (total)</span><span class="v">${data.totalVisible}</span></div>
        <div class="result-row"><span class="k">Satélites usados en el cálculo</span><span class="v accent big">${data.totalUsed}</span></div>
        <div class="table-wrap" style="margin-top:8px;"><table class="data-table"><thead><tr><th>Constelación</th><th>Estado</th><th>Visibles</th><th>Usados</th></tr></thead><tbody>${filas}</tbody></table></div>
        <div class="plot-wrap" style="margin-top:10px; display:flex; justify-content:center;">${svgSkyPlot(data.satelites)}</div>
        <p class="tool-blurb" style="margin-top:6px; text-align:center;">🔵 usado en el cálculo · ⚪ visible, no usado · 🔴 señal débil</p>
      </div>`;
    };
    btnStart.addEventListener('click', async ()=>{
      btnStart.style.display = 'none';
      btnStop.style.display = '';
      gnssResult.innerHTML = `<p class="tool-blurb">Buscando satélites…</p>`;
      let recibioAlgunDato = false;
      const avisoTimeout = setTimeout(()=>{
        if(!recibioAlgunDato){
          gnssResult.innerHTML = `<p class="tool-blurb">Sigue buscando… si esto no cambia en unos segundos más, asegúrate de estar al aire libre (el GNSS no funciona bien bajo techo) y de haber dado permiso de ubicación "Precisa" a la app.</p>`;
        }
      }, 6000);
      try{
        gnssCallbackId = await gnssPlugin.startWatching({}, (data, err)=>{
          recibioAlgunDato = true;
          clearTimeout(avisoTimeout);
          if(err){ gnssResult.innerHTML = `<p class="err-msg">${err.message}</p>`; return; }
          drawGnss(data);
        });
      }catch(err){
        clearTimeout(avisoTimeout);
        gnssResult.innerHTML = `<p class="err-msg">No se pudo iniciar: ${err.message}</p>`;
        btnStart.style.display = ''; btnStop.style.display = 'none';
      }
    });
    btnStop.addEventListener('click', async ()=>{
      btnStop.style.display = 'none';
      btnStart.style.display = '';
      try{ await gnssPlugin.stopWatching(); }catch(err){}
      if(gnssCallbackId) gnssPlugin.removeListener && gnssPlugin.removeListener(gnssCallbackId);
    });
  }

  /* --- Las 3 filas (decimal, GMS, UTM) se mantienen sincronizadas: se escribe en una y las otras se recalculan --- */
  const $ = (id)=> document.getElementById(id);
  const roundNum = (v,d)=> Math.round(v*Math.pow(10,d))/Math.pow(10,d);
  let updating = false, last = 'dec';
  const msg = (t)=>{ $('u_msg').innerHTML = t ? `<p class="err-msg" style="margin:8px 0 0;">${t}</p>` : ''; };
  const dmsText = (v,pos,neg)=>{
    const r = Math.round(Math.abs(v)*360000)/360000;            // a 0,01" antes de descomponer (así no hay 60" sueltos)
    const {d,m,s} = decToDMS(r);
    return `${d}°${String(m).padStart(2,'0')}'${s.toFixed(2).padStart(5,'0')}"${(v<0 && r!==0)?neg:pos}`;
  };
  /* Lee una coordenada GMS escrita de forma flexible: 35°26'07.22"S · 35 26 07.22 S · -35°26'07,22" · 35.4353 S */
  const parseDMS = (str,kind)=>{
    if(typeof str!=='string') return NaN;
    let t = str.trim(); if(!t) return NaN;
    t = t.replace(/[′’´‘`]/g,"'").replace(/[″”“]/g,'"').replace(/''/g,'"').replace(/[º˚]/g,'°').replace(/−/g,'-').replace(/,/g,'.');
    const letras = t.match(/[A-Za-z]/g) || [];
    if(letras.length>1) return NaN;
    const hemi = letras.length ? letras[0].toUpperCase() : '';
    if(hemi && (kind==='lat' ? 'NS' : 'EWO').indexOf(hemi)<0) return NaN;
    const nums = t.match(/\d+(?:\.\d+)?/g);
    if(!nums || nums.length>3) return NaN;
    const d=parseFloat(nums[0]), m=nums.length>1?parseFloat(nums[1]):0, sg=nums.length>2?parseFloat(nums[2]):0;
    if(m>=60 || sg>=60) return NaN;
    const v = d + m/60 + sg/3600;
    if(v > (kind==='lat'?90:180)) return NaN;
    const neg = /^\s*-/.test(t) || hemi==='S' || hemi==='W' || hemi==='O';
    return neg ? -v : v;
  };
  /* Si pegan "35°26'07.22"S 71°40'35.14"W" completo, lo separa en latitud y longitud */
  const splitPair = (str)=>{
    let m = str.match(/^(.*?[NSns])[\s,;\/]*(.*?[EWOewo])\s*$/);
    if(m && /\d/.test(m[1]) && /\d/.test(m[2])) return [m[1],m[2]];
    m = str.split(/\s*;\s*|,\s+/);
    if(m.length===2 && /\d/.test(m[0]) && /\d/.test(m[1])) return m;
    return null;
  };
  const setDec = (lat,lon)=>{ $('u_lat').value = roundNum(lat,7); $('u_lon').value = roundNum(lon,7); };
  const setDms = (lat,lon)=>{ $('u_dlat').value = dmsText(lat,'N','S'); $('u_dlon').value = dmsText(lon,'E','W'); };
  const setUtm = (lat,lon)=>{
    if(lat < -80 || lat >= 84 || lon < -180 || lon >= 180){
      ['u_e','u_n','u_zona'].forEach(id=> $(id).value='');
      msg('Esta posición queda fuera de la zona UTM (de 80°S a 84°N). Se muestran solo los formatos decimal y GMS.');
      return;
    }
    const r = latLonToUTM(lat,lon);
    $('u_e').value = roundNum(r.este,3); $('u_n').value = roundNum(r.norte,3);
    $('u_zona').value = r.zona; $('u_hemi').value = r.hemisferio;
  };
  const fromDec = ()=>{
    const lat=val('u_lat'), lon=val('u_lon');
    if(isNaN(lat)||isNaN(lon)){ msg(''); return null; }
    if(Math.abs(lat)>90 || Math.abs(lon)>180){ msg('La latitud va de −90 a 90 y la longitud de −180 a 180.'); return null; }
    msg(''); setDms(lat,lon); setUtm(lat,lon); return {lat,lon};
  };
  const fromDms = ()=>{
    const a=$('u_dlat').value.trim(), b=$('u_dlon').value.trim();
    if(!a || !b){ msg(''); return null; }
    const lat=parseDMS(a,'lat'), lon=parseDMS(b,'lon');
    if(isNaN(lat)||isNaN(lon)){ msg('Revisa el formato GMS. Ejemplo: 35°26\'07.22"S · 71°40\'35.14"W (minutos y segundos menores a 60).'); return null; }
    msg(''); setDec(lat,lon); setUtm(lat,lon); return {lat,lon};
  };
  const fromUtm = ()=>{
    const e=val('u_e'), n=val('u_n'), z=valInt('u_zona'), h=$('u_hemi').value;
    if(isNaN(e)||isNaN(n)||isNaN(z)){ msg(''); return null; }
    if(z<1 || z>60){ msg('El huso UTM va de 1 a 60.'); return null; }
    const r = utmToLatLon(e,n,z,h);
    if(!isFinite(r.lat)||!isFinite(r.lon)){ msg('No se pudo convertir ese par Este/Norte.'); return null; }
    msg(''); setDec(r.lat,r.lon); setDms(r.lat,r.lon); return {lat:r.lat, lon:r.lon};
  };
  const sync = (src)=> src==='dms' ? fromDms() : (src==='utm' ? fromUtm() : fromDec());
  const onDmsInput = (ev)=>{
    if(updating) return;
    const pair = splitPair(ev.target.value);
    if(pair){
      const la=parseDMS(pair[0],'lat'), lo=parseDMS(pair[1],'lon');
      if(!isNaN(la)&&!isNaN(lo)){ $('u_dlat').value=dmsText(la,'N','S'); $('u_dlon').value=dmsText(lo,'E','W'); }
    }
    last='dms'; fromDms();
  };
  ['u_lat','u_lon'].forEach(id=> $(id).addEventListener('input', ()=>{ last='dec'; fromDec(); }));
  ['u_dlat','u_dlon'].forEach(id=>{ const el=$(id); el.autocapitalize='off'; el.spellcheck=false; el.addEventListener('input', onDmsInput); });
  ['u_e','u_n','u_zona'].forEach(id=> $(id).addEventListener('input', ()=>{ last='utm'; fromUtm(); }));
  $('u_hemi').addEventListener('change', ()=>{ last='utm'; fromUtm(); });
  fromDec();   // completa GMS y UTM a partir de los valores iniciales

  $('btnU1').addEventListener('click', ()=>{
    const box=$('resU1');
    const ll = sync(last);

}

/* ---------- ANGULO ---------- */
function angleTriResult(dec){
  return `<div class="results" style="margin-top:12px;">
    <div class="result-row"><span class="k">Sexagesimal (° ' ")</span><span class="v accent big">${fmtDMS(dec)}</span></div>
    <div class="result-row"><span class="k">Grados decimales</span><span class="v">${fmtNum(dec,6)}°</span></div>
    <div class="result-row"><span class="k">Centesimal (gon)</span><span class="v">${fmtGon(dec,5)}</span></div>
  </div>`;
}
function renderAngulo(){
  const body = `
  <div class="field-card">
    <h3>Escribe en cualquiera de los 3 — los otros se actualizan solos</h3>
    <div class="field-inline">
      ${fieldRow('Grados','au_d',45)}
      ${fieldRow('Minutos','au_m',15)}
      ${fieldRow('Segundos','au_s',12.96)}
    </div>
    ${fieldRow('Grados decimales (°)','au_dec',45.2536)}
    ${fieldRow('Centesimal (gon)','au_gon',50.28178)}
  </div>`;
  toolShell('angulo','Convierte un ángulo entre los tres sistemas: sexagesimal (° \' "), grados decimales y centesimal (gon) — el que usan la mayoría de las estaciones totales. Escribe en cualquier campo y los demás se completan de inmediato.', body);
  const dEl=document.getElementById('au_d'), mEl=document.getElementById('au_m'), sEl=document.getElementById('au_s');
  const decEl=document.getElementById('au_dec'), gonEl=document.getElementById('au_gon');
  let updating=false;
  // <input type="number"> solo acepta punto decimal; fmtNum() usa coma (formato chileno) y el
  // navegador rechaza el valor en silencio. Para escribir en estos campos se usa un número plano.
  const roundNum = (v,d)=> Math.round(v*Math.pow(10,d))/Math.pow(10,d);
  function fromDMS(){
    if(updating) return;
    const d=val('au_d'), m=val('au_m'), s=val('au_s');
    if([d,m,s].some(isNaN)) return;
    updating=true;
    const dec = dmsToDec((d<0||Object.is(d,-0))?-1:1, Math.abs(d), m, s);
    decEl.value = roundNum(dec,6);
    gonEl.value = roundNum(degToGon(dec),6);
    updating=false;
  }
  function fromDec(){
    if(updating) return;
    const dec=val('au_dec');
    if(isNaN(dec)) return;
    updating=true;
    const {sign,d,m,s} = decToDMS(dec);
    dEl.value = (sign<0 && (d||m||s)) ? '-'+d : d; mEl.value=m; sEl.value=roundNum(s,3);
    gonEl.value = roundNum(degToGon(dec),6);
    updating=false;
  }
  function fromGon(){
    if(updating) return;
    const g=val('au_gon');
    if(isNaN(g)) return;
    updating=true;
    const dec = gonToDeg(g);
    const {sign,d,m,s} = decToDMS(dec);
    dEl.value = (sign<0 && (d||m||s)) ? '-'+d : d; mEl.value=m; sEl.value=roundNum(s,3);
    decEl.value = roundNum(dec,6);
    updating=false;
  }
  [dEl,mEl,sEl].forEach(el=>el.addEventListener('input', fromDMS));
  decEl.addEventListener('input', fromDec);
  gonEl.addEventListener('input', fromGon);
}
