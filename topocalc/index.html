<script>
"use strict";

/* ===================== CAPA DE COMPATIBILIDAD NATIVA (Capacitor) =====================
   Esta app funciona tanto como PWA en navegador (file:// o https://) como
   empaquetada en Android vía Capacitor. Cuando corre nativa, usamos los
   plugins de Capacitor (más confiables para permisos en Android); cuando
   corre en navegador, usamos las Web APIs estándar. Todo el resto del
   código llama SIEMPRE a geoGetCurrentPosition/geoWatchPosition/
   pedirPermisoCamara, nunca directo a navigator.geolocation/getUserMedia,
   para que funcione igual en ambos entornos. */
const CAP = (typeof window !== 'undefined' && window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
  ? window.Capacitor : null;
const CapGeo = (CAP && CAP.Plugins) ? CAP.Plugins.Geolocation : null;
const CapCam = (CAP && CAP.Plugins) ? CAP.Plugins.Camera : null;
const esNativo = !!CAP;
// Reserva espacio abajo para el banner de AdMob (que se dibuja nativo, encima del WebView,
// no como parte del HTML) solo cuando corre como app — en el navegador no hay anuncio.
if(esNativo && typeof document !== 'undefined'){
  document.addEventListener('DOMContentLoaded', ()=> document.body.classList.add('con-anuncio'));
}

// Adapta una Position nativa de Capacitor a la forma que ya espera el resto del código
// (misma forma que devuelve navigator.geolocation: pos.coords.{latitude,longitude,accuracy}, pos.timestamp)
function _adaptarPosNativa(pos){ return pos; } // Capacitor ya devuelve la misma forma que la Geolocation API web

// Reemplazo de navigator.geolocation.getCurrentPosition(onPos, onErr, opts)
function geoGetCurrentPosition(onPos, onErr, opts){
  const options = opts || {enableHighAccuracy:true, timeout:15000, maximumAge:0};
  if(CapGeo){
    CapGeo.getCurrentPosition(options).then(pos=> onPos(_adaptarPosNativa(pos))).catch(err=> onErr && onErr(err));
    return;
  }
  if(!navigator.geolocation){ onErr && onErr(new Error('Este navegador no soporta geolocalización.')); return; }
  navigator.geolocation.getCurrentPosition(onPos, onErr, options);
}

// Reemplazo de navigator.geolocation.watchPosition(onPos, onErr, opts)
// Devuelve un objeto {clear()} — NO un id numérico — para que funcione igual con Capacitor (que asigna
// el watch id de forma asíncrona) y con el navegador (que lo asigna de forma síncrona).
function geoWatchPosition(onPos, onErr, opts){
  const options = opts || {enableHighAccuracy:true, timeout:15000, maximumAge:0};
  if(CapGeo){
    let watchId = null;
    let limpiado = false;
    CapGeo.watchPosition(options, (pos, err)=>{
      if(limpiado) return;
      if(err){ onErr && onErr(err); return; }
      if(pos) onPos(_adaptarPosNativa(pos));
    }).then(id=>{
      watchId = id;
      if(limpiado && watchId){ CapGeo.clearWatch({id: watchId}); }
    }).catch(err=> onErr && onErr(err));
    return { clear(){ limpiado = true; if(watchId){ CapGeo.clearWatch({id: watchId}); } } };
  }
  if(!navigator.geolocation){ onErr && onErr(new Error('Este navegador no soporta geolocalización.')); return { clear(){} }; }
  const id = navigator.geolocation.watchPosition(onPos, onErr, options);
  return { clear(){ navigator.geolocation.clearWatch(id); } };
}

// Pide permiso de cámara antes de abrir un getUserMedia en vivo (usado por la Realidad Aumentada).
// El plugin Camera de Capacitor no soporta preview en vivo, así que solo lo usamos para
// disparar el diálogo de permisos nativo de Android; el stream en sí sigue viniendo de getUserMedia.
async function pedirPermisoCamara(){
  if(CapCam){
    try{
      const est = await CapCam.checkPermissions();
      if(est.camera !== 'granted'){
        const pedido = await CapCam.requestPermissions({permissions:['camera']});
        if(pedido.camera !== 'granted'){ throw new Error('Permiso de cámara denegado.'); }
      }
    }catch(e){ throw e; }
  }
  // En navegador no hace falta priming: getUserMedia pide el permiso directamente.
}

/* ===================== ANUNCIOS (AdMob) Y COMPRA "QUITAR ANUNCIOS" (Play Billing) =====================
   Solo hacen algo cuando la app corre empaquetada en Android (esNativo). En el navegador (PWA) estas
   funciones no hacen nada, así que el resto del código puede llamarlas siempre sin comprobar la plataforma.

   IDs DE PRUEBA oficiales de Google (sirven anuncios de prueba siempre, no generan ingresos):
   reemplázalos por tus IDs reales de AdMob (creados en tu propia cuenta) antes de publicar en Play Store,
   junto con el APPLICATION_ID en AndroidManifest.xml. */
const CapAdMob = (CAP && CAP.Plugins) ? CAP.Plugins.AdMob : null;
const CapPurchases = (CAP && CAP.Plugins) ? CAP.Plugins.Purchases : null;
// RevenueCat: reemplaza por tu API key pública de Android (RevenueCat dashboard > Project settings > API keys)
// y crea un Entitlement (ej. "sin_anuncios") asociado al producto de Play Billing "quitar_anuncios".
const REVENUECAT_API_KEY_ANDROID = 'REEMPLAZAR_CON_TU_API_KEY_DE_REVENUECAT';
const REVENUECAT_ENTITLEMENT_SIN_ANUNCIOS = 'sin_anuncios';
if(CapPurchases){
  CapPurchases.configure({ apiKey: REVENUECAT_API_KEY_ANDROID }).catch(()=>{});
}
const ADMOB_BANNER_ID = 'ca-app-pub-3940256099942544/6300978111';       // ID DE PRUEBA — reemplazar antes de publicar
const ADMOB_INTERSTITIAL_ID = 'ca-app-pub-3940256099942544/1033173712'; // ID DE PRUEBA — reemplazar antes de publicar
const SKU_QUITAR_ANUNCIOS = 'quitar_anuncios'; // debes crear un producto no-consumible con este mismo ID en Play Console
const ADS_CADA_N_APERTURAS = 9; // muestra 1 anuncio de pantalla completa cada ~9 aperturas de herramienta

function loadSinAnuncios(){
  try{ return localStorage.getItem('topocalc-sin-anuncios') === '1'; }catch(e){ return false; }
}
function saveSinAnuncios(v){
  try{ localStorage.setItem('topocalc-sin-anuncios', v ? '1' : '0'); }catch(e){}
}
let sinAnunciosComprado = loadSinAnuncios();
let adsInicializado = false;
let interstitialListo = false;
let ultimaRutaAnuncio = null;
let contadorAperturasHerramienta = 0;

async function precargarIntersticial(){
  if(!CapAdMob || sinAnunciosComprado) return;
  try{ await CapAdMob.prepareInterstitial({adId: ADMOB_INTERSTITIAL_ID, isTesting: true}); interstitialListo = true; }
  catch(e){ interstitialListo = false; }
}
async function mostrarBannerAd(){
  if(!CapAdMob || sinAnunciosComprado) return;
  try{ await CapAdMob.showBanner({adId: ADMOB_BANNER_ID, adSize: 'BANNER', position: 'BOTTOM_CENTER', isTesting: true}); }
  catch(e){}
}
async function ocultarBannerAd(){
  if(!CapAdMob) return;
  try{ await CapAdMob.removeBanner(); }catch(e){}
}
async function initAds(){
  if(!CapAdMob || adsInicializado) return;
  adsInicializado = true;
  try{
    await CapAdMob.initialize({initializeForTesting: true});
    CapAdMob.addListener('interstitialAdLoaded', ()=>{ interstitialListo = true; });
    CapAdMob.addListener('interstitialAdFailedToLoad', ()=>{ interstitialListo = false; });
    CapAdMob.addListener('interstitialAdDismissed', ()=>{ precargarIntersticial(); });
    if(!sinAnunciosComprado){ await mostrarBannerAd(); await precargarIntersticial(); }
  }catch(e){ /* si AdMob falla, la app sigue funcionando normalmente sin anuncios */ }
}

// Se llama en cada render() de una herramienta. Cuenta aperturas reales de herramienta (no re-renders
// por cambio de tema o sistema angular) y muestra un intersticial cada ADS_CADA_N_APERTURAS.
function registrarAperturaParaAnuncios(route){
  if(!CapAdMob || sinAnunciosComprado) return;
  if(route === ultimaRutaAnuncio) return;
  ultimaRutaAnuncio = route;
  if(!RENDERERS[route]) return; // no cuenta la pantalla de inicio
  contadorAperturasHerramienta++;
  if(contadorAperturasHerramienta >= ADS_CADA_N_APERTURAS){
    contadorAperturasHerramienta = 0;
    if(interstitialListo){ interstitialListo = false; CapAdMob.showInterstitial().catch(()=>{}); }
  }
}

async function comprobarCompraSinAnuncios(){
  if(!CapPurchases) return;
  try{
    const { customerInfo } = await CapPurchases.getCustomerInfo();
    const tiene = !!(customerInfo && customerInfo.entitlements && customerInfo.entitlements.active && customerInfo.entitlements.active[REVENUECAT_ENTITLEMENT_SIN_ANUNCIOS]);
    if(tiene) activarSinAnuncios();
  }catch(e){}
}
function activarSinAnuncios(){
  sinAnunciosComprado = true;
  saveSinAnuncios(true);
  ocultarBannerAd();
  const btn = document.getElementById('btnQuitarAnuncios');
  if(btn) btn.style.display = 'none';
}
async function comprarQuitarAnuncios(onResult){
  if(!CapPurchases){
    onResult({ok:false, msg:'Las compras solo están disponibles en la app instalada desde Google Play, no en el navegador.'});
    return;
  }
  try{
    const { products } = await CapPurchases.getProducts({ productIdentifiers: [SKU_QUITAR_ANUNCIOS], type: 'inapp' });
    if(!products || !products.length){
      onResult({ok:false, msg:'No se pudo cargar el producto. Intenta más tarde.'});
      return;
    }
    const { customerInfo } = await CapPurchases.purchaseStoreProduct({ product: products[0] });
    const activo = !!(customerInfo && customerInfo.entitlements && customerInfo.entitlements.active && customerInfo.entitlements.active[REVENUECAT_ENTITLEMENT_SIN_ANUNCIOS]);
    if(activo){
      onResult({ok:true, msg:'¡Listo! Ya no verás anuncios.'});
      activarSinAnuncios();
    } else {
      onResult({ok:false, msg:'La compra no se completó.'});
    }
  }catch(e){
    if(e && e.userCancelled){ onResult({ok:false, msg:'Compra cancelada.'}); }
    else onResult({ok:false, msg:(e && e.message) || 'Error al iniciar la compra.'});
  }
}
if(CapPurchases){
  CapPurchases.addListener('ANDROID-PURCHASE-RESPONSE', ()=>{ comprobarCompraSinAnuncios(); });
}

/* ===================== MATH CORE ===================== */
const ELL_A = 6378137;
const ELL_B = 6356752.31424518;
const EP = Math.sqrt(ELL_A*ELL_A - ELL_B*ELL_B) / ELL_B; // segunda excentricidad
const EP2 = EP*EP;
const RC = (ELL_A*ELL_A) / ELL_B; // radio polar de curvatura (c)

function round(v, d){ const f=Math.pow(10,d); return Math.round(v*f)/f; }
function toRad(d){ return d*Math.PI/180; }
function toDeg(r){ return r*180/Math.PI; }
function normDeg(a){ return ((a%360)+360)%360; }

function decToDMS(dec){
  const sign = dec < 0 ? -1 : 1;
  const abs = Math.abs(dec);
  let d = Math.trunc(abs);
  let mFull = (abs - d) * 60;
  let m = Math.trunc(mFull);
  let s = Math.round((mFull - m) * 60 * 1000) / 1000;
  if (s >= 60){ s = 0; m += 1; }
  if (m >= 60){ m = 0; d += 1; }
  return {sign, d, m, s};
}
function dmsToDec(sign, d, m, s){ return sign * (Number(d||0) + Number(m||0)/60 + Number(s||0)/3600); }
function fmtDMS(dec, suffixPos, suffixNeg){
  // Se redondea a 0,1" ANTES de descomponer: así 59,96" acarrea a +1' (antes decToDMS redondeaba a milésimas
  // y toFixed(1) volvía a redondear sin acarreo, mostrando "60.0"). Un ángulo que queda en cero no lleva signo.
  const rDec = Math.round(Math.abs(dec) * 36000) / 36000;
  const {d,m,s} = decToDMS(rDec);
  const sign = (dec < 0 && rDec !== 0) ? -1 : 1;
  const suf = suffixPos ? (sign<0 ? (suffixNeg||'') : (suffixPos||'')) : '';
  const sgn = suffixPos ? '' : (sign<0 ? '-' : '');
  return `${sgn}${d}° ${String(m).padStart(2,'0')}' ${s.toFixed(1).padStart(4,'0')}" ${suf}`.trim();
}
function fmtNum(v, d=3){ if(!isFinite(v)) return '—'; return v.toLocaleString('es-CL',{minimumFractionDigits:d,maximumFractionDigits:d}); }
/* Como fmtNum, pero redondea a máximo "d" decimales sin rellenar con ceros: si tras redondear
   no quedan decimales significativos, no muestra coma (ej: 12,5000 -> "12,5"; 100,0000 -> "100"). */
function fmtNumTrim(v, d=3){ if(!isFinite(v)) return '—'; return v.toLocaleString('es-CL',{minimumFractionDigits:0,maximumFractionDigits:d}); }

/* ---- Sistema angular: sexagesimal (360°, °'") vs centesimal (400g, gon) ---- */
function degToGon(deg){ return deg*(400/360); }
function gonToDeg(gon){ return gon*(360/400); }
function fmtGon(dec, decimals=4){
  if(!isFinite(dec)) return '—';
  const g = degToGon(dec);
  return `${fmtNum(g,decimals)}ᵍ`;
}

let angleSystem = 'cent'; // 'sex' | 'cent'
function loadAngleSystem(){ try{ return localStorage.getItem('topocalc-angsys') || 'cent'; }catch(e){ return 'cent'; } }
function saveAngleSystem(v){ try{ localStorage.setItem('topocalc-angsys', v); }catch(e){} }

/* Formatea un ángulo (grados decimales, base 360) en el sistema activo, para RESULTADOS */
function fmtAngle(dec, suffixPos, suffixNeg){
  if(angleSystem === 'cent') return fmtGon(dec,4) + (suffixPos ? ` ${dec<0?(suffixNeg||''):(suffixPos||'')}` : '');
  return fmtDMS(dec, suffixPos, suffixNeg);
}
/* Unidad "pequeña" para tolerancias/errores angulares: segundo sexagesimal (") o segundo centesimal (cc) */
function smallUnitLabel(){ return angleSystem === 'cent' ? 'cc' : '"'; }
function degToSmallUnit(deg){ return angleSystem === 'cent' ? deg*(400*10000/360) : deg*3600; }
function smallUnitToDeg(v){ return angleSystem === 'cent' ? v*(360/(400*10000)) : v/3600; }

/* Construye un bloque de input de ángulo, con su propio label: 3 casillas °/'/" en sexagesimal, o 1 casilla decimal en gon */
function angleFieldHTML(idPrefix, defaultDeg, label){
  label = label || 'Ángulo';
  if(angleSystem === 'cent'){
    const gon = round(degToGon(defaultDeg),4);
    return `<div class="field-row"><label>${label} (gon)</label>
      <input type="number" step="any" id="${idPrefix}_gon" value="${gon}"></div>`;
  }
  const {d,m,s} = decToDMS(defaultDeg);
  return `<div class="field-row"><label>${label} (° ' ")</label><div class="field-inline">
    ${fieldRow('°',`${idPrefix}_d`,d)}${fieldRow("'",`${idPrefix}_m`,m)}${fieldRow('"',`${idPrefix}_s`,s)}
  </div></div>`;
}
function readAngleField(idPrefix){
  if(angleSystem === 'cent'){
    const gon = val(`${idPrefix}_gon`);
    return isNaN(gon) ? NaN : gonToDeg(gon);
  }
  const d=val(`${idPrefix}_d`), m=val(`${idPrefix}_m`), s=val(`${idPrefix}_s`);
  if(isNaN(d)||isNaN(m)||isNaN(s)) return NaN;
  return dmsToDec((d<0||Object.is(d,-0))?-1:1, Math.abs(d), m, s);
}
/* Input simple de ángulo (ej. ángulo vertical de estación total): grados decimales o gon según sistema */
function angleSimpleLabel(){ return angleSystem === 'cent' ? '(gon)' : '(°)'; }
function readAngleSimple(id){
  const v = val(id);
  if(isNaN(v)) return NaN;
  return angleSystem === 'cent' ? gonToDeg(v) : v;
}
function angleSimpleDefault(defaultDeg){ return angleSystem === 'cent' ? round(degToGon(defaultDeg),4) : defaultDeg; }

function utmBanda(latDeg){
  const edges  = [-80,-72,-64,-56,-48,-40,-32,-24,-16,-8,0,8,16,24,32,40,48,56,64,72,80,84];
  const letters= ["C","D","E","F","G","H","J","K","L","M","N","P","Q","R","S","T","U","V","W","X"];
  for(let i=0;i<edges.length-1;i++){
    if(latDeg>=edges[i] && latDeg<edges[i+1]) return letters[i];
  }
  if(latDeg>=84) return "X";
  return "?";
}

function latLonToUTM(latDeg, lonDeg){
  const zona = Math.trunc(lonDeg/6 + 31);
  const meridianoCentral = 6*zona - 183;
  const hemisferio = latDeg < 0 ? 'S' : 'N';
  const r = tmDirecta(latDeg, lonDeg, meridianoCentral, 0.9996, 500000, hemisferio==='S' ? 10000000 : 0, ELL_A, (ELL_A-ELL_B)/ELL_A);
  return {zona, banda: utmBanda(latDeg), este: r.este, norte: r.norte, hemisferio, meridianoCentral};
}

function utmToLatLon(este, norte, zona, hemisferio){
  const meridianoCentral = 6*zona - 183;
  const r = tmInversa(este, norte, meridianoCentral, 0.9996, 500000, hemisferio==='S' ? 10000000 : 0, ELL_A, (ELL_A-ELL_B)/ELL_A);
  return {lat: r.lat, lon: r.lon, meridianoCentral};
}

function azToRumbo(az){
  let ns,ew,ang;
  if(az<=90){ns='N';ew='E';ang=az;}
  else if(az<=180){ns='S';ew='E';ang=180-az;}
  else if(az<=270){ns='S';ew='W';ang=az-180;}
  else {ns='N';ew='W';ang=360-az;}
  return {ns,ew,ang};
}

function calcPoligonal(n, azimutAB, minDivDeg, angDec, estaciones, E0, N0, metodo){
  const sumaObs = angDec.reduce((a,b)=>a+b,0);
  const sumaTeo = 180*(n-2);
  const EcDeg = sumaTeo - sumaObs;
  const maxErrDeg = minDivDeg*Math.sqrt(n);
  const corrPer = EcDeg/n;
  const angCorr = angDec.map(a => a + corrPer);

  const az = new Array(n);
  az[0] = azimutAB;
  const adjust = raw => raw >= 180 ? raw-180 : raw+180;
  for(let i=1;i<n;i++){
    az[i] = adjust(az[i-1] + angCorr[i]);
  }
  const azN = az.map(normDeg);
  const rumbos = azN.map(azToRumbo);

  const dist = estaciones.map(e => e.dist);
  const Eraw = azN.map((a,i) => dist[i]*Math.sin(toRad(a)));
  const Nraw = azN.map((a,i) => dist[i]*Math.cos(toRad(a)));

  const sumEpos = Eraw.filter(v=>v>0).reduce((a,b)=>a+b,0);
  const sumEneg = Eraw.filter(v=>v<0).reduce((a,b)=>a-b,0);
  const sumNpos = Nraw.filter(v=>v>0).reduce((a,b)=>a+b,0);
  const sumNneg = Nraw.filter(v=>v<0).reduce((a,b)=>a-b,0);

  const errEW = round(sumEpos - sumEneg, 3);
  const errNS = round(sumNpos - sumNneg, 3);
  const perimetro = dist.reduce((a,b)=>a+b,0);

  let Eadj, Nadj;
  if(metodo === 'bowditch'){
    // Regla de Bowditch (compás): correccion proporcional a la distancia del lado
    Eadj = Eraw.map((v,i) => v - errEW*(dist[i]/perimetro));
    Nadj = Nraw.map((v,i) => v - errNS*(dist[i]/perimetro));
  } else {
    // Regla del Transito (default): correccion proporcional a la proyeccion absoluta del lado
    const AO = (sumEpos+sumEneg) !== 0 ? errEW/(sumEpos+sumEneg) : 0;
    const AP = (sumNpos+sumNneg) !== 0 ? errNS/(sumNpos+sumNneg) : 0;
    Eadj = Eraw.map(v => v - AO*v);
    Nadj = Nraw.map(v => v - AP*v);
  }

  const coordE = [E0], coordN = [N0];
  for(let i=0;i<n;i++){
    coordE.push(coordE[coordE.length-1] + Eadj[i]);
    coordN.push(coordN[coordN.length-1] + Nadj[i]);
  }

  const errLineal = Math.sqrt(errEW*errEW + errNS*errNS);
  const precision = errLineal > 0 ? perimetro/errLineal : Infinity;

  let area2 = 0;
  for(let i=0;i<n;i++){
    const x1=coordE[i], y1=coordN[i];
    const x2=coordE[(i+1)%n], y2=coordN[(i+1)%n];
    area2 += x1*y2 - x2*y1;
  }
  const areaM2 = Math.abs(area2)/2;

  return {sumaObs,sumaTeo,EcDeg,maxErrDeg,angCorr,az:azN,rumbos,dist,coordE,coordN,
          errEW,errNS,perimetro,errLineal,precision,areaM2,areaHa:areaM2/10000,
          dentroTolerancia: Math.abs(EcDeg) <= maxErrDeg, metodo: metodo==='bowditch'?'bowditch':'transit'};
}

function calcAreaCoords(points){
  const n = points.length;
  let area2 = 0;
  for(let i=0;i<n;i++){
    const p1=points[i], p2=points[(i+1)%n];
    area2 += p1.e*p2.n - p2.e*p1.n;
  }
  const areaM2 = Math.abs(area2)/2;
  return {areaM2, areaHa: areaM2/10000};
}

function calcRumboDistancia(e1,n1,e2,n2){
  const de=e2-e1, dn=n2-n1;
  const dist=Math.sqrt(de*de+dn*dn);
  const az=normDeg(toDeg(Math.atan2(de,dn)));
  return {dist, az, rumbo: azToRumbo(az)};
}

/* Distancia perpendicular de un punto a una recta definida por dos puntos, y pie de la perpendicular */
function calcDistanciaPuntoLinea(e1,n1,e2,n2,ep,np){
  const dx=e2-e1, dn=n2-n1;
  const len2 = dx*dx+dn*dn;
  const len = Math.sqrt(len2);
  const t = ((ep-e1)*dx + (np-n1)*dn)/len2;
  const footE = e1+t*dx, footN = n1+t*dn;
  const dist = Math.hypot(ep-footE, np-footN);
  const cross = dx*(np-n1) - dn*(ep-e1);
  const signedDist = cross/len;
  const distDesdeA = t*len;
  return {dist, footE, footN, distDesdeA, len, signedDist, tFraction:t, lado: signedDist>=0 ? 'izquierda' : 'derecha'};
}

function calcCurvaCircular(R, deltaDeg){
  const dr = toRad(deltaDeg);
  return {
    T: R*Math.tan(dr/2),
    Lc: R*dr,
    C: 2*R*Math.sin(dr/2),
    E: R*(1/Math.cos(dr/2) - 1),
    M: R*(1-Math.cos(dr/2))
  };
}

/* Resuelve R y Δ a partir de cualquier par de elementos conocidos de una curva circular
   simple (R o Δ, junto con T, Lc, C, E o M). Devuelve {R, Ddeg}; NaN si la combinación
   no es geométricamente válida (p.ej. una cuerda mayor que el diámetro). */
function resolveCurvaCircular(mode, v1, v2){
  let R, Ddeg;
  switch(mode){
    case 'R_D':  R=v1; Ddeg=v2; break;
    case 'R_T':  R=v1; Ddeg=toDeg(2*Math.atan(v2/v1)); break;
    case 'R_Lc': R=v1; Ddeg=toDeg(v2/v1); break;
    case 'R_C':  { const a=v2/(2*v1); R=v1; Ddeg=(a<-1||a>1)?NaN:toDeg(2*Math.asin(a)); break; }
    case 'R_E':  { const a=v1/(v1+v2); R=v1; Ddeg=(a<-1||a>1)?NaN:toDeg(2*Math.acos(a)); break; }
    case 'R_M':  { const a=1-v2/v1; R=v1; Ddeg=(a<-1||a>1)?NaN:toDeg(2*Math.acos(a)); break; }
    case 'D_T':  Ddeg=v1; R=v2/Math.tan(toRad(v1)/2); break;
    case 'D_Lc': Ddeg=v1; R=v2/toRad(v1); break;
    case 'D_C':  Ddeg=v1; R=v2/(2*Math.sin(toRad(v1)/2)); break;
    case 'D_E':  Ddeg=v1; R=v2/(1/Math.cos(toRad(v1)/2)-1); break;
    case 'D_M':  Ddeg=v1; R=v2/(1-Math.cos(toRad(v1)/2)); break;
    default: R=NaN; Ddeg=NaN;
  }
  return {R, Ddeg};
}

/* ---- Cota por progresiva y pendiente (rasante de proyecto) ---- */
function calcCotaProgresiva(Kini,Cini,S,Keval){
  const D = Keval-Kini;
  const dH = D*(S/100);
  const Ceval = Cini+dH;
  return {D, dH, Ceval};
}

/* ---- Plantillado de zanja para alcantarillado (extiende cota por progresiva) ---- */
function calcPlantillaZanja(K1,Cp1,S,Kx,hcama,HI){
  const Cradier = Cp1+(Kx-K1)*(S/100);
  const Cexc = Cradier-hcama;
  const Lmira = HI-Cexc;
  return {Cradier, Cexc, Lmira};
}

/* ---- Capas de pavimento: cota en el eje y en el borde por bombeo transversal ---- */
function calcCapasPavimento(Cras,i,d,e1,e2,e3,capa){
  const espesor = capa===1 ? (e1+e2+e3) : capa===2 ? (e1+e2) : e1;
  const CejeCapa = Cras-espesor;
  const drop = Math.abs(d)*(i/100);
  const CbordeDer = CejeCapa-drop;
  const CbordeIzq = CejeCapa-drop;
  return {CejeCapa, drop, CbordeDer, CbordeIzq};
}

/* ---- Progresiva y offset (izq/der) de un punto respecto a un eje P1-P2, reutilizando
   la misma proyección por producto punto/cruz de calcDistanciaPuntoLinea ---- */
function calcProgresivaOffset(n1,e1,k1,n2,e2,np,ep){
  const dx=e2-e1, dn=n2-n1;
  const len2=dx*dx+dn*dn, len=Math.sqrt(len2);
  const t=((ep-e1)*dx+(np-n1)*dn)/len2;
  const footE=e1+t*dx, footN=n1+t*dn;
  const distDesdeA=t*len;
  const Kp=k1+distDesdeA;
  const cross=dx*(np-n1)-dn*(ep-e1);
  const offset=-(cross/len); // positivo = derecha, en el sentido de avance P1→P2
  return {footE, footN, Kp, offset, lado: offset>=0?'derecha':'izquierda', az: normDeg(toDeg(Math.atan2(dx,dn)))};
}

function calcCurvaVertical(p1,p2,L){
  const A = Math.abs(p1-p2);
  return {A, K: A!==0 ? L/A : Infinity, e: (A*L)/800, tipo: p2>p1 ? 'En columpio (cóncava)' : 'En cima (convexa)'};
}
/* Tabla de replanteo de una curva vertical parabólica simétrica: pendiente instantánea,
   corrección respecto a la tangente de entrada, y cota real si se conoce progresiva y cota
   del PIV (si no se conocen, igual se informan distancia y corrección, sin cota absoluta). */
function calcCurvaVerticalReplanteo(p1, p2, L, paso, pivProg, pivCota){
  const tienePiv = !isNaN(pivProg) && !isNaN(pivCota);
  const pvcProg = tienePiv ? pivProg - L/2 : 0;
  const pvcCota = tienePiv ? pivCota - (p1/100)*(L/2) : null;
  const rows = [];
  const pushRow = (xi)=>{
    const pendiente = p1 + (p2-p1)*xi/L;
    const correccion = ((p1-p2)/(200*L))*xi*xi;
    const row = { x:xi, prog: pvcProg+xi, pendiente, correccion };
    if(tienePiv) row.cota = (pvcCota + (p1/100)*xi) - correccion;
    rows.push(row);
  };
  let x=0;
  while(x < L-1e-9){ pushRow(x); x+=paso; }
  pushRow(L);
  return {rows, pvcProg, pvcCota, tienePiv};
}

function calcTaquimetria(hs,hi,hm,anguloDeg,K,alturaInstr){
  const dg = hs-hi;
  const a = toRad(anguloDeg);
  const Dh = K*dg*Math.pow(Math.cos(a),2);
  const Dv = K*dg*Math.sin(a)*Math.cos(a);
  return {dg, Dh, Dv, desnivel: alturaInstr + Dv - hm};
}

function calcNivelacionTrig(D,anguloDeg,hi,hm){
  const a = toRad(anguloDeg);
  return {desnivel: D*Math.tan(a) + hi - hm};
}

function calcTalud(desnivel,distancia){
  return {
    pendientePct: (desnivel/distancia)*100,
    anguloDeg: toDeg(Math.atan(desnivel/distancia)),
    relacion: distancia/Math.abs(desnivel)
  };
}

/* ---- Chequeo de nivel: prueba de las dos estacas (error de colimación) ---- */
function calcNivelDosEstacas(a1,b1,a2,b2,D,d){
  const dhTrue = a1-b1;
  const dhApp = a2-b2;
  const dA2 = d, dB2 = D-d;
  const denom = dA2-dB2;
  const e = denom!==0 ? ((a2-b2)-dhTrue)/denom : 0; // error por metro (misma unidad que las lecturas)
  const errMM30 = e*30*1000; // error equivalente en mm cada 30 m de visual
  const bCorrecta = a2-dhTrue; // lectura que debería verse en B, en posición 2, si el nivel estuviera en ajuste
  const ok = Math.abs(errMM30) <= 3;
  return {dhTrue, dhApp, e, errMM30, bCorrecta, ok};
}

/* ---- Chequeo de teodolito/estación: colimación horizontal + índice vertical (dos caras CI/CD) ---- */
function calcDosCaras(hzFL,hzFR,zFL,zFR){
  let diffH = normDeg(hzFR-hzFL-180);
  if(diffH>180) diffH -= 360;
  const C = diffH/2; // error de colimación horizontal
  const hzMean = normDeg(hzFL+C);
  const diffV = (zFL+zFR)-360;
  const i = diffV/2; // error de índice vertical
  const zMean = zFL-i;
  const Csec = C*3600, isec = i*3600;
  return {C, Csec, hzMean, i, isec, zMean, okC: Math.abs(Csec)<=20, okI: Math.abs(isec)<=20};
}

/* ---- Chequeo de estación: constante aditiva del EDM (línea base A-B-C colineal) ---- */
function calcConstanteEDM(distAB,distBC,distAC){
  const K = (distAB+distBC)-distAC;
  return {K, ok: Math.abs(K)<=0.005};
}

function calcConvergencia(latDeg, lonDeg, zonaManual){
  const zona = zonaManual || Math.trunc(lonDeg/6 + 31);
  const mc = 6*zona - 183;
  const deltaLambda = lonDeg - mc;
  // Convergencia EXACTA sobre el elipsoide: ángulo entre el meridiano y el norte de la cuadrícula UTM, obtenido derivando la propia
  // proyección a lo largo del meridiano. (La fórmula clásica de 1.er orden, Δλ·senφ, se desvía hasta ~3" a 3° del meridiano central.)
  const f = (ELL_A-ELL_B)/ELL_A, h = 1e-4;
  const s = tmDirecta(latDeg-h, lonDeg, mc, 0.9996, 500000, 0, ELL_A, f), n = tmDirecta(latDeg+h, lonDeg, mc, 0.9996, 500000, 0, ELL_A, f);
  const conv = -toDeg(Math.atan2(n.este - s.este, n.norte - s.norte));
  return {zona, mc, deltaLambda, conv};
}

/* ---- Navegación GPS: distancia y rumbo entre dos coordenadas geográficas (fórmulas de círculo máximo / haversine) ---- */
function haversineDist(lat1,lon1,lat2,lon2){
  const R = 6371000; // radio medio terrestre (m)
  const f1=toRad(lat1), f2=toRad(lat2);
  const df=toRad(lat2-lat1), dl=toRad(lon2-lon1);
  const a = Math.sin(df/2)**2 + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
  const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}
function initialBearing(lat1,lon1,lat2,lon2){
  const f1=toRad(lat1), f2=toRad(lat2), dl=toRad(lon2-lon1);
  const y = Math.sin(dl)*Math.cos(f2);
  const x = Math.cos(f1)*Math.sin(f2) - Math.sin(f1)*Math.cos(f2)*Math.cos(dl);
  return normDeg(toDeg(Math.atan2(y,x)));
}

/* ---- Mediciones y correcciones de línea base ---- */
function calcReduccionHorizonte(Di, anguloDeg){
  const a = toRad(anguloDeg);
  return {Dh: Di*Math.cos(a), Dv: Di*Math.sin(a)};
}
function calcCorrTemperatura(L, Tact, Test, coefK){
  const Ct = coefK*(Tact-Test)*L;
  return {Ct, Lcorr: L+Ct};
}
function calcCorrTension(L, P, Ps, A_mm2, E_MPa){
  const Cp = ((P-Ps)*L)/(A_mm2*E_MPa);
  return {Cp, Lcorr: L+Cp};
}
function calcCorrNivelMar(L, altitud, radioTierra=6371000){
  const Cm = -(L*altitud)/radioTierra;
  return {Cm, Lcorr: L+Cm};
}
function calcNivelBarometrica(P1,P2,T1,T2){
  const Tm=(T1+T2)/2;
  const desnivel = 18400*(1+Tm/273)*Math.log10(P1/P2);
  return {Tm, desnivel};
}
function calcNivelacionDiferencial(cotaBM, filas){
  // filas: [{bs, fs}] — bs = vista atrás (lectura +), fs = vista adelante (lectura -)
  let cota = cotaBM, hi = null;
  const out = [];
  for(const f of filas){
    if(!isNaN(f.bs)){ hi = cota + f.bs; }
    if(!isNaN(f.fs)){ cota = hi - f.fs; }
    out.push({bs:f.bs, fs:f.fs, hi, cota});
  }
  return out;
}

/* ---- Poligonales avanzadas ---- */
function calcPoligonalAbierta(E0,N0,tramos){
  // tramos: [{az, dist}] en grados decimales / metros
  const coordE=[E0], coordN=[N0];
  for(const t of tramos){
    const r = toRad(t.az);
    coordE.push(coordE[coordE.length-1] + t.dist*Math.sin(r));
    coordN.push(coordN[coordN.length-1] + t.dist*Math.cos(r));
  }
  const perimetro = tramos.reduce((a,t)=>a+t.dist,0);
  return {coordE, coordN, perimetro};
}
function calcTriangulacion(a,b,c){
  if(a+b<=c || a+c<=b || b+c<=a) return null; // no forma triangulo
  const cosA=(b*b+c*c-a*a)/(2*b*c);
  const cosB=(a*a+c*c-b*b)/(2*a*c);
  const cosC=(a*a+b*b-c*c)/(2*a*b);
  const A=toDeg(Math.acos(Math.max(-1,Math.min(1,cosA))));
  const B=toDeg(Math.acos(Math.max(-1,Math.min(1,cosB))));
  const C=180-A-B;
  const s=(a+b+c)/2;
  const area=Math.sqrt(s*(s-a)*(s-b)*(s-c));
  return {A,B,C,area,perimetro:a+b+c};
}
function calcInterseccion(e1,n1,az1,e2,n2,az2){
  const a1=toRad(az1), a2=toRad(az2);
  const D = Math.sin(a2-a1);
  if(Math.abs(D)<1e-9) return null;
  const t1 = ( -(e2-e1)*Math.cos(a2) + Math.sin(a2)*(n2-n1) ) / D;
  const t2 = ( -(e2-e1)*Math.cos(a1) + Math.sin(a1)*(n2-n1) ) / D;
  const E = e1 + t1*Math.sin(a1);
  const N = n1 + t1*Math.cos(a1);
  let ang = Math.abs(normDeg(az2-az1));
  if(ang>180) ang=360-ang;
  if(ang>90) ang=180-ang;
  return {E,N,dist1:t1,dist2:t2,ang};
}

/* ---- Curvas ---- */
function calcRadioPorFlecha(C,f){ return (C*C)/(8*f) + f/2; }
function calcRadioPorCuerdaDelta(C,deltaDeg){ return C/(2*Math.sin(toRad(deltaDeg/2))); }
function calcTablaDeflexion(R, deltaDeg, nPuntos){
  const Lc = R*toRad(deltaDeg);
  const rows=[];
  for(let i=1;i<=nPuntos;i++){
    const Li = Lc*i/nPuntos;
    const defl = (Li/Lc)*(deltaDeg/2);
    const cuerda = 2*R*Math.sin(toRad(defl));
    rows.push({Li, defl, cuerda});
  }
  return {Lc, rows};
}
function calcPeralte(V, R, e){
  const total = (V*V)/(127*R);
  const f = total - e/100;
  return {total, f, fPct: f*100};
}
/* Cota relativa de cada borde de la calzada respecto al eje, asumiendo rotación uniforme
   en torno al eje (todo el ancho de la vía se inclina por igual): borde exterior más alto,
   borde interior más bajo, en la dirección del peralte. */
function calcPeralteBordes(ePct, anchoPista){
  return { cotaExt: anchoPista*(ePct/100), cotaInt: -anchoPista*(ePct/100) };
}
/* Tabla de replanteo del desarrollo del peralte: cada "paso" metros a lo largo de la
   longitud de transición Lt, con avance lineal desde e=0 hasta el peralte final ePct. */
function calcReplanteoPeralte(ePct, Lt, paso, anchoPista){
  const rows = [];
  let d = 0;
  while(d < Lt - 1e-9){
    const frac = d/Lt;
    const ei = ePct*frac;
    rows.push({d, ei, cotaExt: anchoPista*(ei/100), cotaInt: -anchoPista*(ei/100)});
    d += paso;
  }
  rows.push({d:Lt, ei:ePct, cotaExt: anchoPista*(ePct/100), cotaInt: -anchoPista*(ePct/100)});
  return rows;
}
function calcAreaSector(R, deltaDeg){
  const dr = toRad(deltaDeg);
  return {area: (dr/2)*R*R, arco: R*dr};
}

/* ---- Terreno y campo ---- */
function calcCurvaNivelInterp(e1,n1,cota1,e2,n2,cota2,cotaObjetivo){
  if(cota2===cota1) return null;
  const t = (cotaObjetivo-cota1)/(cota2-cota1);
  return {t, E: e1+t*(e2-e1), N: n1+t*(n2-n1), dentro: t>=0 && t<=1};
}
function calcVolumenTierra(A1,A2,D,Am){
  const vExtremas = D*(A1+A2)/2;
  const vPrismoidal = (Am!==undefined && !isNaN(Am)) ? (D/6)*(A1+4*Am+A2) : null;
  return {vExtremas, vPrismoidal};
}
function calcCostoBrigada(sueldoMensual, leyesPct, diasMes, nPersonas, costosAdicDiarios){
  const costoPersonaDia = (sueldoMensual*(1+leyesPct/100))/diasMes;
  const costoBrigadaDia = costoPersonaDia*nPersonas + (costosAdicDiarios||0);
  return {costoPersonaDia, costoBrigadaDia};
}
function calcCotizacion(costoBrigadaDia, dias, materiales, movilizacion, margenPct, ivaPct){
  const costoDirecto = costoBrigadaDia*dias + (materiales||0) + (movilizacion||0);
  const utilidad = costoDirecto*(margenPct/100);
  const neto = costoDirecto + utilidad;
  const iva = neto*(ivaPct/100);
  const total = neto + iva;
  return {costoDirecto, utilidad, neto, iva, total};
}

/* ---- Temperatura ---- */
function cToF(c){ return c*9/5+32; }
function fToC(f){ return (f-32)*5/9; }

/* ---- Nivelación trigonométrica: corrección por curvatura y refracción terrestre ---- */
function calcCurvaturaRefraccion(D_m){
  const Dkm = D_m/1000;
  return 0.0675*Dkm*Dkm; // metros, correccion combinada (curvatura - refraccion), valida para D en km
}

/* ---- Orientación astronómica: azimut del sol por distancia zenital (método clásico) ---- */
function calcAzimutSolar(latDeg, decDeg, zDeg, chDeg){
  const F=toRad(latDeg), d=toRad(decDeg), Z=toRad(zDeg);
  const cosAz = (Math.sin(d) - Math.sin(F)*Math.cos(Z)) / (Math.cos(F)*Math.sin(Z));
  const AzAM = toDeg(Math.acos(Math.max(-1,Math.min(1,cosAz)))); // solucion 0-180 (manana, sol al Este)
  const AzPM = 360-AzAM; // tarde, sol al Oeste
  const R_AM = normDeg(AzAM - chDeg);
  const R_PM = normDeg(AzPM - chDeg);
  return {AzAM, AzPM, R_AM, R_PM};
}

/* ---- Teorema de Pitágoras ---- */
function calcPitagorasHipotenusa(a,b){ return Math.sqrt(a*a+b*b); }
function calcPitagorasCateto(c,a){ if(c<=a) return null; return Math.sqrt(c*c-a*a); }

/* ---- Boleta de Honorarios (SII, Chile) ---- */
function calcBoletaBrutoALiquido(bruto, tasaPct){
  const retencion = bruto*(tasaPct/100);
  return {retencion, liquido: bruto-retencion};
}
function calcBoletaLiquidoABruto(liquido, tasaPct){
  const bruto = liquido/(1-tasaPct/100);
  return {bruto, retencion: bruto-liquido};
}
/* IVA (Chile, 19%): el impuesto se redondea al peso, así neto + IVA = total exacto.
   modo 'neto': el monto es el valor sin IVA · modo 'total': el monto ya incluye el IVA. */
function calcIVA(monto, tasaPct, modo){
  if(modo === 'total'){
    const neto = Math.round(monto/(1+tasaPct/100));
    return {neto, iva: monto-neto, total: monto};
  }
  const iva = Math.round(monto*tasaPct/100);
  return {neto: monto, iva, total: monto+iva};
}

/* ---- Replanteo de curva por ordenadas desde la tangente (solo cinta métrica) ---- */
function calcReplanteoOrdenadas(R, deltaDeg, step){
  const deltaRad = toRad(deltaDeg);
  const xMax = R*Math.sin(deltaRad);
  const yMax = R*(1-Math.cos(deltaRad));
  const rows = [];
  let x = step;
  let truncated = false;
  while(x < xMax - 1e-9){
    if(rows.length >= 60){ truncated = true; break; }
    const y = R - Math.sqrt(Math.max(R*R - x*x, 0));
    const theta = Math.asin(Math.min(1, x/R));
    rows.push({x, y, arco: R*theta, esPT:false});
    x += step;
  }
  rows.push({x:xMax, y:yMax, arco:R*deltaRad, esPT:true});
  return {xMax, yMax, Lc:R*deltaRad, rows, truncated};
}

/* ---- Replanteo de curva por ordenadas desde la cuerda (por el interior, cinta métrica) ---- */
function calcReplanteoCuerda(R, deltaDeg, step){
  const deltaRad = toRad(deltaDeg);
  const Lchord = 2*R*Math.sin(deltaRad/2);
  const d = R*Math.cos(deltaRad/2);
  const half = Lchord/2;
  const rows = [];
  let x = 0;
  let truncated = false;
  while(x <= Lchord + 1e-9){
    if(rows.length >= 61){ truncated = true; break; }
    const dx = x - half;
    const under = R*R - dx*dx;
    const y = under>0 ? Math.sqrt(under) - d : 0;
    rows.push({x, y: Math.max(y,0), esPC: x<1e-9, esPT: Math.abs(x-Lchord)<1e-9});
    x += step;
  }
  if(rows.length && Math.abs(rows[rows.length-1].x - Lchord) > 1e-9 && !truncated){
    rows.push({x:Lchord, y:0, esPC:false, esPT:true});
  }
  const M = R - d;
  return {Lchord, d, M, rows, truncated};
}

/* ---- Curva de transicion (clotoide / espiral de Euler) ---- */
function calcClotoide(R, Ls){
  const A = Math.sqrt(R*Ls);
  const tau = Ls/(2*R); // radianes
  const l = Ls;
  const Xc = l - Math.pow(l,5)/(40*R*R*Ls*Ls) + Math.pow(l,9)/(3456*Math.pow(R,4)*Math.pow(Ls,4));
  const Yc = Math.pow(l,3)/(6*R*Ls) - Math.pow(l,7)/(336*Math.pow(R,3)*Math.pow(Ls,3));
  const p = Yc - R*(1-Math.cos(tau));
  const k = Xc - R*Math.sin(tau);
  const Tl = Xc - Yc/Math.tan(tau); // tangente larga
  const Tc = Yc/Math.sin(tau); // tangente corta
  return {A, tauDeg: toDeg(tau), Xc, Yc, p, k, Tl, Tc};
}
function clotoidePunto(R, Ls, l){
  // Coordenadas (x,y) de un punto a distancia l sobre la espiral, respecto al origen TE (tangente = eje x)
  const x = l - Math.pow(l,5)/(40*R*R*Ls*Ls);
  const y = Math.pow(l,3)/(6*R*Ls);
  return {x,y};
}

/* ---- Curva circular compuesta (dos radios, tangentes en PCC) ---- */
function calcCurvaCompuesta(R1, d1Deg, R2, d2Deg){
  const t1r=toRad(d1Deg/2), t2r=toRad(d2Deg/2);
  const T1=R1*Math.tan(t1r), T2=R2*Math.tan(t2r);
  const Lc1=R1*toRad(d1Deg), Lc2=R2*toRad(d2Deg);
  const C1=2*R1*Math.sin(t1r), C2=2*R2*Math.sin(t2r);
  return {T1,T2,Lc1,Lc2,C1,C2, deltaTotal:d1Deg+d2Deg, LcTotal:Lc1+Lc2};
}

/* ---- Curva de reversa (S: dos curvas de sentido contrario) ---- */
function calcCurvaReversa(R1, d1Deg, R2, d2Deg, tanIntermedia){
  const t1r=toRad(d1Deg/2), t2r=toRad(d2Deg/2);
  const T1=R1*Math.tan(t1r), T2=R2*Math.tan(t2r);
  const Lc1=R1*toRad(d1Deg), Lc2=R2*toRad(d2Deg);
  const C1=2*R1*Math.sin(t1r), C2=2*R2*Math.sin(t2r);
  const dt = tanIntermedia||0;
  return {T1,T2,Lc1,Lc2,C1,C2, distPI1PI2: T1+dt+T2, LcTotal:Lc1+Lc2};
}

/* ---- Geodesia: geodesicas <-> geocentricas y transformacion de datum ---- */
function geodeticToGeocentric(latDeg, lonDeg, h, a, e2){
  const lat=toRad(latDeg), lon=toRad(lonDeg);
  const N = a/Math.sqrt(1-e2*Math.sin(lat)*Math.sin(lat));
  return {
    X: (N+h)*Math.cos(lat)*Math.cos(lon),
    Y: (N+h)*Math.cos(lat)*Math.sin(lon),
    Z: (N*(1-e2)+h)*Math.sin(lat)
  };
}
function geocentricToGeodetic(X,Y,Z,a,e2){
  const lon = Math.atan2(Y,X);
  const p = Math.sqrt(X*X+Y*Y);
  let lat = Math.atan2(Z, p*(1-e2));
  let N;
  for(let i=0;i<8;i++){
    N = a/Math.sqrt(1-e2*Math.sin(lat)*Math.sin(lat));
    const h = p/Math.cos(lat) - N;
    lat = Math.atan2(Z, p*(1-e2*N/(N+h)));
  }
  N = a/Math.sqrt(1-e2*Math.sin(lat)*Math.sin(lat));
  const h = p/Math.cos(lat) - N;
  return {lat: toDeg(lat), lon: toDeg(lon), h};
}
const ELIP_PSAD56 = {a:6378388, f:1/297};
ELIP_PSAD56.e2 = ELIP_PSAD56.f*(2-ELIP_PSAD56.f);
const ELIP_SIRGAS = {a:6378137, f:1/298.257223563};
ELIP_SIRGAS.e2 = ELIP_SIRGAS.f*(2-ELIP_SIRGAS.f);
function calcDatumTransform(latDeg, lonDeg, h, dX, dY, dZ, direction){
  if(direction==='toSirgas'){
    const geo = geodeticToGeocentric(latDeg,lonDeg,h,ELIP_PSAD56.a,ELIP_PSAD56.e2);
    return geocentricToGeodetic(geo.X+dX, geo.Y+dY, geo.Z+dZ, ELIP_SIRGAS.a, ELIP_SIRGAS.e2);
  }
  const geo = geodeticToGeocentric(latDeg,lonDeg,h,ELIP_SIRGAS.a,ELIP_SIRGAS.e2);
  return geocentricToGeodetic(geo.X-dX, geo.Y-dY, geo.Z-dZ, ELIP_PSAD56.a, ELIP_PSAD56.e2);
}

/* ---- Altura elipsoidal <-> ortometrica (ondulacion geoidal N conocida) ---- */
function calcAlturaElipsoidal(H, N){ return H+N; }
function calcAlturaOrtometrica(h, N){ return h-N; }

/* ---- Radiacion / replanteo desde una estacion (coordenadas polares) ---- */
function calcRadiacionPunto(E0, N0, azDeg, dist){
  const E = E0 + dist*Math.sin(toRad(azDeg));
  const N = N0 + dist*Math.cos(toRad(azDeg));
  return {E,N};
}

/* ---- Fotogrametria / drones ---- */
function calcGSD(alturaVuelo_m, anchoSensor_mm, distFocal_mm, anchoImagen_px){
  return (alturaVuelo_m * anchoSensor_mm * 100) / (distFocal_mm * anchoImagen_px); // cm/px
}
function calcAlturaParaGSD(gsd_cm, anchoSensor_mm, distFocal_mm, anchoImagen_px){
  return (gsd_cm*distFocal_mm*anchoImagen_px)/(anchoSensor_mm*100); // m
}
function calcFootprint(alturaVuelo_m, anchoSensor_mm, altoSensor_mm, distFocal_mm, anchoImagen_px, altoImagen_px){
  const gsd_m = calcGSD(alturaVuelo_m, anchoSensor_mm, distFocal_mm, anchoImagen_px)/100;
  return {gsd_m, footAncho: gsd_m*anchoImagen_px, footAlto: gsd_m*altoImagen_px};
}
function calcTraslapeVuelo(footAncho, footAlto, traslapeFrontalPct, traslapeLateralPct){
  return {
    baseVuelo: footAlto*(1-traslapeFrontalPct/100),
    espaciamientoLineas: footAncho*(1-traslapeLateralPct/100)
  };
}

/* ---- Pendiente entre dos puntos con cota ---- */
function calcPendienteDosPuntos(e1,n1,cota1,e2,n2,cota2){
  const distH = Math.sqrt((e2-e1)*(e2-e1)+(n2-n1)*(n2-n1));
  const desnivel = cota2-cota1;
  const pendientePct = distH!==0 ? (desnivel/distH)*100 : Infinity;
  const pendienteDeg = toDeg(Math.atan2(desnivel,distH));
  const distInclinada = Math.sqrt(distH*distH+desnivel*desnivel);
  return {distH, desnivel, pendientePct, pendienteDeg, distInclinada};
}

/* ===================== REPLANTEO POR PROGRESIVA (curva / clotoide / eje de proyecto) =====================
   Todas reutilizan calcRadiacionPunto/calcRumboDistancia/clotoidePunto ya existentes; los ángulos que
   reciben estas funciones están siempre en GRADOS decimales (igual que el resto de la app) — la UI se
   encarga de convertir desde/hacia gon o sexagesimal con angleFieldHTML/readAngleField. */
function calcEstacaCurvaProgresiva(KMI, AZI_deg, R, XPC, YPC, KM_estaca){
  const DC = KM_estaca - KMI;
  const centralRad = DC/R;
  const chord = 2*R*Math.sin(centralRad/2);
  const deflDeg = toDeg(centralRad/2);
  const azChordDeg = normDeg(AZI_deg + deflDeg);
  const {E:XP,N:YP} = calcRadiacionPunto(XPC,YPC,azChordDeg,chord);
  return {DC, chord, deflDeg, azChordDeg, XP, YP};
}
function calcEstacaClotoideProgresiva(KMI, AZI_deg, R, Ls, XTE, YTE, KM_estaca){
  const l = KM_estaca - KMI;
  const {x,y} = clotoidePunto(R, Ls, l);
  const chord = Math.sqrt(x*x+y*y);
  const deflDeg = toDeg(Math.atan2(y,x));
  const azChordDeg = normDeg(AZI_deg + deflDeg);
  const {E:XP,N:YP} = calcRadiacionPunto(XTE,YTE,azChordDeg,chord);
  return {l, chord, deflDeg, azChordDeg, XP, YP};
}
/* Eje de proyecto vial: vértices encadenados por progresiva. v0={km,X,Y}; tramos=[{azDeg,long}] */
function calcVerticesEje(v0, tramos){
  const verts=[{...v0}];
  let cur={...v0};
  for(const t of tramos){
    const {E,N} = calcRadiacionPunto(cur.X,cur.Y,t.azDeg,t.long);
    cur = {km: cur.km+t.long, X:E, Y:N};
    verts.push(cur);
  }
  return verts;
}
function calcEstacaEnTramo(vIni, azDeg, km_estaca){
  const d = km_estaca - vIni.km;
  const {E,N} = calcRadiacionPunto(vIni.X,vIni.Y,azDeg,d);
  return {X:E,Y:N};
}

/* ===================== GEODESIA AVANZADA (GNSS, nivelación, proyección) =====================
   Estas funciones sí reciben latitud/longitud/azimut en grados decimales, y devuelven lo mismo,
   consistente con geodeticToGeocentric/geocentricToGeodetic ya existentes. */

/* ---- Problema directo e inverso de la geodesia (fórmulas de Vincenty, 1975 — estándar y robustas
   para cualquier distancia, más precisas que el método de Puissant/latitud media usado en planillas
   clásicas, que solo es válido para líneas cortas). ---- */
function vincentyDirect(lat1Deg, lon1Deg, az1Deg, s, a, f){
  const b = a*(1-f);
  const lat1 = toRad(lat1Deg), az1 = toRad(az1Deg);
  const U1 = Math.atan((1-f)*Math.tan(lat1));
  const sigma1 = Math.atan2(Math.tan(U1), Math.cos(az1));
  const sinAlpha = Math.cos(U1)*Math.sin(az1);
  const cosSqAlpha = 1-sinAlpha*sinAlpha;
  const uSq = cosSqAlpha*(a*a-b*b)/(b*b);
  const A = 1+uSq/16384*(4096+uSq*(-768+uSq*(320-175*uSq)));
  const B = uSq/1024*(256+uSq*(-128+uSq*(74-47*uSq)));
  let sigma = s/(b*A), sigmaP = 2*Math.PI;
  let cos2SigmaM=0, sinSigma=0, cosSigma=0, iter=0;
  while(Math.abs(sigma-sigmaP) > 1e-12 && iter<200){
    cos2SigmaM = Math.cos(2*sigma1+sigma);
    sinSigma = Math.sin(sigma);
    cosSigma = Math.cos(sigma);
    const deltaSigma = B*sinSigma*(cos2SigmaM+B/4*(cosSigma*(-1+2*cos2SigmaM*cos2SigmaM)-B/6*cos2SigmaM*(-3+4*sinSigma*sinSigma)*(-3+4*cos2SigmaM*cos2SigmaM)));
    sigmaP = sigma;
    sigma = s/(b*A)+deltaSigma;
    iter++;
  }
  const tmp = Math.sin(U1)*sinSigma - Math.cos(U1)*cosSigma*Math.cos(az1);
  const lat2 = Math.atan2(Math.sin(U1)*cosSigma+Math.cos(U1)*sinSigma*Math.cos(az1), (1-f)*Math.sqrt(sinAlpha*sinAlpha+tmp*tmp));
  const lambda = Math.atan2(sinSigma*Math.sin(az1), Math.cos(U1)*cosSigma-Math.sin(U1)*sinSigma*Math.cos(az1));
  const C = f/16*cosSqAlpha*(4+f*(4-3*cosSqAlpha));
  const L = lambda-(1-C)*f*sinAlpha*(sigma+C*sinSigma*(cos2SigmaM+C*cosSigma*(-1+2*cos2SigmaM*cos2SigmaM)));
  const lon2 = lon1Deg + toDeg(L);
  const az2 = normDeg(toDeg(Math.atan2(sinAlpha, -tmp)));
  return {lat2: toDeg(lat2), lon2, az2};
}
function vincentyInverse(lat1Deg, lon1Deg, lat2Deg, lon2Deg, a, f){
  const b=a*(1-f);
  const L = toRad(lon2Deg-lon1Deg);
  const U1 = Math.atan((1-f)*Math.tan(toRad(lat1Deg)));
  const U2 = Math.atan((1-f)*Math.tan(toRad(lat2Deg)));
  const sinU1=Math.sin(U1), cosU1=Math.cos(U1), sinU2=Math.sin(U2), cosU2=Math.cos(U2);
  let lambda=L, lambdaP, iter=0;
  let sinSigma=0,cosSigma=0,sigma=0,sinAlpha=0,cosSqAlpha=1,cos2SigmaM=0;
  do{
    const sinLambda=Math.sin(lambda), cosLambda=Math.cos(lambda);
    sinSigma = Math.sqrt(Math.pow(cosU2*sinLambda,2)+Math.pow(cosU1*sinU2-sinU1*cosU2*cosLambda,2));
    if(sinSigma===0) return {dist:0, az1:0, az2:0};
    cosSigma = sinU1*sinU2+cosU1*cosU2*cosLambda;
    sigma = Math.atan2(sinSigma,cosSigma);
    sinAlpha = cosU1*cosU2*sinLambda/sinSigma;
    cosSqAlpha = 1-sinAlpha*sinAlpha;
    cos2SigmaM = cosSqAlpha!==0 ? cosSigma-2*sinU1*sinU2/cosSqAlpha : 0;
    const C = f/16*cosSqAlpha*(4+f*(4-3*cosSqAlpha));
    lambdaP = lambda;
    lambda = L+(1-C)*f*sinAlpha*(sigma+C*sinSigma*(cos2SigmaM+C*cosSigma*(-1+2*cos2SigmaM*cos2SigmaM)));
    iter++;
  } while(Math.abs(lambda-lambdaP)>1e-12 && iter<200);
  const uSq = cosSqAlpha*(a*a-b*b)/(b*b);
  const A = 1+uSq/16384*(4096+uSq*(-768+uSq*(320-175*uSq)));
  const B = uSq/1024*(256+uSq*(-128+uSq*(74-47*uSq)));
  const deltaSigma = B*sinSigma*(cos2SigmaM+B/4*(cosSigma*(-1+2*cos2SigmaM*cos2SigmaM)-B/6*cos2SigmaM*(-3+4*sinSigma*sinSigma)*(-3+4*cos2SigmaM*cos2SigmaM)));
  const dist = b*A*(sigma-deltaSigma);
  const az1 = normDeg(toDeg(Math.atan2(cosU2*Math.sin(lambda), cosU1*sinU2-sinU1*cosU2*Math.cos(lambda))));
  const az2 = normDeg(toDeg(Math.atan2(cosU1*Math.sin(lambda), -sinU1*cosU2+cosU1*sinU2*Math.cos(lambda)))+180);
  return {dist, az1, az2: normDeg(az2)};
}

/* ---- Azimut, ángulo cenital y distancia a partir de un vector geocéntrico (línea base GNSS ΔX,ΔY,ΔZ),
   rotado al sistema topocéntrico local ENU (Este-Norte-Arriba) de la estación. ---- */
function enuDesdeVectorGeocentrico(latDeg, lonDeg, dX,dY,dZ){
  const lat=toRad(latDeg), lon=toRad(lonDeg);
  const e = -Math.sin(lon)*dX + Math.cos(lon)*dY;
  const n = -Math.sin(lat)*Math.cos(lon)*dX - Math.sin(lat)*Math.sin(lon)*dY + Math.cos(lat)*dZ;
  const u = Math.cos(lat)*Math.cos(lon)*dX + Math.cos(lat)*Math.sin(lon)*dY + Math.sin(lat)*dZ;
  const az = normDeg(toDeg(Math.atan2(e,n)));
  const distGeom = Math.sqrt(e*e+n*n+u*u);
  const zenithDeg = toDeg(Math.atan2(Math.sqrt(e*e+n*n), u));
  return {e,n,u,az,distGeom,zenithDeg};
}

/* ---- Nivelación trigonométrica con reducción a Nivel Medio del Mar (cota por ángulo cenital +
   distancia inclinada, con corrección de curvatura terrestre y refracción atmosférica). ---- */
function nivelTrigNMM({a,f, CE, Z_deg, AI, AJ, K, latDeg, azDeg, DI}){
  const b = a*(1-f);
  const e2 = (a*a-b*b)/(a*a);
  const lat = toRad(latDeg);
  const N = a/Math.sqrt(1-e2*Math.sin(lat)*Math.sin(lat));
  const M = a*(1-e2)/Math.pow(1-e2*Math.sin(lat)*Math.sin(lat),1.5);
  const azr = toRad(azDeg);
  const Ralpha = (N*M)/(N*Math.cos(azr)*Math.cos(azr) + M*Math.sin(azr)*Math.sin(azr)); // fórmula de Euler
  const Zr = toRad(Z_deg);
  const Cp = CE + DI*Math.cos(Zr) + Math.pow(DI*Math.sin(Zr),2)*(1-K)/(2*Ralpha) + AI - AJ;
  const CM = (Cp+CE)/2;
  const H = Cp-CE;
  const DNMM = DI - ( (H*H)/(2*DI) + Math.pow(H,4)/(8*Math.pow(DI,3)) + DI*CM/Ralpha );
  return {N,M,Ralpha,Cp,CM,H,DNMM};
}

/* ---- Factor de escala puntual UTM (k, k0=0.9996 en el meridiano central) para reducir una distancia
   de terreno a la distancia proyectada en la cuadrícula UTM. ---- */
function factorEscalaPuntoUTM(este, latDeg, a, f, k0){
  k0 = k0||0.9996;
  const b=a*(1-f);
  const e2=(a*a-b*b)/(a*a);
  const lat=toRad(latDeg);
  const N = a/Math.sqrt(1-e2*Math.sin(lat)*Math.sin(lat));
  const M = a*(1-e2)/Math.pow(1-e2*Math.sin(lat)*Math.sin(lat),1.5);
  const R = Math.sqrt(N*M);
  const xp = este-500000;
  const k = k0*(1 + (xp*xp)/(2*R*R) + Math.pow(xp,4)/(24*Math.pow(R,4)));
  return {k, R};
}

/* ---- Proyección Gauss-Krüger generalizada (parámetros propios de meridiano central, falso
   origen y k0) — base tanto de UTM como de PTL (Plano Topográfico Local). ---- */
/* ---- Proyección transversal de Mercator por la serie de Krüger (orden n^6, Karney 2011): error < 0,1 mm hasta ±4° del meridiano
   central. Reemplaza la serie clásica truncada, cuyo Norte tenía un sesgo de 9 a 21 mm (arco de meridiano truncado en e'^6). ---- */
const _krugerCache = {};
function _krugerCoef(a,f){
  const key=a+'|'+f; if(_krugerCache[key]) return _krugerCache[key];
  const n=f/(2-f), n2=n*n, n3=n2*n, n4=n3*n, n5=n4*n, n6=n5*n;
  return _krugerCache[key] = {
    e: Math.sqrt(f*(2-f)),
    A: a/(1+n)*(1 + n2/4 + n4/64 + n6/256),                       // radio rectificador
    alfa: [ n/2 - 2*n2/3 + 5*n3/16 + 41*n4/180 - 127*n5/288 + 7891*n6/37800,
            13*n2/48 - 3*n3/5 + 557*n4/1440 + 281*n5/630 - 1983433*n6/1935360,
            61*n3/240 - 103*n4/140 + 15061*n5/26880 + 167603*n6/181440,
            49561*n4/161280 - 179*n5/168 + 6601661*n6/7257600,
            34729*n5/80640 - 3418889*n6/1995840,
            212378941*n6/319334400 ],
    beta: [ n/2 - 2*n2/3 + 37*n3/96 - n4/360 - 81*n5/512 + 96199*n6/604800,
            n2/48 + n3/15 - 437*n4/1440 + 46*n5/105 - 1118711*n6/3870720,
            17*n3/480 - 37*n4/840 - 209*n5/4480 + 5569*n6/90720,
            4397*n4/161280 - 11*n5/504 - 830251*n6/7257600,
            4583*n5/161280 - 108847*n6/3991680,
            20648693*n6/638668800 ]
  };
}
function tmDirecta(latDeg, lonDeg, lon0Deg, k0, falseE, falseN, a, f){          // geográficas → este, norte
  const c=_krugerCoef(a,f), phi=toRad(latDeg), lam=toRad(lonDeg-lon0Deg), e=c.e;
  const chi = Math.atan(Math.sinh(Math.asinh(Math.tan(phi)) - e*Math.atanh(e*Math.sin(phi))));   // latitud conforme
  const xi1 = Math.atan2(Math.sin(chi), Math.cos(chi)*Math.cos(lam));
  const eta1 = Math.atanh(Math.cos(chi)*Math.sin(lam));
  let xi = xi1, eta = eta1;
  for(let j=1;j<=6;j++){
    xi  += c.alfa[j-1]*Math.sin(2*j*xi1)*Math.cosh(2*j*eta1);
    eta += c.alfa[j-1]*Math.cos(2*j*xi1)*Math.sinh(2*j*eta1);
  }
  return {este: falseE + k0*c.A*eta, norte: falseN + k0*c.A*xi};
}
function tmInversa(este, norte, lon0Deg, k0, falseE, falseN, a, f){              // este, norte → geográficas
  const c=_krugerCoef(a,f), xi=(norte-falseN)/(k0*c.A), eta=(este-falseE)/(k0*c.A);
  let xi1 = xi, eta1 = eta;
  for(let j=1;j<=6;j++){
    xi1  -= c.beta[j-1]*Math.sin(2*j*xi)*Math.cosh(2*j*eta);
    eta1 -= c.beta[j-1]*Math.cos(2*j*xi)*Math.sinh(2*j*eta);
  }
  const chi = Math.asin(Math.sin(xi1)/Math.cosh(eta1));
  const lam = Math.atan2(Math.sinh(eta1), Math.cos(xi1));
  const tc = Math.tan(chi); let phi = chi;                                        // latitud geodésica desde la conforme (punto fijo)
  for(let i=0;i<10;i++) phi = Math.atan(Math.sinh(Math.asinh(tc) + c.e*Math.atanh(c.e*Math.sin(phi))));
  return {lat: toDeg(phi), lon: lon0Deg + toDeg(lam)};
}
function gaussKrugerGeneral(latDeg, lonDeg, a, ep2, rc, opts){
  const {lon0Deg, k0, falseE, falseN} = opts;
  const f = 1 - 1/Math.sqrt(1+ep2);                                              // aplanamiento a partir de la 2.ª excentricidad
  return tmDirecta(latDeg, lonDeg, lon0Deg, k0, falseE, falseN, a, f);
}
/* PTL: igual que Gauss-Krüger pero con origen/falso-origen propios + factor de escala por elevación
   media de la zona de trabajo (N+H)/N — reduce la deformación en zonas de altiplano/cordillera. */
function calcPTL(latDeg, lonDeg, lon0Deg, falseE, falseN, k0, H_msnm, a, f){
  const b=a*(1-f), ep2=(a*a-b*b)/(b*b), rc=(a*a)/b;
  const base = gaussKrugerGeneral(latDeg,lonDeg,a,ep2,rc,{lon0Deg,k0,falseE,falseN});
  const e2=(a*a-b*b)/(a*a);
  const N = a/Math.sqrt(1-e2*Math.sin(toRad(latDeg))*Math.sin(toRad(latDeg)));
  const elevFactor = (N+H_msnm)/N;
  return { este: falseE + (base.este-falseE)*elevFactor, norte: falseN + (base.norte-falseN)*elevFactor, elevFactor, N };
}

/* ---- Área de un trapecio elipsoidal entre 2 paralelos y 2 meridianos (fórmula cerrada clásica,
   validada contra el límite esférico A=R²·Δλ·(senφ2-senφ1)). ---- */
function areaElipsoidal(lat1Deg,lat2Deg,lon1Deg,lon2Deg,a,f){
  const b=a*(1-f);
  const e2=(a*a-b*b)/(a*a);
  const e=Math.sqrt(e2);
  const q = (phiDeg)=>{
    const s=Math.sin(toRad(phiDeg));
    return s/(1-e2*s*s) + (1/(2*e))*Math.log((1+e*s)/(1-e*s));
  };
  const dLambda = toRad(lon2Deg-lon1Deg);
  return Math.abs((b*b/2)*dLambda*(q(lat2Deg)-q(lat1Deg)));
}

/* ===================== AJUSTES GEODÉSICOS DE UN CUADRILÁTERO (2 diagonales) =====================
   Ajuste por mínimos cuadrados (correcciones mínimas, pesos iguales) de los 8 ángulos observados, imponiendo:
   3 condiciones de figura (suma 180° en cada triángulo) + 1 condición de lado (ecuación de senos). */
function _resolverSistema(M, b){            // Gauss con pivoteo parcial: resuelve M·x = b (M cuadrada, pequeña)
  const n=b.length, A=M.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
    [A[c],A[p]]=[A[p],A[c]];
    for(let r=c+1;r<n;r++){ const k=A[r][c]/A[c][c]; for(let q=c;q<=n;q++) A[r][q]-=k*A[c][q]; }
  }
  const x=new Array(n).fill(0);
  for(let r=n-1;r>=0;r--){ let s=A[r][n]; for(let q=r+1;q<n;q++) s-=A[r][q]*x[q]; x[r]=s/A[r][r]; }
  return x;
}
function ajusteCuadrilateroAngulos(A1,A2,A3,A4,B1,B2,B3,B4){
  // Ángulos en GRADOS decimales. Convención: en el vértice i (A, B, C, D en el orden del dibujo), Ai = ángulo entre el lado
  // hacia el vértice siguiente y la diagonal; Bi = ángulo entre la diagonal y el lado hacia el vértice anterior.
  //   I: A1+A2+B2+B3 = 180° (triángulo ABC)   J: A2+A3+B3+B4 = 180° (BCD)   K: A3+A4+B4+B1 = 180° (CDA)
  //   Lado: senB1·senB2·senB3·senB4 = senA1·senA2·senA3·senA4 (ecuación de senos alrededor del cruce de las diagonales)
  const x0 = [A1,A2,A3,A4,B1,B2,B3,B4].map(toRad);           // orden: A1..A4, B1..B4
  const idx = [[0,1,5,6],[1,2,6,7],[2,3,4,7]];                // I, J, K
  const g = x => {                                            // residuos de las condiciones (rad; el de lado en log-senos)
    const r = idx.map(c=>c.reduce((s,i)=>s+x[i],0)-Math.PI);
    let ln=0; for(let i=0;i<4;i++) ln += Math.log(Math.sin(x[4+i]))-Math.log(Math.sin(x[i]));
    return [...r, ln];
  };
  const jac = (x,conLado)=>{                                  // jacobiana de las condiciones respecto de los 8 ángulos
    const J = idx.map(c=>{ const f=new Array(8).fill(0); c.forEach(i=>f[i]=1); return f; });
    if(conLado) J.push(x.map((v,i)=> (i<4?-1:1)/Math.tan(v)));
    return J;
  };
  // Mínima corrección v con g(x0+v)=0, linealizando alrededor del punto actual (Gauss-Helmert, iterado)
  const resolver = conLado => {
    const m = conLado?4:3; let v = new Array(8).fill(0);
    for(let it=0; it<25; it++){
      const x = x0.map((a,i)=>a+v[i]), J = jac(x,conLado), gx = g(x).slice(0,m);
      const Jv = J.map(f=>f.reduce((s,a,i)=>s+a*v[i],0));
      const JJt = J.map(f=>J.map(h=>f.reduce((s,a,i)=>s+a*h[i],0)));
      const lam = _resolverSistema(JJt, Jv.map((a,i)=>a-gx[i]));
      const vn = new Array(8).fill(0).map((_,i)=>J.reduce((s,f,k)=>s+f[i]*lam[k],0));
      const paso = Math.max(...vn.map((a,i)=>Math.abs(a-v[i]))); v = vn;
      if(paso<1e-15) break;
    }
    return x0.map((a,i)=>toDeg(a+v[i]));
  };
  const K8 = ['A1','A2','A3','A4','B1','B2','B3','B4'], aObj = arr => Object.fromEntries(K8.map((k,i)=>[k,arr[i]]));
  const pre = resolver(false), fin = resolver(true);
  const c0 = g(x0);
  return {
    I: toDeg(c0[0]), J: toDeg(c0[1]), K: toDeg(c0[2]),        // cierres angulares observados (°)
    preliminares: aObj(pre),                                  // solo con las 3 condiciones de figura
    corrLadoDeg: Math.max(...fin.map((a,i)=>Math.abs(a-pre[i]))),  // mayor ajuste adicional por la condición de lado (°)
    finales: aObj(fin)
  };
}

/* ---- Compensación de un cuadrilátero por trilateración (6 lados medidos: 4 perimetrales + 2
   diagonales) — áreas de Herón, ángulos derivados, y control de cierre del lado calculado vs medido. ---- */
function heronArea(a,b,c){ const s=(a+b+c)/2; const t=s*(s-a)*(s-b)*(s-c); return t>0?Math.sqrt(t):0; }
function trilateracionCuadrilatero(a,b,c,d,e,f){
  const areaBCE = heronArea(b,c,e);
  const areaADE = heronArea(a,d,e);
  // Ángulos en el vértice común por LEY DE COSENOS: acos devuelve 0°-180° y por eso sirve también para ángulos obtusos
  // (el asin anterior nunca pasaba de 90°: un ángulo de 100° se mostraba como 80°).
  const clamp = x => Math.max(-1, Math.min(1, x));
  const alpha1 = toDeg(Math.acos(clamp((b*b + e*e - c*c)/(2*b*e))));   // entre b y e (triángulo BCE)
  const alpha2 = toDeg(Math.acos(clamp((a*a + e*e - d*d)/(2*a*e))));   // entre a y e (triángulo ADE)
  const alphaT = alpha1+alpha2;
  const ladoCalc = Math.sqrt(a*a+b*b-2*a*b*Math.cos(toRad(alphaT)));
  const cierre = f-ladoCalc;
  const errorRelativo = ladoCalc!==0 ? Math.abs(f/cierre) : Infinity;
  return {areaBCE, areaADE, alpha1, alpha2, alphaT, ladoCalc, cierre, errorRelativo};
}

/* ---- Cubicación de tierra: métodos por razón de áreas (secciones homogéneas) y por reparto
   corte/terraplén (secciones de transición) — más rigurosos que el simple promedio de áreas. ---- */
function cubicacionHomogenea(A1,A2,D){
  const ratio = A2!==0 ? A1/A2 : Infinity;
  if(ratio>0.33 && ratio<3) return {metodo:'promedio', volumen: D*(A1+A2)/2};
  return {metodo:'corregida', volumen: D*(A1+A2+Math.sqrt(A1*A2))/3};
}
function cubicacionMixta(Sc,St,D){
  return { volCorte: (Sc*Sc/(Sc+St))*(D/2), volTerraplen: (St*St/(Sc+St))*(D/2) };
}

/* ---- Perfil longitudinal (serie de puntos distancia/cota) ---- */
function calcPerfilLongitudinal(puntos){
  const tramos=[];
  for(let i=1;i<puntos.length;i++){
    const dd = puntos[i].d-puntos[i-1].d;
    const dh = puntos[i].cota-puntos[i-1].cota;
    tramos.push({d1:puntos[i-1].d, d2:puntos[i].d, cota1:puntos[i-1].cota, cota2:puntos[i].cota,
      pendPct: dd!==0 ? (dh/dd)*100 : NaN});
  }
  return tramos;
}

/* ---- Area de lote irregular por ordenadas (Simpson / Trapecios) ---- */
function calcAreaTrapecios(h, ys){
  const n=ys.length-1;
  let suma=0;
  for(let i=1;i<n;i++) suma+=ys[i];
  return h*((ys[0]+ys[n])/2 + suma);
}
function calcAreaSimpson(h, ys){
  const n=ys.length-1;
  if(n%2!==0) return null;
  let sImp=0, sPar=0;
  for(let i=1;i<n;i++){ if(i%2===1) sImp+=ys[i]; else sPar+=ys[i]; }
  return (h/3)*(ys[0]+ys[n]+4*sImp+2*sPar);
}

/* ---- Unidades de superficie ---- */
/* Equivalencias oficiales según la Ley S/N de 29-ene-1848 ("Pesos i medidas"), Art. 14:
   una vara=0,836 m; un pié=0,279 m; una vara cuadrada=0,699 m²; un pié cuadrado=7,76 dm²;
   una cuadra=125,39 m (150 varas); una cuadra cuadrada=157,21 áreas. Fuente: Biblioteca del
   Congreso Nacional, Ley Chile (BCN, idNorma=1024220). */
const SURFACE_UNITS = { m2:1, ha:10000, km2:1000000, acre:4046.8564224, varaCuad:0.699, pieCuad:0.0776, cuadraCuad:15721 };
const LENGTH_UNITS = { m:1, km:1000, dm:0.1, cm:0.01, mm:0.001, vara:0.836, pie:0.279, cuadra:125.39 };
function convertLength(value, fromUnit, toUnit){
  return (value*LENGTH_UNITS[fromUnit])/LENGTH_UNITS[toUnit];
}
function convertSurface(value, fromUnit, toUnit){
  return (value*SURFACE_UNITS[fromUnit])/SURFACE_UNITS[toUnit];
}

/* ---- Escala de plano ---- */
function calcEscalaDesdeDistancias(distReal_m, distPlano_cm){ return (distReal_m*100)/distPlano_cm; }
function calcDistanciaRealDesdeEscala(escalaN, distPlano_cm){ return (escalaN*distPlano_cm)/100; }
function calcDistanciaPlanoDesdeEscala(escalaN, distReal_m){ return (distReal_m*100)/escalaN; }

/* ---- Declinacion solar por fecha (Spencer, 1971) ---- */
function dayOfYearUTC(year,month,day){
  const start = Date.UTC(year,0,1);
  const d = Date.UTC(year,month-1,day);
  return Math.round((d-start)/86400000)+1;
}
function calcDeclinacionSolar(year,month,day,hourUT){
  // Coordenadas solares de baja precisión del Almanaque Astronómico (error < 0,01° entre 1950 y 2050), evaluadas en el instante
  // exacto (fecha + hora UT): la declinación cambia hasta 0,39°/día en los equinoccios, así que la hora importa.
  if(hourUT===undefined || hourUT===null || isNaN(hourUT)) hourUT = 12;
  const n = Date.UTC(year,month-1,day)/86400000 + 2440587.5 + hourUT/24 - 2451545.0;   // días desde J2000
  const L = 280.460 + 0.9856474*n;                                                      // longitud media del Sol (°)
  const g = toRad(357.528 + 0.9856003*n);                                               // anomalía media (rad)
  const lambda = toRad(L + 1.915*Math.sin(g) + 0.020*Math.sin(2*g));                    // longitud eclíptica
  const eps = toRad(23.439 - 0.0000004*n);                                              // oblicuidad de la eclíptica
  return toDeg(Math.asin(Math.sin(eps)*Math.sin(lambda)));
}

/* ---- Rendimiento de brigada ---- */
function calcDiasNecesarios(areaTotal, rendimientoDiario){ return areaTotal/rendimientoDiario; }
function calcRendimientoBrigada(areaTotal, dias){ return areaTotal/dias; }

/* ===================== ROUTER ===================== */
let homeScrollY = 0;
let homeBusqueda = '';   // texto del buscador del inicio (se conserva al abrir una herramienta y volver)
function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', render);

function currentRoute(){
  const h = location.hash.replace('#','');
  return h || 'home';
}

/* Herramientas ocultas de la vista principal: NO se eliminan de TOOLS/RENDERERS/CATEGORIES,
   siguen totalmente funcionales (incluso accesibles por enlace directo #tool). Solo se sacan
   de las grillas normales y se agrupan en el desplegable "Próximamente" al final del home. */
const HIDDEN_TOOLS = [
  'corrTemp','corrTension','corrNivelMar','temperatura','costo','cotizacion','rendimientoBrigada','geoidal','azimutSumaResta','converg',
  'geocentricas','directoGeodesico','inversoGeodesico','azimutVectorGeoc','nivelTrigNMM','factorEscalaUTM','ptl','areaElipsoidal','cuadrilateroTriangulacion','cuadrilateroTrilateracion',
  'astronomica','declinacionSolar',
  'nivelBaro',
  'gsd','traslapeVuelo',
  'datumTransform'
];

/* ===================== RENDER: HOME ===================== */
function renderHome(){
  document.body.classList.add('home');
  document.body.classList.remove('in-tool');
  const main = document.getElementById('main');
  let html = `<div class="buscador"><input type="search" id="buscarHerr" placeholder="Buscar: curva, UTM, nivel…" aria-label="Buscar herramienta" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div><div id="resBusqueda" style="display:none;"></div>
  <div class="intro"><p>Calculadoras de topografía para el terreno o el gabinete. Sin conexión, sin instalación — abre esta página y agrégala a tu pantalla de inicio.</p>
    <p style="margin-top:8px;">El botón <strong style="color:var(--blueprint);">${angleSystem==='cent'?'CEN':'SEX'}</strong> arriba a la derecha cambia todos los ángulos entre sexagesimal (° ' ") y centesimal (gon).</p></div>`;
  const hiddenSet = new Set(HIDDEN_TOOLS);
  const toolCardHTML = (tid, hidden) => {
    const t = TOOLS[tid];
    return `<button class="tool-card" data-tool="${tid}" type="button">
        ${hidden?'<span class="badge">Próximamente</span>':''}
        <span class="glyph">${t.icon}</span>
        <span class="name">${t.name}</span>
        <span class="desc">${t.desc}</span>
      </button>`;
  };
  CATEGORIES.forEach((cat, ci) => {
    const visibles = cat.tools.filter(tid => !hiddenSet.has(tid));
    if(!visibles.length) return;
    html += `<section class="category">
      <div class="category-head"><span class="idx">${String(ci+1).padStart(2,'0')}</span><h2>${cat.name}</h2></div>
      <div class="card-grid">`;
    visibles.forEach(tid => { html += toolCardHTML(tid, false); });
    html += `</div></section>`;
  });
  const externalCardHTML = (href, badge, glyph, name, desc) => `<a class="tool-card" href="${href}" style="text-decoration:none; color:inherit;">
        ${badge?`<span class="badge">${badge}</span>`:''}
        <span class="glyph">${glyph}</span>
        <span class="name">${name}</span>
        <span class="desc">${desc}</span>
      </a>`;
  // Herramientas visibles que viven en su propia página dentro de /topocalc/ (no en TOOLS/RENDERERS)
  const PAGE_TOOLS = [
    {href:'./lastplanner/', icon:ICONS.pizarra, name:'Pizarra de Planificación', desc:'Tablero de post-its por semana para planificar obra (Last Planner)', cat:'Gestión de Obra'},
    {href:'./Porticos/', icon:ICONS.pizarra, name:'Programación de Pórticos de Vigilancia', desc:'Instalación de pórticos en la Región de O\'Higgins: excavación, fundación, malla, relleno, pórtico y cámara', cat:'Gestión de Obra'}
  ];
  const pageCats = [...new Set(PAGE_TOOLS.map(p => p.cat))];
  pageCats.forEach((cn, k) => {
    html += `<section class="category">
      <div class="category-head"><span class="idx">${String(CATEGORIES.length+k+1).padStart(2,'0')}</span><h2>${cn}</h2></div>
      <div class="card-grid">${PAGE_TOOLS.filter(p => p.cat === cn).map(p => externalCardHTML(p.href, '', p.icon, p.name, p.desc)).join('')}</div></section>`;
  });
  const EXTERNAL_TOOLS = [];
  if(HIDDEN_TOOLS.length || EXTERNAL_TOOLS.length){
    html += `<details class="proximamente">
      <summary>Próximamente <span class="count">${HIDDEN_TOOLS.length + EXTERNAL_TOOLS.length}</span></summary>
      <div class="card-grid">${HIDDEN_TOOLS.map(tid => toolCardHTML(tid, true)).join('')}${EXTERNAL_TOOLS.join('')}</div>
    </details>`;
  }
  main.innerHTML = html;
  main.querySelectorAll('.tool-card[data-tool]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ homeScrollY = window.scrollY; go(btn.dataset.tool); });
  });
  // ---- Buscador de herramientas: ignora tildes y mayúsculas; todas las palabras deben aparecer en el nombre, la descripción o la categoría.
  //      No incluye las de "Próximamente": esas siguen visibles solo en su desplegable.
  const inp = document.getElementById('buscarHerr'), resBox = document.getElementById('resBusqueda');
  const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const catDe = {}; CATEGORIES.forEach(c => c.tools.forEach(id => { (catDe[id] = catDe[id] || []).push(c.name); }));
  const corpus = {}; Object.keys(TOOLS).forEach(id => { const d = TOOLS[id]; corpus[id] = { nombre: norm(d.name), todo: norm(d.name+' '+String(d.desc||'').replace(/<[^>]*>/g,' ')+' '+(catDe[id]||[]).join(' ')) }; });
  const filtrar = () => {
    homeBusqueda = inp.value;
    const q = norm(inp.value).trim(), resto = main.querySelectorAll('.intro, .category, details.proximamente');
    if(!q){ resBox.style.display = 'none'; resBox.innerHTML = ''; resto.forEach(s => { s.style.display = ''; }); return; }
    const terminos = q.split(/\s+/), enNombre = id => terminos.every(x => corpus[id].nombre.includes(x));
    const hallados = Object.keys(TOOLS).filter(id => !hiddenSet.has(id) && terminos.every(x => corpus[id].todo.includes(x))).sort((a,b) => enNombre(b) - enNombre(a));
    const paginas = PAGE_TOOLS.filter(p => terminos.every(x => norm(p.name+' '+p.desc+' '+p.cat).includes(x)));
    resto.forEach(s => { s.style.display = 'none'; });
    const nRes = hallados.length + paginas.length;
    resBox.innerHTML = `<p class="res-info">${nRes ? nRes+' resultado'+(nRes===1?'':'s') : 'Sin resultados para «'+esc(inp.value.trim())+'». Prueba con otra palabra: curva, área, nivel, UTM, GPS…'}</p>` +
      (nRes ? `<div class="card-grid">${hallados.map(id => toolCardHTML(id, false)).join('')}${paginas.map(p => externalCardHTML(p.href, '', p.icon, p.name, p.desc)).join('')}</div>` : '');
    resBox.style.display = '';
    resBox.querySelectorAll('.tool-card[data-tool]').forEach(btn => { btn.addEventListener('click', () => { homeScrollY = window.scrollY; go(btn.dataset.tool); }); });
  };
  inp.addEventListener('input', filtrar);
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') inp.blur(); });
  if(homeBusqueda){ inp.value = homeBusqueda; filtrar(); }
  document.getElementById('toolTitleTop').textContent = '';
}

/* ===================== GLOSARIO DE SIGLAS (por herramienta) ===================== */
/* Diccionario maestro: cada sigla se define una sola vez aquí. Cada herramienta solo

  'M': 'Ordenada media — distancia desde el punto medio de la cuerda hasta el punto medio del arco',
  'G': 'Grado de curvatura — ángulo central subtendido por una cuerda de 20 m',
  'PC': 'Principio de curva (donde comienza el arco)',
  'PT': 'Fin de curva (donde termina el arco)',
  'PI': 'Punto de Intersección de las dos tangentes (vértice del ángulo de deflexión)',
  'O': 'Centro de la curva circular',
  'p1': 'Pendiente de entrada (%), antes del PIV',
  'p2': 'Pendiente de salida (%), después del PIV',
  'PIV': 'Punto de Intersección Vertical — donde se cruzan las dos pendientes',

  'A': 'Diferencia algebraica de pendientes, |p1−p2| (curva vertical) — o Parámetro de la clotoide, que define qué tan cerrada es la espiral (curva de transición)',
  'L': 'Longitud de la curva (horizontal o vertical, según la herramienta)',
  'e': 'Peralte — inclinación transversal de la calzada en una curva, en %',
  'f': 'Fricción lateral requerida entre el neumático y el pavimento',
  'V': 'Velocidad de diseño (km/h)',
  'a': 'Cateto de un triángulo rectángulo',
  'b': 'Cateto de un triángulo rectángulo',
  'c': 'Hipotenusa de un triángulo rectángulo',
  'h': 'Altura elipsoidal — la que entrega un equipo GNSS/RTK, medida sobre el elipsoide',

  'CD': 'Cara Derecha — lectura del instrumento en posición inversa (anteojo volteado)',
  'ZI': 'Ángulo cenital leído en Cara Izquierda',
  'ZD': 'Ángulo cenital leído en Cara Derecha',
  'EDM': 'Electronic Distance Measurement — el distanciómetro electrónico integrado en una estación total',
  'P': 'Paso (huella) — ancho horizontal de cada peldaño, medido borde a borde',
  'Cp': 'Contrapaso (alzada) — altura vertical de cada peldaño'
};
function glosarioHtml(keys){
  if(!keys || !keys.length) return '';
  const items = keys.filter(k=>GLOSARIO[k]).map(k=>`<div class="gloss-item"><b>${k}</b> — ${GLOSARIO[k]}</div>`).join('');
  if(!items) return '';
  return `<details class="glosario"><summary>Significado de las siglas usadas aquí</summary><div class="gloss-body">${items}</div></details>`;
}

function toolShell(id, blurb, bodyHtml, glosKeys){
  document.body.classList.remove('home');
  document.body.classList.add('in-tool');
  document.getElementById('toolTitleTop').textContent = TOOLS[id].name;
  const main = document.getElementById('main');
  main.innerHTML = `<div class="tool-view">
    <p class="tool-blurb">${blurb}</p>
    ${glosarioHtml(glosKeys)}
    <div class="action-bar">
      <button type="button" id="btnExportInforme" class="btn-sm">📄 Exportar informe</button>
      <button type="button" id="btnShareCapture" class="btn-sm">📷 Compartir captura</button>
      <span id="actionMsg" class="proj-msg"></span>
    </div>
    ${bodyHtml}
  </div>`;
  wireToolActions(id);
}
