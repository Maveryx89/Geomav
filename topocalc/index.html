}

/* Diagrama de traslape frontal entre fotos consecutivas */
function svgTraslape(footAncho, footAlto, baseVuelo){
  const w=220,h=220,pad=20;
  const scale=Math.min((w-2*pad)/footAncho, (h-2*pad)/(footAlto*2 - Math.min(baseVuelo,footAlto)));
  const rectW=footAncho*scale, rectH=footAlto*scale, offsetY=baseVuelo*scale;
  const x0=(w-rectW)/2;
  const y1=pad, y2=pad+Math.max(rectH-offsetY,4);
  const arrowX=Math.min(x0+rectW+10, w-8);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect x="${x0.toFixed(1)}" y="${y1.toFixed(1)}" width="${rectW.toFixed(1)}" height="${rectH.toFixed(1)}" fill="var(--blueprint)" fill-opacity=".2" stroke="var(--blueprint)" stroke-width="1.4"/>
    <rect x="${x0.toFixed(1)}" y="${y2.toFixed(1)}" width="${rectW.toFixed(1)}" height="${rectH.toFixed(1)}" fill="var(--accent)" fill-opacity=".2" stroke="var(--accent)" stroke-width="1.4"/>
    <text x="${(x0+8).toFixed(1)}" y="${(y1+13).toFixed(1)}" font-size="${relFont(w,0.036,7.5,9)}" font-family="var(--font-mono)" fill="var(--blueprint)">Foto 1</text>
    <text x="${(x0+8).toFixed(1)}" y="${(y2+rectH-6).toFixed(1)}" font-size="${relFont(w,0.036,7.5,9)}" font-family="var(--font-mono)" fill="var(--accent-text)">Foto 2</text>
    <text x="${(w/2).toFixed(1)}" y="${(y2+(y1+rectH-y2)/2).toFixed(1)}" font-size="${relFont(w,0.036,7.5,9)}" font-family="var(--font-mono)" fill="var(--ink)" text-anchor="middle">traslape</text>
    <line x1="${arrowX.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${arrowX.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="2 2"/>
    ${svgLineLabel(arrowX,y1,arrowX,y2, 'B='+fmtNum(baseVuelo,1), 'var(--ink-soft)', relFont(w,0.032,6.5,8), -1)}
  </svg>`;
}

/* Diagrama de area irregular por ordenadas */
/* Diagrama de Área Irregular por Ordenadas — v2.
   Basado en la plantilla de Illustrator de Mario (plantilla_area_irregular_mv.svg): mesa 320×190, línea base en ink-soft,
   lindero en blueprint, relleno accent suave (Simpson es el resultado principal), ordenadas punteadas en success con su
   valor a lo largo de la línea, cota del intervalo h bajo la base y áreas al pie. El listado (valor pegado al descriptor)
   va arriba a la izquierda: áreas e intervalo en un bloque, ordenadas en otro. Con más de 12 ordenadas el dibujo lleva solo
   el valor; un rótulo sin lugar libre se omite del dibujo (su valor sigue en el listado). Sin Simpson (N° par de ordenadas),
   el resultado principal pasa a Trapecios. */
function svgAreaOrdenadas(hInterval, ys){
  const W=320, H=190;
  const f = v => v.toFixed(2).replace(/\.?0+$/,'');
  const FONT = 'font-family="var(--font-body)" font-weight="700"';
  const eng = svgLblEngine(W,H);
  const N = ys.length, n = N-1;
  const areaT = calcAreaTrapecios(hInterval, ys), areaS = calcAreaSimpson(hInterval, ys);
  const hasS = areaS!==null;
  const corto = N > 12;
  const mTxt = v => `${fmtNum(v,2)} m`;
  const aTxt = v => `${fmtNum(v,2)} m²`;
  const oTxt = i => corto ? mTxt(ys[i]) : `y${i} = ${mTxt(ys[i])}`;

  // ---- listado: bloque 1 (áreas e intervalo), bloque 2 (ordenadas, columnas de 10 filas) ----
  const blk1 = [];
  blk1.push(hasS ? {k:'Simpson',c:'var(--accent)',v:aTxt(areaS)} : {k:'Simpson',c:'var(--ink-soft)',v:'no aplica'});
  blk1.push({k:'Trapecios', c:hasS?'var(--ink)':'var(--accent)', v:aTxt(areaT)});
  blk1.push({k:'h', c:'var(--ink)', v:mTxt(hInterval)});
  const blk2 = ys.map((y,i)=>({k:`y${i}`, c:'var(--success)', v:mTxt(y)}));
  const ROW_Y0=12.521, ROW_DY=5.761, PER_COL=10;
  const rowW = r => eng.tw(`${r.k} = ${r.v}`,4.32);
  const cols=[]; let x=10.026;
  { const w=Math.max(...blk1.map(rowW)); cols.push({x, rows:blk1, w}); x=Math.max(80.026, x+5.185+w+12); }
  for(let s=0;s<blk2.length;s+=PER_COL){ const rows=blk2.slice(s,s+PER_COL), w=Math.max(...rows.map(rowW)); cols.push({x, rows, w}); x=x+5.185+w+10; }
  const listRight = Math.max(...cols.map(c=>c.x+5.185+c.w))+1;
  const listBottom = ROW_Y0 + (Math.min(Math.max(blk1.length,blk2.length),PER_COL)-1)*ROW_DY + 1;
  eng.rectFill(8.5, 6.5, listRight, listBottom+0.5);

  // ---- terreno (escala vertical independiente, como el diagrama anterior) ----
  const X0=50, X1=270, BY=150;
  const maxPx = Math.max(30, Math.min(80, BY-(listBottom+10)));
  const maxY = Math.max(...ys, 0.001);
  const px = ys.map((y,i)=>({x: X0+(X1-X0)*i/n, y: BY - Math.max(0,y)/maxY*maxPx}));
  const lind = px.map(p=>f(p.x)+' '+f(p.y)).join(' L');
  let out='';
  out += `<path d="M${lind} L${f(px[n].x)} ${BY} L${f(px[0].x)} ${BY} Z" fill="var(--accent)" fill-opacity="0.14" stroke="none"/>\n`;
  out += `<path d="M${X0} ${BY} L${X1} ${BY}" fill="none" stroke="var(--ink-soft)" stroke-width="0.8" stroke-linecap="round"/>\n`;
  out += `<path d="M${lind}" fill="none" stroke="var(--blueprint)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>\n`;
  eng.seg(X0,BY,X1,BY); for(let i=0;i<n;i++) eng.seg(px[i].x,px[i].y,px[i+1].x,px[i+1].y);
  px.forEach(p=>{ out += `<path d="M${f(p.x)} ${BY} L${f(p.x)} ${f(p.y)}" fill="none" stroke="var(--success)" stroke-width="0.7" stroke-dasharray="1.6 1.6" stroke-linecap="round"/>\n`; eng.seg(p.x,BY,p.x,p.y); });
  px.forEach(p=>{
    out += `<circle cx="${f(p.x)}" cy="${BY}" r="1.5" fill="var(--ink-soft)"/><circle cx="${f(p.x)}" cy="${f(p.y)}" r="1.5" fill="var(--success)"/>\n`;
    eng.circle(p.x,BY,1.8); eng.circle(p.x,p.y,1.8);
  });
  // cota del intervalo h (bajo la base, entre y0 e y1)
  const hy=BY+3.634;
  out += `<path d="M${f(px[0].x)} ${f(hy)} L${f(px[1].x)} ${f(hy)}" fill="none" stroke="var(--ink)" stroke-width="0.7" stroke-linecap="round"/>\n`;
  out += `<path d="M${f(px[0].x)} ${f(hy-1.6)} L${f(px[0].x)} ${f(hy+1.6)}" fill="none" stroke="var(--ink)" stroke-width="0.7" stroke-linecap="round"/>\n`;
  out += `<path d="M${f(px[1].x)} ${f(hy-1.6)} L${f(px[1].x)} ${f(hy+1.6)}" fill="none" stroke="var(--ink)" stroke-width="0.7" stroke-linecap="round"/>\n`;
  eng.seg(px[0].x,hy-1.6,px[0].x,hy+1.6); eng.seg(px[1].x,hy-1.6,px[1].x,hy+1.6); eng.seg(px[0].x,hy,px[1].x,hy);

  const lab = (t,fs,col,c) => { const q=eng.txtAttrs(c); out += `<text ${q.pos} ${FONT} font-size="${fs}" fill="${col}"${q.an}>${t}</text>\n`; };
  const omit = (t,fs,cands) => !cands.length || Math.min(...cands.map(q=>eng.count(eng.box(t,fs,q),0.5)))>0;
  // h
  { const t=`h = ${mTxt(hInterval)}`, c={x:(px[0].x+px[1].x)/2, y:hy+4.506, anchor:'middle'}; lab(t,3,'var(--ink)',eng.pick(t,3,[c])); }
  // áreas al pie
  { const cx=(X0+X1)/2;
    if(hasS){ const t=`Simpson = ${aTxt(areaS)}`; lab(t,4,'var(--accent)',eng.pick(t,4,[{x:cx,y:178.145,anchor:'middle'}]));
              const u=`Trapecios = ${aTxt(areaT)}`; lab(u,3.5,'var(--ink)',eng.pick(u,3.5,[{x:cx,y:182.5,anchor:'middle'}])); }
    else { const u=`Trapecios = ${aTxt(areaT)}`; lab(u,4,'var(--accent)',eng.pick(u,4,[{x:cx,y:178.145,anchor:'middle'}])); } }
  // ordenadas: a lo largo de su línea, a la derecha; si no cabe se desliza, pasa a la izquierda o se omite
  const FS=3;
  px.forEach((p,i)=>{
    const t=oTxt(i), w=eng.tw(t,FS), L=BY-p.y, lim=L/2-w/2-1.5, cands=[];
    if(lim>=0) for(let off=0; off<=lim+1e-6; off+=1.5) for(const sg of [1,-1]){ if(off===0&&sg===-1) continue;
      cands.push({x:p.x+0.97*FS, y:(p.y+BY)/2 + sg*off, rot:-90, anchor:'middle', pen:off*0.4});
      cands.push({x:p.x-0.4*FS,  y:(p.y+BY)/2 + sg*off, rot:-90, anchor:'middle', pen:off*0.4+6});
    }
    if(omit(t,FS,cands)) return;
    lab(t,FS,'var(--success)',eng.pick(t,FS,cands));
  });
  // listado
  cols.forEach(c=>c.rows.forEach((r,row)=>{
    const by=ROW_Y0+row*ROW_DY;
    out += `<rect x="${f(c.x)}" y="${f(by-3.457)}" width="3.457" height="3.457" fill="${r.c}"/>\n`;
    out += `<text x="${f(c.x+5.185)}" y="${f(by)}" ${FONT} font-size="4.32"><tspan fill="${r.c}">${r.k}</tspan><tspan fill="var(--ink)"> = ${r.v}</tspan></text>\n`;
  }));
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n${out}</svg>`;
}

/* Diagrama de declinacion solar respecto al ecuador celeste */
function svgDeclinacionSol(decDeg){
  const w=260,h=140,pad=24;
  const cx=w/2, cy=h/2;
  const R=Math.min(w,h)/2-pad;
  const angRad=toRad(decDeg);
  const sunX=cx+R*Math.cos(angRad), sunY=cy-R*Math.sin(angRad);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${cy}" x2="${w-pad}" y2="${cy}" stroke="var(--line-strong)" stroke-width="1.2" stroke-dasharray="2 2"/>
    <text x="${w-pad}" y="${(cy-6).toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="end">Ecuador celeste</text>
    <line x1="${cx}" y1="${cy}" x2="${sunX.toFixed(1)}" y2="${sunY.toFixed(1)}" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${sunX.toFixed(1)}" cy="${sunY.toFixed(1)}" r="6" fill="var(--accent)"/>
    <text x="${sunX.toFixed(1)}" y="${(sunY-10).toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--accent-text)" text-anchor="middle">δ = ${fmtNum(decDeg,2)}°</text>
    <circle cx="${cx}" cy="${cy}" r="2.4" fill="var(--ink)"/>
  </svg>`;
}

    const resultado = normDeg(op==='mas' ? base+delta : base-delta);
    const rumbo = azToRumbo(resultado);
    box.innerHTML = `<div class="results" style="margin-top:12px;">
      <div class="result-row"><span class="k">Azimut resultante</span><span class="v accent big">${fmtAngle(resultado)}</span></div>
      <div class="result-row"><span class="k">Rumbo equivalente</span><span class="v">${rumbo.ns} ${fmtAngle(rumbo.ang)} ${rumbo.ew}</span></div>
    </div>`;
  });
}

    box.innerHTML = `<div class="results" style="margin-top:14px;">

/* Combinaciones de entrada válidas para definir una curva circular simple: R o Δ, junto con
   cualquier otro elemento conocido (T, Lc, C, E o M). Compartido entre Curva Circular y
   Replanteo de Curva para no duplicar el mismo criterio de resolución en dos lugares. */
const CURVA_MODES = {
  R_D:  {label1:'Radio R (m)', type1:'len', def1:20,   label2:'Deflexión Δ',              type2:'ang', def2:42.5},
  R_T:  {label1:'Radio R (m)', type1:'len', def1:20,   label2:'Tangente T (m)',           type2:'len', def2:7.78},
  R_Lc: {label1:'Radio R (m)', type1:'len', def1:20,   label2:'Longitud de curva Lc (m)', type2:'len', def2:14.83},
  R_C:  {label1:'Radio R (m)', type1:'len', def1:20,   label2:'Cuerda larga C (m)',       type2:'len', def2:14.50},
  R_E:  {label1:'Radio R (m)', type1:'len', def1:20,   label2:'Externa E (m)',            type2:'len', def2:1.46},
  R_M:  {label1:'Radio R (m)', type1:'len', def1:20,   label2:'Ordenada media M (m)',     type2:'len', def2:1.36},
  D_T:  {label1:'Deflexión Δ', type1:'ang', def1:42.5, label2:'Tangente T (m)',           type2:'len', def2:7.78},
  D_Lc: {label1:'Deflexión Δ', type1:'ang', def1:42.5, label2:'Longitud de curva Lc (m)', type2:'len', def2:14.83},
  D_C:  {label1:'Deflexión Δ', type1:'ang', def1:42.5, label2:'Cuerda larga C (m)',       type2:'len', def2:14.50},
  D_E:  {label1:'Deflexión Δ', type1:'ang', def1:42.5, label2:'Externa E (m)',            type2:'len', def2:1.46},
  D_M:  {label1:'Deflexión Δ', type1:'ang', def1:42.5, label2:'Ordenada media M (m)',     type2:'len', def2:1.36}
};
const CURVA_MODE_LABELS = {
  R_D:'Radio (R) y Deflexión (Δ)', R_T:'Radio (R) y Tangente (T)', R_Lc:'Radio (R) y Longitud de curva (Lc)',
  R_C:'Radio (R) y Cuerda larga (C)', R_E:'Radio (R) y Externa (E)', R_M:'Radio (R) y Ordenada media (M)',
  D_T:'Deflexión (Δ) y Tangente (T)', D_Lc:'Deflexión (Δ) y Longitud de curva (Lc)', D_C:'Deflexión (Δ) y Cuerda larga (C)',
  D_E:'Deflexión (Δ) y Externa (E)', D_M:'Deflexión (Δ) y Ordenada media (M)'
};
function curvaFieldHtmlFor(type,id,label,def){ return type==='ang' ? angleFieldHTML(id, def, label) : fieldRow(label, id, def); }
function curvaBodyFieldsHtml(mode, idPrefix){
  const m = CURVA_MODES[mode];
  return curvaFieldHtmlFor(m.type1,idPrefix+'v1',m.label1,m.def1) + curvaFieldHtmlFor(m.type2,idPrefix+'v2',m.label2,m.def2);
}
function curvaModeSelectHtml(id, selected){
  return `<select id="${id}">${Object.keys(CURVA_MODE_LABELS).map(k=>`<option value="${k}"${k===selected?' selected':''}>${CURVA_MODE_LABELS[k]}</option>`).join('')}</select>`;
}
function readCurvaModeInputs(mode, idPrefix){
  const m = CURVA_MODES[mode];
  const v1 = m.type1==='ang' ? readAngleField(idPrefix+'v1') : val(idPrefix+'v1');
  const v2 = m.type2==='ang' ? readAngleField(idPrefix+'v2') : val(idPrefix+'v2');
  return {v1, v2};
}

function renderCurvaC(){
  const MODES = CURVA_MODES, labels = CURVA_MODE_LABELS;
  const bodyFieldsHtml = (mode)=> curvaBodyFieldsHtml(mode, 'cc_');
  const body = `<div class="field-card">
    <div class="field-row"><label>Datos que conoces</label>${curvaModeSelectHtml('cc_mode','R_D')}</div>
    <div id="cc_fields">${bodyFieldsHtml('R_D')}</div>
    ${fieldRow('Progresiva del PI (opcional, m)','cc_pi','')}
    <button class="btn" id="btnCC" type="button">Calcular</button>
    <div id="resCC"></div>
  </div>`;
  toolShell('curvaC','Elementos de una curva circular simple. Ingresa el radio o la deflexión junto con cualquier otro elemento conocido (tangente, longitud de curva, cuerda larga, externa u ordenada media) y se completan todos los demás.', body, ['R','Δ','T','Lc','C','E','M','G','PC','PT','PI','O']);

  const modeSelect = document.getElementById('cc_mode');
  const fieldsDiv = document.getElementById('cc_fields');
  modeSelect.addEventListener('change', ()=>{ fieldsDiv.innerHTML = bodyFieldsHtml(modeSelect.value); });

  document.getElementById('btnCC').addEventListener('click', ()=>{
    const mode = modeSelect.value;
    const {v1, v2} = readCurvaModeInputs(mode, 'cc_');
    const box=document.getElementById('resCC');
    if(isNaN(v1)||isNaN(v2)){ box.innerHTML=`<p class="err-msg">Completa ambos valores.</p>`; return; }
    const {R,Ddeg} = resolveCurvaCircular(mode, v1, v2);
    if(!isFinite(R) || !isFinite(Ddeg) || R<=0 || Ddeg<=0 || Ddeg>=180){
      box.innerHTML=`<p class="err-msg">Esa combinación de valores no forma una curva válida — revisa los datos (por ejemplo, una cuerda no puede ser mayor que el diámetro).</p>`; return;
    }
    const r = calcCurvaCircular(R,Ddeg);
    if(![r.T,r.Lc,r.C,r.E,r.M].every(isFinite)){
      box.innerHTML=`<p class="err-msg">Esa combinación de valores no forma una curva válida — revisa los datos.</p>`; return;
    }
    const G = 2*toDeg(Math.asin(Math.min(1,10/R))); // grado de curvatura, cuerda de 20 m
    const piProg = val('cc_pi');
    let progHtml = '';
    if(!isNaN(piProg)){
      const pcProg = piProg - r.T, ptProg = pcProg + r.Lc;
      progHtml = `
      <div class="result-row"><span class="k">Progresiva PC</span><span class="v">${fmtNum(pcProg,3)}</span></div>
      <div class="result-row"><span class="k">Progresiva PT</span><span class="v">${fmtNum(ptProg,3)}</span></div>`;
    }
    box.innerHTML = `<div class="results" style="margin-top:12px;">
      <div class="result-row"><span class="k">Radio (R)</span><span class="v${mode[0]==='R'?'':' accent'}">${fmtNum(R,3)} m</span></div>
      <div class="result-row"><span class="k">Deflexión (Δ)</span><span class="v${mode[0]==='D'?'':' accent'}">${fmtAngle(Ddeg)}</span></div>
      <div class="result-row"><span class="k">Tangente (T)</span><span class="v">${fmtNum(r.T,3)} m</span></div>
      <div class="result-row"><span class="k">Longitud de curva (Lc)</span><span class="v">${fmtNum(r.Lc,3)} m</span></div>
      <div class="result-row"><span class="k">Cuerda larga (C)</span><span class="v">${fmtNum(r.C,3)} m</span></div>
      <div class="result-row"><span class="k">Externa (E)</span><span class="v">${fmtNum(r.E,3)} m</span></div>
      <div class="result-row"><span class="k">Ordenada media (M)</span><span class="v">${fmtNum(r.M,3)} m</span></div>
      <div class="result-row"><span class="k">Grado de curvatura (cuerda 20 m)</span><span class="v">${fmtAngle(G)}</span></div>
      ${progHtml}
      <div class="plot-wrap">${svgCurvaArco(R,Ddeg,null,null,null,r.T,Object.assign({D:Ddeg},r))}</div>
    </div>`;
  });
}

    for(let i=0;i<tbN;i++){
      html += `<div class="station-block">
        <div class="st-label">Banco ${i+1}</div>
        <div class="field-inline2">
          ${fieldRow('Altura (m)',`tb_h_${i}`, 5)}
          ${fieldRow('Berma / ancho de banco (m)',`tb_w_${i}`, 2)}
        </div>
        <div class="field-inline2">
          ${fieldRow('Talud V',`tb_rv_${i}`, val('tb_defV')||3)}
          ${fieldRow('Talud H',`tb_rh_${i}`, val('tb_defH')||2)}
        </div>
      </div>`;
    }
    document.getElementById('tbBenches').innerHTML = html;
  };

  /* --- Persistencia: se recuerdan los datos al volver, y se pueden guardar varios casos o pasarlos a otro equipo (JSON) --- */
  const TB_KEY='topocalc-taludbancos', TB_GIDS=['tb_halfWidth','tb_crownPct','tb_defV','tb_defH','tb_maxHeight'];
  const tbStoreGet = ()=>{ try{ const o=JSON.parse(localStorage.getItem(TB_KEY)||'{}'); return {actual:o.actual||null, casos:Array.isArray(o.casos)?o.casos:[]}; }catch(e){ return {actual:null,casos:[]}; } };
  const tbStoreSet = (o)=>{ try{ localStorage.setItem(TB_KEY, JSON.stringify(o)); }catch(e){} };
  const tbNum = (x)=>{ const n=parseFloat(x); return isFinite(n)?String(n):''; };
  const tbSnap = ()=>{
    const g={}; TB_GIDS.forEach(id=>{ g[id]=document.getElementById(id).value; });
    const b=[]; for(let i=0;i<tbN;i++){ const q=(id)=>{ const e=document.getElementById(id+'_'+i); return e?e.value:''; }; b.push({h:q('tb_h'),w:q('tb_w'),v:q('tb_rv'),hh:q('tb_rh')}); }
    return {g:g,b:b};
  };
  const tbClean = (d)=>{
    if(!d||typeof d!=='object'||!d.g||!Array.isArray(d.b)||!d.b.length) return null;
    const g={}; TB_GIDS.forEach(id=>{ g[id]=tbNum(d.g[id]); });
    const b=d.b.slice(0,12).map(x=>({h:tbNum(x&&x.h),w:tbNum(x&&x.w),v:tbNum(x&&x.v),hh:tbNum(x&&x.hh)}));
    return {g:g,b:b};
  };
  const tbPutBenches = (b)=>{ b.forEach((x,i)=>{ const set=(id,v)=>{ const e=document.getElementById(id+'_'+i); if(e&&v!==undefined&&v!==null&&v!=='') e.value=v; }; set('tb_h',x.h); set('tb_w',x.w); set('tb_rv',x.v); set('tb_rh',x.hh); }); };
  const draw = ()=>{ const prev=tbSnap().b; drawRaw(); tbPutBenches(prev); };   // al agregar/quitar bancos se conservan los valores ya escritos
  const tbApply = (d)=>{
    TB_GIDS.forEach(id=>{ const v=d.g[id]; if(v!==undefined&&v!==null&&v!=='') document.getElementById(id).value=v; });
    tbN=Math.max(1,Math.min(12,d.b.length)); document.getElementById('tbNVal').textContent=tbN;
    drawRaw(); tbPutBenches(d.b);
  };
  const tbSave = ()=>{ const st=tbStoreGet(); st.actual=tbSnap(); tbStoreSet(st); };
  const tbMsg = (t)=>{ document.getElementById('tbMsg').textContent=t; };
  const tbRenderCases = ()=>{
    const box=document.getElementById('tbCases'); box.textContent='';
    tbStoreGet().casos.forEach((c,idx)=>{
      const row=document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(10,34,64,.12);flex-wrap:wrap;';
      const nm=document.createElement('span'); nm.style.cssText='flex:1 1 140px;font-weight:600;';
      nm.textContent=(c.nombre||'Sin nombre')+' · '+((c.datos&&c.datos.b&&c.datos.b.length)||0)+' bancos';
      const bl=document.createElement('button'); bl.type='button'; bl.className='btn-sm'; bl.textContent='Cargar';
      bl.addEventListener('click', ()=>{ const d=tbClean(c.datos); if(!d){ tbMsg('El caso guardado está dañado.'); return; } tbApply(d); tbSave(); document.getElementById('tb_caseName').value=c.nombre||''; document.getElementById('resTB').innerHTML=''; tbMsg('Caso cargado.'); });
      const bd=document.createElement('button'); bd.type='button'; bd.className='btn-sm'; bd.textContent='Eliminar';
      bd.addEventListener('click', ()=>{
        if(bd.dataset.ok!=='1'){ bd.dataset.ok='1'; bd.textContent='¿Seguro?'; setTimeout(()=>{ if(bd.isConnected){ bd.dataset.ok=''; bd.textContent='Eliminar'; } },3000); return; }
        const st=tbStoreGet(); st.casos.splice(idx,1); tbStoreSet(st); tbRenderCases(); tbMsg('Caso eliminado.');
      });
      row.appendChild(nm); row.appendChild(bl); row.appendChild(bd); box.appendChild(row);
    });
  };
  const tbAddCase = (nombre, datos)=>{
    const st=tbStoreGet(); const i=st.casos.findIndex(c=>c.nombre===nombre);
    if(i>=0) st.casos[i]={nombre:nombre,datos:datos}; else st.casos.push({nombre:nombre,datos:datos});
    if(st.casos.length>50) st.casos=st.casos.slice(-50);
    tbStoreSet(st);
  };

  const c0=tbClean(tbStoreGet().actual);
  if(c0) tbApply(c0); else draw();
  tbRenderCases();
  document.querySelector('.tool-view').addEventListener('input', tbSave);
  document.getElementById('tbMinus').addEventListener('click', ()=>{ if(tbN>1){tbN--; document.getElementById('tbNVal').textContent=tbN; draw(); tbSave();}});
  document.getElementById('tbPlus').addEventListener('click', ()=>{ if(tbN<12){tbN++; document.getElementById('tbNVal').textContent=tbN; draw(); tbSave();}});

  document.getElementById('tbSaveCase').addEventListener('click', ()=>{
    const inp=document.getElementById('tb_caseName');
    const nombre=(inp.value||'').trim().slice(0,80) || ('Caso '+(tbStoreGet().casos.length+1));
    inp.value=nombre; tbAddCase(nombre, tbClean(tbSnap())); tbSave(); tbRenderCases(); tbMsg('Caso guardado en este dispositivo.');
  });
  document.getElementById('tbExport').addEventListener('click', ()=>{
    const out={tipo:'topocalc-taludbancos', version:1, actual:tbSnap(), casos:tbStoreGet().casos};
    downloadTextFile('taludes_bancos_casos.json', JSON.stringify(out,null,2), 'application/json;charset=utf-8;');
    tbMsg('Archivo exportado.');
  });
  document.getElementById('tbImport').addEventListener('click', ()=> document.getElementById('tbFile').click());
  document.getElementById('tbFile').addEventListener('change', (ev)=>{
    const f=ev.target.files && ev.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const o=JSON.parse(rd.result);
        if(!o||o.tipo!=='topocalc-taludbancos') throw new Error('tipo');
        let n=0;
        (Array.isArray(o.casos)?o.casos:[]).forEach(c=>{ const d=tbClean(c&&c.datos); if(d){ tbAddCase(String((c&&c.nombre)||'Caso importado').slice(0,80), d); n++; } });
        const a=tbClean(o.actual); if(a){ tbApply(a); tbSave(); document.getElementById('resTB').innerHTML=''; }
        tbRenderCases(); tbMsg('Importado: '+n+' caso(s)'+(a?' y datos actuales.':'.'));
      }catch(e){ tbMsg('El archivo no es válido para Taludes en Cascada.'); }
      ev.target.value='';
    };
    rd.onerror=()=>{ tbMsg('No se pudo leer el archivo.'); ev.target.value=''; };
    rd.readAsText(f);
  });

  document.getElementById('btnTB').addEventListener('click', ()=>{
    const box=document.getElementById('resTB');
    const glob = {
      halfWidth: val('tb_halfWidth'), crownPct: val('tb_crownPct'),
      defV: val('tb_defV'), defH: val('tb_defH'), maxHeight: val('tb_maxHeight')
    };
    if([glob.halfWidth,glob.crownPct,glob.defV,glob.defH,glob.maxHeight].some(isNaN)){
      box.innerHTML = `<p class="err-msg">Completa los datos de camino y talud por defecto.</p>`; return;
    }
    const benches = [];
    for(let i=0;i<tbN;i++){
      const height=val(`tb_h_${i}`), width=val(`tb_w_${i}`), V=val(`tb_rv_${i}`), H=val(`tb_rh_${i}`);
      if([height,width,V,H].some(isNaN)){ box.innerHTML = `<p class="err-msg">Completa todos los bancos.</p>`; return; }
      benches.push({height:height,width:width,V:V,H:H});
    }
    const geo = calcTaludBancosGeometry(glob, benches);
    const last = geo[geo.length-1];
    const totalHeight = last ? last.crestY : 0;
    const totalToe = last ? last.toeX : glob.halfWidth;
    const totalCrest = last ? last.crestX : glob.halfWidth;
    const warnCount = geo.filter(function(g){return g.exceedsMax;}).length;

    const trs = geo.map(function(g){
      return `<tr><td>Banco ${g.index+1}</td><td>${fmtNum(g.height,2)}${g.exceedsMax?' ⚠':''}</td><td>${fmtNum(g.V,1)} : ${fmtNum(g.H,1)}</td><td>${fmtNum(g.slopeLength,2)}</td><td>${fmtNum(g.crestY,2)}</td><td>${fmtNum(g.toeX,3)}</td><td>${fmtNum(g.crestX,3)}</td></tr>`;
    }).join('');

    box.innerHTML = `<div class="results" style="margin-top:14px;">
      <div class="result-row"><span class="k">Estado</span><span class="v">${warnCount>0 ? `<span class="pill bad"><span class="dot"></span>${warnCount} banco(s) superan la altura máxima</span>` : `<span class="pill ok"><span class="dot"></span>Todos los bancos dentro de la altura máxima</span>`}</span></div>
      <div class="result-row"><span class="k">Altura total acumulada</span><span class="v accent big">${fmtNum(totalHeight,2)} m</span></div>
      <div class="result-row"><span class="k">Distancia a pie del último talud</span><span class="v">${fmtNum(totalToe,3)} m</span></div>
      <div class="result-row"><span class="k">Distancia a cresta del último banco</span><span class="v">${fmtNum(totalCrest,3)} m</span></div>
      <div class="table-wrap" style="margin-top:12px;"><table class="data-table"><thead><tr><th>Banco</th><th>Altura</th><th>Talud V:H</th><th>Long. talud</th><th>Cota acum.</th><th>Dist. a pie</th><th>Dist. a cresta</th></tr></thead><tbody>${trs}</tbody></table></div>
      <div class="plot-wrap">${svgTaludBancos(glob, geo)}</div>
      <details style="margin-top:12px;"><summary style="cursor:pointer;font-weight:600;">Fórmulas utilizadas</summary>
        <p style="margin:8px 0 0;font-size:.9rem;line-height:1.6;">Recorrido horizontal = altura × H / V<br>Longitud del talud = √(altura² + recorrido²)<br>Dist. a pie = dist. a cresta del banco anterior + recorrido (el primer banco parte del semiancho de la plataforma)<br>Dist. a cresta = dist. a pie + berma<br>Cota acumulada = suma de las alturas de los bancos<br>⚠ = altura del banco mayor que la máxima recomendada</p>
      </details>
    </div>`;
    const csvRows = ['banco,altura_m,talud_V,talud_H,long_talud_m,cota_acumulada_m,dist_pie_m,dist_cresta_m'];
    geo.forEach(function(g){ csvRows.push(`Banco ${g.index+1},${g.height},${g.V},${g.H},${round(g.slopeLength,3)},${round(g.crestY,3)},${round(g.toeX,3)},${round(g.crestX,3)}`); });
    addCSVButton(box, 'taludes_bancos.csv', csvRows.join('\n'));
  });
}

      <div class="result-row"><span class="k">Diagnóstico</span><span class="v" style="color:${r.ok?'inherit':'var(--accent)'}">${r.ok?'Dentro de tolerancia (≤3 mm/30 m)':'Fuera de tolerancia, requiere ajuste'}</span></div>
      <div class="plot-wrap">${svgNivelDosEstacas(a1,b1,a2,b2,D,d,r)}</div>
    </div>`;
  });
}

/* ---------- DISEÑO Y TRAZADO DE ESCALERA (geométrico, no estructural) ---------- */
/* Calcula contrahuellas, contrapaso real ajustado, verificación de la fórmula de Blondel
   (2*Cp+P), reparto en tramos según el máximo de peldaños permitido sin descanso, y
   longitud horizontal total en planta. La verificación se presenta como criterios
   generales de comodidad y buena práctica de construcción en Chile (no se cita un
   artículo específico de la OGUC sin confirmar contra bcn.cl) — se remite a la DOM
   correspondiente para la exigencia exacta según el uso del edificio. */
function calcDisenoEscalera(H, Cp, P, A, maxPorTramo, fondoDescanso){
  const n = Math.max(1, Math.round(H/Cp));
  const CpReal = H/n;
  const blondelCm = (2*CpReal + P) * 100;
  let blondelEstado;
  if(blondelCm>=60 && blondelCm<=64) blondelEstado='ideal';
  else if(blondelCm>=58 && blondelCm<=65) blondelEstado='aceptable';
  else blondelEstado='fuera';
  const pasoSugerido = 0.64 - 2*CpReal;
  const tramos = Math.max(1, Math.ceil(n/maxPorTramo));
  const base = Math.floor(n/tramos), extra = n % tramos;
  const contrahuellasPorTramo = [];
  for(let i=0;i<tramos;i++) contrahuellasPorTramo.push(base + (i<extra?1:0));
  const huellasPorTramo = contrahuellasPorTramo.map(c=>c-1);
  const horizPorTramo = huellasPorTramo.map(hu=>hu*P);
  const numDescansos = tramos-1;
  const longHorizontalTotal = horizPorTramo.reduce((a,b)=>a+b,0) + numDescansos*fondoDescanso;
  const huellasTotal = n - tramos;
  return {n, CpReal, blondelCm, blondelEstado, pasoSugerido, tramos, contrahuellasPorTramo, huellasPorTramo, horizPorTramo, numDescansos, longHorizontalTotal, huellasTotal};
}

/* Diagrama de Diseño y Trazado de Escalera — v2 (estándar de plantillas de Mario): perfil esquemático (no a escala; se dibujan como máximo 6
   peldaños por tramo) con tramos y descansos. En el dibujo solo el carácter: Cp (contrahuella real, blueprint) y P (huella, danger) en el
   primer peldaño, H (altura total, success) a la izquierda, L (longitud horizontal total en planta, accent: resultado principal) al pie, y
   T(i)/Dc sobre cada tramo y descanso. Los valores van en el listado. */
function svgDisenoEscalera(r, P, fondoDescanso){
  const K=svgKit(), nt=r.contrahuellasPorTramo.length, col={Cp:'var(--blueprint)',P:'var(--danger)',H:'var(--success)',L:'var(--accent)',T:'var(--ink-soft)'};
  const rows=[{k:'L',c:col.L,v:`${fmtNum(r.longHorizontalTotal,2)} m`},{k:'H',c:col.H,v:`${fmtNum(r.n*r.CpReal,2)} m`},{k:'N',c:'var(--ink)',v:`${r.n}`},{k:'Cp',c:col.Cp,v:`${fmtNum(r.CpReal,3)} m`},{k:'P',c:col.P,v:`${fmtNum(P,3)} m`}];
  if(nt>1){ rows.push({k:'Dc',c:col.T,v:`${fmtNum(fondoDescanso,2)} m`}); r.horizPorTramo.forEach((h,i)=>rows.push({k:'T'+(i+1),c:col.T,v:`${fmtNum(h,2)} m`})); }
  K.list([rows],{perCol:4});
  const maxShow=6, seq=[]; r.contrahuellasPorTramo.forEach((c,i)=>{ for(let k=0;k<Math.min(c,maxShow);k++) seq.push({t:'s',seg:i}); if(i<nt-1) seq.push({t:'d',seg:i}); });
  const ns=seq.filter(q=>q.t==='s').length, nd=seq.filter(q=>q.t==='d').length, x0=44, availW=262, unit=availW/Math.max(ns+nd*1.4,1), lw=unit*1.4;
  const top=Math.max(K.listBottom+12,46), base=nt>1?144:150, rh=Math.min((base-top-4)/Math.max(ns,1),16);
  let x=x0, y=base, first={}; const pts=[[x,y]], segs={};
  seq.forEach(q=>{ const id=q.t+q.seg; if(!segs[id]) segs[id]={x0:x,y,t:q.t,seg:q.seg};
    if(q.t==='s'){ const ya=y; y-=rh; pts.push([x,y]); const xa=x; x+=unit; pts.push([x,y]); if(!first.x0&&first.x0!==0) first={x0:xa,y0:ya,x1:x,y1:y}; } else { x+=lw; pts.push([x,y]); }
    segs[id].x1=x; });
  const xt=x, yt=y;
  K.poly([[x0,base],...pts,[xt,base]],{close:true,fill:'var(--ink)',fo:0.08,stroke:'var(--ink)',sw:1.3});
  // tramos y descansos
  const yd=base+9; if(nt>1){ K.line(x0,yd,xt,yd,col.T,{sw:0.7}); Object.values(segs).forEach(s=>{ K.line(s.x0,yd-2,s.x0,yd+2,col.T,{sw:0.7,noObs:false}); K.lineLabel(s.x0,yd,s.x1,yd,s.t==='s'?'T'+(s.seg+1):'Dc',3.6,col.T,{out:[0,1],extras:[0,2]}); }); K.line(xt,yd-2,xt,yd+2,col.T,{sw:0.7,noObs:false}); }
  // L total
  const yl=base+(nt>1?22:12); K.line(x0,yl,xt,yl,col.L,{sw:1}); [x0,xt].forEach(v=>K.line(v,yl-2.5,v,yl+2.5,col.L,{sw:0.9,noObs:false})); K.lineLabel(x0,yl,xt,yl,'L',4.5,col.L,{out:[0,1],extras:[0,3]});
  // H total
  const hx=x0-14; K.line(hx,base,hx,yt,col.H,{sw:1}); [base,yt].forEach(v=>K.line(hx-2.5,v,hx+2.5,v,col.H,{sw:0.9,noObs:false})); K.lineLabel(hx,base,hx,yt,'H',4.5,col.H,{out:[-1,0],extras:[0,3]});
  // Cp y P del primer peldaño
  K.lineLabel(first.x0,first.y0,first.x0,first.y1,'Cp',3.6,col.Cp,{out:[-1,0],extras:[0,2,4]});
  K.lineLabel(first.x0,first.y1,first.x1,first.y1,'P',3.6,col.P,{out:[0,-1],extras:[0,2,4]});
  if(r.contrahuellasPorTramo.some(c=>c>maxShow)) K.add(`<text x="160" y="187" ${K.FONT} font-size="3.6" fill="var(--ink-soft)" text-anchor="middle">(esquemático — ver tabla para el detalle real de peldaños)</text>\n`);
  return K.svg();
}

/* Motor de colocación de rótulos para diagramas SVG: reúne obstáculos (trazos, terreno, listado, otros rótulos)
   como nubes de puntos y elige para cada rótulo la posición candidata con menos choques. */
/* Kit de diagramas SVG (estándar de plantillas de Mario): mesa 320×190, valores en listado arriba a la izquierda (valor pegado al
   descriptor, columnas de 10 filas) y también en el dibujo; rótulos con el motor de colisiones (sin lugar libre → se omiten). */
function svgKit(W,H){
  W=W||320; H=H||190;
  const eng=svgLblEngine(W,H);
  const f=v=>(+v).toFixed(2).replace(/\.?0+$/,'');
  const FONT='font-family="var(--font-body)" font-weight="700"';
  let out='', cols=[], hasNorth=false;
  const K={eng,W,H,f,FONT,listBottom:0,listRight:0};
  const rad=a=>a*Math.PI/180;
  K.add=s=>{out+=s;};
  K.line=(x1,y1,x2,y2,col,o)=>{o=o||{}; out+=`<path d="M${f(x1)} ${f(y1)} L${f(x2)} ${f(y2)}" fill="none" stroke="${col}" stroke-width="${o.sw||0.8}"${o.dash?` stroke-dasharray="${o.dash}"`:''}${o.op?` stroke-opacity="${o.op}"`:''} stroke-linecap="round"/>\n`; if(!o.noObs) eng.seg(x1,y1,x2,y2);};
  K.poly=(pts,o)=>{o=o||{}; const d='M'+pts.map(p=>f(p[0])+' '+f(p[1])).join(' L')+(o.close?' Z':'');
    out+=`<path d="${d}" fill="${o.fill||'none'}"${o.fo!=null?` fill-opacity="${o.fo}"`:''} stroke="${o.stroke||'none'}"${o.stroke?` stroke-width="${o.sw||0.8}" stroke-linecap="round" stroke-linejoin="round"`:''}${o.dash&&o.stroke?` stroke-dasharray="${o.dash}"`:''}/>\n`;
    if(o.stroke&&o.obs!==false){ for(let i=0;i+1<pts.length;i++) eng.seg(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]); if(o.close) eng.seg(pts[pts.length-1][0],pts[pts.length-1][1],pts[0][0],pts[0][1]); } };
  K.dot=(x,y,col,r)=>{r=r||2; out+=`<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${col}"/>\n`; eng.circle(x,y,r+0.3);};
  // arco de centro (cx,cy), radio r, ángulos de pantalla en grados (0=este, crece en sentido horario) de a0 a a1 (sentido = signo de a1-a0)
  K.arc=(cx,cy,r,a0,a1,col,o)=>{o=o||{}; const d=a1-a0; if(Math.abs(d)<0.05) return;
    const P=a=>[cx+r*Math.cos(rad(a)), cy+r*Math.sin(rad(a))];
    if(Math.abs(d)>=359.9){ out+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="none" stroke="${col}" stroke-width="${o.sw||0.8}"${o.dash?` stroke-dasharray="${o.dash}"`:''}/>\n`; }
    else { const p=P(a0), q=P(a1); out+=`<path d="M${f(p[0])} ${f(p[1])} A${f(r)} ${f(r)} 0 ${Math.abs(d)>180?1:0} ${d>0?1:0} ${f(q[0])} ${f(q[1])}" fill="none" stroke="${col}" stroke-width="${o.sw||0.8}"${o.dash?` stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>\n`; }
    if(o.noObs) return; const n=Math.max(8,Math.min(400,Math.ceil(Math.abs(rad(d))*r/0.8))); for(let k=0;k<=n;k++) eng.pts.push(P(a0+d*k/n)); };
  K.txt=(t,fs,col,c)=>{const q=eng.txtAttrs(c); out+=`<text ${q.pos} ${FONT} font-size="${fs}" fill="${col}"${q.an}>${t}</text>\n`;};
  K.put=(t,fs,col,cands,o)=>{o=o||{}; if(!cands.length) return null; if(o.omit!==false && Math.min(...cands.map(q=>eng.count(eng.box(t,fs,q),0.5)))>0) return null; const c=eng.pick(t,fs,cands); K.txt(t,fs,col,c); return c;};
  // rótulo a lo largo de un segmento (centro en at∈[0,1]); out=[ox,oy] lado preferido (hacia afuera); desliza, se aleja o cambia de lado
  K.lineLabel=(x1,y1,x2,y2,t,fs,col,o)=>{o=o||{}; const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1; let ang=Math.atan2(dy,dx)*180/Math.PI; if(ang>90) ang-=180; if(ang<=-90) ang+=180;
    const th=rad(ang), u=[Math.cos(th),Math.sin(th)], g=[Math.sin(th),-Math.cos(th)], w=eng.tw(t,fs), at=o.at==null?0.5:o.at, mx=x1+dx*at, my=y1+dy*at;
    const lo=-len*at+w/2+(o.margin==null?2:o.margin), hi=len*(1-at)-w/2-(o.margin==null?2:o.margin); const ss=[]; if(lo<=hi){ for(let s=0;s<=Math.max(-lo,hi)+1e-6;s+=2){ if(s<=hi) ss.push(s); if(s>0&&-s>=lo) ss.push(-s); } } else if(o.force) ss.push(0);
    const out_=o.out||[g[0],g[1]], pref=(g[0]*out_[0]+g[1]*out_[1])>=0?1:-1, cands=[], ex=o.extras||[0,fs*1.2,fs*2.4,fs*3.6];
    ss.forEach(s=>{ [pref,-pref].forEach((side,si)=>{ ex.forEach((e,ei)=>{ const n=[g[0]*side,g[1]*side], d=(side===1?0.5*fs:1.37*fs)+e;
      cands.push({x:mx+u[0]*s+n[0]*d, y:my+u[1]*s+n[1]*d, rot:ang, anchor:'middle', pen:Math.abs(s)*0.4+si*(o.noFlip?1000:10)+ei*1.5}); }); }); });
    return K.put(t,fs,col,cands,o);};
  // rótulo junto a un punto (hacia la dirección dir=[ux,uy], o alrededor si no hay)
  K.pointLabel=(t,x,y,fs,col,o)=>{o=o||{}; const cands=[], rmin=o.rmin||4.6, rmax=o.rmax||11, dir=o.dir, w=eng.tw(t,fs);
    const base=dir?Math.atan2(dir[1],dir[0]):0, span=(dir&&!o.full)?80:180, dpen=o.full?0.12:0.05;
    for(let r=rmin;r<=rmax;r+=1.2) for(let da=-span;da<=span;da+=((dir&&!o.full)?16:22.5)){ const a=base+rad(da), cx=x+Math.cos(a)*(r+(Math.abs(Math.cos(a))*w/2)), cy=y+Math.sin(a)*r+fs*0.364; cands.push({x:cx,y:cy,anchor:'middle',pen:(r-rmin)*1.5+Math.abs(da)*dpen}); }
    return K.put(t,fs,col,cands,o);};
  // rótulo horizontal en posición libre cercana a (x,y) con desplazamientos
  K.near=(t,x,y,fs,col,o)=>{o=o||{}; const cands=[]; for(let r=0;r<=(o.rmax||14);r+=1.5) for(let a=0;a<360;a+=(r?30:360)){ cands.push({x:x+r*Math.cos(rad(a)), y:y+r*Math.sin(rad(a)), anchor:'middle', pen:r*0.8}); } return K.put(t,fs,col,cands,o);};
  K.north=()=>{hasNorth=true; out+=`<path d="M300 36 L300 14" fill="none" stroke="var(--ink-soft)" stroke-width="0.7" stroke-linecap="round"/>\n<path d="M300 10 L298.2 14.5 L301.8 14.5 Z" fill="var(--ink-soft)"/>\n<text x="300" y="7.5" ${FONT} font-size="4.5" fill="var(--ink-soft)" text-anchor="middle">N</text>\n`; eng.rectFill(292,3,308,38);};
  // listado: bloques de filas {k,c,v}; cada bloque empieza columna nueva; columnas de pc filas (crece hasta que quepa)
  K.list=(blocks,o)=>{o=o||{}; const ROW_Y0=12.521, ROW_DY=5.761, LIM=o.lim||(hasNorth?286:312), rowW=r=>eng.tw(`${r.k} = ${r.v}`,4.32);
    let pc=o.perCol||10, res;
    const lay=pc=>{const c=[]; let x=10.026; blocks.forEach((b,bi)=>{ for(let s=0;s<b.length;s+=pc){ const rows=b.slice(s,s+pc), w=Math.max(...rows.map(rowW)); c.push({x,rows,w}); x=Math.max(x+(o.minGap||0), x+5.185+w+(o.gap||12)); } }); return c;};
    for(;pc<=30;pc++){ res=lay(pc); const l=res[res.length-1]; if(l.x+5.185+l.w<=LIM) break; }
    cols=res; K.listRight=Math.max(...cols.map(c=>c.x+5.185+c.w))+1; K.listBottom=ROW_Y0+(Math.min(Math.max(...blocks.map(b=>b.length)),pc)-1)*ROW_DY+1; K.perCol=pc;
    eng.rectFill(8.5,6.5,K.listRight,K.listBottom+0.5); return K;};
  // ajuste a escala de puntos del mundo (E/N, norte arriba) a una caja {l,r,t,b}; devuelve {X,Y,sc}
  K.fit=(pts,box,o)=>{o=o||{}; const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]), mnx=Math.min(...xs), mxx=Math.max(...xs), mny=Math.min(...ys), mxy=Math.max(...ys);
    const sx=Math.max(mxx-mnx,1e-9), sy=Math.max(mxy-mny,1e-9); let sc=Math.min((box.r-box.l)/sx,(box.b-box.t)/sy); if(o.maxSc) sc=Math.min(sc,o.maxSc);
    const ox=(box.l+box.r)/2-(mnx+mxx)/2*sc, oy=(box.t+box.b)/2+(mny+mxy)/2*sc; return {sc,X:e=>ox+e*sc,Y:n=>oy-n*sc};};
  K.svg=()=>{ const ROW_Y0=12.521, ROW_DY=5.761; let s=out;
    cols.forEach(c=>c.rows.forEach((r,i)=>{ const by=ROW_Y0+i*ROW_DY; s+=`<rect x="${f(c.x)}" y="${f(by-3.457)}" width="3.457" height="3.457" fill="${r.c}"/>\n<text x="${f(c.x+5.185)}" y="${f(by)}" ${FONT} font-size="4.32"><tspan fill="${r.c}">${r.k}</tspan><tspan fill="var(--ink)"> = ${r.v}</tspan></text>\n`; }));
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n${s}</svg>`; };
  return K;
}

function svgLblEngine(W,H){
  const pts = [];
  const CW = {'0':.63,'1':.63,'2':.63,'3':.63,'4':.63,'5':.63,'6':.63,'7':.63,'8':.63,'9':.63,',':.28,'.':.28,' ':.26,'=':.6,
    '°':.46,"'":.26,'"':.42,'+':.6,'-':.5,'−':.6,'m':.98,'D':.76,'i':.29,'h':.62,'v':.58,'B':.7,'S':.66,'F':.6,'H':.78,'I':.3,'P':.7,'E':.62,'Z':.66,'N':.78,'C':.72,'α':.62,'Δ':.74,'ᵍ':.8,'g':.4,'s':.56,'o':.62,'t':.4,'a':.6,'l':.28,'(':.34,')':.34,'M':.9,'F':.6};
  const tw = (t,fs) => { let w=0; for(const ch of String(t)) w += (CW[ch]!==undefined?CW[ch]:.62); return w*fs*1.03; };
  const seg = (x1,y1,x2,y2,st=0.5) => { const n=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)/st)); for(let i=0;i<=n;i++) pts.push([x1+(x2-x1)*i/n, y1+(y2-y1)*i/n]); };
  const poly = (a) => { for(let i=0;i+1<a.length;i++) seg(a[i][0],a[i][1],a[i+1][0],a[i+1][1]); };
  const rectFill = (x1,y1,x2,y2,st=0.9) => { for(let x=x1;x<=x2+1e-6;x+=st) for(let y=y1;y<=y2+1e-6;y+=st) pts.push([x,y]); };
  const rectOutline = (x1,y1,x2,y2) => { seg(x1,y1,x2,y1); seg(x2,y1,x2,y2); seg(x2,y2,x1,y2); seg(x1,y2,x1,y1); };
  const circle = (cx,cy,r) => { for(let a=0;a<Math.PI*2;a+=0.25){ pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]); } pts.push([cx,cy]); };
  // caja local de un rótulo: x en [x0, x0+w], y en [-asc, desc] (línea base en 0)
  const box = (t,fs,c) => {
    const w = tw(t,fs), asc=0.74*fs, desc=0.14*fs, an=c.anchor||'start';
    const x0 = an==='middle' ? -w/2 : (an==='end' ? -w : 0);
    const th=(c.rot||0)*Math.PI/180;
    return {w,asc,desc,x0,ox:c.x,oy:c.y,ct:Math.cos(th),st:Math.sin(th)};
  };
  const count = (b,m=0.5) => {
    let n=0;
    for(const p of pts){
      const dx=p[0]-b.ox, dy=p[1]-b.oy;
      const lx=dx*b.ct+dy*b.st, ly=-dx*b.st+dy*b.ct;
      if(lx>b.x0-m && lx<b.x0+b.w+m && ly>-b.asc-m && ly<b.desc+m) n++;
    }
    // fuera del lienzo
    for(const lx of [b.x0,b.x0+b.w]) for(const ly of [-b.asc,b.desc]){
      const X=b.ox+lx*b.ct-ly*b.st, Y=b.oy+lx*b.st+ly*b.ct;
      if(X<0.8||X>W-0.8||Y<0.8||Y>H-0.8) n+=500;
    }
    return n;
  };
  const addBox = (b,pad=0.7) => {
    for(let lx=b.x0-pad; lx<=b.x0+b.w+pad+1e-6; lx+=0.8) for(let ly=-b.asc-pad; ly<=b.desc+pad+1e-6; ly+=0.8){
      pts.push([b.ox+lx*b.ct-ly*b.st, b.oy+lx*b.st+ly*b.ct]);
    }
  };
  // elige la candidata de menor puntuación (choques*1000 + penalización) y la registra como obstáculo
  const pick = (t,fs,cands,m=0.5) => {
    let best=null, bs=1e18;
    for(const c of cands){
      const b=box(t,fs,c), s=count(b,m)*1000 + (c.pen||0);
      if(s<bs){ bs=s; best=c; best._b=b; best._hits=Math.floor(s/1000); }
    }
    if(best) addBox(best._b);
    return best;
  };
  const txtAttrs = (c) => {
    const an = c.anchor && c.anchor!=='start' ? ` text-anchor="${c.anchor}"` : '';
    return c.rot ? {pos:`transform="translate(${c.x.toFixed(2)} ${c.y.toFixed(2)}) rotate(${c.rot.toFixed(2)})"`, an}
                 : {pos:`x="${c.x.toFixed(2)}" y="${c.y.toFixed(2)}"`, an};
  };
  return {pts,tw,seg,poly,rectFill,rectOutline,circle,box,count,addBox,pick,txtAttrs};
}

/* Diagrama de Reducción al Horizonte — v2.
   Basado en la plantilla de Illustrator de Mario (plantilla_reduccion_horizonte_v4mv.svg): mesa 320×190, geometría,
   grosores, terreno y ubicaciones de rótulos de esa plantilla. Los valores van en el listado (esquina superior
   izquierda, pegados a su descriptor) y también en cada rótulo del dibujo.
   Di = blueprint, Dh = accent (resultado estrella), Dv = success, α = danger, Z = ink; E, P, N, Hi, hp y ΔH neutros; terreno café. */
function svgReduccionHorizonte(anguloDeg, Di, Dh, Dv){
  const W=320, H=190;
  const f = v => v.toFixed(2).replace(/\.?0+$/,'');
  const FONT = 'font-family="var(--font-body)" font-weight="700"';
  const eng = svgLblEngine(W,H);

  // ---- ángulo visual (con signo) y tamaño del triángulo (esquemático, no a escala) ----
  let a = Math.max(-70, Math.min(anguloDeg, 70));
  if(Math.abs(a) < 3) a = a<0 ? -3 : 3;
  const neg = a < 0, aa = Math.abs(a), ar = toRad(aa);
  const s = neg ? -1 : 1;                                  // +1 sube, −1 baja
  const L = Math.min(194.13, 72.7/Math.sin(ar));          // hipotenusa en px (con 22° reproduce Dh=179,94, Dv=72,7)
  const dh = L*Math.cos(ar), dv = L*Math.sin(ar);
  const E = {x: neg ? Math.max(160 - dh/2, 82) : 160 - dh/2, y: neg ? 62.3 : 135};   // si cuelga hacia abajo, no invade el listado
  const P = {x: E.x+dh, y: E.y - s*dv};
  const B = {x: P.x, y: E.y};                              // pie de la vertical (ángulo recto)

  // ---- terreno de la plantilla (de izquierda a derecha), ajustado a la pendiente y al ancho del triángulo ----
  const TER=[[46.32,161.945],[51.159,161.945],[58.888,161.938],[62.363,161.945],[66.78,161.954],[65.802,161.976],[75.648,161.945],[82.025,160.246],[87.77,159.21],[101.25,157.9],[117.43,153.87],[108.41,154.75],[142.01,149.73],[152.92,144.85],[168.69,149.68],[173.86,147.11],[197.07,135.54],[224.888,121.529],[234.378,114.469],[238.42,111.457],[233.81,91.52],[247.97,91.52],[248.97,91.52],[256.303,91.52],[258.4,91.52],[268.934,91.867],[279.467,92.213],[290.001,92.56]];
  const X0T=46.32, WT=243.681, DYT=-69.385;
  const Wt = Math.max(dh+63.74, 170), kf = Math.min(Math.tan(ar)/Math.tan(toRad(22)), 1.8), dYnew = DYT*s*kf*(Wt/WT);   // pendiente acotada: con ángulos grandes el terreno no se vuelve vertical
  const T = TER.map(([x,y])=>{
    const u = (x-X0T)/WT;
    return [E.x-23.71 + u*Wt, y + (E.y-135) + (dYnew-DYT)*u];
  });
  let terrainD = `M${f(T[0][0])} ${f(T[0][1])}`;
  for(let i=1;i<T.length;i+=3) terrainD += ` C${f(T[i][0])} ${f(T[i][1])} ${f(T[i+1][0])} ${f(T[i+1][1])} ${f(T[i+2][0])} ${f(T[i+2][1])}`;
  const tpoly = [];
  for(let i=0;i+3<T.length;i+=3){
    for(let t=0;t<=1.0001;t+=0.004){
      const m=1-t, c=[m*m*m, 3*m*m*t, 3*m*t*t, t*t*t];
      tpoly.push([0,1].map(k=> c[0]*T[i][k]+c[1]*T[i+1][k]+c[2]*T[i+2][k]+c[3]*T[i+3][k]));
    }
  }
  // primer punto del terreno bajo (x, desde y0 hacia abajo)
  const groundAt = (x,y0,dflt) => { let best=null; tpoly.forEach(q=>{ if(Math.abs(q[0]-x)<0.6 && q[1]>=y0 && (best===null||q[1]<best)) best=q[1]; }); return best===null ? dflt : best; };
  const gE = groundAt(E.x, E.y+8, E.y+27);
  const gP = Math.max(groundAt(P.x, P.y+4, P.y+12), P.y+6);

  // ---- textos (valores en el listado y en el dibujo) ----
  const z0 = v => Math.abs(v)<0.0005 ? 0 : v;   // evita «−0,000»
  const aV = Math.abs(anguloDeg)<1e-9 ? 0 : anguloDeg;
  const rows = [
    {k:'Di', c:'var(--blueprint)', v:`${fmtNum(z0(Di),3)} m`},
    {k:'Dh', c:'var(--accent)',    v:`${fmtNum(z0(Dh),3)} m`},
    {k:'Dv', c:'var(--success)',   v:`${fmtNum(z0(Dv),3)} m`},
    {k:'α',  c:'var(--danger)',    v:fmtAngle(aV)},
    {k:'Z',  c:'var(--ink)',       v:fmtAngle(90-aV)}
  ];
  const tx = {}; rows.forEach(r=> tx[r.k] = `${r.k} = ${r.v}`);

  let out = '';
  const NEUT = 'stroke="var(--ink-soft)" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  const brV = (x,y1,y2) => { eng.seg(x,y1,x,y2); eng.seg(x-2,y1,x+2,y1); eng.seg(x-2,y2,x+2,y2);
    return `<path d="M${f(x)} ${f(y1)} L${f(x)} ${f(y2)} M${f(x-2)} ${f(y1)} L${f(x+2)} ${f(y1)} M${f(x-2)} ${f(y2)} L${f(x+2)} ${f(y2)}" ${NEUT}/>\n`; };

  // obstáculos fijos: terreno, listado y nota al pie
  eng.poly(tpoly);
  const listW = Math.max(...rows.map(r=>eng.tw(tx[r.k],4.32)));
  eng.rectFill(8.5, 6.5, 15.2+listW+1.5, 37.2);
  eng.rectFill(W/2-30, 181.5, W/2+30, 187);

  out += `<path d="${terrainD}" fill="none" stroke="#8B6B47" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>\n`;

  // ---- instrumento en E (neutro) ----
  out += `<path d="M${f(E.x)} ${f(E.y+2.45)} L${f(E.x)} ${f(gE)} M${f(E.x)} ${f(E.y+2.45)} L${f(E.x-4.3)} ${f(gE)} M${f(E.x)} ${f(E.y+2.45)} L${f(E.x+4.3)} ${f(gE)}" fill="none" stroke="var(--ink-soft)" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>\n`;
  out += `<rect x="${f(E.x-4.25)}" y="${f(E.y-2.45)}" width="8.5" height="4.9" fill="var(--paper-raised)" stroke="var(--ink-soft)" stroke-width="0.7" stroke-linejoin="round"/>\n`;
  eng.seg(E.x,E.y+2.45,E.x,gE); eng.seg(E.x,E.y+2.45,E.x-4.3,gE); eng.seg(E.x,E.y+2.45,E.x+4.3,gE);
  eng.rectFill(E.x-4.25,E.y-2.45,E.x+4.25,E.y+2.45,0.8);

  // ---- triángulo: un trazo por magnitud ----
  out += `<path d="M${f(E.x)} ${f(E.y)} L${f(P.x)} ${f(P.y)}" fill="none" stroke="var(--blueprint)" stroke-width="0.8" stroke-linecap="round"/>\n`;
  out += `<path d="M${f(E.x)} ${f(E.y)} L${f(B.x)} ${f(B.y)}" fill="none" stroke="var(--accent)" stroke-width="0.8" stroke-linecap="round"/>\n`;
  out += `<path d="M${f(B.x)} ${f(B.y)} L${f(P.x)} ${f(P.y)}" fill="none" stroke="var(--success)" stroke-width="0.8" stroke-linecap="round"/>\n`;
  out += `<path d="M${f(B.x-4)} ${f(B.y)} L${f(B.x-4)} ${f(B.y-s*4)} L${f(B.x)} ${f(B.y-s*4)}" fill="none" stroke="var(--ink-soft)" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>\n`;
  eng.seg(E.x,E.y,P.x,P.y); eng.seg(E.x,E.y,B.x,B.y); eng.seg(B.x,B.y,P.x,P.y);
  eng.seg(B.x-4,B.y,B.x-4,B.y-s*4); eng.seg(B.x-4,B.y-s*4,B.x,B.y-s*4);
  const R = Math.min(54.5, 0.35*dh, 0.45*L);
  out += `<path d="M${f(E.x+R)} ${f(E.y)} A${f(R)} ${f(R)} 0 0 ${neg?1:0} ${f(E.x+R*Math.cos(ar))} ${f(E.y-s*R*Math.sin(ar))}" fill="none" stroke="var(--danger)" stroke-width="0.7" stroke-linecap="round"/>\n`;
  for(let t=0;t<=1.0001;t+=0.02){ eng.pts.push([E.x+R*Math.cos(ar*t), E.y-s*R*Math.sin(ar*t)]); }

  // ---- puntos E y P (neutros) ----
  out += `<circle cx="${f(E.x)}" cy="${f(E.y)}" r="2" fill="var(--ink-soft)"/>\n`;
  out += `<circle cx="${f(P.x)}" cy="${f(P.y)}" r="2" fill="var(--ink-soft)"/>\n`;
  eng.circle(E.x,E.y,2.3); eng.circle(P.x,P.y,2.3);

  // ---- N: eje vertical con flecha desde E ----
  out += `<path d="M${f(E.x)} ${f(E.y-4)} L${f(E.x)} ${f(E.y-46)}" ${NEUT}/>\n`;
  out += `<path d="M${f(E.x)} ${f(E.y-50)} L${f(E.x-1.8)} ${f(E.y-45.5)} L${f(E.x+1.8)} ${f(E.y-45.5)} Z" fill="var(--ink-soft)" stroke="none"/>\n`;
  eng.seg(E.x,E.y-4,E.x,E.y-50); eng.seg(E.x-1.8,E.y-45.5,E.x+1.8,E.y-45.5);
  // ---- Z: ángulo cenital, desde N hasta Di, en sentido horario ----
  const Zdeg = 90 - s*aa;
  let rZ = Math.min(40, 0.8*L);
  if(neg && Math.abs(rZ-dh/2) < 5.5) rZ = (dh/2-6 >= 18) ? dh/2-6 : dh/2+6;
  out += `<path d="M${f(E.x)} ${f(E.y-rZ)} A${f(rZ)} ${f(rZ)} 0 ${Zdeg>180?1:0} 1 ${f(E.x+rZ*Math.cos(ar))} ${f(E.y-s*rZ*Math.sin(ar))}" fill="none" stroke="var(--ink)" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="2 1.5"/>\n`;
  for(let t=0;t<=1.0001;t+=0.01){ const th=toRad(Zdeg)*t; eng.pts.push([E.x+rZ*Math.sin(th), E.y-rZ*Math.cos(th)]); }
  // ---- Hi: altura del instrumento (esquemática), a la izquierda de las patas ----
  const xHi = E.x-7.667;
  out += brV(xHi, E.y-0.055, gE);
  // ---- hp y ΔH: apilados a la derecha de la vertical (hp: P → terreno bajo P; ΔH: terreno bajo P → terreno bajo E) ----
  const xBr = P.x+2.55;
  out += brV(xBr, P.y, gP);
  out += brV(xBr, gP, gE);
  const dx0 = neg ? xBr+2 : E.x+9.33, dx1 = neg ? xBr+16 : xBr-3.45;
  if(dx1 > dx0+2){ out += `<path d="M${f(dx0)} ${f(gE)} L${f(dx1)} ${f(gE)}" ${NEUT} stroke-dasharray="1 2"/>\n`; eng.seg(dx0,gE,dx1,gE); }

  // ---- rótulos (cada uno elige su posición libre más cercana a la de la plantilla) ----
  const lab = (t, fs, col, c) => { const q=eng.txtAttrs(c); out += `<text ${q.pos} ${FONT} font-size="${fs}" fill="${col}"${q.an}>${t}</text>\n`; };
  const mx=(E.x+P.x)/2, my=(E.y+P.y)/2;

  // Di: a lo largo de su línea
  {
    const rot = -s*aa, g=[Math.sin(toRad(rot)), -Math.cos(toRad(rot))], u=[Math.cos(ar), -s*Math.sin(ar)];
    const wD = eng.tw(tx.Di,4), tmax = Math.max(0, L/2 - wD/2 - 6), cands=[];
    const sides = neg ? [[-1,4.8],[1,1.9]] : [[1,1.9],[-1,4.8]];
    for(let t=0;t<=tmax+1e-6;t+=3) for(const sg of [1,-1]){ if(t===0&&sg===-1) continue;
      sides.forEach(([ns,d],si)=> cands.push({x:mx+u[0]*t*sg+g[0]*ns*d, y:my+u[1]*t*sg+g[1]*ns*d, rot, anchor:'middle', pen:t*0.4+si*6}));
    }
    lab(tx.Di,4,'var(--blueprint)',eng.pick(tx.Di,4,cands));
  }
  // Dh: bajo la base (sobre ella si el triángulo cuelga); si no cabe, se corre a lo largo o más abajo
  {
    const wD = eng.tw(tx.Dh,4), cands=[];
    const ys = neg ? [E.y-1.0, E.y+3.94, E.y+9, E.y-6] : [E.y+3.94, E.y-1.0, E.y+9, E.y+14];
    for(let t=0;t<=130;t+=2) for(const sg of [1,-1]){ if(t===0&&sg===-1) continue;
      const over = Math.max(0, wD/2 - (dh/2-Math.abs(t)) ) ;   // cuánto sobresale del tramo
      ys.forEach((yy,si)=> cands.push({x:mx-0.169+t*sg, y:yy, anchor:'middle', pen:t*0.3+si*6+over*0.8}));
    }
    lab(tx.Dh,4,'var(--accent)',eng.pick(tx.Dh,4,cands));
  }
  // Dv: a la izquierda de la vertical (la derecha lleva hp y ΔH)
  {
    const c0 = (P.y+B.y)/2 + s*11.75, lo=Math.min(P.y,B.y), hi=Math.max(P.y,B.y), wD=eng.tw(tx.Dv,4), cands=[];
    for(let d=0; d<=70; d+=1.5) for(const sg of [1,-1]){ if(d===0&&sg===-1) continue;
      const cc=c0+d*sg; const over = Math.max(0, lo-(cc-wD/2)) + Math.max(0,(cc+wD/2)-hi);
      [[P.x-1.865,0],[P.x+4.424,5]].forEach(([xx,pp])=> cands.push({x:xx, y:cc, rot:-90, anchor:'middle', pen:d*0.3+over*2+pp}));
    }
    lab(tx.Dv,4,'var(--success)',eng.pick(tx.Dv,4,cands));
  }
  // α: a la derecha del arco, junto a su punto medio
  {
    const th=-s*aa/2*Math.PI/180, mxA=E.x+R*Math.cos(th), myA=E.y+R*Math.sin(th), cands=[];
    for(let dx=0.8; dx<=45; dx+=1.5) for(let dy=-16; dy<=16; dy+=1.2)
      cands.push({x:mxA+dx, y:myA+s*1.05+dy, pen:Math.hypot(dx-1,dy)*0.35 + ((s>0 ? myA+s*1.05+dy > E.y-0.5 : myA+s*1.05+dy < E.y+3.5) ? 8 : 0)});
    lab(tx['α'],4.5,'var(--danger)',eng.pick(tx['α'],4.5,cands));
  }
  // Z: fuera del arco, junto a su punto medio
  {
    const zm=toRad(Zdeg/2), mxZ=E.x+rZ*Math.sin(zm), myZ=E.y-rZ*Math.cos(zm), cands=[];
    for(let dx=1; dx<=45; dx+=1.5) for(let dy=-16; dy<=16; dy+=1.2){
      cands.push({x:mxZ+dx, y:myZ+dy, pen:Math.hypot(dx-3,dy+1.5)*0.35});
      cands.push({x:mxZ-dx, y:myZ+dy, anchor:'end', pen:Math.hypot(dx-3,dy+1.5)*0.35+4});
    }
    lab(tx.Z,4.5,'var(--ink)',eng.pick(tx.Z,4.5,cands));
  }
  // E, P, N (neutros): cerca de la posición de la plantilla
  {
    const eC=[]; for(let dx=-16;dx<=16;dx+=1) for(let dy=-8;dy<=10;dy+=1) eC.push({x:E.x+6.98+dx, y:E.y+20.5+dy, anchor:'end', pen:Math.hypot(dx,dy)*0.4});
    lab('E',4.5,'var(--ink-soft)',eng.pick('E',4.5,eC));
    const pC=[]; const py0 = neg ? P.y+6.4 : P.y-3.09;
    for(let dx=-6;dx<=8;dx+=1) for(let dy=-8;dy<=8;dy+=1) pC.push({x:P.x-0.9+dx, y:py0+dy, pen:Math.hypot(dx,dy)*0.4});
    lab('P',4.5,'var(--ink-soft)',eng.pick('P',4.5,pC));
    const nC=[]; for(let dx=-6;dx<=6;dx+=1) for(let dy=-6;dy<=3;dy+=1) nC.push({x:E.x+dx, y:E.y-52.5+dy, anchor:'middle', pen:Math.hypot(dx,dy)*0.4});
    lab('N',4.5,'var(--ink-soft)',eng.pick('N',4.5,nC));
  }
  // Hi, hp y ΔH (neutros, sin valor)
  {
    const hC=[]; for(let dx=-6;dx<=4;dx+=1) for(let dy=-8;dy<=8;dy+=1) hC.push({x:xHi-2+dx, y:(E.y+gE)/2+2.735+dy, anchor:'end', pen:Math.hypot(dx,dy)*0.4});
    lab('Hi',4,'var(--ink-soft)',eng.pick('Hi',4,hC));
    const vl = (t,y1,y2,off) => { const cc=[]; const lo=Math.min(y1,y2), hi=Math.max(y1,y2), m=(y1+y2)/2+off;
      for(let d=0; d<=60; d+=1) for(const sg of [1,-1]){ if(d===0&&sg===-1) continue; const y=m+d*sg;
        for(let dx=0; dx<=8; dx+=4) cc.push({x:xBr+3.875+dx, y, rot:-90, anchor:'middle', pen:d*0.3+dx*0.6+Math.max(0,lo+2-(y-eng.tw(t,4)/2))*3+Math.max(0,(y+eng.tw(t,4)/2)-(hi-2))*3}); }
      lab(t,4,'var(--ink-soft)',eng.pick(t,4,cc)); };
    vl('hp',P.y,gP,3.5);
    vl('ΔH',gP,gE,1.95);
  }

  // ---- listado de valores (esquina superior izquierda): el valor a continuación de su descriptor ----
  rows.forEach((r,i)=>{
    const by = 12.521 + i*5.761;
    out += `<rect x="10.026" y="${f(by-3.457)}" width="3.457" height="3.457" fill="${r.c}"/>\n`;
    out += `<text x="15.211" y="${f(by)}" ${FONT} font-size="4.32"><tspan fill="${r.c}">${r.k}</tspan><tspan fill="var(--ink)"> = ${r.v}</tspan></text>\n`;
  });

  out += `<text x="${W/2}" y="${H-4}" font-family="var(--font-body)" font-size="4" fill="var(--ink-soft)" text-anchor="middle">(esquemático, no a escala)</text>\n`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n${out}</svg>`;
}

    const r = calcPoligonalAbierta(E0,N0,tramos);

      <div class="plot-wrap">${svgOpenPath(r.coordE, r.coordN)}</div>

/* Diagrama de Poligonal Abierta — v2.
   Basado en la plantilla de Illustrator de Mario (plantilla_poligonal_abierta_mv.svg): lienzo 320×190, recorrido teal 0,8,
   Inicio en ink (punto mayor) y puntos siguientes neutros, rótulo de distancia (teal) por el lado convexo y de azimut
   (verde) por el opuesto, flecha norte arriba a la derecha, y listado con el valor a continuación de su descriptor:
   columna(s) de tramos + Total recorrido (cobre, resultado principal) y columna(s) de azimutes. Con más de 8 tramos,
   el dibujo lleva solo los valores; el rótulo que no encuentra sitio libre se omite del dibujo (queda en el listado). */
function svgOpenPath(coordE, coordN){
  const W=320, H=190;
  const f = v => v.toFixed(2).replace(/\.?0+$/,'');
  const FONT = 'font-family="var(--font-body)" font-weight="700"';
  const eng = svgLblEngine(W,H);
  const n = coordE.length - 1;                       // tramos
  const dist=[], az=[];
  for(let i=0;i<n;i++){
    const dE=coordE[i+1]-coordE[i], dN=coordN[i+1]-coordN[i];
    dist.push(Math.hypot(dE,dN));
    az.push(((Math.atan2(dE,dN)*180/Math.PI)%360+360)%360);
  }
  const total = dist.reduce((a,b)=>a+b,0);
  const ptName = i => i===0 ? 'Inicio' : 'P'+i;
  const corto = n > 8;
  const dTxt = i => `${fmtNum(dist[i],2)} m`;
  const aTxt = i => fmtAngle(az[i]);

  // ---- listado: columnas de 10 filas (tramos + total) y luego (azimutes) ----
  const PER_COL=10, ROW_Y0=12.521, ROW_DY=5.761, FS_L=4.32;
  const dRows=[]; for(let i=0;i<n;i++) dRows.push({k:'T'+(i+1), c:'var(--blueprint)', v:dTxt(i)});
  dRows.push({k:'Total recorrido', c:'var(--accent)', v:`${fmtNum(total,2)} m`});
  const aRows=[]; for(let i=0;i<n;i++) aRows.push({k:'Az'+(i+1), c:'var(--success)', v:aTxt(i)});
  const place = (rows, x0) => {                      // devuelve {items, xEnd}
    const nc=Math.ceil(rows.length/PER_COL), items=[]; let x=x0;
    for(let c=0;c<nc;c++){
      const part=rows.slice(c*PER_COL,(c+1)*PER_COL);
      const w=Math.max(...part.map(r=>eng.tw(`${r.k} = ${r.v}`,FS_L)))+5.2;
      part.forEach((r,j)=>items.push({r, x, y:ROW_Y0+j*ROW_DY}));
      x += Math.max(w+9, 70);
    }
    return {items, xEnd:x};
  };
  const L1 = place(dRows, 10.026), L2 = place(aRows, L1.xEnd);
  const items = L1.items.concat(L2.items);
  let listRight=0, listBottom=0;
  items.forEach(it=>{ const w=eng.tw(`${it.r.k} = ${it.r.v}`,FS_L); listRight=Math.max(listRight,it.x+5.2+w+1); listBottom=Math.max(listBottom,it.y+1); });
  eng.rectFill(8.5, 6.5, listRight, listBottom+0.5);
  eng.rectFill(292, 3, 308, 38);                      // flecha norte

  // ---- recorrido a escala ----
  const left=50, right=270, top=Math.max(52, listBottom+8), bot=160;
  const minE=Math.min(...coordE), maxE=Math.max(...coordE), minN=Math.min(...coordN), maxN=Math.max(...coordN);
  const spanE=maxE-minE, spanN=maxN-minN;
  let sc = Math.min((right-left)/Math.max(spanE,1e-6), (bot-top)/Math.max(spanN,1e-6));
  if(!isFinite(sc) || spanE+spanN<1e-6) sc=1;
  const ox=(left+right)/2-(spanE*sc)/2, oy=(top+bot)/2+(spanN*sc)/2;
  const V=coordE.map((e,i)=>({x:ox+(e-minE)*sc, y:oy-(coordN[i]-minN)*sc}));

  let out='';
  out += `<path d="M${V.map(p=>f(p.x)+' '+f(p.y)).join(' L')}" fill="none" stroke="var(--blueprint)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>\n`;
  for(let i=0;i<n;i++) eng.seg(V[i].x,V[i].y,V[i+1].x,V[i+1].y);
  V.forEach((p,i)=>{ const r=i===0?2.686:2; out += `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${r}" fill="${i===0?'var(--ink)':'var(--ink-soft)'}"/>\n`; eng.circle(p.x,p.y,r+0.3); });
  out += `<path d="M300 36 L300 14" fill="none" stroke="var(--ink-soft)" stroke-width="0.7" stroke-linecap="round"/>\n`;
  out += `<path d="M300 10 L298.2 14.5 L301.8 14.5 Z" fill="var(--ink-soft)"/>\n`;
  out += `<text x="300" y="7.5" ${FONT} font-size="4.5" fill="var(--ink-soft)" text-anchor="middle">N</text>\n`;

  const lab=(t,fs,col,c)=>{ const q=eng.txtAttrs(c); out += `<text ${q.pos} ${FONT} font-size="${fs}" fill="${col}"${q.an}>${t}</text>\n`; };
  // normal del tramo i hacia el lado convexo del giro (el otro lado queda para el azimut)
  const nrm = i => {
    const a=V[i], b=V[i+1], dx=b.x-a.x, dy=b.y-a.y, l=Math.hypot(dx,dy)||1; let nx=dy/l, ny=-dx/l, turn=0;
    if(i>0){ const p=V[i-1]; turn+=(a.x-p.x)*dy-(a.y-p.y)*dx; }
    if(i<n-1){ const q=V[i+2]; turn+=dx*(q.y-b.y)-dy*(q.x-b.x); }
    return turn<=0 ? [nx,ny] : [-nx,-ny];
  };

  // vértices: hacia el lado exterior; Inicio y último, "detrás" de su tramo
  for(let i=0;i<=n;i++){
    let ux,uy;
    if(i===0){ const d=Math.hypot(V[1].x-V[0].x,V[1].y-V[0].y)||1; ux=(V[0].x-V[1].x)/d; uy=(V[0].y-V[1].y)/d; }
    else if(i===n){ const d=Math.hypot(V[n].x-V[n-1].x,V[n].y-V[n-1].y)||1; ux=(V[n].x-V[n-1].x)/d; uy=(V[n].y-V[n-1].y)/d; }
    else { const a=nrm(i-1), b=nrm(i); ux=a[0]+b[0]; uy=a[1]+b[1]; const l=Math.hypot(ux,uy)||1; ux/=l; uy/=l; }
    const t=ptName(i), cands=[];
    for(let r=(i===0?5.2:4.8); r<=12; r+=1.2) for(let da=-80; da<=80; da+=16){
      const ca=Math.cos(da*Math.PI/180), sa=Math.sin(da*Math.PI/180), vx=ux*ca-uy*sa, vy=ux*sa+uy*ca;
      cands.push({x:V[i].x+vx*r, y:V[i].y+vy*r+1.6, anchor:'middle', pen:(r-4.8)*1.5+Math.abs(da)*0.05});
    }
    lab(t,4.7,i===0?'var(--ink)':'var(--ink-soft)',eng.pick(t,4.7,cands));
  }

  // tramos: distancia por el lado convexo, azimut por el opuesto; se desliza, se aleja o cambia de lado si no cabe
  const sideLabel = (i, t, col, sgn) => {
    const p=V[i], q=V[i+1], dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy)||1;
    let ang=Math.atan2(dy,dx)*180/Math.PI; if(ang>90) ang-=180; if(ang<-90) ang+=180;
    const th=ang*Math.PI/180, g=[Math.sin(th),-Math.cos(th)], u=[Math.cos(th),Math.sin(th)], no=nrm(i);
    const mx=(p.x+q.x)/2, my=(p.y+q.y)/2, tmax=Math.max(0,len/2-eng.tw(t,4)/2-3), cands=[];
    for(let s=0;s<=tmax+1e-6;s+=2.5) for(const sg of [1,-1]){ if(s===0&&sg===-1) continue;
      [[sgn,0],[sgn,3.6],[sgn,7.2],[sgn,10.8],[-sgn,0],[-sgn,3.6]].forEach(([side,extra],si)=>{
        const nn=[no[0]*side,no[1]*side], d=((g[0]*nn[0]+g[1]*nn[1])>0?1.9:4.8)+extra;
        cands.push({x:mx+u[0]*s*sg+nn[0]*d, y:my+u[1]*s*sg+nn[1]*d, rot:ang, anchor:'middle', pen:s*0.4+(side!==sgn?10:0)+extra*1.2});
      });
    }
    // si ninguna posición queda libre, el rótulo se omite del dibujo (el valor sigue en el listado)
    if(Math.min(...cands.map(c=>eng.count(eng.box(t,4,c),0.5)))>0) return;
    lab(t,4,col,eng.pick(t,4,cands));
  };
  for(let i=0;i<n;i++){
    sideLabel(i, corto?dTxt(i):`T${i+1} = ${dTxt(i)}`, 'var(--blueprint)', 1);
    sideLabel(i, corto?aTxt(i):`Az${i+1} = ${aTxt(i)}`, 'var(--success)', -1);
  }

  // listado
  items.forEach(it=>{
    out += `<rect x="${f(it.x)}" y="${f(it.y-3.457)}" width="3.457" height="3.457" fill="${it.r.c}"/>\n`;
    out += `<text x="${f(it.x+5.185)}" y="${f(it.y)}" ${FONT} font-size="${FS_L}"><tspan fill="${it.r.c}">${it.r.k}</tspan><tspan fill="var(--ink)"> = ${it.r.v}</tspan></text>\n`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n${out}</svg>`;
}

/* ---------- TRIANGULACION (LEY DE COSENOS) ---------- */
/* Diagrama de Triangulación (ley de cosenos) — v2.
   Basado en la plantilla de Illustrator de Mario (plantilla_triangulacion_mv.svg): lienzo 320×190, triángulo con relleno
   cobre suave (el área es el resultado principal), lado y ángulo opuesto con el mismo color (a/A teal, b/B verde, c/C gris),
   letras de vértice grandes por fuera, valor de cada ángulo por dentro junto a su arco, lados rotulados por fuera y
   listado con el valor a continuación de su descriptor (lados, perímetro y área a la izquierda; ángulos a la derecha). */
function svgTriangulacion(a, b, c, r){
  const W=320, H=190;
  const f = v => v.toFixed(2).replace(/\.?0+$/,'');
  const FONT = 'font-family="var(--font-body)" font-weight="700"';
  const eng = svgLblEngine(W,H);
  const CA='var(--blueprint)', CB='var(--success)', CC='var(--ink-soft)', CAR='var(--accent)', CI='var(--ink)';
  const colV = [CA,CB,CC], names=['A','B','C'];
  const per = a+b+c;
  const sTxt = v => fmtNum(v,2);

  // ---- listado ----
  const rows1=[{k:'a',c:CA,v:sTxt(a)},{k:'b',c:CB,v:sTxt(b)},{k:'c',c:CC,v:sTxt(c)},{k:'Perímetro',c:CI,v:sTxt(per),nocol:1},{k:'Área',c:CAR,v:fmtNum(r.area,3)}];
  const rows2=[{k:'A',c:CA,v:fmtAngle(r.A)},{k:'B',c:CB,v:fmtAngle(r.B)},{k:'C',c:CC,v:fmtAngle(r.C)}];
  const ROW_Y0=12.521, ROW_DY=5.761, FS_L=4.32;
  const w1=Math.max(...rows1.map(q=>eng.tw(`${q.k} = ${q.v}`,FS_L)));
  const OX2=Math.max(70, 10.026+5.2+w1+9);
  const items=[]; rows1.forEach((q,i)=>items.push({q,x:10.026,y:ROW_Y0+i*ROW_DY})); rows2.forEach((q,i)=>items.push({q,x:OX2,y:ROW_Y0+i*ROW_DY}));
  let listRight=0, listBottom=0;
  items.forEach(it=>{ listRight=Math.max(listRight,it.x+5.2+eng.tw(`${it.q.k} = ${it.q.v}`,FS_L)+1); listBottom=Math.max(listBottom,it.y+1); });
  eng.rectFill(8.5,6.5,listRight,listBottom+0.5);

  // ---- triángulo a escala: A en el origen, B a la derecha ----
  const cosA=Math.cos(toRad(r.A)), sinA=Math.sin(toRad(r.A));
  const P=[[0,0],[c,0],[b*cosA,b*sinA]];
  const minX=Math.min(...P.map(p=>p[0])), maxX=Math.max(...P.map(p=>p[0])), maxY=P[2][1];
  const left=77, right=248, top=Math.max(62,listBottom+22), bot=150;
  const sc=Math.min((right-left)/Math.max(maxX-minX,1e-6),(bot-top)/Math.max(maxY,1e-6));
  const ox=(left+right)/2-((maxX-minX)*sc)/2-minX*sc, oy=(top+bot)/2+(maxY*sc)/2;
  const V=P.map(p=>({x:ox+p[0]*sc, y:oy-p[1]*sc}));
  const cx=(V[0].x+V[1].x+V[2].x)/3, cy=(V[0].y+V[1].y+V[2].y)/3;
  const side=[[V[1],V[2]],[V[2],V[0]],[V[0],V[1]]];      // a (BC), b (CA), c (AB)
  const sName=['a','b','c'], sVal=[a,b,c], sCol=[CA,CB,CC];
  const len=(p,q)=>Math.hypot(q.x-p.x,q.y-p.y);

  let out='';
  out += `<path d="M${f(V[0].x)} ${f(V[0].y)} L${f(V[1].x)} ${f(V[1].y)} L${f(V[2].x)} ${f(V[2].y)} Z" fill="var(--accent)" fill-opacity="0.14" stroke="none"/>\n`;
  [[2,'c'],[0,'a'],[1,'b']].forEach(([i,n])=>{ const [p,q]=side[i]; eng.seg(p.x,p.y,q.x,q.y);
    out += `<path d="M${f(p.x)} ${f(p.y)} L${f(q.x)} ${f(q.y)}" fill="none" stroke="${sCol[i]}" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>\n`; });
  // arcos de ángulo (radio 9 o menos si el lado es corto)
  const arcR=[0,1,2].map(i=>Math.min(9, 0.4*Math.min(len(V[i],V[(i+1)%3]),len(V[i],V[(i+2)%3]))));
  [0,1,2].forEach(i=>{
    const Vv=V[i], P1=V[(i+1)%3], P2=V[(i+2)%3], rr=arcR[i];
    const a1=Math.atan2(P1.y-Vv.y,P1.x-Vv.x), a2=Math.atan2(P2.y-Vv.y,P2.x-Vv.x);
    const d=(a2-a1+Math.PI)%(2*Math.PI)-Math.PI, sw=d>0?1:0;
    const x1=Vv.x+rr*Math.cos(a1), y1=Vv.y+rr*Math.sin(a1), x2=Vv.x+rr*Math.cos(a2), y2=Vv.y+rr*Math.sin(a2);
    out += `<path d="M${f(x1)} ${f(y1)} A${f(rr)} ${f(rr)} 0 0 ${sw} ${f(x2)} ${f(y2)}" fill="none" stroke="${colV[i]}" stroke-width="0.8" stroke-linecap="round"/>\n`;
    for(let t=0;t<=1.0001;t+=0.1){ const an=a1+d*t; eng.pts.push([Vv.x+rr*Math.cos(an),Vv.y+rr*Math.sin(an)]); }
  });
  V.forEach(p=>{ out += `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="2" fill="var(--ink-soft)"/>\n`; eng.circle(p.x,p.y,2.3); });

  const lab=(t,fs,col,cd)=>{ const q=eng.txtAttrs(cd); out += `<text ${q.pos} ${FONT} font-size="${fs}" fill="${col}"${q.an}>${t}</text>\n`; };
  const inside=(x,y)=>{ const s=(p,q)=>(q.x-p.x)*(y-p.y)-(q.y-p.y)*(x-p.x); const d1=s(V[0],V[1]),d2=s(V[1],V[2]),d3=s(V[2],V[0]); return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0)); };

  // letras de vértice (grandes), por fuera: A y B abajo, C arriba
  const FL=9.92;
  [0,1,2].forEach(i=>{
    const e=[-(V[(i+1)%3].x-V[i].x)/len(V[i],V[(i+1)%3])-(V[(i+2)%3].x-V[i].x)/len(V[i],V[(i+2)%3]),
             -(V[(i+1)%3].y-V[i].y)/len(V[i],V[(i+1)%3])-(V[(i+2)%3].y-V[i].y)/len(V[i],V[(i+2)%3])];
    const el=Math.hypot(e[0],e[1])||1, pref=i===2?[0,-1]:[0,1], cands=[];
    for(let ang=0;ang<360;ang+=15) for(let rr=6.5;rr<=15;rr+=1.5){
      const dx=Math.cos(ang*Math.PI/180), dy=Math.sin(ang*Math.PI/180);
      const dp=Math.acos(Math.max(-1,Math.min(1,dx*pref[0]+dy*pref[1])))*180/Math.PI;
      const de=Math.acos(Math.max(-1,Math.min(1,(dx*e[0]+dy*e[1])/el)))*180/Math.PI;
      cands.push({x:V[i].x+dx*rr, y:V[i].y+dy*rr+0.36*FL, anchor:'middle', pen:(rr-6.5)*1.2+Math.min(dp,de)*0.12+Math.max(0,90-de)*0.0});
    }
    lab(names[i],FL,colV[i],eng.pick(names[i],FL,cands));
  });

  // valor de cada ángulo: por dentro, a lo largo de un lado adyacente, pasado su arco
  const angTxt=[fmtAngle(r.A),fmtAngle(r.B),fmtAngle(r.C)];
  const mainSide=[1,0,2];                                   // A→B, B→A, C→A  (índices de vértice destino: 1,0,0)
  const dest=[[1,2],[0,2],[0,1]];                           // destino principal y alterno
  [0,1,2].forEach(i=>{
    const t=`${names[i]} = ${angTxt[i]}`, tw=eng.tw(t,4), cands=[];
    const order = i===2 ? [0,1] : [0,1];
    const dests = i===0 ? [1,2] : (i===1 ? [0,2] : [0,1]);
    dests.forEach((dj,di)=>{
      const p=V[i], q=V[dj], L=len(p,q), ux=(q.x-p.x)/L, uy=(q.y-p.y)/L;
      let ang=Math.atan2(uy,ux)*180/Math.PI; if(ang>90) ang-=180; if(ang<-90) ang+=180;
      const th=ang*Math.PI/180, g=[Math.sin(th),-Math.cos(th)];
      let nx=uy, ny=-ux; if((cx-p.x)*nx+(cy-p.y)*ny<0){ nx=-nx; ny=-ny; }     // normal hacia el interior
      const s0=arcR[i]+2+tw/2;
      for(let s=s0; s<=L-tw/2-2; s+=2) [[1,0],[1,2.5],[-1,0]].forEach(([sd,ex])=>{
        const m=[nx*sd,ny*sd], dd=((g[0]*m[0]+g[1]*m[1])>0?3:5.5)+ex;
        cands.push({x:p.x+ux*s+m[0]*dd, y:p.y+uy*s+m[1]*dd, rot:ang, anchor:'middle', pen:(s-s0)*0.15+di*4+(sd<0?12:0)+ex*1.2});
      });
    });
    if(!cands.length) cands.push({x:V[i].x, y:V[i].y-14, anchor:'middle', pen:50});
    if(Math.min(...cands.map(q=>eng.count(eng.box(t,4,q),0.5)))>0) return;     // sin sitio libre: se omite del dibujo (queda en el listado)
    lab(t,4,colV[i],eng.pick(t,4,cands));
  });

  // lados: por fuera, a lo largo de su línea
  [0,1,2].forEach(i=>{
    const [p,q]=side[i], L=len(p,q), dx=q.x-p.x, dy=q.y-p.y;
    let ang=Math.atan2(dy,dx)*180/Math.PI; if(ang>90) ang-=180; if(ang<-90) ang+=180;
    const th=ang*Math.PI/180, g=[Math.sin(th),-Math.cos(th)], u=[Math.cos(th),Math.sin(th)];
    let nx=dy/L, ny=-dx/L; if((cx-(p.x+q.x)/2)*nx+(cy-(p.y+q.y)/2)*ny>0){ nx=-nx; ny=-ny; }
    const t=`${sName[i]} = ${sTxt(sVal[i])}`, mx=(p.x+q.x)/2, my=(p.y+q.y)/2, tmax=Math.max(0,L/2-eng.tw(t,4)/2-3), cands=[];
    for(let s=0;s<=tmax+1e-6;s+=2.5) for(const sg of [1,-1]){ if(s===0&&sg===-1) continue;
      [[1,0],[1,3.6],[1,7.2],[-1,0],[-1,3.6]].forEach(([sd,ex])=>{
        const m=[nx*sd,ny*sd], dd=((g[0]*m[0]+g[1]*m[1])>0?1.9:4.8)+ex;
        cands.push({x:mx+u[0]*s*sg+m[0]*dd, y:my+u[1]*s*sg+m[1]*dd, rot:ang, anchor:'middle', pen:s*0.4+(sd<0?10:0)+ex*1.2});
      });
    }
    if(Math.min(...cands.map(q=>eng.count(eng.box(t,4,q),0.5)))>0) return;
    lab(t,4,sCol[i],eng.pick(t,4,cands));
  });

  // área: en el interior, lo más lejos posible de los bordes (si no cabe, al costado)
  {
    const dEdge=(x,y)=>{ let m=1e9; for(let i=0;i<3;i++){ const p=V[i],q=V[(i+1)%3],dx=q.x-p.x,dy=q.y-p.y,l2=dx*dx+dy*dy||1; let t=((x-p.x)*dx+(y-p.y)*dy)/l2; t=Math.max(0,Math.min(1,t)); m=Math.min(m,Math.hypot(x-p.x-t*dx,y-p.y-t*dy)); } return m; };
    const t=`Área = ${fmtNum(r.area,3)}`, cands=[]; let best=0; const pts=[];
    const xs=V.map(p=>p.x), ys=V.map(p=>p.y);
    for(let x=Math.min(...xs);x<=Math.max(...xs);x+=2.5) for(let y=Math.min(...ys);y<=Math.max(...ys);y+=2.5) if(inside(x,y)){ const d=dEdge(x,y); pts.push([x,y,d]); best=Math.max(best,d); }
    pts.forEach(([x,y,d])=>cands.push({x,y:y+1.5,anchor:'middle',pen:(best-d)*0.8}));
    const tw0=eng.tw(t,4.5), my0=(Math.min(...ys)+Math.max(...ys))/2;
    for(let dy=-30;dy<=30;dy+=6){ cands.push({x:Math.max(...xs)+8+tw0/2,y:my0+dy,anchor:'middle',pen:30+Math.abs(dy)*0.1}); cands.push({x:Math.min(...xs)-8-tw0/2,y:my0+dy,anchor:'middle',pen:30+Math.abs(dy)*0.1}); }
    lab(t,4.5,'var(--accent)',eng.pick(t,4.5,cands));
  }

  // listado
  items.forEach(it=>{
    out += `<rect x="${f(it.x)}" y="${f(it.y-3.457)}" width="3.457" height="3.457" fill="${it.q.c}"/>\n`;
    out += it.q.nocol
      ? `<text x="${f(it.x+5.185)}" y="${f(it.y)}" ${FONT} font-size="${FS_L}" fill="var(--ink)">${it.q.k} = ${it.q.v}</text>\n`
      : `<text x="${f(it.x+5.185)}" y="${f(it.y)}" ${FONT} font-size="${FS_L}"><tspan fill="${it.q.c}">${it.q.k}</tspan><tspan fill="var(--ink)"> = ${it.q.v}</tspan></text>\n`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n${out}</svg>`;
}

function renderTriangulacion(){
  const body = `<div class="field-card">
    ${fieldRow('Lado a (opuesto a A)','tr_a',3)}
    ${fieldRow('Lado b (opuesto a B)','tr_b',4)}
    ${fieldRow('Lado c (opuesto a C)','tr_c',5)}
    <button class="btn" id="btnTR" type="button">Calcular</button>
    <div id="resTR"></div>
  </div>`;
  toolShell('triangulacion','Resuelve un triángulo conocidos sus tres lados (SSS) mediante la ley de los cosenos — útil para triangulación y verificación de poligonales.', body);
  document.getElementById('btnTR').addEventListener('click', ()=>{
    const a=val('tr_a'), b=val('tr_b'), c=val('tr_c');
    const box=document.getElementById('resTR');
    if([a,b,c].some(isNaN)){ box.innerHTML=`<p class="err-msg">Completa los tres lados.</p>`; return; }
    const r = calcTriangulacion(a,b,c);
    if(!r){ box.innerHTML=`<p class="err-msg">Esos tres lados no forman un triángulo válido (la suma de dos lados debe superar al tercero).</p>`; return; }
    const svg = svgTriangulacion(a,b,c,r);
    box.innerHTML = `<div class="results" style="margin-top:14px;">
      <div class="result-row"><span class="k">Ángulo A</span><span class="v accent">${fmtAngle(r.A)}</span></div>
      <div class="result-row"><span class="k">Ángulo B</span><span class="v accent">${fmtAngle(r.B)}</span></div>
      <div class="result-row"><span class="k">Ángulo C</span><span class="v accent">${fmtAngle(r.C)}</span></div>
      <div class="result-row"><span class="k">Perímetro</span><span class="v">${fmtNum(r.perimetro,3)}</span></div>
      <div class="result-row"><span class="k">Área (Herón)</span><span class="v big">${fmtNum(r.area,3)}</span></div>
      <div class="plot-wrap">${svg}</div>
    </div>`;
  });
}

/* ---------- INTERSECCION DE DOS RECTAS ---------- */
function renderInterseccion(){
  const body = `<div class="field-card">
    <h3>Recta 1</h3>
    <div class="field-inline2">${fieldRow('Este','ix_e1',5000)}${fieldRow('Norte','ix_n1',10000)}</div>
    ${angleFieldHTML('ix_az1', 45, 'Azimut de la recta 1')}
    <h3 style="margin-top:14px;">Recta 2</h3>
    <div class="field-inline2">${fieldRow('Este','ix_e2',5120)}${fieldRow('Norte','ix_n2',10000)}</div>
    ${angleFieldHTML('ix_az2', 135, 'Azimut de la recta 2')}
    <button class="btn" id="btnIX" type="button">Calcular</button>
    <div id="resIX"></div>
  </div>`;
  toolShell('interseccion','Encuentra el punto de intersección de dos visuales (rectas) definidas cada una por un punto y su azimut, y el ángulo entre ambas.', body);
  document.getElementById('btnIX').addEventListener('click', ()=>{
    const e1=val('ix_e1'),n1=val('ix_n1'),az1=readAngleField('ix_az1');
    const e2=val('ix_e2'),n2=val('ix_n2'),az2=readAngleField('ix_az2');
    const box=document.getElementById('resIX');
    if([e1,n1,az1,e2,n2,az2].some(isNaN)){ box.innerHTML=`<p class="err-msg">Completa todos los campos.</p>`; return; }
    const r = calcInterseccion(e1,n1,az1,e2,n2,az2);
    if(!r){ box.innerHTML=`<p class="err-msg">Las rectas son paralelas — no se intersectan.</p>`; return; }
    box.innerHTML = `<div class="results" style="margin-top:12px;">
      <div class="result-row"><span class="k">Este (E)</span><span class="v accent big">${fmtNum(r.E,3)}</span></div>
      <div class="result-row"><span class="k">Norte (N)</span><span class="v accent big">${fmtNum(r.N,3)}</span></div>
      <div class="result-row"><span class="k">Distancia desde P1</span><span class="v">${fmtNum(r.dist1,3)} m</span></div>
      <div class="result-row"><span class="k">Distancia desde P2</span><span class="v">${fmtNum(r.dist2,3)} m</span></div>
      <div class="result-row"><span class="k">Ángulo entre rectas</span><span class="v">${fmtAngle(r.ang)}</span></div>
      <div class="plot-wrap">${svgInterseccion(e1,n1,az1,e2,n2,az2,r.E,r.N)}</div>
    </div>`;
  });
}

/* ---------- RADIO Y CUERDA DE CURVA ---------- */
function renderRadioCuerda(){
  const body = `
