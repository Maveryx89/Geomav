/* Diagrama de Progresiva y Offset desde un Eje — v2 (estándar de plantillas de Mario): eje P1–P2 a escala (blueprint, con prolongaciones
   tenues), punto P3 y su pie F sobre el eje con ángulo recto. El Offset (accent: resultado principal) es la perpendicular P3→F; la progresiva
   K se mide sobre el eje desde P1 hasta F (success, cota paralela al eje del lado opuesto a P3). Valores en el listado; en el dibujo solo el
   carácter (K, Off) y las letras de los puntos. Rótulo sin lugar libre → se omite del dibujo. */
function svgProgresivaOffset(n1,e1,k1,n2,e2,np,ep,r){
  const K=svgKit(), len0=Math.hypot(e2-e1,n2-n1);
  K.north();
  K.list([[
    {k:'K',c:'var(--success)',v:`${fmtNum(r.Kp,2)} m`},
    {k:'Off',c:'var(--accent)',v:`${fmtNum(Math.abs(r.offset),3)} m`},
    {k:'Lado',c:'var(--ink)',v:r.lado},
    {k:'Az eje',c:'var(--blueprint)',v:fmtAngle(r.az)},
    {k:'K P1',c:'var(--ink)',v:`${fmtNum(k1,2)} m`},
    {k:'P1→P2',c:'var(--blueprint)',v:`${fmtNum(len0,2)} m`}]]);
  const box={l:62,r:268,t:Math.max(54,K.listBottom+8),b:164};
  const fit=K.fit([[e1,n1],[e2,n2],[ep,np],[r.footE,r.footN]],box);
  const A=[fit.X(e1),fit.Y(n1)], B=[fit.X(e2),fit.Y(n2)], P=[fit.X(ep),fit.Y(np)], F=[fit.X(r.footE),fit.Y(r.footN)];
  const dx=B[0]-A[0], dy=B[1]-A[1], len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
  const proj=q=>(q[0]-A[0])*ux+(q[1]-A[1])*uy, pf=proj(F);
  const tmin=Math.min(0,len,pf)-12, tmax=Math.max(0,len,pf)+12, at=t=>[A[0]+ux*t,A[1]+uy*t];
  if(tmin<0) K.line(...at(tmin),...at(0),'var(--blueprint)',{op:0.45,dash:'1.6 1.6'});
  if(tmax>len) K.line(...at(len),...at(tmax),'var(--blueprint)',{op:0.45,dash:'1.6 1.6'});
  K.line(...A,...B,'var(--blueprint)',{sw:1.2});
  const nrm=[-uy,ux], sP=((P[0]-A[0])*nrm[0]+(P[1]-A[1])*nrm[1])>=0?1:-1, away=[-nrm[0]*sP,-nrm[1]*sP], toP=[nrm[0]*sP,nrm[1]*sP];
  const d=Math.hypot(P[0]-F[0],P[1]-F[1]);
  if(d>0.5) K.line(...P,...F,'var(--accent)',{sw:1});
  if(d>6){ const k=3, s=pf<len/2?1:-1, v=[toP[0]*k,toP[1]*k];
    K.poly([[F[0]+ux*s*k,F[1]+uy*s*k],[F[0]+ux*s*k+v[0],F[1]+uy*s*k+v[1]],[F[0]+v[0],F[1]+v[1]]],{stroke:'var(--ink-soft)',sw:0.6,obs:false}); }
  // cota K: de P1 a F, paralela al eje, del lado opuesto a P3
  const off=5, a0=[A[0]+away[0]*off,A[1]+away[1]*off], f0=[F[0]+away[0]*off,F[1]+away[1]*off];
  if(Math.abs(pf)>2){
    K.line(...a0,...f0,'var(--success)',{sw:0.7});
    [A,F].forEach(q=>K.line(q[0]+away[0]*1.5,q[1]+away[1]*1.5,q[0]+away[0]*(off+1.6),q[1]+away[1]*(off+1.6),'var(--success)',{sw:0.6,noObs:false}));
    K.lineLabel(...a0,...f0,'K',4.5,'var(--success)',{out:away,extras:[0,3,6]});
  }
  [A,B].forEach(q=>K.dot(q[0],q[1],'var(--ink-soft)',2));
  K.dot(F[0],F[1],'var(--ink-soft)',1.8); K.dot(P[0],P[1],'var(--accent)',2.4);
  if(d>6) K.lineLabel(...P,...F,'Off',4.5,'var(--accent)',{out:[ux,uy]});
  const pd=d>0.5?[(P[0]-F[0])/d,(P[1]-F[1])/d]:toP;
  K.pointLabel('P1',A[0],A[1],4.5,'var(--ink-soft)',{dir:away,full:true,omit:false});
  K.pointLabel('P2',B[0],B[1],4.5,'var(--ink-soft)',{dir:away,full:true,omit:false});
  K.pointLabel('P3',P[0],P[1],4.5,'var(--accent)',{dir:pd,omit:false});
  K.pointLabel('F',F[0],F[1],4.5,'var(--ink-soft)',{dir:away,full:true});
  return K.svg();
}

/* Nivelación diferencial: esquema de campo (trípode + mira + terreno), como Taquimetría/Nivelación Trig.
   Agrupa filas en ESTACIONES: una fila con BS en blanco es una vista adicional (radiada) desde
   la MISMA estación anterior, sin mover el instrumento — no 1 trípode por fila. */
/* Diagrama de nivelación diferencial — v3.
   Basado en la plantilla de Illustrator de Mario (plantilla_nivelacion_diferencial_v2_mv.svg): mesa 320×190,
   geometría, grosores de línea, ubicaciones y tamaños de texto de esa plantilla. Los valores van en el listado
   (esquina superior izquierda, pegados a su descriptor) y también en los rótulos del dibujo (HI, BS, FS y ΔH).
   Color por tramo (estación 1 = blueprint, estación 2 = success, y así alternando); ΔH total = accent. */
function svgNivelacionDiferencial(cotas, filas){
  const n = filas.length;
  const nPts = cotas.length;
  if(nPts<2 || n<1) return '';

  // ---- estaciones de nivel: cada fila con BS abre una estación; las filas sin BS son FS adicionales de la misma estación ----
  const stations = [];
  let i = 0;
  while(i<n){
    const fromPt = i;
    const hi = cotas[fromPt] + filas[i].bs;
    const toPts = [];
    let j = i;
    do{
      toPts.push(j+1);
      j++;
    } while(j<n && !isFinite(filas[j].bs));
    stations.push({fromPt, row0:i, toPts, hi});
    i = j;
  }

  // ---- mapa de alturas (esquemático): el valor mínimo va a y=150 y el máximo (cota o HI) a y=95 ----
  const W=320, H=190, yBot=150, yTop=95;
  const allVals = [...cotas, ...stations.map(s=>s.hi)].filter(isFinite);
  const minC=Math.min(...allVals), maxC=Math.max(...allVals);
  const span=Math.max(maxC-minC, 0.001);
  const py = v => yBot - ((v-minC)/span)*(yBot-yTop);

  // ---- posiciones horizontales: separación de la plantilla (67,5), centradas; se comprime si hay muchos puntos ----
  const nSeg = nPts-1;
  const sp = Math.min(67.5, 212/nSeg);
  const x0 = 182.5 - (nSeg*sp)/2;
  const ptX = cotas.map((_,k)=> x0 + k*sp);
  const ptY = cotas.map(c=> py(c));
  const xLast = ptX[nPts-1];
  const ptLbl = k => k===0 ? 'BM' : (k===nPts-1 ? 'PF' : 'PC'+k);
  const stCol = k => (k%2===0) ? 'var(--blueprint)' : 'var(--success)';
  const f = v => v.toFixed(2).replace(/\.?0+$/,'');   // coordenadas compactas
  const FONT = 'font-family="var(--font-body)" font-weight="700"';
  const HALO = 'stroke="var(--paper-raised)" stroke-width="1" paint-order="stroke" stroke-linejoin="round"';
  const dense = sp < 45;   // muchas estaciones: se simplifica (sin E)
  const eng = svgLblEngine(W,H);
  const val = v => `${fmtNum(v,3)} m`;

  // ---- listado de valores (esquina superior izquierda, columnas de 10 filas) ----
  const rows = [];
  stations.forEach((s,k)=>{
    const r = s.row0+1;
    rows.push({t:'HI'+r, c:stCol(k), v:val(s.hi)});
    rows.push({t:'BS'+r, c:stCol(k), v:val(filas[s.row0].bs)});
    s.toPts.forEach(p=> rows.push({t:'FS'+p, c:stCol(k), v:val(filas[p-1].fs)}));
  });
  const dH = cotas[nPts-1]-cotas[0];
  const dHtxt = (dH>=0 ? '+' : '') + val(dH);
  rows.push({t:'ΔH', c:'var(--accent)', v:dHtxt});
  cotas.forEach((c,k)=> rows.push({t:'Cota '+ptLbl(k), c:'var(--ink-soft)', v:val(c)}));
  const PER_COL=10, COL_W=70, ROW_Y0=12.521, ROW_DY=5.761;
  const nCols = Math.ceil(rows.length/PER_COL);
  const maxRowW = Math.max(...rows.map(r=>eng.tw(`${r.t} = ${r.v}`,4.32)));
  const listRight = 15.2 + COL_W*(nCols-1) + maxRowW + 1;
  const listBottom = ROW_Y0 + (Math.min(rows.length,PER_COL)-1)*ROW_DY + 1;
  eng.rectFill(8.5, 6.5, listRight, listBottom+0.5);
  eng.rectFill(W/2-30, 181.5, W/2+30, 187);

  // ---- altura de cada mira: 65 desde el terreno, y siempre sobre las visuales que toca ----
  const touchY = cotas.map(()=>[]);
  stations.forEach(s=>{
    const y = py(s.hi);
    touchY[s.fromPt].push(y);
    s.toPts.forEach(p=>touchY[p].push(y));
  });
  const staffTop = cotas.map((_,k)=>{
    let top = ptY[k]-65;
    touchY[k].forEach(y=>{ top = Math.min(top, y-12); });
    if(ptX[k]-3 < listRight) top = Math.max(top, listBottom+4);   // no pisar el listado
    return top;
  });

  // ---- desnivel total (parámetros) ----
  const yBM = ptY[0], yFin = ptY[nPts-1];
  const showDH = Math.abs(yBM-yFin) > 0.5;
  const subiendo = yFin < yBM;                         // el punto final está más alto que el BM
  const xd = subiendo ? xLast+4 : xLast+13;            // si baja, se desplaza para no montarse sobre el FS final

  let out = '';

  // ---- terreno ----
  const extL = Math.min(15, x0-4), extR = Math.min(40, 316-xLast);
  let terrainD = `M${f(x0-extL)} ${f(ptY[0]+2.5)}`;
  const tp = [[x0-extL, ptY[0]+2.5]];
  for(let k=0;k<nPts;k++){ terrainD += ` L${f(ptX[k])} ${f(ptY[k])}`; tp.push([ptX[k],ptY[k]]); }
  terrainD += ` L${f(xLast+extR)} ${f(ptY[nPts-1]-2)}`; tp.push([xLast+extR, ptY[nPts-1]-2]);
  out += `<path d="${terrainD}" fill="none" stroke="#8B6B47" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>\n`;
  eng.poly(tp);

  // ---- miras y puntos (neutros) ----
  for(let k=0;k<nPts;k++){
    out += `<rect x="${f(ptX[k]-1)}" y="${f(staffTop[k])}" width="2" height="${f(ptY[k]-staffTop[k])}" fill="none" stroke="var(--ink-soft)" stroke-width="0.6" stroke-linejoin="round"/>\n`;
    eng.rectOutline(ptX[k]-1, staffTop[k], ptX[k]+1, ptY[k]);
  }
  for(let k=0;k<nPts;k++){
    out += `<circle cx="${f(ptX[k])}" cy="${f(ptY[k])}" r="2" fill="var(--ink-soft)"/>\n`;
    eng.circle(ptX[k], ptY[k], 2.3);
  }

  // ---- estaciones (geometría) ----
  const pend = [];   // rótulos pendientes de colocar
  stations.forEach((s,k)=>{
    const col = stCol(k);
    const visY = py(s.hi);
    const xFrom = ptX[s.fromPt];
    const xTo = ptX[s.toPts[s.toPts.length-1]];
    const Vx = xFrom + sp/2;
    const Ey = ptY[s.fromPt] + (ptY[s.fromPt+1]-ptY[s.fromPt])/2;
    const bodyTop = visY-2.45, bodyBot = visY+2.45;

    // visual horizontal
    out += `<line x1="${f(xFrom+1.5)}" y1="${f(visY)}" x2="${f(xTo-1.5)}" y2="${f(visY)}" stroke="${col}" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="3 2"/>\n`;
    eng.seg(xFrom+1.5, visY, xTo-1.5, visY);
    // BS (a la izquierda de su mira) y FS (a la derecha de cada mira de adelante): cota con topes
    const dim = (x, y1, y2, c, w) => { eng.seg(x,y1,x,y2); eng.seg(x-2,y1,x+2,y1); eng.seg(x-2,y2,x+2,y2);
      return `<path d="M${f(x)} ${f(y1)} L${f(x)} ${f(y2)} M${f(x-2)} ${f(y1)} L${f(x+2)} ${f(y1)} M${f(x-2)} ${f(y2)} L${f(x+2)} ${f(y2)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>\n`; };
    const xBS = xFrom-4;
    out += dim(xBS, visY, ptY[s.fromPt], col, 0.7);
    s.toPts.forEach(p=>{ out += dim(ptX[p]+4, visY, ptY[p], col, 0.7); });
    // nivel (cuerpo + trípode)
    out += `<path d="M${f(Vx)} ${f(bodyBot)} L${f(Vx)} ${f(Ey)} M${f(Vx)} ${f(bodyBot)} L${f(Vx-4.3)} ${f(Ey)} M${f(Vx)} ${f(bodyBot)} L${f(Vx+4.3)} ${f(Ey)}" fill="none" stroke="${col}" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>\n`;
    out += `<rect x="${f(Vx-4.25)}" y="${f(bodyTop)}" width="8.5" height="4.9" fill="var(--paper-raised)" stroke="${col}" stroke-width="1.4" stroke-linejoin="round"/>\n`;
    out += `<circle cx="${f(Vx)}" cy="${f(Ey)}" r="1.5" fill="var(--ink-soft)"/>\n`;
    eng.seg(Vx,bodyBot,Vx,Ey); eng.seg(Vx,bodyBot,Vx-4.3,Ey); eng.seg(Vx,bodyBot,Vx+4.3,Ey);
    eng.rectFill(Vx-4.5, bodyTop-0.3, Vx+4.5, bodyBot+0.3, 0.8); eng.circle(Vx,Ey,1.8);
    pend.push({kind:'st', k, col, visY, xFrom, xBS, Vx, Ey, s});
  });

  // ---- desnivel total BM → punto final (accent): geometría ----
  if(showDH){
    out += `<line x1="${f(ptX[0]+3)}" y1="${f(yBM)}" x2="${f(xd+20)}" y2="${f(yBM)}" stroke="var(--ink-soft)" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="1 2"/>\n`;
    out += `<path d="M${f(xd)} ${f(yBM)} L${f(xd)} ${f(yFin)} M${f(xd-2)} ${f(yBM)} L${f(xd+2)} ${f(yBM)} M${f(xd-2)} ${f(yFin)} L${f(xd+2)} ${f(yFin)}" fill="none" stroke="var(--accent)" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>\n`;
    eng.seg(ptX[0]+3,yBM,xd+20,yBM); eng.seg(xd,yBM,xd,yFin); eng.seg(xd-2,yBM,xd+2,yBM); eng.seg(xd-2,yFin,xd+2,yFin);
  }

  // ---- rótulos fijos: nombres de los puntos y E (neutros) ----
  const lab = (t, fs, col, c, halo=true) => { const q=eng.txtAttrs(c); out += `<text ${q.pos} ${FONT} ${halo?HALO+' ':''}font-size="${fs}" fill="${col}"${q.an}>${t}</text>\n`; };
  const near = (c, dxs, dys) => { const cc=[]; for(const dx of dxs) for(const dy of dys) cc.push({...c, x:c.x+dx, y:c.y+dy, pen:Math.hypot(dx,dy)*0.5}); return cc; };
  const D6=[0,-1.5,1.5,-3,3,-5,5,-8,8], D5=[0,1,2,3,4,5,7,9];
  for(let k=0;k<nPts;k++){
    let c, fs=4;
    if(k===0){ c={x:ptX[0], y:ptY[0]+6.359, anchor:'middle'}; fs=4.5; }
    else if(k===nPts-1) c={x:ptX[k]+3, y:ptY[k]+5.875, anchor:'end'};
    else c={x:ptX[k], y:ptY[k]+5.875, anchor:'middle'};
    lab(ptLbl(k), fs, 'var(--ink-soft)', eng.pick(ptLbl(k),fs,near(c,D6,D5)));
  }
  pend.forEach(p=>{
    if(!dense){ const c={x:p.Vx+5.3, y:p.Ey-3.6}; lab('E'+(p.k+1),4,p.col,eng.pick('E'+(p.k+1),4,near(c,[0,1,2,3,-1,-2,4,6],[0,-1,-2,-3,1,2,-5,-7]))); }
  });

  // ---- rótulos con valor: ΔH, luego BS/FS, luego HI ----
  if(showDH){
    const t = 'ΔH = '+dHtxt, cc=[], mid=(yBM+yFin)/2, len=Math.abs(yBM-yFin), wT=eng.tw(t,4);
    for(let d=0; d<=40; d+=2) for(const sg of [1,-1]){ if(d===0&&sg===-1) continue;
      for(const dx of [0,4,8]) cc.push({x:xd+3.875+dx, y:mid+d*sg, rot:-90, anchor:'middle', pen:d*0.3+dx*0.8+Math.max(0,wT-len)*0.6});
    }
    for(const dx of [3.5,5,8]) for(let d=-16; d<=16; d+=2) cc.push({x:xd+dx, y:mid+1.4+d, pen:6+Math.abs(d)*0.3+(dx-3.5)*0.5});
    lab(t,4,'var(--accent)',eng.pick(t,4,cc));
  }
  pend.forEach(p=>{
    const s=p.s, col=p.col, r=s.row0+1;
    const bsT = `BS${r} = ${val(filas[s.row0].bs)}`;
    const vert = (t, xBase, ya, yb) => { const cc=[], c0=(ya+yb)/2+1, len=Math.abs(ya-yb), wT=eng.tw(t,4), lo=Math.min(ya,yb), hi=Math.max(ya,yb);
      for(let d=0; d<=70; d+=1.5) for(const sg of [1,-1]){ if(d===0&&sg===-1) continue; const y=c0+d*sg;
        const over=Math.max(0,lo-(y-wT/2))+Math.max(0,(y+wT/2)-hi);
        for(const dx of [0,3,6]) cc.push({x:xBase+dx*(t.startsWith('BS')?-1:1), y, rot:-90, anchor:'middle', pen:d*0.25+over*0.7+dx*0.8}); }
      lab(t,4,col,eng.pick(t,4,cc)); };
    vert(bsT, p.xBS-1.4, p.visY, ptY[s.fromPt]);
    s.toPts.forEach(q=> vert(`FS${q} = ${val(filas[q-1].fs)}`, ptX[q]+7.875, p.visY, ptY[q]));
  });
  pend.forEach(p=>{
    const s=p.s, t=`HI${s.row0+1} = ${val(s.hi)}`, half=sp/2, cc=[];
    const hx = dense ? p.Vx - 0.3*sp : p.Vx + (p.k%2===0 ? -0.55 : 0.6)*half;
    for(let dx=-60; dx<=60; dx+=2) for(let dy=0; dy<=28; dy+=2)
      cc.push({x:hx+dx, y:p.visY-0.94-dy, anchor:'middle', pen:Math.abs(dx)*0.25+dy*0.45});
    lab(t,4,p.col,eng.pick(t,4,cc));
  });

  // ---- listado de valores: el valor a continuación de su descriptor ----
  rows.forEach((r,idx)=>{
    const col = Math.floor(idx/PER_COL), row = idx%PER_COL;
    const ox = COL_W*col, by = ROW_Y0 + row*ROW_DY;
    out += `<rect x="${f(10.026+ox)}" y="${f(by-3.457)}" width="3.457" height="3.457" fill="${r.c}"/>\n`;
    out += `<text x="${f(15.211+ox)}" y="${f(by)}" ${FONT} font-size="4.32"><tspan fill="${r.c}">${r.t}</tspan><tspan fill="var(--ink)"> = ${r.v}</tspan></text>\n`;
  });

  out += `<text x="${W/2}" y="${H-4}" font-family="var(--font-body)" font-size="4" fill="var(--ink-soft)" text-anchor="middle">(esquemático, no a escala)</text>\n`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n${out}</svg>`;
}

/* Diagrama de Perfil Longitudinal — v2 (estándar de plantillas de Mario): perfil del eje con la distancia acumulada en horizontal y la cota
   en vertical (escalas independientes, perfil esquemático), puntos P1..Pn y líneas de caída punteadas hasta el plano de referencia. La
   pendiente de cada tramo (accent: resultado principal) se rotula a lo largo de él: hasta 8 tramos solo la letra p(i) y los valores en el
   listado; con más tramos el rótulo lleva el valor en %. El listado resume largo, desnivel y pendiente media. Rótulo sin lugar libre → se omite. */
function svgPerfilLongitudinal(puntos){
  const K=svgKit(), n=puntos.length, nt=n-1, few=nt<=8, acc='var(--accent)';
  if(n<2) return '';
  const pend=i=>{ const dd=puntos[i+1].d-puntos[i].d; return dd!==0?(puntos[i+1].cota-puntos[i].cota)/dd*100:NaN; };
  const L=puntos[n-1].d-puntos[0].d, dz=puntos[n-1].cota-puntos[0].cota;
  const rows=[{k:'Largo',c:'var(--ink)',v:`${fmtNum(L,2)} m`},{k:'Desnivel',c:'var(--ink)',v:`${fmtNum(dz,3)} m`},{k:'Pend. media',c:'var(--ink-soft)',v:L!==0?`${fmtNum(dz/L*100,2)} %`:'—'}];
  const blocks=[rows];
  if(few) blocks.push(Array.from({length:nt},(_,i)=>({k:'p'+(i+1),c:acc,v:isNaN(pend(i))?'—':`${fmtNum(pend(i),2)} %`})));
  K.list(blocks,{gap:12});
  const ds=puntos.map(p=>p.d), cs=puntos.map(p=>p.cota), d0=Math.min(...ds), d1=Math.max(...ds), c0=Math.min(...cs), c1=Math.max(...cs);
  const box={l:24,r:300,t:Math.max(48,K.listBottom+12),b:158}, datum=168;
  const X=d=>box.l+(d-d0)/Math.max(d1-d0,1e-9)*(box.r-box.l), Y=c=>box.b-(c-c0)/Math.max(c1-c0,1e-9)*(box.b-box.t);
  const Q=puntos.map(p=>[X(p.d),Y(p.cota)]);
  K.line(box.l-8,datum,box.r+8,datum,'var(--ink-soft)',{sw:0.7});
  if(n<=14) Q.forEach(q=>K.line(q[0],q[1],q[0],datum,'var(--ink-soft)',{sw:0.5,dash:'1.4 1.8',noObs:false}));
  K.poly(Q,{stroke:'var(--blueprint)',sw:1.3});
  Q.forEach(q=>K.dot(q[0],q[1],'var(--ink-soft)',2));
  const st=thinLabelStep(n,12);
  for(let i=0;i<nt;i++){ const a=Q[i], b=Q[i+1]; if(Math.hypot(b[0]-a[0],b[1]-a[1])<6) continue;
    if(few) K.lineLabel(...a,...b,'p'+(i+1),4.5,acc,{out:[0,-1],extras:[0,3,6]});
    else if(nt<=16&&!isNaN(pend(i))) K.lineLabel(...a,...b,fmtNum(pend(i),1)+'%',3,acc,{out:[0,-1],extras:[0,3]}); }
  Q.forEach((q,i)=>{ if(i%st!==0&&i!==n-1) return; K.pointLabel('P'+(i+1),q[0],q[1],4.5,'var(--ink-soft)',{dir:[0,-1],omit:false,rmin:3.6,rmax:12}); });
  return K.svg();
}

function svgPerfilNivel(cotas, labels){
  const w=300,h=170,pad=26;
  const vals = cotas.filter(v=>isFinite(v));
  if(vals.length<2) return '';
  const minC=Math.min(...vals), maxC=Math.max(...vals);
  const span=Math.max(maxC-minC,0.001);
  const n=cotas.length;
  const stepX=(w-2*pad)/Math.max(n-1,1);
  const px=i=> pad+i*stepX;
  const py=v=> (h-pad) - ((v-minC)/span)*(h-2*pad);
  let path='', dots='';
  cotas.forEach((c,i)=>{
    if(!isFinite(c)) return;
    path += `${path?'L':'M'} ${px(i).toFixed(1)} ${py(c).toFixed(1)} `;
    dots += `<circle cx="${px(i).toFixed(1)}" cy="${py(c).toFixed(1)}" r="3" fill="var(--accent)"/>
      <text x="${px(i).toFixed(1)}" y="${(py(c)-8).toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">${fmtNum(c,2)}</text>
      ${labels&&labels[i]?`<text x="${px(i).toFixed(1)}" y="${h-8}" font-size="9" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">${labels[i]}</text>`:''}`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="1"/>
    <path d="${path}" stroke="var(--blueprint)" stroke-width="1.8" fill="none"/>
    ${dots}
  </svg>`;
}

/* Diagrama de arco/curva circular: R, delta, cuerda, tangentes, puntos opcionales de replanteo */
/* Diagrama de curva circular — v2 (estándar de plantillas de Mario): esquema (no a escala) con PI, PC, PT, O, tangentes T, radios R,
   arco Lc, cuerda C, externa E, ordenada media M y deflexión Δ. En el dibujo solo el carácter de cada magnitud (nomenclatura estándar);
   todos los valores van en el listado de la esquina, con el mismo color que su trazo. El color accent sigue a la magnitud estrella del panel
   (extras.star: 'T' por defecto, 'R', 'Lc'; con ptLabel — estaca — el punto final). Solo se dibuja lo que se entrega: T si hay Tval;
   Lc/C/E/M/D/defl si vienen en extras (defl = deflexión desde el PC: tangente en el PC y ángulo hasta la cuerda). La deflexión dibujada se acota a 60°–140° para que E y M tengan largo suficiente para rotularse. */
function svgCurvaArco(R, deltaDeg, puntos, fuente, ptLabel, Tval, extras){
  const K=svgKit(), eng=K.eng, ex=extras||{};
  const d=Math.min(Math.max(deltaDeg,60),140), th=toRad(d/2), thDeg=d/2;
  const top=19, bot=fuente?165:176, cx=170;
  const Rs=Math.min((bot-top)*Math.cos(th), 190/(2*Math.sin(th)), 150);
  const O=[cx, top+Rs/Math.cos(th)], PI_=[cx,top];
  const at=a=>[O[0]+Rs*Math.cos(toRad(a)), O[1]+Rs*Math.sin(toRad(a))];
  const PC=at(-90-thDeg), PT=at(-90+thDeg), MA=at(-90), MC=[cx,(PC[1]+PT[1])/2];
  // colores: accent sigue a la magnitud estrella
  const col={R:'var(--blueprint)',T:'var(--accent)',Lc:'var(--success)',C:'var(--danger)',E:'var(--ink-soft)',M:'var(--ink)',D:'var(--ink)'};
  const star=ex.star||'T'; if(star!=='T'&&col[star]&&!ptLabel){ const t=col[star]; col[star]=col.T; col.T=t; }
  const hasT=Tval!==undefined, has=k=>ex[k]!==undefined;
  const rows=[{k:'R',c:col.R,v:`${fmtNum(R,2)} m`}];
  if(has('D')) rows.push({k:'Δ',c:col.D,v:fmtAngle(deltaDeg)});
  if(has('defl')) rows.push({k:'δ',c:col.D,v:fmtAngle(ex.defl)});
  if(hasT) rows.push({k:'T',c:col.T,v:`${fmtNum(Tval,2)} m`});
  if(has('Lc')) rows.push({k:'Lc',c:col.Lc,v:`${fmtNum(ex.Lc,2)} m`});
  if(has('C')) rows.push({k:'C',c:col.C,v:`${fmtNum(ex.C,2)} m`});
  if(has('E')) rows.push({k:'E',c:col.E,v:`${fmtNum(ex.E,2)} m`});
  if(has('M')) rows.push({k:'M',c:col.M,v:`${fmtNum(ex.M,2)} m`});
  K.list([rows]);
  // trazos
  if(hasT){ K.line(...PI_,...PC,col.T,{sw:0.9}); K.line(...PI_,...PT,col.T,{sw:0.9}); }
  K.line(...PC,...O,col.R,{dash:'2.4 2.4',sw:0.7}); K.line(...O,...PT,col.R,{dash:'2.4 2.4',sw:0.7});
  K.arc(O[0],O[1],Rs,-90-thDeg,-90+thDeg,ptLabel?col.Lc:col.Lc,{sw:1.4});
  if(has('C')) K.line(...PC,...PT,col.C,{dash:'3 2',sw:0.8});
  if(has('E')&&hasT) K.line(...PI_,...MA,col.E,{dash:'1.6 1.6',sw:0.8});
  if(has('M')) K.line(...MA,...MC,col.M,{sw:0.9});
  if(has('D')) K.arc(O[0],O[1],Rs*0.22,-90-thDeg,-90+thDeg,col.D,{sw:0.8});
  // deflexión desde el PC (estaca): tangente en el PC y ángulo entre tangente y cuerda
  let dfl=null;
  if(has('defl')){ const tx=Math.cos(th), ty=-Math.sin(th), cl=Math.hypot(PT[0]-PC[0],PT[1]-PC[1]);
    const fl=ty<0?Math.min(cl*0.8,(PC[1]-6)/-ty):cl*0.8;
    K.line(PC[0]-tx*10,PC[1]-ty*10,PC[0]+tx*fl,PC[1]+ty*fl,'var(--ink-soft)',{dash:'1.6 1.6',sw:0.7});
    K.line(...PC,...PT,col.C,{dash:'3 2',sw:0.8});
    const ac=Math.atan2(PT[1]-PC[1],PT[0]-PC[0])*180/Math.PI, at0=Math.atan2(ty,tx)*180/Math.PI, ra=Math.min(18,cl*0.35);
    K.arc(PC[0],PC[1],ra,at0,ac,col.D,{sw:0.8}); dfl={am:(at0+ac)/2*Math.PI/180,ra}; }
  // replanteo: puntos sobre el arco
  if(puntos&&puntos.length){
    const st=thinLabelStep(puntos.length,10), tp=[];
    puntos.forEach((p,i)=>{ const a=-90-thDeg+p.frac*d, q=at(a); K.dot(q[0],q[1],'var(--ink-soft)',1.6); tp.push([i,a,q]); });
    tp.forEach(([i,a,q])=>{ if(i%st===0) K.pointLabel('P'+(i+1),q[0],q[1],3,'var(--ink-soft)',{dir:[Math.cos(toRad(a)),Math.sin(toRad(a))],rmin:3.6,rmax:9}); });
  }
  // puntos fijos
  [PC,O].forEach(q=>K.dot(q[0],q[1],'var(--ink-soft)',2)); K.dot(PT[0],PT[1],ptLabel?'var(--accent)':'var(--ink-soft)',2);
  if(hasT) K.dot(PI_[0],PI_[1],'var(--ink-soft)',2);
  if(has('Lc')||has('E')||has('M')) K.dot(MA[0],MA[1],col.Lc,1.8);
  // letras de puntos (hacia afuera)
  const out=(q)=>{const dx=q[0]-O[0], dy=q[1]-O[1], l=Math.hypot(dx,dy)||1; return [dx/l,dy/l];};
  if(hasT) K.pointLabel('PI',PI_[0],PI_[1],4.5,'var(--ink-soft)',{dir:[0,-1],omit:false});
  K.pointLabel('PC',PC[0],PC[1],4.5,'var(--ink-soft)',{dir:out(PC),omit:false});
  K.pointLabel(ptLabel||'PT',PT[0],PT[1],4.5,ptLabel?'var(--accent)':'var(--ink-soft)',{dir:out(PT),omit:false});
  K.pointLabel('O',O[0],O[1],4.5,'var(--ink-soft)',{dir:[0,1],full:true,omit:false});
  // magnitudes: carácter a lo largo de su trazo
  const L=4.5;
  if(hasT){ K.lineLabel(...PI_,...PC,'T',L,col.T,{at:0.45,out:[-1,0],extras:[0,3,6]}); K.lineLabel(...PI_,...PT,'T',L,col.T,{at:0.45,out:[1,0],extras:[0,3,6]}); }
  K.lineLabel(...O,...PC,'R',L,col.R,{at:0.5,out:[-1,0.3],extras:[0,3,6]});
  if(has('C')) K.lineLabel(...PC,...PT,'C',L,col.C,{at:0.25,out:[0,1],extras:[0,3,6]});
  if(has('E')&&hasT) K.lineLabel(...PI_,...MA,'E',L,col.E,{at:0.5,out:[1,0],extras:[0,3]});
  if(has('M')) K.lineLabel(...MA,...MC,'M',L,col.M,{at:0.5,out:[1,0],extras:[0,3]});
  if(dfl) K.pointLabel('δ',PC[0]+dfl.ra*Math.cos(dfl.am),PC[1]+dfl.ra*Math.sin(dfl.am),L,col.D,{dir:[Math.cos(dfl.am),Math.sin(dfl.am)],rmin:2,rmax:9});
  if(has('Lc')) K.pointLabel('Lc',...at(-90+thDeg*0.55),L,col.Lc,{dir:out(at(-90+thDeg*0.55)),rmin:3,rmax:9});
  if(has('D')){ const a=-90, q=[O[0]+Rs*0.22*Math.cos(toRad(a)),O[1]+Rs*0.22*Math.sin(toRad(a))]; K.pointLabel('Δ',q[0],q[1],L,col.D,{dir:[0,-1],rmin:1.5,rmax:8}); }
  if(fuente) K.add(svgFuente(fuente,320,190));
  return K.svg();
}

/* Diagrama de curva vertical parabólica — v2 (estándar de plantillas de Mario): perfil con las dos tangentes (p1 en success, p2 en danger),
   parábola (blueprint) de PVC a PVT y la corrección vertical e en el PIV (accent: es la magnitud estrella); longitud L acotada en horizontal
   (blueprint). Los valores van en el listado (p1, p2, L, A, K, e) y en el dibujo solo el carácter. Escala horizontal real; la vertical se
   exagera para que la pendiente más fuerte alcance ~40 px. Con replanteo, los puntos de la tabla se marcan sobre la curva. */
function svgCurvaVertical(p1,p2,L,fracs){
  const K=svgKit(), A=Math.abs(p1-p2), e=A*L/800, kk=A!==0?L/A:Infinity;
  K.list([[{k:'p1',c:'var(--success)',v:`${fmtNum(p1,2)} %`},{k:'p2',c:'var(--danger)',v:`${fmtNum(p2,2)} %`},{k:'L',c:'var(--blueprint)',v:`${fmtNum(L,2)} m`},{k:'A',c:'var(--ink)',v:`${fmtNum(A,3)} %`},{k:'K',c:'var(--ink-soft)',v:isFinite(kk)?fmtNum(kk,2):'∞'},{k:'e',c:'var(--accent)',v:`${fmtNum(e,4)} m`}]]);
  const l=34, r=286, t=K.listBottom+12, b=158, half=L/2, col=p2>p1?1:-1;
  const sx=(r-l)/Math.max(L,1e-6), sv=40/((Math.max(Math.abs(p1),Math.abs(p2),0.3)/100)*half);
  const zP=-p1/100*half, zT=p2/100*half, zM=col*e, zs=[zP,zT,0,(zP+zT)/2+0*zM,col*e];
  const zmin=Math.min(...zs,0), zmax=Math.max(...zs,0), hh=(zmax-zmin)*sv;
  const yc=t+((b-t)-hh)/2;                       // parte alta del dibujo
  const X=x=>l+x*sx, Y=z=>yc+(zmax-z)*sv;
  const zc=x=>zP+p1/100*x-(p1-p2)/(200*L)*x*x;
  const PVC=[X(0),Y(zP)], PIV=[X(half),Y(0)], PVT=[X(L),Y(zT)];
  const cv=[]; for(let i=0;i<=60;i++){ const x=L*i/60; cv.push([X(x),Y(zc(x))]); }
  const CM=[X(half),Y(zc(half))];
  K.line(...PVC,...PIV,'var(--success)',{sw:0.7,dash:'3 2'}); K.line(...PIV,...PVT,'var(--danger)',{sw:0.7,dash:'3 2'});
  K.poly(cv,{stroke:'var(--blueprint)',sw:1.5});
  if(e*sv>2) K.line(...PIV,...CM,'var(--accent)',{sw:1});
  // cota de L
  const dy=b+12; K.line(PVC[0],dy,PVT[0],dy,'var(--blueprint)',{sw:0.7}); K.line(PVC[0],dy-3,PVC[0],dy+3,'var(--blueprint)',{sw:0.6,noObs:false}); K.line(PVT[0],dy-3,PVT[0],dy+3,'var(--blueprint)',{sw:0.6,noObs:false});
  K.line(PVC[0],Math.max(PVC[1],0)+0,PVC[0],dy-3,'var(--ink-soft)',{sw:0.4,dash:'1 2',noObs:true,op:0.6}); K.line(PVT[0],PVT[1],PVT[0],dy-3,'var(--ink-soft)',{sw:0.4,dash:'1 2',noObs:true,op:0.6});
  if(fracs&&fracs.length){ const st=thinLabelStep(fracs.length,8); fracs.forEach((f,i)=>{ const q=cv[Math.round(f*60)]; K.dot(q[0],q[1],'var(--ink-soft)',1.6); if(i%st===0&&i!==0&&i!==fracs.length-1) K.pointLabel(String(i+1),q[0],q[1],3,'var(--ink-soft)',{dir:[0,col>0?1:-1],rmin:3.2,rmax:8}); }); }
  [PVC,PVT].forEach(q=>K.dot(q[0],q[1],'var(--ink-soft)',2)); K.dot(PIV[0],PIV[1],'var(--ink-soft)',2);
  const up=col>0?[0,-1]:[0,1];                    // el PIV queda del lado contrario a la curva
  K.pointLabel('PIV',PIV[0],PIV[1],4.5,'var(--ink-soft)',{dir:col>0?[0,1]:[0,-1],omit:false});
  K.pointLabel('PVC',PVC[0],PVC[1],4.5,'var(--ink-soft)',{dir:[-1,p1>0?0.5:-0.5],omit:false});
  K.pointLabel('PVT',PVT[0],PVT[1],4.5,'var(--ink-soft)',{dir:[1,p2>0?-0.5:0.5],omit:false});
  const mid=(a,b2)=>[(a[0]+b2[0])/2,(a[1]+b2[1])/2], awayC=(a,b2)=>{ const m=mid(a,b2); return [col>0?-0.2:0.2, col>0?1:-1]; };
  K.lineLabel(...PVC,...PIV,'p1',4.5,'var(--success)',{out:[0,col>0?1:-1],extras:[0,3,6]});
  K.lineLabel(...PIV,...PVT,'p2',4.5,'var(--danger)',{out:[0,col>0?1:-1],extras:[0,3,6]});
  if(e*sv>5) K.lineLabel(...PIV,...CM,'e',4.5,'var(--accent)',{out:[1,0],extras:[0,3]});
  K.lineLabel(PVC[0],dy,PVT[0],dy,'L',4.5,'var(--blueprint)',{out:[0,1],extras:[0,3]});
  return K.svg();
}

/* Diagrama de Taquimetría — v2 (estándar de plantillas de Mario): corte lateral esquemático (no a escala) con el instrumento en A, la mira a la
   derecha y las lecturas de hilo superior Hs, medio Hm e inferior Hi. La distancia horizontal Dh (accent: resultado principal) va sobre la
   horizontal del instrumento, la distancia vertical Dv (success) sobre la mira y el ángulo vertical α (blueprint) entre la horizontal y la
   visual al hilo medio. En el dibujo solo el carácter; los valores van en el listado (Dh, Dv, α, Hs, Hm, Hi y desnivel). */
function svgTaquimetria(hs,hm,hi_lect,anguloDeg,r){
  const K=svgKit(), rows=[];
  if(r){ rows.push({k:'Dh',c:'var(--accent)',v:`${fmtNum(r.Dh,3)} m`}); rows.push({k:'Dv',c:'var(--success)',v:`${fmtNum(r.Dv,3)} m`}); }
  rows.push({k:'α',c:'var(--blueprint)',v:fmtAngle(anguloDeg)});
  rows.push({k:'Hs',c:'var(--danger)',v:`${fmtNum(hs,3)} m`}); rows.push({k:'Hm',c:'var(--ink)',v:`${fmtNum(hm,3)} m`}); rows.push({k:'Hi',c:'var(--ink-soft)',v:`${fmtNum(hi_lect,3)} m`});
  if(r) rows.push({k:'Desnivel',c:'var(--ink)',v:`${fmtNum(r.desnivel,3)} m`});
  K.list([rows],{perCol:4});
  const A=[52,0], rodX=244, dx=rodX-A[0], top=Math.max(K.listBottom+10,56), bot=176;
  let a=Math.max(-16,Math.min(anguloDeg,16)); if(Math.abs(a)<5) a=a<0?-5:5;
  const dy=Math.min(55,dx*Math.tan(toRad(Math.abs(a))))*Math.sign(a);   // dy>0 = la mira queda más arriba
  const span=Math.max(hs-hi_lect,1e-6), fS=Math.min(Math.max((hs-hm)/span,0.12),0.88), L=Math.min(40,(bot-top)-Math.abs(dy)-16);
  const up=fS*L, dn=(1-fS)*L;
  // yM: posición del hilo medio; se centra el conjunto y se acota para que la mira completa quede dentro del marco
  const lo=Math.max(top+up+6, top+Math.max(0,-dy)+4), hi=Math.min(bot-dn-6, bot-Math.max(0,dy)-4);
  const yM=Math.min(Math.max((top+bot)/2-dy/2,lo),Math.max(lo,hi)); A[1]=yM+dy;
  const yS=yM-up, yI=yM+dn;
  const rt=Math.max(top-2,yS-8), rb=Math.min(bot,yI+8);
  // terreno bajo la mira y la mira
  K.line(rodX-26,rb,rodX+26,rb,'#8B6B47',{sw:1.2,noObs:false});
  K.line(rodX,rt,rodX,rb,'var(--ink)',{sw:1.8});
  // horizontal del instrumento (Dh) y vertical sobre la mira (Dv)
  K.line(...A,rodX,A[1],'var(--accent)',{sw:1,dash:'2.4 2'});
  K.line(rodX-9,A[1],rodX-9,yM,'var(--success)',{sw:1});
  // visuales
  K.line(...A,rodX,yS,'var(--danger)',{sw:0.7,dash:'1.6 1.6'}); K.line(...A,rodX,yI,'var(--ink-soft)',{sw:0.7,dash:'1.6 1.6'});
  K.line(...A,rodX,yM,'var(--ink)',{sw:1.1});
  [[yS,'var(--danger)'],[yM,'var(--ink)'],[yI,'var(--ink-soft)']].forEach(([y,c])=>K.line(rodX-5,y,rodX+5,y,c,{sw:1.4,noObs:false}));
  // ángulo α
  const ra=26; K.arc(A[0],A[1],ra,0,-a,'var(--blueprint)',{sw:0.9});
  K.dot(...A,'var(--ink-soft)',2);
  // letras
  K.pointLabel('Hs',rodX+5,yS,4.5,'var(--danger)',{dir:[1,0],rmin:3,rmax:10,omit:false});
  K.pointLabel('Hm',rodX+5,yM,4.5,'var(--ink)',{dir:[1,0],rmin:3,rmax:10,omit:false});
  K.pointLabel('Hi',rodX+5,yI,4.5,'var(--ink-soft)',{dir:[1,0],rmin:3,rmax:10,omit:false});
  K.pointLabel('A',A[0],A[1],4.5,'var(--ink-soft)',{dir:[-1,0.5],omit:false});
  const am=-a/2*Math.PI/180; K.pointLabel('α',A[0]+ra*Math.cos(am),A[1]+ra*Math.sin(am),4.5,'var(--blueprint)',{dir:[Math.cos(am),Math.sin(am)],rmin:2,rmax:9});
  K.lineLabel(...A,rodX,A[1],'Dh',4.5,'var(--accent)',{at:0.55,out:[0,a>0?1:-1],extras:[0,3,6]});
  if(Math.abs(A[1]-yM)>8) K.lineLabel(rodX-9,A[1],rodX-9,yM,'Dv',4.5,'var(--success)',{out:[-1,0],extras:[0,3]});
  return K.svg();
}

/* Diagrama de sector circular — v2 (estándar de plantillas de Mario): sector a escala con el vértice O abajo y A–B arriba; el área (accent: es
   el resultado principal) como relleno, la longitud de arco (success) sobre el arco, los radios (blueprint) y el ángulo central Δ (ink) en O.
   Valores en el listado (R, Δ, Arco, Área) y en el dibujo solo el carácter; rótulo sin lugar libre → se omite del dibujo. */
function svgSectorCircular(deltaDeg, Rval){
  const K=svgKit(), d=Math.min(Math.max(deltaDeg,2),359.9), rad=a=>a*Math.PI/180;
  const R=Rval!==undefined?Rval:1, rows=[];
  if(Rval!==undefined) rows.push({k:'R',c:'var(--blueprint)',v:`${fmtNum(R,2)} m`});
  rows.push({k:'Δ',c:'var(--ink)',v:fmtAngle(d)});
  if(Rval!==undefined){ rows.push({k:'Arco',c:'var(--success)',v:`${fmtNum(R*rad(d),3)} m`}); rows.push({k:'Área',c:'var(--accent)',v:`${fmtNum(R*R*rad(d)/2,3)} m²`}); }
  K.list([rows]);
  const wp=[[0,0]], n=Math.max(12,Math.ceil(d/3)); for(let i=0;i<=n;i++){ const a=rad(90+d/2-d*i/n); wp.push([Math.cos(a),Math.sin(a)]); }
  const fit=K.fit(wp,{l:70,r:290,t:Math.max(K.listBottom+10,26),b:166});
  const O=[fit.X(0),fit.Y(0)], Rs=fit.sc, P=a=>[O[0]+Rs*Math.cos(rad(a)),O[1]-Rs*Math.sin(rad(a))];
  const A=P(90+d/2), B=P(90-d/2);
  K.poly(wp.map(q=>[fit.X(q[0]),fit.Y(q[1])]),{close:true,fill:'var(--accent)',fo:0.16,obs:false});
  K.line(...O,...A,'var(--blueprint)',{sw:1}); K.line(...O,...B,'var(--blueprint)',{sw:1});
  K.arc(O[0],O[1],Rs,-(90+d/2),-(90-d/2),'var(--success)',{sw:1.6});
  const rd=Math.min(Rs*0.22,14); K.arc(O[0],O[1],rd,-(90+d/2),-(90-d/2),'var(--ink)',{sw:0.8});
  [O,A,B].forEach(q=>K.dot(q[0],q[1],'var(--ink-soft)',2));
  K.pointLabel('O',O[0],O[1],4.5,'var(--ink-soft)',{dir:[0,1],full:d>180,omit:false});
  K.pointLabel('A',A[0],A[1],4.5,'var(--ink-soft)',{dir:[Math.cos(rad(90+d/2)),-Math.sin(rad(90+d/2))],omit:false});
  K.pointLabel('B',B[0],B[1],4.5,'var(--ink-soft)',{dir:[Math.cos(rad(90-d/2)),-Math.sin(rad(90-d/2))],omit:false});
  K.lineLabel(...O,...A,'R',4.5,'var(--blueprint)',{out:[-1,0],extras:[0,3,6]});
  K.lineLabel(...O,...B,'R',4.5,'var(--blueprint)',{out:[1,0],extras:[0,3,6]});
  K.pointLabel('Arco',O[0],O[1]-Rs,4.5,'var(--success)',{dir:[0,-1],rmin:3,rmax:10});
  K.pointLabel('Δ',O[0],O[1]-rd,4.5,'var(--ink)',{dir:[0,-1],rmin:2,rmax:9});
  const al=rad(d/2), cd=d>=359?0:(2/3)*Rs*Math.sin(al)/al;
  K.near('Área',O[0],O[1]-Math.max(cd,rd+8),4.5,'var(--accent)',{rmax:16});
  return K.svg();
}

/* Diagrama de dos rectas que se intersectan */
/* Diagrama de Intersección de Rectas — v2.
   Basado en la plantilla de Illustrator de Mario (plantilla_interseccion_rectas.svg): lienzo 320×190, recta 1 teal y recta 2
   verde (tramo estación→I sólido y prolongaciones punteadas tenues), I en cobre (resultado principal), Es1/Es2 neutros,
   arco del ángulo agudo en I (ink), D y Az de cada recta a lados opuestos de su línea, flecha norte y listado con el valor a
   continuación de su descriptor (E, N, Ángulo, D1, D2 a la izquierda; Az1, Az2 a la derecha). */
function svgInterseccion(e1,n1,az1,e2,n2,az2,eI,nI){
  const W=320, H=190, EXT=14;
  const f = v => v.toFixed(2).replace(/\.?0+$/,'');
  const FONT = 'font-family="var(--font-body)" font-weight="700"';
  const eng = svgLblEngine(W,H);
  const CB1='var(--blueprint)', CB2='var(--success)', CI='var(--accent)', CK='var(--ink)', CS='var(--ink-soft)';
  const s1=Math.sin(toRad(az1)), c1=Math.cos(toRad(az1)), s2=Math.sin(toRad(az2)), c2=Math.cos(toRad(az2));
  const t1=(eI-e1)*s1+(nI-n1)*c1, t2=(eI-e2)*s2+(nI-n2)*c2;                 // distancias con signo estación → I
  let ang=Math.abs(normDeg(az2-az1)); if(ang>180) ang=360-ang; if(ang>90) ang=180-ang;
  const aTxt = v => fmtAngle(v);

  // ---- listado ----
  const rows1=[{k:'E',c:CI,v:fmtNum(eI,3)},{k:'N',c:CI,v:fmtNum(nI,3)},{k:'Ángulo',c:CK,v:aTxt(ang)},{k:'D1',c:CB1,v:`${fmtNum(t1,3)} m`},{k:'D2',c:CB2,v:`${fmtNum(t2,3)} m`}];
  const rows2=[{k:'Az1',c:CB1,v:aTxt(az1)},{k:'Az2',c:CB2,v:aTxt(az2)}];
  const ROW_Y0=12.521, ROW_DY=5.761, FS_L=4.32;
  const w1=Math.max(...rows1.map(q=>eng.tw(`${q.k} = ${q.v}`,FS_L)));
  const OX2=Math.max(80, 10.026+5.2+w1+9);
  const items=[]; rows1.forEach((q,i)=>items.push({q,x:10.026,y:ROW_Y0+i*ROW_DY})); rows2.forEach((q,i)=>items.push({q,x:OX2,y:ROW_Y0+i*ROW_DY}));
  let listRight=0, listBottom=0;
  items.forEach(it=>{ listRight=Math.max(listRight,it.x+5.2+eng.tw(`${it.q.k} = ${it.q.v}`,FS_L)+1); listBottom=Math.max(listBottom,it.y+1); });
  eng.rectFill(8.5,6.5,listRight,listBottom+0.5);
  eng.rectFill(292,3,308,38);

  // ---- geometría a escala (estaciones e I; las prolongaciones tienen largo fijo en pantalla) ----
  const left=78, right=262, top=Math.max(62,listBottom+20), bot=150;
  const Es=[e1,e2,eI], Ns=[n1,n2,nI];
  const minE=Math.min(...Es), maxE=Math.max(...Es), minN=Math.min(...Ns), maxN=Math.max(...Ns);
  const spanE=maxE-minE, spanN=maxN-minN;
  let sc=Math.min((right-left)/Math.max(spanE,1e-9),(bot-top)/Math.max(spanN,1e-9));
  if(!isFinite(sc) || spanE+spanN<1e-9) sc=1;
  const ox=(left+right)/2-(spanE*sc)/2, oy=(top+bot)/2+(spanN*sc)/2;
  const X=e=>ox+(e-minE)*sc, Y=n=>oy-(n-minN)*sc;
  const P1={x:X(e1),y:Y(n1)}, P2={x:X(e2),y:Y(n2)}, I={x:X(eI),y:Y(nI)};
  const d1=[s1,-c1], d2=[s2,-c2];
  const sg1=t1>=0?1:-1, sg2=t2>=0?1:-1;

  let out='';
  const rect=(P,d,sg,col)=>{
    const a={x:P.x-d[0]*sg*EXT, y:P.y-d[1]*sg*EXT}, b={x:I.x+d[0]*sg*EXT, y:I.y+d[1]*sg*EXT};
    out += `<path d="M${f(a.x)} ${f(a.y)} L${f(P.x)} ${f(P.y)}" fill="none" stroke="${col}" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 1.6" opacity="0.45"/>\n`;
    out += `<path d="M${f(P.x)} ${f(P.y)} L${f(I.x)} ${f(I.y)}" fill="none" stroke="${col}" stroke-width="0.8" stroke-linecap="round"/>\n`;
    out += `<path d="M${f(I.x)} ${f(I.y)} L${f(b.x)} ${f(b.y)}" fill="none" stroke="${col}" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 1.6" opacity="0.45"/>\n`;
    eng.seg(a.x,a.y,b.x,b.y,1);
  };
  rect(P1,d1,sg1,CB1); rect(P2,d2,sg2,CB2);

  // arco del ángulo agudo en I
  const r1=sg1>0?[-d1[0],-d1[1]]:[d1[0],d1[1]];
  let r2=sg2>0?[-d2[0],-d2[1]]:[d2[0],d2[1]];
  if(r1[0]*r2[0]+r1[1]*r2[1]<0) r2=[-r2[0],-r2[1]];
  const L1=Math.hypot(P1.x-I.x,P1.y-I.y), L2=Math.hypot(P2.x-I.x,P2.y-I.y);
  const R=Math.min(9, 0.45*Math.max(0.01,Math.min(L1>0.5?L1:99, L2>0.5?L2:99)));
  const a1=Math.atan2(r1[1],r1[0]), a2=Math.atan2(r2[1],r2[0]), da=(a2-a1+Math.PI)%(2*Math.PI)-Math.PI, sw=da>0?1:0;
  out += `<path d="M${f(I.x+R*Math.cos(a1))} ${f(I.y+R*Math.sin(a1))} A${f(R)} ${f(R)} 0 0 ${sw} ${f(I.x+R*Math.cos(a2))} ${f(I.y+R*Math.sin(a2))}" fill="none" stroke="var(--ink)" stroke-width="0.8" stroke-linecap="round"/>\n`;
  for(let t=0;t<=1.0001;t+=0.1){ const an=a1+da*t; eng.pts.push([I.x+R*Math.cos(an),I.y+R*Math.sin(an)]); }
  out += `<circle cx="${f(P1.x)}" cy="${f(P1.y)}" r="2" fill="var(--ink-soft)"/>\n<circle cx="${f(P2.x)}" cy="${f(P2.y)}" r="2" fill="var(--ink-soft)"/>\n`;
  out += `<circle cx="${f(I.x)}" cy="${f(I.y)}" r="2.7" fill="var(--accent)"/>\n`;
  eng.circle(P1.x,P1.y,2.3); eng.circle(P2.x,P2.y,2.3); eng.circle(I.x,I.y,3);
  out += `<path d="M300 36 L300 14" fill="none" stroke="var(--ink-soft)" stroke-width="0.7" stroke-linecap="round"/>\n`;
  out += `<path d="M300 10 L298.2 14.5 L301.8 14.5 Z" fill="var(--ink-soft)"/>\n`;
  out += `<text x="300" y="7.5" ${FONT} font-size="4.5" fill="var(--ink-soft)" text-anchor="middle">N</text>\n`;

  const lab=(t,fs,col,cd)=>{ const q=eng.txtAttrs(cd); out += `<text ${q.pos} ${FONT} font-size="${fs}" fill="${col}"${q.an}>${t}</text>\n`; };
  const around=(pt,t,fs,col,pref,r0,rmax)=>{       // rótulo alrededor de un punto, con dirección preferida
    const cands=[];
    for(let r=r0;r<=rmax;r+=1.2) for(let an=0;an<360;an+=15){
      const dx=Math.cos(an*Math.PI/180), dy=Math.sin(an*Math.PI/180);
      const dp=Math.acos(Math.max(-1,Math.min(1,dx*pref[0]+dy*pref[1])))*180/Math.PI;
      cands.push({x:pt.x+dx*r, y:pt.y+dy*r+0.36*fs, anchor:'middle', pen:(r-r0)*1.2+dp*0.08});
    }
    lab(t,fs,col,eng.pick(t,fs,cands));
  };
  around(P1,'Es1',4.5,CS,[-0.3,1],5.2,12); around(P2,'Es2',4.5,CS,[0.3,1],5.2,12);
  around(I,'I',4.5,CI,[0,-1],4.8,12);

  // D y Az de cada recta: a lados opuestos de la línea, hacia el centro del tramo
  const sideLabels=(P,d,sg,other,tD,tA,col)=>{
    const L=Math.hypot(I.x-P.x,I.y-P.y), dx=(I.x-P.x), dy=(I.y-P.y);
    let ux=L>1e-6?dx/L:d[0]*sg, uy=L>1e-6?dy/L:d[1]*sg;
    let angR=Math.atan2(uy,ux)*180/Math.PI; if(angR>90) angR-=180; if(angR<-90) angR+=180;
    const th=angR*Math.PI/180, g=[Math.sin(th),-Math.cos(th)], uu=[Math.cos(th),Math.sin(th)];
    let nx=-uy, ny=ux; if(nx*(other.x-P.x)+ny*(other.y-P.y)>0){ nx=-nx; ny=-ny; }       // normal: lado alejado de la otra estación
    const mx=P.x+ux*L/2, my=P.y+uy*L/2;
    [[tD,1],[tA,-1]].forEach(([t,sd])=>{
      const smax=Math.max(0,L/2-eng.tw(t,4)/2-3)+8, cands=[];
      for(let s=0;s<=smax+1e-6;s+=2.5) for(const sgn of [1,-1]){ if(s===0&&sgn===-1) continue;
        [[sd,0],[sd,3.6],[sd,7.2],[-sd,0],[-sd,3.6]].forEach(([sdd,ex])=>{
          const m=[nx*sdd,ny*sdd], dd=((g[0]*m[0]+g[1]*m[1])>0?1.9:4.8)+ex;
          cands.push({x:mx+uu[0]*s*sgn+m[0]*dd, y:my+uu[1]*s*sgn+m[1]*dd, rot:angR, anchor:'middle', pen:s*0.4+(sdd!==sd?10:0)+ex*1.2});
        });
      }
      if(Math.min(...cands.map(q=>eng.count(eng.box(t,4,q),0.5)))>0) return;        // sin sitio libre: queda solo en el listado
      lab(t,4,col,eng.pick(t,4,cands));
    });
  };
  sideLabels(P1,d1,sg1,P2,`D1 = ${fmtNum(t1,3)} m`,`Az1 = ${aTxt(az1)}`,CB1);
  sideLabels(P2,d2,sg2,P1,`D2 = ${fmtNum(t2,3)} m`,`Az2 = ${aTxt(az2)}`,CB2);

  // ángulo entre rectas: junto al arco, hacia la bisectriz del ángulo agudo o por fuera
  {
    const t=`Áng = ${aTxt(ang)}`, tw=eng.tw(t,4), bis=[r1[0]+r2[0],r1[1]+r2[1]], bl=Math.hypot(bis[0],bis[1])||1, cands=[];
    const b0=[bis[0]/bl,bis[1]/bl];
    for(let r=R+tw/2+2; r<=R+tw/2+36; r+=2) for(let an=0;an<360;an+=15){
      const dx=Math.cos(an*Math.PI/180), dy=Math.sin(an*Math.PI/180), dp=Math.acos(Math.max(-1,Math.min(1,dx*b0[0]+dy*b0[1])))*180/Math.PI;
      cands.push({x:I.x+dx*r, y:I.y+dy*r+1.4, anchor:'middle', pen:(r-R-tw/2-2)*0.25+dp*0.1});
    }
    lab(t,4,CK,eng.pick(t,4,cands));
  }

  items.forEach(it=>{
    out += `<rect x="${f(it.x)}" y="${f(it.y-3.457)}" width="3.457" height="3.457" fill="${it.q.c}"/>\n`;
    out += `<text x="${f(it.x+5.185)}" y="${f(it.y)}" ${FONT} font-size="${FS_L}"><tspan fill="${it.q.c}">${it.q.k}</tspan><tspan fill="var(--ink)"> = ${it.q.v}</tspan></text>\n`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n${out}</svg>`;
}

/* Diagrama de Volumen de Tierra — v2 (estándar de plantillas de Mario): elevación esquemática de dos secciones extremas (A1 blueprint, A2 success)
   separadas por la distancia D (ink), con la sección media Am (danger) si se entrega; la altura de cada barra es proporcional a su área.
   El volumen V entre las secciones (accent: resultado principal) va como relleno. En el dibujo solo el carácter; los valores van en el listado
   (V, V prismoidal si hay Am, A1, A2, Am y D). */
function svgVolumen(A1,A2,Am,ext){
  ext=ext||{}; const K=svgKit(), hasM=Am!==undefined&&!isNaN(Am), col={A1:'var(--blueprint)',A2:'var(--success)',Am:'var(--danger)',D:'var(--ink)',V:'var(--accent)'};
  const rows=[]; if(ext.V!==undefined) rows.push({k:'V',c:col.V,v:`${fmtNum(ext.V,2)} m³`}); if(ext.Vp!==undefined&&ext.Vp!==null) rows.push({k:'V prism.',c:col.V,v:`${fmtNum(ext.Vp,2)} m³`});
  rows.push({k:'A1',c:col.A1,v:`${fmtNum(A1,2)} m²`}); rows.push({k:'A2',c:col.A2,v:`${fmtNum(A2,2)} m²`}); if(hasM) rows.push({k:'Am',c:col.Am,v:`${fmtNum(Am,2)} m²`});
  if(ext.D!==undefined) rows.push({k:'D',c:col.D,v:`${fmtNum(ext.D,2)} m`});
  K.list([rows],{perCol:3});
  const top=Math.max(K.listBottom+16,50), base=152, maxA=Math.max(A1,A2,hasM?Am:0,1e-9), hmax=base-top, bw=26;
  const hf=A=>Math.max(3,A/maxA*hmax), x1=66, x2=254, xm=160, h1=hf(A1), h2=hf(A2), hm=hasM?hf(Am):0;
  // volumen entre las secciones
  K.poly([[x1+bw/2,base],[x1+bw/2,base-h1],[x2-bw/2,base-h2],[x2-bw/2,base]],{close:true,fill:col.V,fo:0.22,stroke:col.V,sw:0.8,dash:'2.4 2',obs:false});
  K.line(x1-bw/2-8,base,x2+bw/2+8,base,'var(--ink-soft)',{sw:0.7});
  const bar=(x,h,c)=>K.poly([[x-bw/2,base],[x-bw/2,base-h],[x+bw/2,base-h],[x+bw/2,base]],{close:true,fill:c,fo:0.18,stroke:c,sw:1.3});
  bar(x1,h1,col.A1); bar(x2,h2,col.A2); if(hasM) bar(xm,hm,col.Am);
  // cota D entre ejes de las secciones extremas
  const yd=base+13; K.line(x1,yd,x2,yd,col.D,{sw:0.9}); [x1,x2].forEach(x=>K.line(x,yd-2.5,x,yd+2.5,col.D,{sw:0.9,noObs:false}));
  K.lineLabel(x1,yd,x2,yd,'D',4.5,col.D,{out:[0,1],extras:[0,3]});
  K.pointLabel('A1',x1,base-h1,4.5,col.A1,{dir:[0,-1],omit:false,rmin:4,rmax:10});
  K.pointLabel('A2',x2,base-h2,4.5,col.A2,{dir:[0,-1],omit:false,rmin:4,rmax:10});
  if(hasM) K.pointLabel('Am',xm,base-hm,4.5,col.Am,{dir:[0,-1],omit:false,rmin:4,rmax:10});
  K.near('V',(x1+x2)/2+(hasM?36:0),base-Math.min(h1,h2)*0.45,4.5,col.V,{rmax:30});
  return K.svg();
}

/* Diagrama de peralte (seccion transversal de via) */
/* Diagrama de sección de peralte — v2 (estándar de plantillas de Mario): calzada en sección (ancho eje→borde, blueprint) girada en torno
   al eje respecto de la horizontal de referencia; el peralte e (accent: la magnitud que gobierna el panel) se marca como ángulo en el eje y
   las cotas de los bordes respecto al eje se acotan en vertical (exterior en success, interior en danger). Valores en el listado y en el
   dibujo solo el carácter. La inclinación dibujada se exagera (4× e, entre 3° y 60°; con e = 0 la calzada queda horizontal) para que sea visible: sección esquemática. */
function svgPeralteSeccion(ePct, anchoPista, cotaExt, cotaInt){
  const K=svgKit(), sg=v=>`${v>=0?'+':''}${fmtNum(v===0?0:v,3)} m`;
  K.list([[{k:'e',c:'var(--accent)',v:`${fmtNum(ePct,2)} %`},{k:'Ancho',c:'var(--blueprint)',v:`${fmtNum(anchoPista,2)} m`},{k:'Ext',c:'var(--success)',v:sg(cotaExt)},{k:'Int',c:'var(--danger)',v:sg(cotaInt)}]]);
  const dir=ePct>=0?1:-1, ang=(ePct===0?0:Math.min(Math.max(Math.abs(ePct)*4,3),60))*Math.PI/180, halfW=106;
  const yEje=Math.max(K.listBottom+44,108), xEje=160;
  const rise=Math.min(halfW*Math.tan(ang), Math.min(yEje-K.listBottom-8,176-yEje-14));
  const EXT=[xEje+halfW,yEje-dir*rise], INT=[xEje-halfW,yEje+dir*rise], EJE=[xEje,yEje];
  K.line(xEje-halfW-10,yEje,xEje+halfW+10,yEje,'var(--ink-soft)',{dash:'1.6 1.6',sw:0.6});
  K.line(...INT,...EJE,'var(--blueprint)',{sw:1.6}); K.line(...EJE,...EXT,'var(--blueprint)',{sw:1.6});
  K.line(EXT[0],yEje,...EXT,'var(--success)',{sw:0.8}); K.line(INT[0],yEje,...INT,'var(--danger)',{sw:0.8});
  const ra=Math.min(34,halfW*0.35), a0=0, a1=-dir*ang*180/Math.PI;
  K.arc(xEje,yEje,ra,a0,a1,'var(--accent)',{sw:1});
  [EJE,EXT,INT].forEach(q=>K.dot(q[0],q[1],'var(--ink-soft)',2));
  K.pointLabel('Eje',EJE[0],EJE[1],4.5,'var(--ink-soft)',{dir:[0,dir>0?1:-1],omit:false});
  K.pointLabel('Ext',EXT[0],EXT[1],4.5,'var(--success)',{dir:[0.4,-dir],omit:false});
  K.pointLabel('Int',INT[0],INT[1],4.5,'var(--danger)',{dir:[-0.4,dir],omit:false});
  K.lineLabel(...EJE,...EXT,'Ancho',4.5,'var(--blueprint)',{out:[0,-dir],extras:[0,3,6]});
  K.lineLabel(...INT,...EJE,'Ancho',4.5,'var(--blueprint)',{out:[0,dir],extras:[0,3,6]});
  const am=a1/2*Math.PI/180; if(ePct!==0) K.pointLabel('e',xEje+ra*Math.cos(am),yEje+ra*Math.sin(am),4.5,'var(--accent)',{dir:[Math.cos(am),Math.sin(am)],rmin:2,rmax:9});
  K.txt('(inclinación exagerada, sección esquemática)',3,'var(--ink-soft)',{x:160,y:184,anchor:'middle'});
  return K.svg();
}

/* Diagrama de orientación astronómica: rosa con rayo al sol y a la línea de referencia */
function svgAstronomica(azSolDeg, rDeg, chDeg){
  const w=240,h=240,pad=30;
  const R=Math.min(w,h)/2-pad;
  const cx=w/2, cy=h/2;
  const ray = (azDeg,len)=>({x:cx+len*Math.sin(toRad(azDeg)), y:cy-len*Math.cos(toRad(azDeg))});
  const pSol=ray(azSolDeg,R), pRef=ray(rDeg,R*0.8);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-width="1"/>
    <text x="${cx}" y="${cy-R-8}" font-size="10" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">N</text>
    <line x1="${cx}" y1="${cy}" x2="${pSol.x.toFixed(1)}" y2="${pSol.y.toFixed(1)}" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${pSol.x.toFixed(1)}" cy="${pSol.y.toFixed(1)}" r="6" fill="var(--accent)"/>
    <line x1="${cx}" y1="${cy}" x2="${pRef.x.toFixed(1)}" y2="${pRef.y.toFixed(1)}" stroke="var(--blueprint)" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="2.6" fill="var(--ink)"/>
    <text x="${pSol.x.toFixed(1)}" y="${(pSol.y-10).toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--accent-text)" text-anchor="middle">Sol (Az=${fmtNum(azSolDeg,2)}°)</text>
    <text x="${pRef.x.toFixed(1)}" y="${(pRef.y-8).toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--blueprint)" text-anchor="middle">Ref. (Az=${fmtNum(rDeg,2)}°)</text>
  </svg>`;
}

/* Diagrama de triángulo rectángulo (Pitágoras), a escala real — v2.
   Basado en la plantilla de Illustrator de Mario (plantilla_pitagoras.svg): mesa 320×190, trazos, colores y
   rótulos de esa plantilla (caso 3-4-5 = caja de 160×120). El triángulo conserva la proporción real de A:B
   (si es extrema, se limita a un mínimo visible). Los valores van en el listado y en cada lado del dibujo.
   A = blueprint, B = success, C (hipotenusa) = accent. */
function svgPitagoras(a,b,c){
  const W=320, H=190;
  const f = v => v.toFixed(2).replace(/\.?0+$/,'');
  const FONT = 'font-family="var(--font-body)" font-weight="700"';
  const eng = svgLblEngine(W,H);

  // ---- triángulo a escala dentro de la caja de la plantilla (160 × 120), centrado en x, base en y=170 ----
  const sc = Math.min(160/b, 120/a);
  const bx = Math.max(sc*b, 8), ay = Math.max(sc*a, 8);
  const x0 = 160 - bx/2, y0 = 170, x1 = x0+bx, y2 = y0-ay;
  const th = Math.atan2(ay,bx), thD = th*180/Math.PI;          // inclinación de la hipotenusa (A arriba → B abajo)
  const rs = Math.min(4, 0.4*Math.min(bx,ay));

  const rows = [
    {k:'A', c:'var(--blueprint)', v:`${fmtNum(a,3)} m`},
    {k:'B', c:'var(--success)',   v:`${fmtNum(b,3)} m`},
    {k:'C', c:'var(--accent)',    v:`${fmtNum(c,3)} m`}
  ];
  const tx = {}; rows.forEach(r=> tx[r.k] = `${r.k} = ${r.v}`);
  const listW = Math.max(...rows.map(r=>eng.tw(tx[r.k],4.32)));
  eng.rectFill(8.5, 6.5, 15.2+listW+1.5, 25.5);

  let out = '';
  out += `<path d="M${f(x0)} ${y0} L${f(x1)} ${y0}" fill="none" stroke="var(--success)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>\n`;
  out += `<path d="M${f(x0)} ${y0} L${f(x0)} ${f(y2)}" fill="none" stroke="var(--blueprint)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>\n`;
  out += `<path d="M${f(x1)} ${y0} L${f(x0)} ${f(y2)}" fill="none" stroke="var(--accent)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>\n`;
  out += `<path d="M${f(x0+rs)} ${y0} L${f(x0+rs)} ${f(y0-rs)} L${f(x0)} ${f(y0-rs)}" fill="none" stroke="var(--ink-soft)" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>\n`;
  eng.seg(x0,y0,x1,y0); eng.seg(x0,y0,x0,y2); eng.seg(x1,y0,x0,y2); eng.seg(x0+rs,y0,x0+rs,y0-rs); eng.seg(x0+rs,y0-rs,x0,y0-rs);

  const lab = (t, fs, col, c) => { const q=eng.txtAttrs(c); out += `<text ${q.pos} ${FONT} font-size="${fs}" fill="${col}"${q.an}>${t}</text>\n`; };

  // C: a lo largo de la hipotenusa, por fuera (arriba a la derecha); si no cabe, se desliza o pasa al interior
  {
    const Lc = Math.hypot(bx,ay), mx=(x0+x1)/2, my=(y0+y2)/2, g=[Math.sin(th), -Math.cos(th)], u=[Math.cos(th), Math.sin(th)];
    const tmax = Math.max(0, Lc/2 - eng.tw(tx.C,4)/2 - 4), cands=[];
    for(let t=0;t<=tmax+1e-6;t+=3) for(const sg of [1,-1]){ if(t===0&&sg===-1) continue;
      [[1,1.9],[-1,4.8]].forEach(([ns,d],si)=> cands.push({x:mx+u[0]*t*sg+g[0]*ns*d, y:my+u[1]*t*sg+g[1]*ns*d, rot:thD, anchor:'middle', pen:t*0.4+si*6}));
    }
    lab(tx.C,4,'var(--accent)',eng.pick(tx.C,4,cands));
  }
  // B: bajo la base
  {
    const cands=[];
    for(let t=0;t<=90;t+=2) for(const sg of [1,-1]){ if(t===0&&sg===-1) continue;
      [4.5,9].forEach((dy,si)=> cands.push({x:160+t*sg, y:y0+dy, anchor:'middle', pen:t*0.3+si*6}));
    }
    lab(tx.B,4,'var(--success)',eng.pick(tx.B,4,cands));
  }
  // A: a la izquierda de la vertical (si no cabe, por el interior)
  {
    const cands=[], mid=(y0+y2)/2;
    for(let d=0; d<=70; d+=2) for(const sg of [1,-1]){ if(d===0&&sg===-1) continue;
      [[x0-1.9,0],[x0+4.8,6],[x0-8,8]].forEach(([xx,pp])=> cands.push({x:xx, y:mid+d*sg, rot:-90, anchor:'middle', pen:d*0.3+pp}));
    }
    lab(tx.A,4,'var(--blueprint)',eng.pick(tx.A,4,cands));
  }

  // listado (valor a continuación de su descriptor)
  rows.forEach((r,i)=>{
    const by = 12.521 + i*5.761;
    out += `<rect x="10.026" y="${f(by-3.457)}" width="3.457" height="3.457" fill="${r.c}"/>\n`;
    out += `<text x="15.211" y="${f(by)}" ${FONT} font-size="4.32"><tspan fill="${r.c}">${r.k}</tspan><tspan fill="var(--ink)"> = ${r.v}</tspan></text>\n`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n${out}</svg>`;
}

/* Barra proporcional líquido/retención de una boleta de honorarios */
function svgBoletaBarra(liquido, retencion){
  const total=liquido+retencion;
  const w=300,h=64,pad=10;
  const barW=w-2*pad;
  const liqW=barW*(liquido/total);
  const retW=barW-liqW;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect x="${pad}" y="14" width="${liqW.toFixed(1)}" height="22" fill="var(--blueprint)" rx="2"/>
    <rect x="${(pad+liqW).toFixed(1)}" y="14" width="${retW.toFixed(1)}" height="22" fill="var(--accent)" rx="2"/>
    <text x="${pad}" y="50" font-size="9" font-family="var(--font-mono)" fill="var(--blueprint)">■ Líquido ${fmtNum(liquido/total*100,1)}%</text>
    <text x="${(pad+barW).toFixed(1)}" y="50" font-size="9" font-family="var(--font-mono)" fill="var(--accent-text)" text-anchor="end">Retención ${fmtNum(retencion/total*100,1)}% ■</text>
  </svg>`;
}

/* Diagrama de replanteo por ordenadas desde la tangente — v2 (estándar de plantillas de Mario): tangente desde el PC (x, blueprint), curva
   (accent: la longitud de curva Lc es la magnitud estrella del panel) y ordenadas perpendiculares (y, success) en cada punto; valores de
   Lc, x y y del PT en el listado, y la ordenada de cada punto sobre su trazo cuando son ≤ 8 puntos (la tabla del panel los trae todos).
   Esquema: la escala vertical se exagera hasta 4× la horizontal para que la curva se distinga de la tangente. */
function svgReplanteoOrdenadas(R, deltaDeg, rows, xMax, yMax){
  const K=svgKit(), n=rows.length, many=n>8;
  K.list([[{k:'Lc',c:'var(--accent)',v:`${fmtNum(R*toRad(deltaDeg),3)} m`},{k:'x PT',c:'var(--blueprint)',v:`${fmtNum(xMax,3)} m`},{k:'y PT',c:'var(--success)',v:`${fmtNum(yMax,3)} m`}]]);
  const l=26, r=292, t=K.listBottom+12, b=150;
  const dr=toRad(Math.min(deltaDeg,179.9)), xExt=dr>Math.PI/2?R:xMax, yExt=Math.max(yMax,1e-3);
  const sx=(r-l)/Math.max(xExt,1e-3), sy=Math.min((b-t)/yExt, sx*4);
  const X=x=>l+x*sx, Y=y=>b-y*sy;
  const cp=[]; for(let i=0;i<=60;i++){ const a=dr*i/60; cp.push([X(R*Math.sin(a)),Y(R*(1-Math.cos(a)))]); }
  K.line(l,b,X(xExt),b,'var(--blueprint)');
  rows.forEach(q=>{ if(q.y>1e-9) K.line(X(q.x),b,X(q.x),Y(q.y),'var(--success)',{dash:q.esPT?null:'2 2',sw:0.7}); });
  K.poly(cp,{stroke:'var(--accent)',sw:1.4});
  const st=thinLabelStep(n,9);
  rows.forEach((q,i)=>{ if(!q.esPT) K.dot(X(q.x),Y(q.y),'var(--ink-soft)',1.8); });
  K.dot(l,b,'var(--ink-soft)',2); K.dot(X(xMax),Y(yMax),'var(--ink-soft)',2);
  K.pointLabel('PC',l,b,4.5,'var(--ink-soft)',{dir:[0,1],omit:false});
  K.pointLabel('PT',X(xMax),Y(yMax),4.5,'var(--ink-soft)',{dir:[1,-0.4],omit:false});
  rows.forEach((q,i)=>{ if(!q.esPT && i%st===0) K.pointLabel('P'+(i+1),X(q.x),Y(q.y),3,'var(--ink-soft)',{dir:[0,-1],rmin:3.2,rmax:9}); });
  K.lineLabel(l,b,X(xExt),b,'x',4.5,'var(--blueprint)',{out:[0,1],extras:[0,3,6]});
  K.lineLabel(X(xMax),b,X(xMax),Y(yMax),'y',4.5,'var(--success)',{out:[1,0],extras:[0,3,6]});
  const mid=cp[30]; K.pointLabel('Lc',mid[0],mid[1],4.5,'var(--accent)',{dir:[-0.35,-1],rmin:3,rmax:10});
  if(!many) rows.forEach(q=>{ if(!q.esPT && q.y*sy>14) K.lineLabel(X(q.x),b,X(q.x),Y(q.y),fmtNum(q.y,3),3,'var(--success)',{out:[1,0],extras:[0,3],margin:1}); });
  return K.svg();
}

/* Diagrama de replanteo por ordenadas desde la cuerda — v2 (estándar de plantillas de Mario): cuerda PC–PT como línea base (C, accent: es la
   magnitud estrella del panel), curva (blueprint) y ordenadas perpendiculares a la cuerda (success); la ordenada media M (danger) se marca
   en el centro. Valores de C y M en el listado, y la ordenada de cada punto sobre su trazo cuando son ≤ 8 puntos (la tabla trae todos).
   Esquema: la escala vertical se exagera hasta 4× la horizontal para que la curva se distinga de la cuerda. */
function svgReplanteoCuerda(R, deltaDeg, rows, Lchord, M){
  const K=svgKit(), n=rows.length, many=n>8;
  K.list([[{k:'C',c:'var(--accent)',v:`${fmtNum(Lchord,3)} m`},{k:'M',c:'var(--danger)',v:`${fmtNum(M,3)} m`}]]);
  const l=26, r=292, t=K.listBottom+12, b=150, half=Lchord/2, dd=R-M;
  const sx=(r-l)/Math.max(Lchord,1e-3), sy=Math.min((b-t)/Math.max(M,1e-3), sx*4);
  const X=x=>l+x*sx, Y=y=>b-y*sy;
  const cp=[], hd=toRad(Math.min(deltaDeg,179.9))/2; for(let i=0;i<=60;i++){ const a=-hd+2*hd*i/60; cp.push([X(half+R*Math.sin(a)),Y(Math.max(R*Math.cos(a)-dd,0))]); }
  K.line(l,b,X(Lchord),b,'var(--accent)');
  rows.forEach(q=>{ if(q.y>1e-9) K.line(X(q.x),b,X(q.x),Y(q.y),'var(--success)',{dash:(q.esPC||q.esPT)?null:'2 2',sw:0.7}); });
  K.poly(cp,{stroke:'var(--blueprint)',sw:1.4});
  K.line(X(half),b,X(half),Y(M),'var(--danger)',{sw:0.9});
  const st=thinLabelStep(n,9);
  rows.forEach(q=>{ if(!q.esPC&&!q.esPT) K.dot(X(q.x),Y(q.y),'var(--ink-soft)',1.8); });
  K.dot(X(half),Y(M),'var(--danger)',1.8);
  K.dot(l,b,'var(--ink-soft)',2); K.dot(X(Lchord),b,'var(--ink-soft)',2);
  K.pointLabel('PC',l,b,4.5,'var(--ink-soft)',{dir:[-0.6,1],omit:false});
  K.pointLabel('PT',X(Lchord),b,4.5,'var(--ink-soft)',{dir:[0.6,1],omit:false});
  rows.forEach((q,i)=>{ if(!q.esPC&&!q.esPT&&i%st===0) K.pointLabel('P'+i,X(q.x),Y(q.y),3,'var(--ink-soft)',{dir:[0,-1],rmin:3.2,rmax:9}); });
  K.lineLabel(l,b,X(Lchord),b,'C',4.5,'var(--accent)',{out:[0,1],extras:[0,3,6]});
  K.lineLabel(X(half),b,X(half),Y(M),'M',4.5,'var(--danger)',{out:[1,0],extras:[0,3,6]});
  if(!many) rows.forEach(q=>{ if(!q.esPC&&!q.esPT&&q.y*sy>14&&Math.abs(q.x-half)>1e-9) K.lineLabel(X(q.x),b,X(q.x),Y(q.y),fmtNum(q.y,3),3,'var(--success)',{out:[1,0],extras:[0,3],margin:1}); });
  return K.svg();
}

/* Diagrama de la clotoide (espiral de transicion) */
/* Diagrama de la clotoide — v2 (estándar de plantillas de Mario), compartido por "Curva de Transición (Clotoide)" y "Clotoide por Progresiva".
   Sin estaca: espiral TE→EC (accent: el parámetro A es la magnitud estrella), tangente al EC hasta el PI de la espiral (Tc, success), tangente
   larga sobre el eje (Tl, blueprint), cotas Xc (danger) e Yc (ink) y ángulo τ (ink-soft). Con estaca (lEstaca): espiral tenue, tramo recorrido l
   (accent), cuerda desde el TE (danger) y deflexión (ink); el punto de la estaca lleva su rótulo. Valores en el listado; en el dibujo solo el
   carácter. Escala uniforme en x, con la vertical exagerada hasta 3× cuando la espiral es muy plana (el ángulo dibujado se deforma igual). */
function svgClotoide(R, Ls, lEstaca, estLabel, fuente){
  const K=svgKit(), conEst=(lEstaca!==undefined&&lEstaca!==null&&!isNaN(lEstaca));
  const cl=calcClotoide(R,Ls), tau=cl.tauDeg;
  const l=26, r=292, t0=conEst?44:52, rad=a=>a*Math.PI/180;
  const lc=conEst?Math.min(Math.max(lEstaca,0),Ls):Ls, pe=clotoidePunto(R,Ls,lc);
  // geometría del dibujo con el mismo modelo que traza la espiral (el EC dibujado coincide con su extremo)
  const ee=clotoidePunto(R,Ls,Ls), Xd=ee.x, Yd=ee.y, Tcd=Yd/Math.sin(rad(tau));
  const piX=Xd-Tcd*Math.cos(rad(tau)), xExt=Math.max(Xd, conEst?0:piX, 1e-3);
  const bot=fuente?160:176, reserve=conEst?6:20, sc0=(r-l)/xExt, kex=Math.min(3,Math.max(1,26/Math.max(Yd*sc0,1e-6)));
  const sc=Math.min(sc0,(bot-reserve-t0)/Math.max(Yd*kex,1e-6)), H=Yd*sc*kex;
  const b=t0+((bot-reserve-t0)-H)/2+H;
  const X=x=>l+x*sc, Y=y=>b-y*sc*kex;
  const sp=[]; for(let i=0;i<=48;i++){ const p=clotoidePunto(R,Ls,Ls*i/48); sp.push([X(p.x),Y(p.y)]); }
  const TE=[X(0),Y(0)], EC=[X(Xd),Y(Yd)];
  if(!conEst){
    K.list([[{k:'A',c:'var(--accent)',v:fmtNum(cl.A,3)},{k:'τ',c:'var(--ink-soft)',v:fmtAngle(tau)},{k:'Xc',c:'var(--danger)',v:`${fmtNum(cl.Xc,3)} m`},{k:'Yc',c:'var(--ink)',v:`${fmtNum(cl.Yc,3)} m`},{k:'Tl',c:'var(--blueprint)',v:`${fmtNum(cl.Tl,3)} m`},{k:'Tc',c:'var(--success)',v:`${fmtNum(cl.Tc,3)} m`}]]);
    const PI=[X(piX),Y(0)];
    K.line(...TE,...PI,'var(--blueprint)');
    if(Xd>piX+1e-6) K.line(...PI,X(Xd),b,'var(--blueprint)',{op:0.45,dash:'1.6 1.6'});
    K.line(...PI,...EC,'var(--success)');
    K.line(...EC,EC[0],b,'var(--ink)',{dash:'1.6 1.6',sw:0.7});
    K.poly(sp,{stroke:'var(--accent)',sw:1.4});
    const dy=b+8; K.line(TE[0],dy,EC[0],dy,'var(--danger)',{sw:0.7}); K.line(TE[0],b+4,TE[0],dy+2,'var(--danger)',{sw:0.6,noObs:false}); K.line(EC[0],b+4,EC[0],dy+2,'var(--danger)',{sw:0.6,noObs:false});
    const a1=Math.atan2(EC[1]-PI[1],EC[0]-PI[0])*180/Math.PI, ra=Math.min(14,Math.hypot(EC[0]-PI[0],EC[1]-PI[1])*0.4);
    if(ra>3) K.arc(PI[0],PI[1],ra,0,a1,'var(--ink-soft)',{sw:0.8});
    [TE,EC,PI].forEach(q=>K.dot(q[0],q[1],'var(--ink-soft)',2));
    K.pointLabel('TE',TE[0],TE[1],4.5,'var(--ink-soft)',{dir:[-0.5,1],omit:false});
    K.pointLabel('EC',EC[0],EC[1],4.5,'var(--ink-soft)',{dir:[0.5,-1],omit:false});
    K.pointLabel('PI',PI[0],PI[1],4.5,'var(--ink-soft)',{dir:[0,1],omit:false});
    K.lineLabel(...TE,...PI,'Tl',4.5,'var(--blueprint)',{out:[0,-1],extras:[0,3,6]});
    K.lineLabel(...PI,...EC,'Tc',4.5,'var(--success)',{out:[1,-0.5],extras:[0,3,6]});
    K.lineLabel(EC[0],b,EC[0],EC[1],'Yc',4.5,'var(--ink)',{out:[1,0],extras:[0,3,6]});
    K.lineLabel(TE[0],dy,EC[0],dy,'Xc',4.5,'var(--danger)',{out:[0,1],extras:[0,3]});
    if(ra>3){ const am=a1/2*Math.PI/180; K.pointLabel('τ',PI[0]+ra*Math.cos(am),PI[1]+ra*Math.sin(am),4.5,'var(--ink-soft)',{dir:[Math.cos(am),Math.sin(am)],rmin:2,rmax:8}); }
    const m=sp[24]; K.pointLabel('A',m[0],m[1],4.5,'var(--accent)',{dir:[-0.3,-1],rmin:3,rmax:10});
  } else {
    const P=[X(pe.x),Y(pe.y)], ch=Math.hypot(pe.x,pe.y), defl=Math.atan2(pe.y,pe.x)*180/Math.PI;
    K.list([[{k:'l',c:'var(--accent)',v:`${fmtNum(lc,3)} m`},{k:'Cuerda',c:'var(--danger)',v:`${fmtNum(ch,3)} m`},{k:'Deflexión',c:'var(--ink)',v:fmtAngle(defl)}]]);
    K.line(TE[0],TE[1],X(xExt),TE[1],'var(--ink-soft)',{dash:'1.6 1.6',op:0.8,sw:0.7});
    K.poly(sp,{stroke:'var(--blueprint)',sw:0.9,op:0.5});
    const k=Math.max(2,Math.round(48*lc/Ls)); K.poly(sp.slice(0,k+1),{stroke:'var(--accent)',sw:1.6});
    K.line(...TE,...P,'var(--danger)',{dash:'3 2',sw:0.8});
    const a1=Math.atan2(P[1]-TE[1],P[0]-TE[0])*180/Math.PI, ra=Math.min(16,Math.hypot(P[0]-TE[0],P[1]-TE[1])*0.5);
    if(ra>3&&Math.abs(a1)>0.5) K.arc(TE[0],TE[1],ra,0,a1,'var(--ink)',{sw:0.8});
    K.dot(...TE,'var(--ink-soft)',2); K.dot(...EC,'var(--ink-soft)',2); K.dot(...P,'var(--accent)',2.4);
    K.pointLabel('TE',TE[0],TE[1],4.5,'var(--ink-soft)',{dir:[-0.5,1],omit:false});
    K.pointLabel('EC',EC[0],EC[1],4.5,'var(--ink-soft)',{dir:[0.5,-1],omit:false});
    K.pointLabel(estLabel||'Estaca',P[0],P[1],4.5,'var(--accent)',{dir:[-0.4,-1],rmin:4,rmax:14,omit:false});
    K.lineLabel(...TE,...P,'C',4.5,'var(--danger)',{out:[0.3,1],extras:[0,3,6]});
    if(ra>3&&Math.abs(a1)>0.5){ const am=a1/2*Math.PI/180; K.pointLabel('Δ',TE[0]+ra*Math.cos(am),TE[1]+ra*Math.sin(am),4.5,'var(--ink)',{dir:[Math.cos(am),Math.sin(am)],rmin:2,rmax:9}); }
  }
  if(fuente) K.add(svgFuente(fuente,320,190));
  return K.svg();
}

/* Diagrama de curva compuesta / curva de reversa: dos arcos exactos encadenados */
function curveArcPoints(R, deltaDeg, n, mirror){
  const deltaRad = toRad(deltaDeg);
  const pts=[];
  for(let i=0;i<=n;i++){
    const th = deltaRad*i/n;
    pts.push({x: R*Math.sin(th), y: (mirror?-1:1)*R*(1-Math.cos(th))});
  }
  return pts;
}
function rotateTranslatePts(pts, angleRad, ox, oy){
  const c=Math.cos(angleRad), s=Math.sin(angleRad);
  return pts.map(p=>({x: ox+p.x*c-p.y*s, y: oy+p.x*s+p.y*c}));
}
/* Diagrama de curva circular compuesta / curva de reversa (S) — v2 (estándar de plantillas de Mario): dos arcos encadenados a escala, cada tramo
   con su color (tramo 1 = blueprint, tramo 2 = accent; el tramo recto intermedio de la reversa, si existe, en ink). De cada tramo se dibuja
   el arco (Lc), la cuerda (C) y las tangentes (T) hasta sus PI; el listado trae R, Δ, T, Lc y C de cada tramo en su color y un tercer
   bloque (ink) con los totales. En el dibujo solo el carácter de cada magnitud con el índice de su tramo. */
function svgCurvaDoble(R1, d1Deg, R2, d2Deg, reversa, dt){
  const K=svgKit(), n=24, g=dt>0&&reversa?dt:0, rad=a=>a*Math.PI/180;
  const c1='var(--blueprint)', c2='var(--accent)';
  const T1=R1*Math.tan(rad(d1Deg/2)), T2=R2*Math.tan(rad(d2Deg/2)), Lc1=R1*rad(d1Deg), Lc2=R2*rad(d2Deg), C1=2*R1*Math.sin(rad(d1Deg/2)), C2=2*R2*Math.sin(rad(d2Deg/2));
  const A1=curveArcPoints(R1,d1Deg,n,false), pcc=A1[n], u=[Math.cos(rad(d1Deg)),Math.sin(rad(d1Deg))];
  const prc2=g?{x:pcc.x+g*u[0],y:pcc.y+g*u[1]}:pcc;
  const A2=rotateTranslatePts(curveArcPoints(R2,d2Deg,n,!!reversa), rad(d1Deg), prc2.x, prc2.y);
  const PC=A1[0], PT=A2[n], PI1={x:pcc.x-T1*u[0],y:pcc.y-T1*u[1]}, PI2={x:prc2.x+T2*u[0],y:prc2.y+T2*u[1]};
  const rows1=[{k:'R1',c:c1,v:`${fmtNum(R1,2)} m`},{k:'Δ1',c:c1,v:fmtAngle(d1Deg)},{k:'T1',c:c1,v:`${fmtNum(T1,3)} m`},{k:'Lc1',c:c1,v:`${fmtNum(Lc1,3)} m`},{k:'C1',c:c1,v:`${fmtNum(C1,3)} m`}];
  const rows2=[{k:'R2',c:c2,v:`${fmtNum(R2,2)} m`},{k:'Δ2',c:c2,v:fmtAngle(d2Deg)},{k:'T2',c:c2,v:`${fmtNum(T2,3)} m`},{k:'Lc2',c:c2,v:`${fmtNum(Lc2,3)} m`},{k:'C2',c:c2,v:`${fmtNum(C2,3)} m`}];
  const tot=reversa?[{k:'PI1–PI2',c:'var(--ink)',v:`${fmtNum(T1+g+T2,3)} m`},{k:'Lc total',c:'var(--ink)',v:`${fmtNum(Lc1+Lc2,3)} m`}]:[{k:'Δ total',c:'var(--ink)',v:fmtAngle(d1Deg+d2Deg)},{k:'Lc total',c:'var(--ink)',v:`${fmtNum(Lc1+Lc2,3)} m`}];
  if(g) tot.push({k:'Tang. interm.',c:'var(--ink)',v:`${fmtNum(g,3)} m`});
  K.list([rows1,rows2,tot],{gap:8});
  const all=A1.concat(A2,[PI1,PI2]).map(p=>[p.x,p.y]);
  const fit=K.fit(all,{l:22,r:298,t:Math.max(K.listBottom+8,40),b:176});
  const S=p=>[fit.X(p.x),fit.Y(p.y)];
  const s1=A1.map(S), s2=A2.map(S), sPC=S(PC), sPCC=S(pcc), sPRC2=S(prc2), sPT=S(PT), sPI1=S(PI1), sPI2=S(PI2);
  // tangentes, intermedia y cuerdas
  K.line(...sPC,...sPI1,c1,{sw:0.6,dash:'1.6 1.6'}); K.line(...sPI2,...sPT,c2,{sw:0.6,dash:'1.6 1.6'});
  K.line(...sPI1,...sPCC,c1,{sw:0.6,dash:'1.6 1.6'}); K.line(...sPRC2,...sPI2,c2,{sw:0.6,dash:'1.6 1.6'});
  if(g) K.line(...sPCC,...sPRC2,'var(--ink)',{sw:0.9});
  K.line(...sPC,...sPCC,c1,{sw:0.8,dash:'3 2'}); K.line(...sPRC2,...sPT,c2,{sw:0.8,dash:'3 2'});
  K.poly(s1,{stroke:c1,sw:1.5}); K.poly(s2,{stroke:c2,sw:1.5});
  [sPC,sPCC,sPRC2,sPT,sPI1,sPI2].forEach((q,i)=>{ if(i===2&&!g) return; K.dot(q[0],q[1],'var(--ink-soft)',i<4?2:1.6); });
  // letras de puntos
  const nm=reversa?'PRC':'PCC', un=v=>{const l=Math.hypot(v[0],v[1])||1; return [v[0]/l,v[1]/l];};
  const away=(p,ref)=>un([p[0]-ref[0],p[1]-ref[1]]);
  const m1=s1[n/2], m2=s2[n/2], ch1=[(sPC[0]+sPCC[0])/2,(sPC[1]+sPCC[1])/2], ch2=[(sPRC2[0]+sPT[0])/2,(sPRC2[1]+sPT[1])/2];
  K.pointLabel('PC',sPC[0],sPC[1],4.5,'var(--ink-soft)',{dir:away(sPC,m1),omit:false});
  K.pointLabel(g?nm+'1':nm,sPCC[0],sPCC[1],4.5,'var(--ink-soft)',{dir:away(sPCC,ch1),omit:false});
  if(g) K.pointLabel(nm+'2',sPRC2[0],sPRC2[1],4.5,'var(--ink-soft)',{dir:away(sPRC2,ch2),omit:false});
  K.pointLabel('PT',sPT[0],sPT[1],4.5,'var(--ink-soft)',{dir:away(sPT,m2),omit:false});
  K.pointLabel('PI1',sPI1[0],sPI1[1],3.4,'var(--ink-soft)',{dir:away(sPI1,m1)});
  K.pointLabel('PI2',sPI2[0],sPI2[1],3.4,'var(--ink-soft)',{dir:away(sPI2,m2)});
  // magnitudes de cada tramo
  const outFrom=(a,b,ref)=>{ const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2; return away([mx,my],ref); };
  K.lineLabel(...sPC,...sPI1,'T1',4.5,c1,{out:outFrom(sPC,sPI1,m1),extras:[0,3,6]});
  K.lineLabel(...sPI2,...sPT,'T2',4.5,c2,{out:outFrom(sPI2,sPT,m2),extras:[0,3,6]});
  K.lineLabel(...sPC,...sPCC,'C1',4.5,c1,{out:away(ch1,m1),extras:[0,3,6]});
  K.lineLabel(...sPRC2,...sPT,'C2',4.5,c2,{out:away(ch2,m2),extras:[0,3,6]});
  K.pointLabel('Lc1',m1[0],m1[1],4.5,c1,{dir:away(m1,ch1),rmin:3,rmax:11});
  K.pointLabel('Lc2',m2[0],m2[1],4.5,c2,{dir:away(m2,ch2),rmin:3,rmax:11});
  return K.svg();
}

/* Diagrama de radiacion: rayos desde una estacion a varios puntos */
/* Diagrama de Radiación (polares múltiples) — v2.
   Basado en la plantilla de Illustrator de Mario (plantilla_radiacion_mv.svg): lienzo 320×190, rayos teal 0,8, estación en ink,
   puntos y su letra en cobre (sus coordenadas son el resultado), D (teal) y Az (verde) a lados opuestos de cada rayo con letra
   de 3, flecha norte y listado con el valor a continuación de su descriptor (D1…Dn a la izquierda, Az1…Azn a la derecha).
   Con más de 6 puntos, el dibujo lleva solo los valores; el rótulo que no encuentra sitio libre se omite (queda en el listado). */
function svgRadiacion(E0,N0,points){
  const W=320, H=190;
  const f = v => v.toFixed(2).replace(/\.?0+$/,'');
  const FONT = 'font-family="var(--font-body)" font-weight="700"';
  const eng = svgLblEngine(W,H);
  const CD='var(--blueprint)', CZ='var(--success)', CP='var(--accent)', CK='var(--ink)', CS='var(--ink-soft)';
  const n = points.length, corto = n > 6;
  const dist = points.map(p=>Math.hypot(p.E-E0,p.N-N0));
  const dTxt = i => `${fmtNum(dist[i],2)} m`, aTxt = i => fmtAngle(points[i].az);

  // ---- listado: columnas de 10 filas, primero distancias y luego azimutes ----
  const PER_COL=10, ROW_Y0=12.521, ROW_DY=5.761, FS_L=4.32;
  const dRows=[], aRows=[];
  for(let i=0;i<n;i++){ dRows.push({k:'D'+(i+1), c:CD, v:dTxt(i)}); aRows.push({k:'Az'+(i+1), c:CZ, v:aTxt(i)}); }
  const place = (rows, x0) => {
    const nc=Math.ceil(rows.length/PER_COL), items=[]; let x=x0;
    for(let c=0;c<nc;c++){
      const part=rows.slice(c*PER_COL,(c+1)*PER_COL);
      const w=Math.max(...part.map(r=>eng.tw(`${r.k} = ${r.v}`,FS_L)))+5.2;
      part.forEach((r,j)=>items.push({r,x,y:ROW_Y0+j*ROW_DY}));
      x += Math.max(w+9, 62);
    }
    return {items,xEnd:x};
  };
  const L1=place(dRows,10.026), L2=place(aRows,L1.xEnd), items=L1.items.concat(L2.items);
  let listRight=0, listBottom=0;
  items.forEach(it=>{ listRight=Math.max(listRight,it.x+5.2+eng.tw(`${it.r.k} = ${it.r.v}`,FS_L)+1); listBottom=Math.max(listBottom,it.y+1); });
  eng.rectFill(8.5,6.5,listRight,listBottom+0.5);
  eng.rectFill(292,3,308,38);

  // ---- geometría a escala ----
  const left=75, right=265, top=Math.max(42,listBottom+9), bot=166;
  const Es=points.map(p=>p.E).concat([E0]), Ns=points.map(p=>p.N).concat([N0]);
  const minE=Math.min(...Es), maxE=Math.max(...Es), minN=Math.min(...Ns), maxN=Math.max(...Ns);
  const spanE=maxE-minE, spanN=maxN-minN;
  let sc=Math.min((right-left)/Math.max(spanE,1e-9),(bot-top)/Math.max(spanN,1e-9));
  if(!isFinite(sc) || spanE+spanN<1e-9) sc=1;
  const ox=(left+right)/2-(spanE*sc)/2, oy=(top+bot)/2+(spanN*sc)/2;
  const X=e=>ox+(e-minE)*sc, Y=n_=>oy-(n_-minN)*sc;
  const S={x:X(E0),y:Y(N0)}, P=points.map(p=>({x:X(p.E),y:Y(p.N)}));

  let out='';
  P.forEach(p=>{ out += `<path d="M${f(S.x)} ${f(S.y)} L${f(p.x)} ${f(p.y)}" fill="none" stroke="var(--blueprint)" stroke-width="0.8" stroke-linecap="round"/>\n`; eng.seg(S.x,S.y,p.x,p.y); });
  out += `<circle cx="${f(S.x)}" cy="${f(S.y)}" r="2.7" fill="var(--ink)"/>\n`; eng.circle(S.x,S.y,3);
  P.forEach(p=>{ out += `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="2" fill="var(--accent)"/>\n`; eng.circle(p.x,p.y,2.3); });
  out += `<path d="M300 36 L300 14" fill="none" stroke="var(--ink-soft)" stroke-width="0.7" stroke-linecap="round"/>\n`;
  out += `<path d="M300 10 L298.2 14.5 L301.8 14.5 Z" fill="var(--ink-soft)"/>\n`;
  out += `<text x="300" y="7.5" ${FONT} font-size="4.5" fill="var(--ink-soft)" text-anchor="middle">N</text>\n`;

  const lab=(t,fs,col,cd)=>{ const q=eng.txtAttrs(cd); out += `<text ${q.pos} ${FONT} font-size="${fs}" fill="${col}"${q.an}>${t}</text>\n`; };
  const around=(pt,t,fs,col,pref,r0,rmax)=>{
    const cands=[];
    for(let r=r0;r<=rmax;r+=1.2) for(let an=0;an<360;an+=15){
      const dx=Math.cos(an*Math.PI/180), dy=Math.sin(an*Math.PI/180);
      const dp=Math.acos(Math.max(-1,Math.min(1,dx*pref[0]+dy*pref[1])))*180/Math.PI;
      cands.push({x:pt.x+dx*r, y:pt.y+dy*r+0.36*fs, anchor:'middle', pen:(r-r0)*1.2+dp*0.08});
    }
    lab(t,fs,col,eng.pick(t,fs,cands));
  };
  // estación: hacia el mayor hueco entre rayos
  {
    const angs=P.map(p=>Math.atan2(p.y-S.y,p.x-S.x)).sort((a,b)=>a-b);
    let best=0, mid=Math.PI/2;
    if(angs.length){ for(let i=0;i<angs.length;i++){ const a=angs[i], b=i+1<angs.length?angs[i+1]:angs[0]+2*Math.PI, g=b-a; if(g>best){ best=g; mid=a+g/2; } } }
    around(S,'Est.',4.5,CK,[Math.cos(mid),Math.sin(mid)],5.4,13);
  }
  // puntos: hacia afuera de la estación
  P.forEach((p,i)=>{ const dx=p.x-S.x, dy=p.y-S.y, l=Math.hypot(dx,dy)||1; around(p,'P'+(i+1),4.5,CP,[dx/l,dy/l],5.2,12); });

  // D y Az de cada rayo: a lados opuestos, hacia el 60 % del rayo (letra de 3)
  const FS=3;
  P.forEach((p,i)=>{
    const dx=p.x-S.x, dy=p.y-S.y, L=Math.hypot(dx,dy); if(L<3) return;
    let ang=Math.atan2(dy,dx)*180/Math.PI; if(ang>90) ang-=180; if(ang<-90) ang+=180;
    const th=ang*Math.PI/180, g=[Math.sin(th),-Math.cos(th)], nl=[dy/L,-dx/L];
    [[corto?dTxt(i):`D${i+1} = ${dTxt(i)}`,CD,1],[corto?aTxt(i):`Az${i+1} = ${aTxt(i)}`,CZ,-1]].forEach(([t,col,sd])=>{
      const w=eng.tw(t,FS), cands=[];
      const centers=[]; for(let s=0.6*L; s<=L-w/2-1; s+=2) centers.push(s); for(let s=0.6*L-2; s>=w/2+4; s-=2) centers.push(s);
      if(!centers.length) centers.push(L/2);
      centers.forEach(s=>{
        [[sd,0],[sd,2.5],[-sd,0]].forEach(([sdd,ex])=>{
          const m=[nl[0]*sdd,nl[1]*sdd], dd=((g[0]*m[0]+g[1]*m[1])>0?1.5:4.1)+ex;
          cands.push({x:S.x+dx/L*s+m[0]*dd, y:S.y+dy/L*s+m[1]*dd, rot:ang, anchor:'middle', pen:Math.abs(s-0.6*L)*0.15+(sdd!==sd?10:0)+ex*1.2});
        });
      });
      if(Math.min(...cands.map(q=>eng.count(eng.box(t,FS,q),0.5)))>0) return;
      lab(t,FS,col,eng.pick(t,FS,cands));
    });
  });

  items.forEach(it=>{
    out += `<rect x="${f(it.x)}" y="${f(it.y-3.457)}" width="3.457" height="3.457" fill="${it.r.c}"/>\n`;
    out += `<text x="${f(it.x+5.185)}" y="${f(it.y)}" ${FONT} font-size="${FS_L}"><tspan fill="${it.r.c}">${it.r.k}</tspan><tspan fill="var(--ink)"> = ${it.r.v}</tspan></text>\n`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n${out}</svg>`;
}

/* Diagrama de huella de vuelo con dron (GSD) */
function svgFootprintVuelo(alturaVuelo, footAncho){
  const w=280,h=170,pad=24;
  const halfFoot=footAncho/2;
  const scale=Math.min((w-2*pad)/footAncho, (h-2*pad)/alturaVuelo);
  const cx=w/2, groundY=h-pad, droneY=pad;
  const gx1=cx-halfFoot*scale, gx2=cx+halfFoot*scale;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <circle cx="${cx}" cy="${droneY}" r="4" fill="var(--ink)"/>
    <line x1="${cx}" y1="${droneY}" x2="${gx1.toFixed(1)}" y2="${groundY}" stroke="var(--blueprint)" stroke-width="1.6"/>
    <line x1="${cx}" y1="${droneY}" x2="${gx2.toFixed(1)}" y2="${groundY}" stroke="var(--blueprint)" stroke-width="1.6"/>
    <line x1="${gx1.toFixed(1)}" y1="${groundY}" x2="${gx2.toFixed(1)}" y2="${groundY}" stroke="var(--accent)" stroke-width="2.4"/>
    <text x="${cx}" y="${(droneY-8).toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">h = ${fmtNum(alturaVuelo,0)} m</text>
    <text x="${cx}" y="${(groundY+18).toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--accent-text)" text-anchor="middle">Huella = ${fmtNum(footAncho,1)} m</text>
