/* Diagrama de Poligonal Cerrada — v2.
   Basado en la plantilla de Illustrator de Mario (plantilla_poligonal_cerrada.svg): mesa 320×190, trazos, colores
   y rótulos de esa plantilla. Polígono a escala con relleno accent suave (el área es el resultado principal), lados en
   blueprint con su valor por fuera, vértices neutros con su letra, área al centro, norte arriba a la derecha y el
   listado (valor pegado al descriptor) arriba a la izquierda. Con más de 8 lados, el dibujo lleva solo el valor del lado. */
function svgPoligonalCerrada(coordE, coordN){
  const W=320, H=190;
  const f = v => v.toFixed(2).replace(/\.?0+$/,'');
  const FONT = 'font-family="var(--font-body)" font-weight="700"';
  const eng = svgLblEngine(W,H);
  const n = coordE.length - 1;
  const P0 = coordE.slice(0,n).map((e,i)=>({e, n:coordN[i]}));
  const dist = P0.map((p,i)=>{ const q=P0[(i+1)%n]; return Math.hypot(q.e-p.e, q.n-p.n); });
  const perim = dist.reduce((a,b)=>a+b,0);
  let a2 = 0; for(let i=0;i<n;i++){ const p=P0[i], q=P0[(i+1)%n]; a2 += p.e*q.n - q.e*p.n; }
  const areaM2 = Math.abs(a2)/2, areaHa = areaM2/10000;
  const sideName = i => POL_LABELS[i] + POL_LABELS[(i+1)%n];
  const corto = n > 8;                         // muchos lados: en el dibujo solo el valor
  const dTxt = i => `${fmtNum(dist[i],2)} m`;

  // ---- listado (arriba a la izquierda, columnas de 10 filas) ----
  const rows = [];
  for(let i=0;i<n;i++) rows.push({k:sideName(i), c:'var(--blueprint)', v:dTxt(i)});
  rows.push({k:'Perímetro', c:'var(--success)', v:`${fmtNum(perim,2)} m`});
  rows.push({k:'Área', c:'var(--accent)', v:`${fmtNum(areaHa,4)} ha`});
  const PER_COL=10, COL_W=70, ROW_Y0=12.521, ROW_DY=5.761;
  const nCols = Math.ceil(rows.length/PER_COL);
  const maxRowW = Math.max(...rows.map(r=>eng.tw(`${r.k} = ${r.v}`,4.32)));
  const listRight = 15.2 + COL_W*(nCols-1) + maxRowW + 1;
  const listBottom = ROW_Y0 + (Math.min(rows.length,PER_COL)-1)*ROW_DY + 1;
  eng.rectFill(8.5, 6.5, listRight, listBottom+0.5);
  eng.rectFill(292, 3, 308, 38);                                  // flecha norte

  // ---- polígono a escala dentro de la caja libre (a la derecha del listado y bajo él) ----
  const top = Math.max(50, listBottom+7), bot = 168;
  const left = 75, right = 265;
  const minE=Math.min(...P0.map(p=>p.e)), maxE=Math.max(...P0.map(p=>p.e));
  const minN=Math.min(...P0.map(p=>p.n)), maxN=Math.max(...P0.map(p=>p.n));
  const spanE=Math.max(maxE-minE,0.001), spanN=Math.max(maxN-minN,0.001);
  const sc = Math.min((right-left)/spanE, (bot-top)/spanN);
  const ox = (left+right)/2 - (spanE*sc)/2, oy = (top+bot)/2 + (spanN*sc)/2;
  const V = P0.map(p=>({x: ox+(p.e-minE)*sc, y: oy-(p.n-minN)*sc}));
  const s2 = V.reduce((s,p,i)=>{ const q=V[(i+1)%n]; return s + p.x*q.y - q.x*p.y; },0);     // orientación en pantalla

  let out = '';
  out += `<path d="M${V.map(p=>f(p.x)+' '+f(p.y)).join(' L')} Z" fill="var(--accent)" fill-opacity="0.14" stroke="none"/>\n`;
  V.forEach((p,i)=>{
    const q=V[(i+1)%n];
    out += `<path d="M${f(p.x)} ${f(p.y)} L${f(q.x)} ${f(q.y)}" fill="none" stroke="var(--blueprint)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>\n`;
    eng.seg(p.x,p.y,q.x,q.y);
  });
  V.forEach(p=>{ out += `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="2" fill="var(--ink-soft)"/>\n`; eng.circle(p.x,p.y,2.3); });
  // norte
  out += `<path d="M300 36 L300 14" fill="none" stroke="var(--ink-soft)" stroke-width="0.7" stroke-linecap="round"/>\n`;
  out += `<path d="M300 10 L298.2 14.5 L301.8 14.5 Z" fill="var(--ink-soft)"/>\n`;
  out += `<text x="300" y="7.5" ${FONT} font-size="4.5" fill="var(--ink-soft)" text-anchor="middle">N</text>\n`;

  const lab = (t, fs, col, c) => { const q=eng.txtAttrs(c); out += `<text ${q.pos} ${FONT} font-size="${fs}" fill="${col}"${q.an}>${t}</text>\n`; };
  const outN = (i) => { const p=V[i], q=V[(i+1)%n], dx=q.x-p.x, dy=q.y-p.y, l=Math.hypot(dx,dy)||1; const k = s2>0 ? 1 : -1; return [k*dy/l, -k*dx/l]; };

  // lados: a lo largo de su línea, por fuera; si no cabe, se desliza, se aleja o pasa al interior
  for(let i=0;i<n;i++){
    const p=V[i], q=V[(i+1)%n], dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy)||1;
    let ang=Math.atan2(dy,dx)*180/Math.PI; if(ang>90) ang-=180; if(ang<-90) ang+=180;
    const th=ang*Math.PI/180, g=[Math.sin(th), -Math.cos(th)], u=[Math.cos(th), Math.sin(th)], no=outN(i);
    const mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
    const t = corto ? dTxt(i) : `${sideName(i)} = ${dTxt(i)}`;
    const tmax = Math.max(0, len/2 - eng.tw(t,4)/2 - 3), cands=[];
    for(let s=0;s<=tmax+1e-6;s+=2.5) for(const sg of [1,-1]){ if(s===0&&sg===-1) continue;
      [[1,0],[1,3.6],[1,7.2],[1,10.8],[-1,0],[-1,3.6]].forEach(([side,extra],si)=>{
        const nn=[no[0]*side,no[1]*side], d=((g[0]*nn[0]+g[1]*nn[1])>0 ? 1.9 : 4.8)+extra;
        cands.push({x:mx+u[0]*s*sg+nn[0]*d, y:my+u[1]*s*sg+nn[1]*d, rot:ang, anchor:'middle', pen:s*0.4+(side<0?10:0)+extra*1.2});
      });
    }
    lab(t,4,'var(--blueprint)',eng.pick(t,4,cands));
  }
  // vértices: letra hacia afuera
  for(let i=0;i<n;i++){
    const a=outN((i+n-1)%n), b=outN(i); let ux=a[0]+b[0], uy=a[1]+b[1]; const l=Math.hypot(ux,uy)||1; ux/=l; uy/=l;
    const cands=[];
    for(let r=4.6; r<=11; r+=1.2) for(let da=-70; da<=70; da+=14){
      const ca=Math.cos(da*Math.PI/180), sa=Math.sin(da*Math.PI/180), vx=ux*ca-uy*sa, vy=ux*sa+uy*ca;
      cands.push({x:V[i].x+vx*r, y:V[i].y+vy*r+1.6, anchor:'middle', pen:(r-4.6)*1.5+Math.abs(da)*0.05});
    }
    lab(POL_LABELS[i],4.5,'var(--ink-soft)',eng.pick(POL_LABELS[i],4.5,cands));
  }
  // área: en el interior, lo más lejos posible de los bordes
  {
    const inside = (x,y) => { let c=false; for(let i=0,j=n-1;i<n;j=i++){ const a=V[i], b=V[j]; if(((a.y>y)!==(b.y>y)) && (x < (b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)) c=!c; } return c; };
    const dEdge = (x,y) => { let m=1e9; for(let i=0;i<n;i++){ const a=V[i], b=V[(i+1)%n], dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy||1; let t=((x-a.x)*dx+(y-a.y)*dy)/l2; t=Math.max(0,Math.min(1,t)); m=Math.min(m,Math.hypot(x-a.x-t*dx,y-a.y-t*dy)); } return m; };
    const t=`Área = ${fmtNum(areaHa,4)} ha`, cands=[]; let best=0;
    const xs=V.map(p=>p.x), ys=V.map(p=>p.y);
    const pts=[]; for(let x=Math.min(...xs); x<=Math.max(...xs); x+=2.5) for(let y=Math.min(...ys); y<=Math.max(...ys); y+=2.5) if(inside(x,y)){ const d=dEdge(x,y); pts.push([x,y,d]); best=Math.max(best,d); }
    pts.forEach(([x,y,d])=> cands.push({x, y:y+1.5, anchor:'middle', pen:(best-d)*0.8}));
    const tw0=eng.tw(t,4.5), mxx=Math.max(...xs), mnx=Math.min(...xs), my0=(Math.min(...ys)+Math.max(...ys))/2;
    for(let dy=-40; dy<=40; dy+=6){ cands.push({x:mxx+8+tw0/2, y:my0+dy, anchor:'middle', pen:30+Math.abs(dy)*0.1}); cands.push({x:mnx-8-tw0/2, y:my0+dy, anchor:'middle', pen:30+Math.abs(dy)*0.1}); }
    if(!cands.length) cands.push({x:(Math.min(...xs)+Math.max(...xs))/2, y:(Math.min(...ys)+Math.max(...ys))/2, anchor:'middle', pen:0});
    lab(t,4.5,'var(--accent)',eng.pick(t,4.5,cands));
  }

  // listado: el valor a continuación de su descriptor
  rows.forEach((r,idx)=>{
    const col=Math.floor(idx/PER_COL), row=idx%PER_COL, oxl=COL_W*col, by=ROW_Y0+row*ROW_DY;
    out += `<rect x="${f(10.026+oxl)}" y="${f(by-3.457)}" width="3.457" height="3.457" fill="${r.c}"/>\n`;
    out += `<text x="${f(15.211+oxl)}" y="${f(by)}" ${FONT} font-size="4.32"><tspan fill="${r.c}">${r.k}</tspan><tspan fill="var(--ink)"> = ${r.v}</tspan></text>\n`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n${out}</svg>`;
}

/* Diagrama de Área por Coordenadas — v2.
   Basado en la plantilla de Illustrator de Mario (plantilla_area_coordenadas_mv.svg): mesa 320×190, contorno y relleno accent
   (el área es el resultado principal), arcos de ángulo interior en success con su valor sobre la bisectriz, lados en blueprint
   con su valor por fuera, vértices neutros con su letra, área al centro, norte arriba a la derecha y listado
   (valor pegado al descriptor) arriba a la izquierda: Área, Perímetro y lados en un bloque; ángulos interiores en otro.
   Con más de 8 vértices, el dibujo lleva solo el valor (sin nombre). Si un rótulo no tiene lugar libre, se omite del dibujo
   (su valor sigue en el listado). */
function svgAreaCoordenadas(pts){
  const W=320, H=190;
  const f = v => v.toFixed(2).replace(/\.?0+$/,'');
  const FONT = 'font-family="var(--font-body)" font-weight="700"';
  const FS_LADO = 2, FS_ANG = 1.5;                       // tamaños de la plantilla de Mario
  const eng = svgLblEngine(W,H);
  const n = pts.length;
  const name = i => POL_LABELS[i];
  const sideName = i => POL_LABELS[i] + POL_LABELS[(i+1)%n];
  const corto = n > 8;

  // ---- cálculo: lados, perímetro, área e ángulos interiores (según el sentido real del polígono) ----
  const dist = pts.map((p,i)=>{ const q=pts[(i+1)%n]; return Math.hypot(q.e-p.e, q.n-p.n); });
  const perim = dist.reduce((a,b)=>a+b,0);
  let a2=0; for(let i=0;i<n;i++){ const p=pts[i], q=pts[(i+1)%n]; a2 += p.e*q.n - q.e*p.n; }
  const areaM2 = Math.abs(a2)/2, areaHa = areaM2/10000, sg = a2>=0 ? 1 : -1;
  const angInt = pts.map((p,i)=>{
    const a=pts[(i+n-1)%n], b=pts[(i+1)%n];
    const vn=[b.e-p.e, b.n-p.n], vp=[a.e-p.e, a.n-p.n];
    let t=Math.atan2(sg*(vn[0]*vp[1]-vn[1]*vp[0]), vn[0]*vp[0]+vn[1]*vp[1]); if(t<0) t+=2*Math.PI;
    return t*180/Math.PI;
  });
  const dTxt = i => `${fmtNum(dist[i],2)} m`;
  const aTxt = i => fmtAngle(angInt[i]);

  // ---- listado: bloque 1 (Área, Perímetro, lados) y bloque 2 (ángulos), columnas de PER_COL filas ----
  const blk1 = [{k:'Área',c:'var(--accent)',v:`${fmtNum(areaHa,4)} ha`},{k:'Área',c:'var(--accent)',v:`${fmtNum(areaM2,2)} m²`},{k:'Perímetro',c:'var(--ink)',v:`${fmtNum(perim,2)} m`, solo:true}];
  for(let i=0;i<n;i++) blk1.push({k:sideName(i), c:'var(--blueprint)', v:dTxt(i)});
  const blk2 = []; for(let i=0;i<n;i++) blk2.push({k:name(i), c:'var(--success)', v:aTxt(i)});
  const ROW_Y0=12.521, ROW_DY=5.761, LIM=286;
  const rowW = r => eng.tw(`${r.k} = ${r.v}`,4.32);
  let PER_COL=10, cols;
  const layout = pc => {
    const out=[]; let x=10.026;
    [blk1,blk2].forEach(b=>{
      for(let s=0;s<b.length;s+=pc){
        const rows=b.slice(s,s+pc), w=Math.max(...rows.map(rowW));
        out.push({x, rows, w}); x = Math.max(x+70, x+5.185+w+10);
      }
      // el bloque 2 empieza en columna nueva; (el avance ya está hecho)
    });
    return out;
  };
  for(; PER_COL<=24; PER_COL++){ cols=layout(PER_COL); const last=cols[cols.length-1]; if(last.x+5.185+last.w <= LIM) break; }
  const listRight = Math.max(...cols.map(c=>c.x+5.185+c.w))+1;
  const listBottom = ROW_Y0 + (Math.min(Math.max(blk1.length,blk2.length),PER_COL)-1)*ROW_DY + 1;
  eng.rectFill(8.5, 6.5, listRight, listBottom+0.5);
  eng.rectFill(292, 3, 308, 38);                                  // flecha norte

  // ---- polígono a escala ----
  const top=Math.max(50, listBottom+(n>8?12:7)), bot=168, left=75, right=265;
  const minE=Math.min(...pts.map(p=>p.e)), maxE=Math.max(...pts.map(p=>p.e));
  const minN=Math.min(...pts.map(p=>p.n)), maxN=Math.max(...pts.map(p=>p.n));
  const spanE=Math.max(maxE-minE,0.001), spanN=Math.max(maxN-minN,0.001);
  const sc=Math.min((right-left)/spanE,(bot-top)/spanN);
  const ox=(left+right)/2-(spanE*sc)/2, oy=(top+bot)/2+(spanN*sc)/2;
  const V = pts.map(p=>({x:ox+(p.e-minE)*sc, y:oy-(p.n-minN)*sc}));
  const s2 = V.reduce((s,p,i)=>{ const q=V[(i+1)%n]; return s+p.x*q.y-q.x*p.y; },0);

  let out='';
  out += `<path d="M${V.map(p=>f(p.x)+' '+f(p.y)).join(' L')} Z" fill="var(--accent)" fill-opacity="0.14" stroke="none"/>\n`;
  out += `<path d="M${V.map(p=>f(p.x)+' '+f(p.y)).join(' L')} Z" fill="none" stroke="var(--accent)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>\n`;
  V.forEach((p,i)=>{ const q=V[(i+1)%n]; eng.seg(p.x,p.y,q.x,q.y); });

  // arcos de ángulo interior (success) — se registran como obstáculos
  const sgS = s2>=0 ? 1 : -1, bis=[];
  V.forEach((p,i)=>{
    const a=V[(i+n-1)%n], b=V[(i+1)%n];
    const ln=Math.hypot(b.x-p.x,b.y-p.y)||1, lp=Math.hypot(a.x-p.x,a.y-p.y)||1;
    const vn=[(b.x-p.x)/ln,(b.y-p.y)/ln], vp=[(a.x-p.x)/lp,(a.y-p.y)/lp];
    let t=Math.atan2(sgS*(vn[0]*vp[1]-vn[1]*vp[0]), vn[0]*vp[0]+vn[1]*vp[1]); if(t<0) t+=2*Math.PI;
    const r=Math.max(2.5, Math.min(7, 0.4*Math.min(ln,lp)));
    const sw = sgS>0 ? 1 : 0, large = t>Math.PI ? 1 : 0;
    out += `<path d="M${f(p.x+vn[0]*r)} ${f(p.y+vn[1]*r)} A${f(r)} ${f(r)} 0 ${large} ${sw} ${f(p.x+vp[0]*r)} ${f(p.y+vp[1]*r)}" fill="none" stroke="var(--success)" stroke-width="0.8" stroke-linecap="round"/>\n`;
    for(let k=0;k<=12;k++){ const th=sgS*t*k/12, c=Math.cos(th), s=Math.sin(th); eng.pts.push([p.x+r*(vn[0]*c-vn[1]*s), p.y+r*(vn[0]*s+vn[1]*c)]); }
    const th=sgS*t/2, c=Math.cos(th), s=Math.sin(th);
    bis.push({u:[vn[0]*c-vn[1]*s, vn[0]*s+vn[1]*c], r});
  });
  V.forEach(p=>{ out += `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="2" fill="var(--ink-soft)"/>\n`; eng.circle(p.x,p.y,2.3); });
  // norte
  out += `<path d="M300 36 L300 14" fill="none" stroke="var(--ink-soft)" stroke-width="0.7" stroke-linecap="round"/>\n`;
  out += `<path d="M300 10 L298.2 14.5 L301.8 14.5 Z" fill="var(--ink-soft)"/>\n`;
  out += `<text x="300" y="7.5" ${FONT} font-size="4.5" fill="var(--ink-soft)" text-anchor="middle">N</text>\n`;

  const lab = (t,fs,col,c) => { const q=eng.txtAttrs(c); out += `<text ${q.pos} ${FONT} font-size="${fs}" fill="${col}"${q.an}>${t}</text>\n`; };
  const omit = (t,fs,cands) => Math.min(...cands.map(q=>eng.count(eng.box(t,fs,q),0.5)))>0;
  const outN = i => { const p=V[i], q=V[(i+1)%n], dx=q.x-p.x, dy=q.y-p.y, l=Math.hypot(dx,dy)||1; const k=s2>0?1:-1; return [k*dy/l,-k*dx/l]; };

  // ángulos interiores: sobre la bisectriz, leídos a lo largo de ella (a la derecha), pegados al arco
  for(let i=0;i<n;i++){
    const t = corto ? aTxt(i) : `${name(i)} = ${aTxt(i)}`, w=eng.tw(t,FS_ANG), u=bis[i].u;
    let ang=Math.atan2(u[1],u[0])*180/Math.PI; if(ang>90) ang-=180; if(ang<-90) ang+=180;
    const th=ang*Math.PI/180, up=[Math.sin(th),-Math.cos(th)], cands=[];
    for(let g=bis[i].r+1.6; g<=bis[i].r+16; g+=1.2){
      const d=g+w/2, cx=V[i].x+u[0]*d, cy=V[i].y+u[1]*d;
      cands.push({x:cx-up[0]*0.364*FS_ANG, y:cy-up[1]*0.364*FS_ANG, rot:ang, anchor:'middle', pen:(g-bis[i].r)*0.6});
    }
    if(omit(t,FS_ANG,cands)) continue;
    lab(t,FS_ANG,'var(--success)',eng.pick(t,FS_ANG,cands));
  }
  // lados: a lo largo de su línea, por fuera; si no cabe se desliza, se aleja o pasa al interior
  for(let i=0;i<n;i++){
    const p=V[i], q=V[(i+1)%n], dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy)||1;
    let ang=Math.atan2(dy,dx)*180/Math.PI; if(ang>90) ang-=180; if(ang<-90) ang+=180;
    const th=ang*Math.PI/180, g=[Math.sin(th),-Math.cos(th)], u=[Math.cos(th),Math.sin(th)], no=outN(i);
    const mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
    const t = corto ? dTxt(i) : `${sideName(i)} = ${dTxt(i)}`;
    const tmax=Math.max(0, len/2 - eng.tw(t,FS_LADO)/2 - 3), cands=[];
    for(let s=0;s<=tmax+1e-6;s+=2) for(const sgn of [1,-1]){ if(s===0&&sgn===-1) continue;
      [[1,0],[1,2],[1,4],[1,6],[-1,0],[-1,2]].forEach(([side,extra])=>{
        const nn=[no[0]*side,no[1]*side], d=((g[0]*nn[0]+g[1]*nn[1])>0 ? 0.4 : 1.05)*FS_LADO + extra;
        cands.push({x:mx+u[0]*s*sgn+nn[0]*d, y:my+u[1]*s*sgn+nn[1]*d, rot:ang, anchor:'middle', pen:s*0.4+(side<0?10:0)+extra*1.2});
      });
    }
    if(omit(t,FS_LADO,cands)) continue;
    lab(t,FS_LADO,'var(--blueprint)',eng.pick(t,FS_LADO,cands));
  }
  // vértices: letra hacia afuera
  for(let i=0;i<n;i++){
    const a=outN((i+n-1)%n), b=outN(i); let ux=a[0]+b[0], uy=a[1]+b[1]; const l=Math.hypot(ux,uy)||1; ux/=l; uy/=l;
    const cands=[];
    for(let r=4.6; r<=11; r+=1.2) for(let da=-70; da<=70; da+=14){
      const ca=Math.cos(da*Math.PI/180), sa=Math.sin(da*Math.PI/180), vx=ux*ca-uy*sa, vy=ux*sa+uy*ca;
      cands.push({x:V[i].x+vx*r, y:V[i].y+vy*r+1.6, anchor:'middle', pen:(r-4.6)*1.5+Math.abs(da)*0.05});
    }
    lab(name(i),4.5,'var(--ink-soft)',eng.pick(name(i),4.5,cands));
  }
  // área: en el interior, lo más lejos posible de los bordes
  {
    const inside=(x,y)=>{ let c=false; for(let i=0,j=n-1;i<n;j=i++){ const a=V[i], b=V[j]; if(((a.y>y)!==(b.y>y)) && (x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)) c=!c; } return c; };
    const dEdge=(x,y)=>{ let m=1e9; for(let i=0;i<n;i++){ const a=V[i], b=V[(i+1)%n], dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy||1; let t=((x-a.x)*dx+(y-a.y)*dy)/l2; t=Math.max(0,Math.min(1,t)); m=Math.min(m,Math.hypot(x-a.x-t*dx,y-a.y-t*dy)); } return m; };
    const t=`Área = ${fmtNum(areaHa,4)} ha`, cands=[]; let best=0;
    const xs=V.map(p=>p.x), ys=V.map(p=>p.y), pp=[];
    for(let x=Math.min(...xs); x<=Math.max(...xs); x+=2.5) for(let y=Math.min(...ys); y<=Math.max(...ys); y+=2.5) if(inside(x,y)){ const d=dEdge(x,y); pp.push([x,y,d]); best=Math.max(best,d); }
    pp.forEach(([x,y,d])=>cands.push({x, y:y+1.5, anchor:'middle', pen:(best-d)*0.8}));
    const tw0=eng.tw(t,4.5), mxx=Math.max(...xs), mnx=Math.min(...xs), my0=(Math.min(...ys)+Math.max(...ys))/2;
    for(let dy=-40; dy<=40; dy+=6){ cands.push({x:mxx+8+tw0/2, y:my0+dy, anchor:'middle', pen:30+Math.abs(dy)*0.1}); cands.push({x:mnx-8-tw0/2, y:my0+dy, anchor:'middle', pen:30+Math.abs(dy)*0.1}); }
    if(!cands.length) cands.push({x:(Math.min(...xs)+Math.max(...xs))/2, y:(Math.min(...ys)+Math.max(...ys))/2, anchor:'middle', pen:0});
    lab(t,4.5,'var(--accent)',eng.pick(t,4.5,cands));
  }
  // listado
  cols.forEach(c=>c.rows.forEach((r,row)=>{
    const by=ROW_Y0+row*ROW_DY;
    out += `<rect x="${f(c.x)}" y="${f(by-3.457)}" width="3.457" height="3.457" fill="${r.c}"/>\n`;
    out += `<text x="${f(c.x+5.185)}" y="${f(by)}" ${FONT} font-size="4.32"><tspan fill="${r.c}">${r.k}</tspan><tspan fill="var(--ink)"> = ${r.v}</tspan></text>\n`;
  }));
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n${out}</svg>`;
}

function renderPolygonSVG(coordE, coordN){
  const n = coordE.length - 1;
  const pts = coordE.slice(0,n).map((e,i)=>({e, n:coordN[i]}));
  const minE=Math.min(...pts.map(p=>p.e)), maxE=Math.max(...pts.map(p=>p.e));
  const minN=Math.min(...pts.map(p=>p.n)), maxN=Math.max(...pts.map(p=>p.n));
  const w=280,h=220,pad=24;
  const spanE = Math.max(maxE-minE, 0.001), spanN = Math.max(maxN-minN, 0.001);
  const scale = Math.min((w-2*pad)/spanE, (h-2*pad)/spanN);
  const px = e => pad + (e-minE)*scale;
  const py = n => (h-pad) - (n-minN)*scale;
  const pathD = pts.map((p,i)=> `${i===0?'M':'L'} ${px(p.e).toFixed(1)} ${py(p.n).toFixed(1)}`).join(' ') + ' Z';
  const dots = pts.map((p,i)=> `<circle cx="${px(p.e).toFixed(1)}" cy="${py(p.n).toFixed(1)}" r="3.2" fill="var(--accent)"/><text x="${px(p.e).toFixed(1)}" y="${(py(p.n)-7).toFixed(1)}" font-size="${relFont(w,0.035,8,10.5)}" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">${POL_LABELS[i]}</text>`).join('');
  const cEx=pts.reduce((s,p)=>s+px(p.e),0)/pts.length, cNy=pts.reduce((s,p)=>s+py(p.n),0)/pts.length;
  const distFont=relFont(w,0.026,6.5,8.5);
  const step=thinLabelStep(pts.length,12);
  let sideLabels='';
  for(let i=0;i<pts.length;i+=step){
    const a=pts[i], b=pts[(i+1)%pts.length];
    const dist=Math.hypot(b.e-a.e, b.n-a.n);
    const ax=px(a.e), ay=py(a.n), bx=px(b.e), by=py(b.n);
    const mx=(ax+bx)/2, my=(ay+by)/2, dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len;
    const side = ((cEx-mx)*nx+(cNy-my)*ny)>0 ? -1 : 1;
    sideLabels += svgLineLabel(ax,ay,bx,by, fmtNum(dist,2)+' m', 'var(--blueprint)', distFont, side);
  }
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <path d="${pathD}" fill="var(--blueprint-soft)" stroke="var(--blueprint)" stroke-width="1.6" stroke-linejoin="round"/>
    ${dots}
    ${sideLabels}
    ${svgNorthArrow(w-20, 22)}
  </svg>`;
}

/* ---------- HELPERS DE DIAGRAMAS (SVG) ---------- */
function svgNorthArrow(cx, cy){
  return `<g transform="translate(${cx},${cy})" stroke="var(--ink-soft)" fill="var(--ink-soft)">
    <path d="M0 -10 L4 4 L0 1 L-4 4 Z" stroke="none"/>
    <text x="0" y="16" font-size="9" font-family="var(--font-mono)" text-anchor="middle" stroke="none">N</text>
  </g>`;
}

/* Sello discreto en la esquina del dibujo, indicando de qué planilla/hoja proviene el cálculo */
function svgFuente(text, w, h){
  return `<text x="${w-5}" y="${h-5}" font-size="7.3" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="end" opacity="0.65">${text}</text>`;
}

/* Tamaño de fuente relativo al ancho del viewBox del dibujo: como el SVG se escala completo
   (width:100% en .plot-wrap svg), un tamaño proporcional al viewBox mantiene la letra legible
   y consistente sin importar el tamaño de pantalla donde se vea. */
function relFont(w, mult, min, max){
  return Math.max(min||6.5, Math.min(max||10, w*(mult||0.032)));
}

/* Rótulo de distancia/rumbo orientado a lo largo de una línea (x1,y1)-(x2,y2), como en un plano
   topográfico real: el texto queda paralelo a la línea, nunca invertido (boca abajo), y desplazado
   hacia un lado para no cruzar el trazo ni pisar otros rótulos cercanos. */
function svgLineLabel(x1, y1, x2, y2, text, color, fontSize, side, offsetMult, weight){
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const s = side===-1?-1:1;
  const nx=-(dy/len)*s, ny=(dx/len)*s;
  let angle = Math.atan2(dy,dx)*180/Math.PI;
  if(angle>90) angle-=180;
  if(angle<-90) angle+=180;
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const off=(fontSize||8)*(offsetMult||0.85)+2;
  const lx=mx+nx*off, ly=my+ny*off;
  const fw=weight?` font-weight="${weight}"`:'';
  return `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="${(fontSize||8).toFixed ? (fontSize||8).toFixed(1) : (fontSize||8)}" font-family="var(--font-mono)"${fw} fill="${color}" text-anchor="middle" transform="rotate(${angle.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})">${text}</text>`;
}
/* Calcula el offsetMult que hay que pasarle a svgLineLabel para que, sea cual sea el ángulo de
   rotación resultante, el rótulo quede a la misma distancia visual de su línea que un rótulo con
   offsetMult por defecto (0.85) cuyo lado ascendente de la fuente mira hacia la línea (el caso
   "bueno", sin que se note el ascendente/descendente). Según el ángulo final y el lado (side),
   a veces el lado que queda hacia la línea es el descendente en vez del ascendente — como el
   descendente es más chico, con el mismo offsetMult el rótulo se ve más lejos de la línea de lo
   esperado (ver notas en svgPitagoras). Esta función detecta ese caso y devuelve un offsetMult
   menor para compensarlo; en el caso normal devuelve baseOffsetMult sin cambios. Los ratios
   ASC/DESC son metrics de la fuente monoespaciada de la app, medidos con getBBox real. */
function svgLineLabelAutoOffset(x1,y1,x2,y2,side,fontSize,baseOffsetMult){
  baseOffsetMult = baseOffsetMult===undefined ? 0.85 : baseOffsetMult;
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const s = side===-1?-1:1;
  const nx=-(dy/len)*s, ny=(dx/len)*s;
  let angle = Math.atan2(dy,dx)*180/Math.PI;
  if(angle>90) angle-=180;
  if(angle<-90) angle+=180;
  const th = angle*Math.PI/180;
  const indicator = Math.sin(th)*nx - Math.cos(th)*ny; // >0: descendente hacia la línea (compensar)
  if(indicator <= 1e-9) return baseOffsetMult;
  const ASC=0.9133, DESC=0.2614;
  const ascent=fontSize*ASC, descent=fontSize*DESC;
  const offGood = fontSize*baseOffsetMult+2 - ascent;
  const offNeeded = offGood + descent;
  return Math.max(0, (offNeeded-2)/fontSize);
}

/* Decide qué índices de una serie de N puntos rotular para evitar amontonar texto: si hay pocos,
   se rotulan todos; si hay muchos, se espacian para dejar aire entre etiquetas. */
function thinLabelStep(n, maxLabels){
  if(n<=(maxLabels||10)) return 1;
  return Math.ceil(n/(maxLabels||10));
}

/* Diagrama de triángulo vertical — v2 (estándar de plantillas de Mario): corte lateral esquemático (no a escala) con distancia
   inclinada Di (blueprint), horizontal Dh (success), ángulo vertical α, desnivel ΔH entre los puntos del terreno A y B y, si hay alturas
   de instrumento y de señal (Nivelación Trigonométrica), los tramos Hi y hp. accent sigue a la magnitud estrella del panel: ΔH por defecto
   o α (ext.star='a', Pendiente entre Dos Puntos). En el dibujo solo el carácter; los valores van en el listado. */
function svgTrianguloVertical(anguloDeg, Dh, hi, hm, desnivel, ext){
  ext=ext||{}; const K=svgKit(), hasH=hi!==undefined&&hm!==undefined&&!isNaN(hi)&&!isNaN(hm);
  const col={DH:'var(--success)',DI:'var(--blueprint)',dH:'var(--accent)',a:'var(--ink)',Hi:'var(--ink-soft)',hp:'var(--danger)'};
  if(ext.star==='a'){ col.a='var(--accent)'; col.dH='var(--ink)'; }
  const Di=ext.Di!==undefined?ext.Di:Dh/Math.max(Math.cos(toRad(anguloDeg)),1e-9);
  const rows=[{k:'ΔH',c:col.dH,v:`${fmtNum(desnivel,3)} m`},{k:'Dh',c:col.DH,v:`${fmtNum(Dh,3)} m`},{k:'Di',c:col.DI,v:`${fmtNum(Di,3)} m`},{k:'α',c:col.a,v:fmtAngle(anguloDeg)}];
  if(ext.pct!==undefined) rows.push({k:'Pendiente',c:col.a,v:`${fmtNum(ext.pct,2)} %`});
  if(hasH){ rows.push({k:'Hi',c:col.Hi,v:`${fmtNum(hi,3)} m`}); rows.push({k:'hp',c:col.hp,v:`${fmtNum(hm,3)} m`}); }
  K.list([rows],{perCol:3});
  let a=Math.max(-35,Math.min(anguloDeg,35)); if(Math.abs(a)<4) a=a<0?-4:4; if(ext.sign<0&&a>0) a=-a;
  const top=Math.max(K.listBottom+10,44), bot=176, vx=56, rodX=226, dx=rodX-vx;
  const dy=Math.min(58,dx*Math.tan(toRad(Math.abs(a))))*Math.sign(a);        // dy>0: B más arriba que el instrumento
  const hiPx=hasH?22:0, hpPx=hasH?22:0;
  const ymin=Math.min(0,-dy)-5, ymax=Math.max(hiPx,-dy+hpPx);
  const vy=(top+bot)/2-(ymin+ymax)/2, V=[vx,vy], P=[rodX,vy-dy], GA=[vx,vy+hiPx], GB=[rodX,vy-dy+hpPx];
  // terreno y mástiles
  if(hasH){ K.line(vx-14,GA[1]+(GA[1]-GB[1])*0.08,rodX+16,GB[1]-(GA[1]-GB[1])*0.08,'#8B6B47',{sw:1.2,noObs:false});
    K.line(...V,...GA,'var(--ink-soft)',{sw:0.8}); K.line(...P,...GB,'var(--ink-soft)',{sw:0.8}); }
  // horizontal (Dh), visual (Di) y ángulo
  K.line(vx,vy,rodX,vy,col.DH,{sw:1,dash:'2.4 2'}); K.line(rodX,vy,rodX,P[1],'var(--ink-soft)',{sw:0.7,dash:'1.6 1.6',noObs:false});
  K.line(...V,...P,col.DI,{sw:1.3});
  const ra=26; K.arc(vx,vy,ra,0,-a,col.a,{sw:0.9});
  // desnivel ΔH entre los puntos del terreno (a la derecha), con rayas de referencia
  const dhX=rodX+36; let u=Math.min(GA[1],GB[1]), d=Math.max(GA[1],GB[1]); if(d-u<14){ const m=(u+d)/2; u=m-7; d=m+7; }
  K.line(GA[0]+3,GA[1],dhX+3,GA[1],'var(--ink-soft)',{sw:0.6,dash:'1.6 1.6',noObs:false}); K.line(GB[0]+3,GB[1],dhX+3,GB[1],'var(--ink-soft)',{sw:0.6,dash:'1.6 1.6',noObs:false});
  K.line(dhX,u,dhX,d,col.dH,{sw:1.1});
  [u,d].forEach(y=>K.line(dhX-2,y,dhX+2,y,col.dH,{sw:1,noObs:false}));
  // Hi y hp
  if(hasH){ const hx=vx-12, px=rodX+11;
    K.line(hx,GA[1],hx,vy,col.Hi,{sw:1}); [GA[1],vy].forEach(y=>K.line(hx-2,y,hx+2,y,col.Hi,{sw:0.9,noObs:false}));
    K.line(px,GB[1],px,P[1],col.hp,{sw:1}); [GB[1],P[1]].forEach(y=>K.line(px-2,y,px+2,y,col.hp,{sw:0.9,noObs:false}));
    K.pointLabel('Hi',hx,(GA[1]+vy)/2,4.5,col.Hi,{dir:[-1,0],rmin:3,rmax:9,omit:false});
    K.pointLabel('hp',px,(GB[1]+P[1])/2,4.5,col.hp,{dir:[1,0],rmin:3,rmax:9,omit:false}); }
  // puntos
  K.dot(...GA,'var(--ink-soft)',2); K.dot(...GB,'var(--ink-soft)',2);
  if(hasH){ K.dot(...V,'var(--ink)',2.4); K.dot(...P,'var(--ink)',2.4); }
  K.pointLabel('A',GA[0],GA[1],4.5,'var(--ink-soft)',{dir:[-0.6,hasH?0.8:0.8],omit:false});
  K.pointLabel('B',GB[0],GB[1],4.5,'var(--ink-soft)',{dir:[0.6,0.8],omit:false});
  // magnitudes
  const up=a>0;
  K.lineLabel(vx,vy,rodX,vy,'Dh',4.5,col.DH,{at:0.62,out:[0,up?1:-1],extras:[0,3,6]});
  K.lineLabel(...V,...P,'Di',4.5,col.DI,{at:0.5,out:[0,up?-1:1],extras:[0,3,6]});
  K.lineLabel(dhX,u,dhX,d,'ΔH',4.5,col.dH,{out:[1,0],extras:[0,3]});
  const am=-a/2*Math.PI/180; K.pointLabel('α',vx+ra*Math.cos(am),vy+ra*Math.sin(am),4.5,col.a,{dir:[Math.cos(am),Math.sin(am)],rmin:2,rmax:9});
  return K.svg();
}

/* Diagrama de Rumbo y Distancia — v2 (estándar de plantillas de Mario): A→B a escala, meridiano punteado por A, arco de azimut
   (success, desde el norte en sentido horario) y arco de rumbo (blueprint, desde el meridiano N o S más cercano); distancia en accent
   a lo largo de la línea; valores también en el listado (arriba a la izquierda). Rótulo sin lugar libre → se omite del dibujo. */
function svgRumboAzimut(e1, n1, e2, n2, r, fuente){
  const W=320, H=190;
  const f = v => v.toFixed(2).replace(/\.?0+$/,'');
  const FONT = 'font-family="var(--font-body)" font-weight="700"';
  const eng = svgLblEngine(W,H);
  const rum = `${r.rumbo.ns} ${fmtAngle(r.rumbo.ang)} ${r.rumbo.ew}`;
  const rows = [{k:'Distancia',c:'var(--accent)',v:`${fmtNum(r.dist,3)} m`},{k:'Azimut',c:'var(--success)',v:fmtAngle(r.az)},{k:'Rumbo',c:'var(--blueprint)',v:rum}];
  const ROW_Y0=12.521, ROW_DY=5.761;
  const maxRowW = Math.max(...rows.map(q=>eng.tw(`${q.k} = ${q.v}`,4.32)));
  eng.rectFill(8.5, 6.5, 15.2+maxRowW+1, ROW_Y0+2*ROW_DY+1.5);
  eng.rectFill(292, 3, 308, 38);
  // ---- geometría a escala (A y B dentro de la caja libre) ----
  const de=e2-e1, dn=n2-n1, deg=r.dist>1e-9;
  const left=62, right=268, top=56, bot=146;
  const spanE=Math.max(Math.abs(de),0.001), spanN=Math.max(Math.abs(dn),0.001);
  const sc=Math.min((right-left)/spanE,(bot-top)/spanN);
  const midX=(left+right)/2, midY=(top+bot)/2;
  const Ax=midX-de*sc/2, Ay=midY+dn*sc/2, Bx=midX+de*sc/2, By=midY-dn*sc/2;
  let out='';
  const R1=14, R2=24, az=r.az, pol=(rr,a)=>[Ax+rr*Math.sin(a*Math.PI/180), Ay-rr*Math.cos(a*Math.PI/180)];
  const sNorth = r.rumbo.ns==='S';
  // meridiano punteado por A
  const my0=Ay-28, my1=sNorth ? Math.min(Ay+34, H-5) : Ay+0;
  out += `<path d="M${f(Ax)} ${f(my0)} L${f(Ax)} ${f(my1)}" fill="none" stroke="var(--ink-soft)" stroke-width="0.6" stroke-dasharray="1.6 1.6" stroke-linecap="round"/>\n`;
  eng.seg(Ax,my0,Ax,my1);
  // arcos
  const arc=(rr,a0,a1,col)=>{ let d=((a1-a0)%360+540)%360-180; const sw=d>0?1:0, big=Math.abs(d)>180?1:0; const p=pol(rr,a0), q=pol(rr,a1);
    out += `<path d="M${f(p[0])} ${f(p[1])} A${rr} ${rr} 0 ${big} ${sw} ${f(q[0])} ${f(q[1])}" fill="none" stroke="${col}" stroke-width="0.8" stroke-linecap="round"/>\n`;
    for(let k=0;k<=14;k++){ const pp=pol(rr,a0+d*k/14); eng.pts.push(pp); } return d; };
  let bisAz=null, bisRu=null;
  if(deg && az>0.3 && az<359.7){ // arco de azimut: del norte hacia AB, siempre horario
    const sw=1, p=pol(R1,0), q=pol(R1,az); out += `<path d="M${f(p[0])} ${f(p[1])} A${R1} ${R1} 0 ${az>180?1:0} ${sw} ${f(q[0])} ${f(q[1])}" fill="none" stroke="var(--success)" stroke-width="0.8" stroke-linecap="round"/>\n`;
    for(let k=0;k<=14;k++) eng.pts.push(pol(R1,az*k/14)); bisAz=az/2; }
  const ra = r.rumbo.ang;
  if(deg && ra>0.3 && ra<179.7 && !(r.rumbo.ns==='N' && r.rumbo.ew==='E')){ const start = sNorth?180:0; const d=arc(R2,start,az,'var(--blueprint)'); bisRu=start+d/2; }
  // puntos
  out += `<path d="M${f(Ax)} ${f(Ay)} L${f(Bx)} ${f(By)}" fill="none" stroke="var(--accent)" stroke-width="0.8" stroke-linecap="round"/>\n`;
  eng.seg(Ax,Ay,Bx,By);
  [[Ax,Ay],[Bx,By]].forEach(p=>{ out += `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="2" fill="var(--ink-soft)"/>\n`; eng.circle(p[0],p[1],2.3); });
  // norte
  out += `<path d="M300 36 L300 14" fill="none" stroke="var(--ink-soft)" stroke-width="0.7" stroke-linecap="round"/>\n<path d="M300 10 L298.2 14.5 L301.8 14.5 Z" fill="var(--ink-soft)"/>\n<text x="300" y="7.5" ${FONT} font-size="4.5" fill="var(--ink-soft)" text-anchor="middle">N</text>\n`;
  const lab=(t,fs,col,c)=>{ const q=eng.txtAttrs(c); out += `<text ${q.pos} ${FONT} font-size="${fs}" fill="${col}"${q.an}>${t}</text>\n`; };
  const omit=(t,fs,cands)=>!cands.length || Math.min(...cands.map(q=>eng.count(eng.box(t,fs,q),0.5)))>0;
  // N / S del meridiano
  lab('N',3,'var(--ink-soft)',eng.pick('N',3,[{x:Ax+3.6,y:my0+2.4,anchor:'middle'},{x:Ax-3.6,y:my0+2.4,anchor:'middle'}]));
  if(sNorth) lab('S',3,'var(--ink-soft)',eng.pick('S',3,[{x:Ax+3.6,y:my1-0.4,anchor:'middle'},{x:Ax-3.6,y:my1-0.4,anchor:'middle'}]));
  // distancia a lo largo de la línea (ambos lados, deslizando)
  if(deg){
    const dx=Bx-Ax, dy=By-Ay, len=Math.hypot(dx,dy); let ang=Math.atan2(dy,dx)*180/Math.PI; if(ang>90) ang-=180; if(ang<-90) ang+=180;
    const th=ang*Math.PI/180, u=[Math.cos(th),Math.sin(th)], g=[Math.sin(th),-Math.cos(th)];
    const t=`D = ${fmtNum(r.dist,3)} m`, w=eng.tw(t,3), tmax=Math.max(0,len/2-w/2-3), cands=[];
    for(let s=0;s<=tmax+1e-6;s+=2.5) for(const sg of [1,-1]){ if(s===0&&sg===-1) continue;
      for(const side of [1,-1]){ const nn=[g[0]*side,g[1]*side]; const d=(side===1?1.5:4.1)+0; // up (side 1) = glifo hacia afuera
        cands.push({x:(Ax+Bx)/2+u[0]*s*sg+nn[0]*d, y:(Ay+By)/2+u[1]*s*sg+nn[1]*d, rot:ang, anchor:'middle', pen:s*0.4+(side<0?1:0)}); } }
    if(!omit(t,3,cands)) lab(t,3,'var(--accent)',eng.pick(t,3,cands));
  }
  // azimut y rumbo sobre la bisectriz, a lo largo de ella
  const alongBis=(t,col,bis,rr)=>{
    if(bis===null) return; const w=eng.tw(t,3); let a=bis-90; while(a>90) a-=180; while(a<=-90) a+=180;
    const th=a*Math.PI/180, up=[Math.sin(th),-Math.cos(th)], cands=[];
    for(let g=rr+1.8; g<=rr+16; g+=1.5){ const c=pol(g+w/2,bis); cands.push({x:c[0]-up[0]*0.364*3, y:c[1]-up[1]*0.364*3, rot:a, anchor:'middle', pen:(g-rr)*0.5}); }
    if(omit(t,3,cands)) return; lab(t,3,col,eng.pick(t,3,cands)); };
  alongBis(`Az = ${fmtAngle(r.az)}`,'var(--success)',bisAz,R1);
  alongBis(`Rumbo = ${rum}`,'var(--blueprint)',bisRu,R2);
  // letras A y B hacia afuera de la línea
  [['A',Ax,Ay,-1],['B',Bx,By,1]].forEach(([nm,x,y,sg])=>{
    const dx=(Bx-Ax)*sg, dy=(By-Ay)*sg, l=Math.hypot(dx,dy)||1, ux=-dx/l, uy=-dy/l, cands=[];
    for(let rr=4.6; rr<=11; rr+=1.2) for(let da=-80; da<=80; da+=16){ const ca=Math.cos(da*Math.PI/180), sa=Math.sin(da*Math.PI/180); cands.push({x:x+(ux*ca-uy*sa)*rr, y:y+(ux*sa+uy*ca)*rr+1.6, anchor:'middle', pen:(rr-4.6)*1.5+Math.abs(da)*0.05}); }
    if(!deg) { cands.length=0; cands.push({x:x+6*sg*-1,y:y+1.6,anchor:'middle',pen:0}); }
    lab(nm,4.5,'var(--ink-soft)',eng.pick(nm,4.5,cands)); });
  // listado
  rows.forEach((q,i)=>{ const by=ROW_Y0+i*ROW_DY;
    out += `<rect x="10.03" y="${f(by-3.457)}" width="3.457" height="3.457" fill="${q.c}"/>\n<text x="15.21" y="${f(by)}" ${FONT} font-size="4.32"><tspan fill="${q.c}">${q.k}</tspan><tspan fill="var(--ink)"> = ${q.v}</tspan></text>\n`; });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">\n${out}</svg>`;
}

/* Diagrama de Distancia Punto-Línea — v2 (estándar de plantillas de Mario): recta A–B (extensión tenue), punto P, pie F con ángulo recto y
   perpendicular P→F (accent: es la magnitud estrella); tramo A→F en success y longitud A→B en blueprint; valores en el listado y en el dibujo. */
function svgDistPuntoLinea(e1, n1, e2, n2, ep, np, r, fuente){
  const K=svgKit(), eng=K.eng, f=K.f;
  K.north();
  K.list([[
    {k:'D',c:'var(--accent)',v:`${fmtNum(r.dist,3)} m`},
    {k:'A→F',c:'var(--success)',v:`${fmtNum(r.distDesdeA,3)} m`},
    {k:'A→B',c:'var(--blueprint)',v:`${fmtNum(r.len,3)} m`},
    {k:'Lado',c:'var(--ink)',v:r.lado},
    {k:'F Este',c:'var(--ink)',v:fmtNum(r.footE,3)},
    {k:'F Norte',c:'var(--ink)',v:fmtNum(r.footN,3)}]]);
  const box={l:62,r:268,t:Math.max(54,K.listBottom+8),b:164};
  const fit=K.fit([[e1,n1],[e2,n2],[ep,np],[r.footE,r.footN]],box);
  const A=[fit.X(e1),fit.Y(n1)], B=[fit.X(e2),fit.Y(n2)], P=[fit.X(ep),fit.Y(np)], F=[fit.X(r.footE),fit.Y(r.footN)];
  const dx=B[0]-A[0], dy=B[1]-A[1], len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
  const proj=q=>(q[0]-A[0])*ux+(q[1]-A[1])*uy;               // coordenada sobre la recta, medida desde A
  const tmin=Math.min(0,len,proj(F))-14, tmax=Math.max(0,len,proj(F))+14;
  const at=t=>[A[0]+ux*t, A[1]+uy*t];
  // recta: tramo A–B sólido y prolongaciones tenues
  if(tmin<0) K.line(...at(tmin),...at(0),'var(--blueprint)',{op:0.45,dash:'1.6 1.6'});
  if(tmax>len) K.line(...at(len),...at(tmax),'var(--blueprint)',{op:0.45,dash:'1.6 1.6'});
  K.line(...A,...B,'var(--blueprint)');
  // lado opuesto a P (para cotas y letras de la recta)
  const nrm=[-uy,ux], sP=((P[0]-A[0])*nrm[0]+(P[1]-A[1])*nrm[1])>=0?1:-1, away=[-nrm[0]*sP,-nrm[1]*sP], toP=[nrm[0]*sP,nrm[1]*sP];
  // perpendicular P→F y marca de ángulo recto
  K.line(...P,...F,'var(--accent)');
  const d=Math.hypot(P[0]-F[0],P[1]-F[1]);
  if(d>6){ const k=3, a=[F[0]+ux*k*Math.sign(proj(F)<len/2?1:-1)*1, F[1]+uy*k*Math.sign(proj(F)<len/2?1:-1)*1], v=[toP[0]*k,toP[1]*k], s=Math.sign(proj(F)<len/2?1:-1);
    K.poly([[F[0]+ux*s*k,F[1]+uy*s*k],[F[0]+ux*s*k+v[0],F[1]+uy*s*k+v[1]],[F[0]+v[0],F[1]+v[1]]],{stroke:'var(--ink-soft)',sw:0.6,obs:false}); }
  // cota A→F (success), paralela a la recta, del lado opuesto a P
  const off=5, a0=[A[0]+away[0]*off,A[1]+away[1]*off], f0=[F[0]+away[0]*off,F[1]+away[1]*off];
  if(Math.hypot(F[0]-A[0],F[1]-A[1])>2){
    K.line(...a0,...f0,'var(--success)',{sw:0.7});
    [A,F].forEach((q,i)=>{ const c=i?f0:a0; K.line(q[0]+away[0]*1.5,q[1]+away[1]*1.5,q[0]+away[0]*(off+1.6),q[1]+away[1]*(off+1.6),'var(--success)',{sw:0.6,noObs:false}); });
    K.lineLabel(...a0,...f0,`A→F = ${fmtNum(r.distDesdeA,3)} m`,3,'var(--success)',{out:away,extras:[0,3,6]});
  }
  // puntos y letras
  [A,B,P,F].forEach(q=>K.dot(q[0],q[1],'var(--ink-soft)',2));
  K.lineLabel(...P,...F,`D = ${fmtNum(r.dist,3)} m`,3,'var(--accent)',{out:[ux,uy]});
  K.lineLabel(...A,...B,`A→B = ${fmtNum(r.len,3)} m`,3,'var(--blueprint)',{out:toP,extras:[0,3,6]});
  const pdir=[P[0]-F[0],P[1]-F[1]], pl=Math.hypot(...pdir)||1;
  K.pointLabel('A',A[0],A[1],4.5,'var(--ink-soft)',{dir:away,full:true});
  K.pointLabel('B',B[0],B[1],4.5,'var(--ink-soft)',{dir:away,full:true});
  K.pointLabel('F',F[0],F[1],4.5,'var(--ink-soft)',{dir:away,full:true});
  K.pointLabel('P',P[0],P[1],4.5,'var(--ink-soft)',{dir:[pdir[0]/pl,pdir[1]/pl]});
  return K.svg();
}

/* Diagrama de Talud — v2 (estándar de plantillas de Mario): triángulo rectángulo esquemático (no a escala) con la distancia horizontal d
   (success), el desnivel h (danger), el talud (accent: es el resultado principal, a lo largo de la pendiente) y el ángulo α (blueprint) en A.
   Talud descendente (h<0) se dibuja hacia abajo. En el dibujo solo el carácter; los valores van en el listado. */
function svgTalud(h, d, r, fuente){
  const K=svgKit(), up=h>=0, col={d:'var(--success)',h:'var(--danger)',t:'var(--accent)',a:'var(--blueprint)'};
  K.list([[{k:'Talud',c:col.t,v:`${fmtNum(r.pendientePct,2)} %`},{k:'α',c:col.a,v:fmtAngle(r.anguloDeg)},{k:'H:V',c:'var(--ink)',v:`${fmtNum(r.relacion,2)} : 1`},{k:'d',c:col.d,v:`${fmtNum(d,2)} m`},{k:'h',c:col.h,v:`${fmtNum(h,2)} m`}]],{perCol:3});
  const top=Math.max(K.listBottom+12,46), bot=fuente?160:172, W=190, ang=toRad(Math.min(Math.max(Math.abs(r.anguloDeg),8),60));
  const rise=Math.min(W*Math.tan(ang),bot-top-6), x0=(320-W)/2-6, x1=x0+W, s=up?-1:1;
  const y0=up?(top+bot)/2+rise/2:(top+bot)/2-rise/2, y1=y0+s*rise, A=[x0,y0], B=[x1,y1], C=[x1,y0];
  const real=Math.atan2(y1-y0,x1-x0)*180/Math.PI, k=4;
  K.line(...A,...C,col.d,{sw:1.1}); K.line(...C,...B,col.h,{sw:1.1,dash:'3 2'}); K.line(...A,...B,col.t,{sw:1.6});
  K.poly([[C[0]-k,C[1]],[C[0]-k,C[1]+s*k],[C[0],C[1]+s*k]],{stroke:'var(--ink-soft)',sw:0.6,obs:false});
  K.arc(A[0],A[1],24,0,real,col.a,{sw:0.9});
  [A,B].forEach(q=>K.dot(q[0],q[1],'var(--ink-soft)',2));
  K.lineLabel(...A,...C,'d',4.5,col.d,{out:[0,-s],extras:[0,3,6]});
  K.lineLabel(...C,...B,'h',4.5,col.h,{out:[1,0],extras:[0,3,6]});
  K.lineLabel(...A,...B,'Talud',4.5,col.t,{at:0.5,out:[0,s],extras:[0,3,6]});
  const am=real/2*Math.PI/180; K.pointLabel('α',A[0]+24*Math.cos(am),A[1]+24*Math.sin(am),4.5,col.a,{dir:[Math.cos(am),Math.sin(am)],rmin:2,rmax:9});
  K.pointLabel('A',A[0],A[1],4.5,'var(--ink-soft)',{dir:[-1,-s*0.3],omit:false}); K.pointLabel('B',B[0],B[1],4.5,'var(--ink-soft)',{dir:[1,s*0.3],omit:false});
  if(fuente) K.add(svgFuente(fuente,320,190));

}

/* ---------- TALUDES EN CASCADA (BANCOS) ---------- */
/* Geometría de bancos escalonados desde el eje de camino: cada banco avanza en horizontal
   según su propio talud V:H y altura, y deja una berma antes de que empiece el siguiente
   banco (que se apila encima). Banco 1 es el más cercano al camino. */
function calcTaludBancosGeometry(glob, benches){
  const results = [];
  let x = Math.max(0, glob.halfWidth||0);
  let y = 0;
  benches.forEach(function(b, i){
    const V = (b.V && b.V>0) ? b.V : 1;
    const H = (b.H && b.H>=0) ? b.H : 0;
    const height = Math.max(0, b.height||0);
    const width = Math.max(0, b.width||0);
    const ratio = H / V;
    const run = height * ratio;
    const slopeLength = Math.sqrt(height*height + run*run);
    const toeX = x + run;
    const toeY = y + height;
    const crestX = toeX + width;
    const crestY = toeY;
    results.push({
      index:i, height:height, V:V, H:H, width:width, ratio:ratio, run:run, slopeLength:slopeLength,
      prevX:x, prevY:y, toeX:toeX, toeY:toeY, crestX:crestX, crestY:crestY,
      exceedsMax: (glob.maxHeight>0) && (height > glob.maxHeight)
    });
    x = crestX; y = crestY;
  });
  return results;
}

/* Diagrama de Taludes en Cascada (Bancos) — v2 (estándar de plantillas de Mario): sección transversal a escala con la plataforma y su
   pendiente de corona, el eje de camino punteado y el perfil escalonado. En el dibujo solo el carácter: H (altura de cada banco, accent, a la
   izquierda), D (distancia acumulada del eje al pie de cada banco, blueprint) y V:H (talud de cada banco, a lo largo de su pendiente); los
   valores ya están en la tabla del panel. El banco que supera la altura máxima se resalta en danger. Una leyenda al pie explica cada letra. */
function svgTaludBancos(glob, geo){
  const K=svgKit(), hw=Math.max(0,glob.halfWidth||0), drop=Math.max(0,hw*(glob.crownPct||0)/100), last=geo[geo.length-1];
  const totH=last?last.crestY:0, totX=last?last.crestX:hw;
  const x0=-hw-0.9, x1=totX+0.9, ymin=-(drop+0.55), ymax=totH+0.6;
  const box={l:24,r:310,t:8,b:168}, sc=Math.min(50,(box.r-box.l)/Math.max(1,x1-x0),(box.b-box.t)/Math.max(1,ymax-ymin));
  const ox=(box.l+box.r)/2-(x0+x1)/2*sc, oy=(box.t+box.b)/2+(ymin+ymax)/2*sc, X=w=>ox+w*sc, Y=w=>oy-w*sc;
  const colH='var(--accent)', colD='var(--blueprint)', base=Y(ymin+0.15);
  // terreno (relleno), eje y plataforma
  const g=[[X(-hw),base],[X(-hw),Y(0)],[X(0),Y(drop)],[X(hw),Y(0)]]; geo.forEach(q=>{ g.push([X(q.toeX),Y(q.toeY)]); g.push([X(q.crestX),Y(q.crestY)]); });
  g.push([g[g.length-1][0],base]); K.poly(g,{close:true,fill:'var(--paper-sunken)',obs:false});
  K.line(X(0),Y(ymax-0.15),X(0),base,'var(--ink-soft)',{sw:0.7,dash:'1 3',noObs:false});
  K.poly([[X(-hw),Y(0)],[X(0),Y(drop)],[X(hw),Y(0)]],{stroke:'var(--ink)',sw:1.4});
  const prof=[[X(hw),Y(0)]]; geo.forEach(q=>{ prof.push([X(q.toeX),Y(q.toeY)]); prof.push([X(q.crestX),Y(q.crestY)]); });
  geo.forEach(q=>{ if(q.exceedsMax) K.line(X(q.prevX),Y(q.prevY),X(q.toeX),Y(q.toeY),'var(--danger)',{sw:3,op:0.85,noObs:false}); });
  K.poly(prof,{stroke:'var(--ink)',sw:1.5});
  // cotas H (izquierda), D (a la altura de cada cresta) y rótulos
  const hx=X(x0+0.3), many=geo.length>6;
  geo.forEach((q,i)=>{
    K.line(hx,Y(q.prevY),hx,Y(q.toeY),colH,{sw:0.8}); [q.prevY,q.toeY].forEach(y=>K.line(hx-1.6,Y(y),hx+1.6,Y(y),colH,{sw:0.7,noObs:false}));
    K.lineLabel(hx,Y(q.prevY),hx,Y(q.toeY),'H',4.5,colH,{out:[-1,0],extras:[0,3]});
    const dy=Y(q.crestY)-2.5; K.line(X(0),dy,X(q.toeX),dy,colD,{sw:0.8}); [0,q.toeX].forEach(x=>K.line(X(x),dy-1.6,X(x),dy+1.6,colD,{sw:0.7,noObs:false}));
    K.lineLabel(X(0),dy,X(q.toeX),dy,'D',4.5,colD,{out:[0,-1],extras:[0,3]});
    if(!many||i%2===0) K.lineLabel(X(q.prevX),Y(q.prevY),X(q.toeX),Y(q.toeY),'V:H',3.2,'var(--ink-soft)',{out:[-1,0],extras:[0,2,4]});
    K.pointLabel('B'+(i+1),(X(q.toeX)+X(q.crestX))/2,Y(q.crestY),3.6,'var(--ink)',{dir:[0,-1],rmin:3,rmax:9,omit:false});
  });
  // leyenda al pie
  K.eng.rectFill(box.l,176,box.l+160,188);
  K.add(`<text x="${box.l}" y="185" ${K.FONT} font-size="3.8"><tspan fill="${colH}">H</tspan><tspan fill="var(--ink-soft)"> altura   </tspan><tspan fill="${colD}">D</tspan><tspan fill="var(--ink-soft)"> dist. acum.   </tspan><tspan fill="var(--ink)">V:H</tspan><tspan fill="var(--ink-soft)"> talud</tspan></text>\n`);
  return K.svg();
}

/* Diagrama de Inversa Múltiple — v2 (estándar de plantillas de Mario): recorrido abierto A→B→C… a escala con norte arriba; la distancia
   (accent: magnitud estrella) se rotula a lo largo de cada tramo y el total va en el listado (con cada tramo si son ≤ 8). El azimut y el rumbo de
   cada tramo ya están en la tabla del panel. Con más de 8 tramos el rótulo lleva solo el valor; rótulo sin lugar libre → se omite del dibujo. */
function svgInversaMultiple(pts, tramos){
  const K=svgKit(), n=pts.length, many=tramos.length>8, f=K.f;
  const total=tramos.reduce((s,t)=>s+t.dist,0);
  K.north();
  const rows=[{k:'Total',c:'var(--accent)',v:`${fmtNum(total,3)} m`}];
  if(!many) tramos.forEach((t,i)=>rows.push({k:`${POL_LABELS[i]}→${POL_LABELS[i+1]}`,c:'var(--accent)',v:`${fmtNum(t.dist,3)} m`}));
  K.list([rows]);
  const fit=K.fit(pts.map(p=>[p.e,p.n]),{l:22,r:288,t:Math.max(22,K.listBottom+7),b:176});
  const Q=pts.map(p=>[fit.X(p.e),fit.Y(p.n)]);
  K.poly(Q,{stroke:'var(--accent)',sw:0.9});
  Q.forEach(q=>K.dot(q[0],q[1],'var(--ink-soft)',2));
  // letras de los puntos: hacia afuera de la quebrada
  const unit=(a,b)=>{const dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy); return l>1e-6?[dx/l,dy/l]:null;};
  Q.forEach((q,i)=>{
    const v1=i>0?unit(q,Q[i-1]):null, v2=i<n-1?unit(q,Q[i+1]):null;
    let d=null;
    if(v1&&v2){ const s=[v1[0]+v2[0],v1[1]+v2[1]], l=Math.hypot(...s); d=l>0.3?[-s[0]/l,-s[1]/l]:[-v1[1],v1[0]]; }
    else if(v1) d=[-v1[0],-v1[1]]; else if(v2) d=[-v2[0],-v2[1]];
    K.pointLabel(POL_LABELS[i],q[0],q[1],4.5,'var(--ink-soft)',{dir:d||undefined,full:!d||(v1&&v2),omit:false});
  });
  // distancia de cada tramo, a lo largo de él (lado exterior del giro si lo hay)
  tramos.forEach((t,i)=>{
    const a=Q[i], b=Q[i+1]; if(Math.hypot(b[0]-a[0],b[1]-a[1])<6) return;
    K.lineLabel(a[0],a[1],b[0],b[1],many?fmtNum(t.dist,2):`${fmtNum(t.dist,2)} m`,3,'var(--accent)',{extras:[0,3,6]});
  });
  return K.svg();
}

/* Diagrama de Chequeo de Nivel (prueba de las dos estacas) — v2 (estándar de plantillas de Mario): dos cortes esquemáticos del mismo par de
   miras A y B; arriba la posición 1 (nivel centrado, blueprint) y abajo la posición 2 (nivel cerca de A, accent: es la que delata el error de
   colimación). Cada visual es la recta real que pasa por sus dos lecturas (a, b) y por el instrumento; la horizontal punteada por el
   instrumento muestra su inclinación. La separación vertical entre lecturas se exagera (esquemático). En el dibujo solo el carácter; los
   valores van en el listado (error E, desniveles, lecturas, D, d y lectura correcta en B). */
function svgNivelDosEstacas(a1,b1,a2,b2,D,d,r){
  const K=svgKit(), c1='var(--blueprint)', c2='var(--accent)';
  K.list([[{k:'E',c:c2,v:`${fmtNum(Math.abs(r.errMM30)<0.05?0:r.errMM30,1)} mm/30 m`},{k:'ΔH ver.',c:c1,v:`${fmtNum(r.dhTrue,4)} m`},{k:'ΔH apar.',c:c2,v:`${fmtNum(r.dhApp,4)} m`},{k:'b2 corr.',c:c2,v:`${fmtNum(r.bCorrecta,4)} m`}],
    [{k:'a1',c:c1,v:`${fmtNum(a1,3)} m`},{k:'b1',c:c1,v:`${fmtNum(b1,3)} m`},{k:'a2',c:c2,v:`${fmtNum(a2,3)} m`},{k:'b2',c:c2,v:`${fmtNum(b2,3)} m`}],
    [{k:'D',c:'var(--ink)',v:`${fmtNum(D,2)} m`},{k:'d',c:'var(--ink-soft)',v:`${fmtNum(d,2)} m`}]],{perCol:4});
  const xA=52, xB=268, maxV=Math.max(Math.abs(a1),Math.abs(b1),Math.abs(a2),Math.abs(b2),0.01), kk=36/maxV, sh=34;
  const xi2=xA+Math.min(Math.max(d/Math.max(D,1e-9),0),1)*(xB-xA), xi1=(xA+xB)/2;
  const panel=(g,a,b,xi,col,name)=>{
    const ya=g-a*kk, yb=g-b*kk, yi=ya+(yb-ya)*(xi-xA)/(xB-xA);
    K.line(xA-18,g,xB+18,g,'#8B6B47',{sw:1,noObs:false});
    K.line(xA,g,xA,g-sh-10,'var(--ink-soft)',{sw:1.2,noObs:false}); K.line(xB,g,xB,g-sh-10,'var(--ink-soft)',{sw:1.2,noObs:false});
    K.line(xA-8,yi,xB+8,yi,'var(--ink-soft)',{sw:0.6,dash:'1.6 1.6'});
    K.line(xA,ya,xB,yb,col,{sw:1.1}); K.line(xi,yi,xi,g,'var(--ink)',{sw:0.9,noObs:false});
    K.dot(xA,ya,col,2); K.dot(xB,yb,col,2); K.dot(xi,yi,'var(--ink)',2.4);
    K.pointLabel(name==='1'?'a1':'a2',xA,ya,4.5,col,{dir:[-1,0],omit:false,rmin:3.5,rmax:10});
    K.pointLabel(name==='1'?'b1':'b2',xB,yb,4.5,col,{dir:[1,0],omit:false,rmin:3.5,rmax:10});
    K.pointLabel('A',xA,g,4.5,'var(--ink-soft)',{dir:[0,1],omit:false,rmin:3.5,rmax:10}); K.pointLabel('B',xB,g,4.5,'var(--ink-soft)',{dir:[0,1],omit:false,rmin:3.5,rmax:10});
    K.pointLabel('Nivel '+name,xi,g,3.6,col,{dir:[0,1],omit:false,rmin:3.5,rmax:12});
    return {ya,yb,yi};
  };
  panel(94,a1,b1,xi1,c1,'1'); panel(160,a2,b2,xi2,c2,'2');
  // D y d al pie
  const yD=179; K.line(xA,yD,xB,yD,'var(--ink)',{sw:0.8}); [xA,xB].forEach(x=>K.line(x,yD-2,x,yD+2,'var(--ink)',{sw:0.8,noObs:false})); K.lineLabel(xA,yD,xB,yD,'D',4.5,'var(--ink)',{at:0.7,out:[0,1],extras:[0,2]});
  if(xi2-xA>6){ K.line(xA,yD,xi2,yD,'var(--ink-soft)',{sw:1.4,noObs:false}); K.lineLabel(xA,yD,xi2,yD,'d',4.5,'var(--ink-soft)',{at:0.5,out:[0,-1],extras:[0,2]}); }
  return K.svg();
}

/* Diagrama de chequeo por dos caras (CI/CD): panel izquierdo = colimación horizontal
   (vista en planta), panel derecho = índice vertical (vista de perfil desde el cenit). */
/* Diagrama de Chequeo de Teodolito (dos caras) — v2 (estándar de plantillas de Mario): dos esquemas con el mismo centro de instrumento;
   izquierda, vista en planta de la colimación horizontal (rayo CI en blueprint, rayo CD en success, arco C en accent = error de colimación);
   derecha, vista de perfil del índice vertical con el cenit arriba (rayos ZI/ZD, arco i en accent). La separación entre rayos se exagera
   (esquemática, no a escala); si el error es 0 los rayos coinciden y no se dibuja el arco. En el dibujo solo el carácter; valores en el listado. */
function svgTeodolitoDosCaras(hzFL,hzFR,zFL,zFR,r){

    [{k:'ZI',c:cb,v:fmtAngle(zFL)},{k:'ZD',c:cs,v:fmtAngle(zFR)},{k:'i',c:ca,v:sec(r.isec)},{k:'Z medio',c:ci,v:fmtAngle(r.zMean)}]],{perCol:4,gap:14});

    if(s){ K.arc(cx,cy,arm*0.45,az-90,az2-90,ca,{sw:1});
      const bm=(az+az2)/2, q=P(bm,arm*0.45); K.pointLabel(cl,q[0],q[1],4.5,ca,{dir:[Math.cos(rad(bm-90)),Math.sin(rad(bm-90))],rmin:2.5,rmax:9,omit:false}); }
    K.dot(cx,cy,ci,2.4);
    const d1=[Math.cos(rad(az-90)),Math.sin(rad(az-90))], d2=[Math.cos(rad(az2-90)),Math.sin(rad(az2-90))];
    K.pointLabel(l1,p1[0],p1[1],4.5,cb,{dir:d1,omit:false,rmin:4,rmax:12}); K.pointLabel(l2,p2[0],p2[1],4.5,cs,{dir:d2,omit:false,rmin:4,rmax:12});

  panel(80,hzFL,r.C,'CI','CD','C','Colimación horizontal',false);

  K.line(160,44,160,176,'var(--line)',{sw:0.6,noObs:true});

}

/* Diagrama de la línea base A-B-C para la constante aditiva del EDM. */

/* Diagrama de Cota por Progresiva y Pendiente — v2 (estándar de plantillas de Mario): perfil esquemático (no a escala, pendiente exagerada)
   del tramo recto desde el origen (Kini, Cini) hasta la progresiva evaluada (Keval): la pendiente S (blueprint) a lo largo de la línea, la
   distancia parcial D (success) en horizontal y el desnivel ΔH (danger) en vertical. La cota evaluada Ceval (accent: resultado principal) es el
   punto final. En el dibujo solo el carácter; los valores van en el listado. */
function svgCotaProgresiva(Kini,Cini,S,Keval,r){
  const K=svgKit(), col={S:'var(--blueprint)',D:'var(--success)',dH:'var(--danger)',C:'var(--accent)'};
  K.list([[{k:'Ceval',c:col.C,v:`${fmtNum(r.Ceval,3)} m`},{k:'Cini',c:'var(--ink)',v:`${fmtNum(Cini,3)} m`},{k:'S',c:col.S,v:`${fmtNum(S,2)} %`},{k:'D',c:col.D,v:`${fmtNum(r.D,2)} m`},{k:'ΔH',c:col.dH,v:`${fmtNum(r.dH,3)} m`},{k:'Kini',c:'var(--ink-soft)',v:`${fmtNum(Kini,2)} m`},{k:'Keval',c:'var(--ink-soft)',v:`${fmtNum(Keval,2)} m`}]],{perCol:4});
  const flat=Math.abs(S)<1e-9, up=S>=0, s=up?-1:1, top=Math.max(K.listBottom+12,48), bot=168, W=190;
  const ang=toRad(Math.min(Math.max(Math.abs(Math.atan(S/100))*180/Math.PI*6,7),32)), rise=flat?0:Math.min(W*Math.tan(ang),bot-top-8);
  const x0=(320-W)/2-6, x1=x0+W, y0=up?(top+bot)/2+rise/2:(top+bot)/2-rise/2, y1=y0+s*rise, A=[x0,y0], B=[x1,y1], C=[x1,y0];
  K.line(...A,...C,col.D,{sw:1.1,dash:'3 2'}); if(!flat) K.line(...C,...B,col.dH,{sw:1.1}); K.line(...A,...B,col.S,{sw:1.6});

  K.lineLabel(xEje,yd,xR,yd,'d',4.5,col.d,{out:[0,1],extras:[0,3]});
