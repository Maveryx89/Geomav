/* ---------- REPLANTEO DE CURVA CIRCULAR ---------- */
let repN = 5;
function renderReplanteo(){
  const bodyFieldsHtml = (mode)=> curvaBodyFieldsHtml(mode, 'rp_');
  const body = `<div class="field-card">
    <div class="field-row"><label>Datos que conoces</label>${curvaModeSelectHtml('rp_mode','R_D')}</div>
    <div id="rp_fields">${bodyFieldsHtml('R_D')}</div>
    ${fieldRow('Progresiva del PC (opcional, m)','rp_pc','')}
    <div class="field-row"><label>Método de replanteo</label>
      <select id="rp_metodo">
        <option value="n" selected>Por número de puntos (equiespaciados)</option>
        <option value="paso">Por paso fijo (cada X metros)</option>
      </select>
    </div>
    <div class="field-row" id="rp_n_wrap"><label>Puntos a replantear</label>
      <div class="n-stepper"><button type="button" id="rpMinus">−</button><span class="n-val" id="rpNVal">${repN}</span><button type="button" id="rpPlus">+</button></div>
    </div>
    <div id="rp_paso_wrap" style="display:none;">${fieldRow('Paso de replanteo (m)','rp_paso',5)}</div>
    <button class="btn" id="btnRP" type="button">Generar Tabla</button>
    <div id="resRP"></div>
  </div>`;
  toolShell('replanteo','Genera la tabla de deflexión para replantear una curva circular en terreno con teodolito. Ingresa el radio o la deflexión junto con cualquier otro elemento conocido (tangente, longitud de curva, cuerda larga, externa u ordenada media), y replantea por número de puntos o cada un paso fijo en metros.', body, ['R','Δ','T','Lc','C','E','M','PC','PT']);

  const modeSelect = document.getElementById('rp_mode');
  const fieldsDiv = document.getElementById('rp_fields');
  modeSelect.addEventListener('change', ()=>{ fieldsDiv.innerHTML = bodyFieldsHtml(modeSelect.value); });

  const metodoSelect = document.getElementById('rp_metodo');
  const nWrap = document.getElementById('rp_n_wrap'), pasoWrap = document.getElementById('rp_paso_wrap');
  metodoSelect.addEventListener('change', ()=>{
    const porPaso = metodoSelect.value==='paso';
    nWrap.style.display = porPaso ? 'none' : '';
    pasoWrap.style.display = porPaso ? '' : 'none';
  });

  document.getElementById('rpMinus').addEventListener('click', ()=>{ if(repN>2){repN--; document.getElementById('rpNVal').textContent=repN;}});
  document.getElementById('rpPlus').addEventListener('click', ()=>{ if(repN<20){repN++; document.getElementById('rpNVal').textContent=repN;}});

  document.getElementById('btnRP').addEventListener('click', ()=>{
    const mode = modeSelect.value;
    const {v1, v2} = readCurvaModeInputs(mode, 'rp_');
    const box=document.getElementById('resRP');
    if(isNaN(v1)||isNaN(v2)){ box.innerHTML=`<p class="err-msg">Completa ambos valores.</p>`; return; }
    const {R,Ddeg} = resolveCurvaCircular(mode, v1, v2);
    if(!isFinite(R) || !isFinite(Ddeg) || R<=0 || Ddeg<=0 || Ddeg>=180){
      box.innerHTML=`<p class="err-msg">Esa combinación de valores no forma una curva válida — revisa los datos (por ejemplo, una cuerda no puede ser mayor que el diámetro).</p>`; return;
    }
    const Lc = R*toRad(Ddeg);

    let rows;
    if(metodoSelect.value==='paso'){
      const paso = val('rp_paso');
      if(isNaN(paso) || paso<=0){ box.innerHTML=`<p class="err-msg">Ingresa un paso de replanteo mayor que 0.</p>`; return; }
      rows = [];
      let Li = paso;
      while(Li < Lc - 1e-9){
        const defl = (Li/Lc)*(Ddeg/2);
        rows.push({Li, defl, cuerda: 2*R*Math.sin(toRad(defl))});
        Li += paso;
      }
      const deflFinal = Ddeg/2;
      rows.push({Li:Lc, defl:deflFinal, cuerda: 2*R*Math.sin(toRad(deflFinal))});
    } else {
      rows = calcTablaDeflexion(R,Ddeg,repN).rows;
    }

    const pcProg = val('rp_pc');
    const conProg = !isNaN(pcProg);
    let trs='';
    rows.forEach((row,i)=>{
      const prog = conProg ? fmtNum(pcProg+row.Li,3) : `P${i+1}`;
      trs += `<tr><td>${prog}</td><td>${fmtNum(row.Li,2)}</td><td>${fmtAngle(row.defl)}</td><td>${fmtNum(row.cuerda,3)}</td></tr>`;
    });
    box.innerHTML = `<div class="results" style="margin-top:14px;">
      <div class="result-row"><span class="k">Radio (R)</span><span class="v${mode[0]==='R'?'':' accent'}">${fmtNum(R,3)} m</span></div>
      <div class="result-row"><span class="k">Deflexión (Δ)</span><span class="v${mode[0]==='D'?'':' accent'}">${fmtAngle(Ddeg)}</span></div>
      <div class="result-row"><span class="k">Longitud de curva (Lc)</span><span class="v accent big">${fmtNum(Lc,3)} m</span></div>
      <div class="table-wrap" style="margin-top:10px;"><table class="data-table"><thead><tr><th>${conProg?'Progresiva':'Punto'}</th><th>Dist. acum.</th><th>Deflexión</th><th>Cuerda parcial</th></tr></thead><tbody>${trs}</tbody></table></div>
      <div class="plot-wrap">${svgCurvaArco(R,Ddeg, rows.map(r=>({frac:r.Li/Lc})), null, null, R*Math.tan(toRad(Ddeg/2)), {Lc:Lc,star:'Lc'})}</div>
    </div>`;
  });
}

      <div class="result-row"><span class="k">Cota borde interior (resp. al eje)</span><span class="v">${clean0(bordes.cotaInt)>=0?'+':''}${fmtNum(clean0(bordes.cotaInt),3)} m</span></div>
      <div class="plot-wrap">${svgPeralteSeccion(e,ancho,bordes.cotaExt,bordes.cotaInt)}</div>
      ${tablaHtml}
    </div>`;
  });
}

  toolShell('nivelDif','Nivelación diferencial por vistas atrás (BS) y adelante (FS): calcula la altura de instrumento y la cota de cada punto de cambio.', body, ['BS','FS','HI']);
  const draw = ()=>{

        </div>
      </div>`;
    }
    document.getElementById('ndFilas').innerHTML = html;
  };
  draw();
  document.getElementById('ndMinus').addEventListener('click', ()=>{ if(ndN>1){ndN--; document.getElementById('ndNVal').textContent=ndN; draw();}});
  document.getElementById('ndPlus').addEventListener('click', ()=>{ if(ndN<25){ndN++; document.getElementById('ndNVal').textContent=ndN; draw();}});

    const cota0=val('nd_cota0'); const box=document.getElementById('resND');
    if(isNaN(cota0)){ box.innerHTML=`<p class="err-msg">Ingresa la cota de partida.</p>`; return; }

    for(let i=0;i<ndN;i++){
      const bsRaw=document.getElementById(`nd_bs_${i}`).value, fsRaw=document.getElementById(`nd_fs_${i}`).value;
      filas.push({bs: bsRaw===''?NaN:parseFloat(bsRaw), fs: fsRaw===''?NaN:parseFloat(fsRaw)});
    }
    const out = calcNivelacionDiferencial(cota0, filas);
    let rows='';

    out.forEach((o,i)=>{
      rows += `<tr><td>V${i+1}</td><td>${isNaN(o.bs)?'—':fmtNum(o.bs,3)}</td><td>${isNaN(o.fs)?'—':fmtNum(o.fs,3)}</td><td>${o.hi!==null?fmtNum(o.hi,3):'—'}</td><td>${fmtNum(o.cota,3)}</td></tr>`;
      cotas.push(o.cota);
    });
    const cotaFRaw = document.getElementById('nd_cotaF').value;
    let cierreRow='';
    if(cotaFRaw!==''){
      const cotaFconocida = parseFloat(cotaFRaw);
      const cotaFcalc = out[out.length-1].cota;
      const errCierre = cotaFcalc - cotaFconocida;
      cierreRow = `<div class="result-row"><span class="k">Error de cierre</span><span class="v ${Math.abs(errCierre)<0.01?'accent':''}">${errCierre>=0?'+':''}${fmtNum(errCierre,4)} m</span></div>`;

    box.innerHTML = `<div class="results" style="margin-top:14px;">
      ${cierreRow}
      <div class="table-wrap" style="margin-top:${cierreRow?'10px':'0'};"><table class="data-table"><thead><tr><th>Vista</th><th>BS</th><th>FS</th><th>H.I.</th><th>Cota</th></tr></thead><tbody>${rows}</tbody></table></div>

    </div>`;
  });
}

/* Diagrama de sección mixta corte/terraplén, repartida a cada lado de la línea de rasante */
function svgCorteTerraplen(Sc, St, fuente){
  const w=280,h=150,pad=26;
  const baseY=h/2;
  const maxA=Math.max(Sc,St,0.001);
  const hFor=A=>(A/maxA)*(h/2-pad);
  const hc=hFor(Sc), ht=hFor(St);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${baseY}" x2="${w-pad}" y2="${baseY}" stroke="var(--line-strong)" stroke-width="1.2"/>
    <rect x="${w/2-40}" y="${(baseY-hc).toFixed(1)}" width="80" height="${hc.toFixed(1)}" fill="var(--blueprint-soft)" stroke="var(--blueprint)" stroke-width="1.4"/>
    <rect x="${w/2-40}" y="${baseY.toFixed(1)}" width="80" height="${ht.toFixed(1)}" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="1.4"/>
    <text x="${w/2}" y="${(baseY-hc-8).toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--blueprint)" text-anchor="middle">Sc (corte) = ${fmtNum(Sc,2)} m²</text>
    <text x="${w/2}" y="${(baseY+ht+14).toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--accent-text)" text-anchor="middle">St (terraplén) = ${fmtNum(St,2)} m²</text>
    ${fuente?svgFuente(fuente,w,h):''}
  </svg>`;
}

/* ---------- TEOREMA DE PITAGORAS ---------- */
function renderPitagoras(){
  const body = `
  <div class="field-card">
    <h3>Escribe 2 datos — el tercero se calcula solo</h3>
    ${fieldRow('Cateto a (m)','pi_a',3)}
    ${fieldRow('Cateto b (m)','pi_b',4)}
    ${fieldRow('Hipotenusa c (m)','pi_c',5)}
    <div id="pi_err"></div>
    <div class="plot-wrap" id="pi_plot"></div>
  </div>`;
  toolShell('pitagoras','c² = a² + b². Escribe cualquiera de los tres datos — los dos catetos, o un cateto y la hipotenusa — y el que falta se completa de inmediato. Útil para calcular distancias y alturas indirectas, y para comprobar escuadras en terreno (regla 3-4-5).', body, ['a','b','c']);

  const aEl=document.getElementById('pi_a'), bEl=document.getElementById('pi_b'), cEl=document.getElementById('pi_c');
  const errBox=document.getElementById('pi_err'), plotBox=document.getElementById('pi_plot');
  let updating=false;

  function redraw(){
    const a=val('pi_a'), b=val('pi_b'), c=val('pi_c');
    plotBox.innerHTML = ([a,b,c].every(n=>isFinite(n)&&n>0)) ? svgPitagoras(a,b,c) : '';
  }

  // Editar un cateto (a o b) siempre recalcula la hipotenusa (c).
  function fromAB(){
    if(updating) return;
    const a=val('pi_a'), b=val('pi_b');
    if(isNaN(a)||isNaN(b)||a<=0||b<=0) return;
    updating=true;
    cEl.value = round(calcPitagorasHipotenusa(a,b),4);
    updating=false;
    errBox.innerHTML='';
    redraw();
  }
  // Editar la hipotenusa (c) recalcula el cateto b a partir del cateto a vigente
  // (si a no calza con c, se recalcula a a partir de b en su lugar).
  function fromC(){
    if(updating) return;
    const c=val('pi_c');
    if(isNaN(c)||c<=0) return;
    const a=val('pi_a'), b=val('pi_b');
    updating=true;
    if(!isNaN(a) && a>0 && a<c){
      bEl.value = round(calcPitagorasCateto(c,a),4);
      errBox.innerHTML='';
    } else if(!isNaN(b) && b>0 && b<c){
      aEl.value = round(calcPitagorasCateto(c,b),4);
      errBox.innerHTML='';
    } else {
      errBox.innerHTML = `<p class="err-msg">La hipotenusa debe ser mayor que el cateto conocido.</p>`;
    }
    updating=false;
    redraw();
  }

  aEl.addEventListener('input', fromAB);
  bEl.addEventListener('input', fromAB);
  cEl.addEventListener('input', fromC);
  redraw();
}

/* Diagrama del Eje de Proyecto Vial — v2 (estándar de plantillas de Mario): polilínea del eje a escala (blueprint) con vértices V0..Vn,
   norte arriba y estaca (accent: es el resultado principal) cuando se busca una progresiva. Hasta 8 tramos: cada tramo lleva su letra
   L(i) (blueprint) y Az(i) (success) y todos los valores van en el listado; con más tramos el dibujo lleva solo la longitud de cada uno
   y el listado el resumen. Rótulo sin lugar libre → se omite del dibujo (el valor queda en el listado). */
function svgEjePolilinea(verts, estaca, fuente){
  const K=svgKit(), n=verts.length-1, few=n<=8;
  K.north();
  const seg=i=>{ const dx=verts[i+1].X-verts[i].X, dy=verts[i+1].Y-verts[i].Y; return {L:Math.hypot(dx,dy), az:((Math.atan2(dx,dy)*180/Math.PI)%360+360)%360}; };
  const S=[]; for(let i=0;i<n;i++) S.push(seg(i));
  const tot=verts[n].km-verts[0].km;
  const b1=[{k:'Largo total',c:'var(--blueprint)',v:`${fmtNum(tot,2)} m`},{k:'Km inicial',c:'var(--ink)',v:`${fmtNum(verts[0].km,2)} m`},{k:'Km final',c:'var(--ink)',v:`${fmtNum(verts[n].km,2)} m`}];
  if(estaca&&estaca.km!==undefined) b1.push({k:'Estaca',c:'var(--accent)',v:`${fmtNum(estaca.km,2)} m`});
  const blocks=[b1];
  if(few){ blocks.push(S.map((s,i)=>({k:'L'+(i+1),c:'var(--blueprint)',v:`${fmtNum(s.L,2)} m`}))); blocks.push(S.map((s,i)=>({k:'Az'+(i+1),c:'var(--success)',v:fmtAngle(s.az)}))); }
  K.list(blocks,{gap:9});
  const box={l:28,r:272,t:Math.max(44,K.listBottom+8),b:fuente?158:172};
  const pts=verts.map(v=>[v.X,v.Y]); if(estaca) pts.push([estaca.X,estaca.Y]);
  const fit=K.fit(pts,box), P=verts.map(v=>[fit.X(v.X),fit.Y(v.Y)]), E=estaca?[fit.X(estaca.X),fit.Y(estaca.Y)]:null;
  K.poly(P,{stroke:'var(--blueprint)',sw:1.3});
  P.forEach(q=>K.dot(q[0],q[1],'var(--ink-soft)',2));
  if(E) K.dot(E[0],E[1],'var(--accent)',2.6);
  // letras de vértices hacia el exterior del giro
  const st=thinLabelStep(n+1,12), unit=(a,b)=>{ const l=Math.hypot(b[0]-a[0],b[1]-a[1])||1; return [(b[0]-a[0])/l,(b[1]-a[1])/l]; };
  P.forEach((q,i)=>{ if(i%st!==0&&i!==n) return; let d;
    if(i===0) d=[-unit(q,P[1])[0],-unit(q,P[1])[1]]; else if(i===n) d=unit(P[n-1],q);
    else { const a=unit(P[i-1],q), b=unit(q,P[i]); d=[a[0]-b[0],a[1]-b[1]]; const l=Math.hypot(...d); d=l<0.3?[-a[1],a[0]]:[d[0]/l,d[1]/l]; }
    K.pointLabel('V'+i,q[0],q[1],4.5,'var(--ink-soft)',{dir:d,full:false}); });
  // rótulos de tramo
  for(let i=0;i<n;i++){ const a=P[i], b=P[i+1];
    if(few){ K.lineLabel(...a,...b,'L'+(i+1),3.6,'var(--blueprint)',{out:[0,-1]}); K.lineLabel(...a,...b,'Az'+(i+1),3.6,'var(--success)',{out:[0,1]}); }
    else if(n<=14) K.lineLabel(...a,...b,fmtNum(S[i].L,1),3,'var(--blueprint)',{out:[0,-1]}); }
  if(E){ const lbl=estaca.km!==undefined?`Km ${fmtNum(estaca.km,2)}`:'Estaca'; K.pointLabel(lbl,E[0],E[1],3.6,'var(--accent)',{rmin:5,rmax:16}); }
  if(fuente) K.add(svgFuente(fuente,320,190));
  return K.svg();
}

let ejeN = 2;
let ejeVertsCache = [], ejeTramosCache = [];
function renderEjeProyecto(){
  const body = `<div class="field-card">
    <h3>Punto de partida del eje</h3>
    <div class="field-inline2">
      ${fieldRow('Progresiva inicial (m)','ej_km0',0)}
      ${fieldRow('Coordenada Este inicial','ej_x0',5000)}
    </div>
    ${fieldRow('Coordenada Norte inicial','ej_y0',10000)}
  </div>
  <div class="field-row"><label>Número de tramos (rectos, entre vértices)</label>
    <div class="n-stepper"><button type="button" id="ejMinus">−</button><span class="n-val" id="ejNVal">${ejeN}</span><button type="button" id="ejPlus">+</button></div>
  </div>
  <div id="ejTramos"></div>
  <button class="btn" id="btnEJ" type="button">Calcular Vértices del Eje</button>
  <div id="resEJ"></div>
  <div class="field-card" style="margin-top:14px;">
    <h3>Buscar estaca a una progresiva</h3>
    <p class="tool-blurb" style="margin-top:0;">Primero calcula los vértices del eje arriba; luego ingresa una progresiva dentro de alguno de los tramos.</p>
    ${fieldRow('Progresiva de la estaca (m)','ej_kmBuscar',0)}
    <button class="btn" id="btnEJEst" type="button">Buscar Estaca</button>
    <div id="resEJEst"></div>
  </div>`;
  toolShell('ejeProyecto','Traza el eje de un proyecto vial como una serie de tramos rectos encadenados por azimut y longitud (progresiva), obteniendo las coordenadas de cada vértice — y permite ubicar la estaca correspondiente a cualquier progresiva intermedia.', body);
  const draw = ()=>{
    let html='';
    for(let i=0;i<ejeN;i++){
      html += `<div class="station-block">
        <div class="st-label">Tramo ${i+1}</div>
        ${angleFieldHTML(`ej_az_${i}`, 30+i*20, 'Azimut')}
        <div class="field-row"><label>Longitud (m)</label><input type="number" step="any" id="ej_l_${i}" value="${100+i*50}"></div>
      </div>`;
    }
    document.getElementById('ejTramos').innerHTML = html;
  };
  draw();
  document.getElementById('ejMinus').addEventListener('click', ()=>{ if(ejeN>1){ejeN--; document.getElementById('ejNVal').textContent=ejeN; draw();}});
  document.getElementById('ejPlus').addEventListener('click', ()=>{ if(ejeN<20){ejeN++; document.getElementById('ejNVal').textContent=ejeN; draw();}});
  document.getElementById('btnEJ').addEventListener('click', ()=>{
    const km0=val('ej_km0'), x0=val('ej_x0'), y0=val('ej_y0');
    const box=document.getElementById('resEJ');
    if([km0,x0,y0].some(isNaN)){ box.innerHTML=`<p class="err-msg">Completa el punto de partida.</p>`; return; }
    const tramos=[];
    for(let i=0;i<ejeN;i++){
      const az=readAngleField(`ej_az_${i}`), l=val(`ej_l_${i}`);
      if(isNaN(az)||isNaN(l)||l<=0){ box.innerHTML=`<p class="err-msg">Completa azimut y longitud (mayor a 0) de todos los tramos.</p>`; return; }
      tramos.push({azDeg:az, long:l});
    }
    const verts = calcVerticesEje({km:km0,X:x0,Y:y0}, tramos);
    ejeVertsCache = verts; ejeTramosCache = tramos;
    let trs=''; verts.forEach((v,i)=>{ trs += `<tr><td>V${i}</td><td>${fmtNum(v.km,3)}</td><td>${fmtNum(v.X,3)}</td><td>${fmtNum(v.Y,3)}</td></tr>`; });
    box.innerHTML = `<div class="results" style="margin-top:14px;">
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Vértice</th><th>Progresiva (m)</th><th>Este</th><th>Norte</th></tr></thead><tbody>${trs}</tbody></table></div>
      <div class="plot-wrap">${svgEjePolilinea(verts, null, "complemento — extiende la progresiva de 'curva'/'clotoide' a tramos rectos")}</div>
    </div>`;
    addCSVButton(box, 'eje_proyecto.csv', 'vertice,progresiva,este,norte\n'+verts.map((v,i)=>`V${i},${v.km},${v.X},${v.Y}`).join('\n'));
  });
  document.getElementById('btnEJEst').addEventListener('click', ()=>{
    const km = val('ej_kmBuscar');
    const box=document.getElementById('resEJEst');
    if(isNaN(km)){ box.innerHTML=`<p class="err-msg">Ingresa una progresiva.</p>`; return; }
    if(!ejeVertsCache.length){ box.innerHTML=`<p class="err-msg">Primero calcula los vértices del eje.</p>`; return; }
    let i=-1;
    for(let k=0;k<ejeTramosCache.length;k++){ if(km>=ejeVertsCache[k].km && km<=ejeVertsCache[k+1].km){ i=k; break; } }
    if(i===-1){ box.innerHTML=`<p class="err-msg">Esa progresiva está fuera del rango del eje calculado (${fmtNum(ejeVertsCache[0].km,3)} a ${fmtNum(ejeVertsCache[ejeVertsCache.length-1].km,3)} m).</p>`; return; }
    const r = calcEstacaEnTramo(ejeVertsCache[i], ejeTramosCache[i].azDeg, km);
    box.innerHTML = `<div class="results" style="margin-top:12px;">
      <div class="result-row"><span class="k">Tramo</span><span class="v">${i+1}</span></div>
      <div class="result-row"><span class="k">Coordenadas de la estaca (E, N)</span><span class="v accent big">${fmtNum(r.X,3)}, ${fmtNum(r.Y,3)}</span></div>
      <div class="plot-wrap">${svgEjePolilinea(ejeVertsCache, {X:r.X,Y:r.Y,km:km})}</div>
    </div>`;
    const btnGuardar = document.createElement('button');
    btnGuardar.type='button'; btnGuardar.className='btn-sm'; btnGuardar.style.marginTop='8px';
    btnGuardar.textContent='💾 Guardar en la Libreta';
    btnGuardar.addEventListener('click', ()=>{ agregarPunto('Km '+fmtNum(km,3), r.X, r.Y, null); btnGuardar.textContent='Guardado ✓'; });
    box.appendChild(btnGuardar);
  });
}

/* ---------- TRANSFORMACION DE DATUM ---------- */
function renderDatumTransform(){
  const body = `<div class="field-card">
    <div class="field-row"><label for="dt_dir">Sentido</label>
      <select id="dt_dir"><option value="toSirgas" selected>PSAD56 → SIRGAS/WGS84</option><option value="toPsad">SIRGAS/WGS84 → PSAD56</option></select></div>
    <div class="field-row"><label for="dt_zona">Parámetros de traslación</label>
      <select id="dt_zona"><option value="auto" selected>Automático según la latitud (EPSG Chile)</option><option value="6949">EPSG:6949 · norte de 26°S</option><option value="6950">EPSG:6950 · 26°S a 36°S</option><option value="6951">EPSG:6951 · 36°S a 43,5°S</option><option value="manual">Manual (los ingreso yo)</option></select></div>
    <div class="field-inline2">
      ${fieldRow('Latitud (°, sur negativo)','dt_lat',-20.2133)}
      ${fieldRow('Longitud (°, oeste negativo)','dt_lon',-69.0989)}
    </div>
    ${fieldRow('Altura (m)','dt_h',1000)}
    <h3>Parámetros de traslación (ΔX, ΔY, ΔZ)</h3>
    <div class="field-inline2">
      ${fieldRow('ΔX (m)','dt_dx',-302)}
      ${fieldRow('ΔY (m)','dt_dy',272)}
    </div>
    ${fieldRow('ΔZ (m)','dt_dz',-360)}
    <button class="btn" id="btnDT" type="button">Transformar</button>
    <div id="resDT"></div>
  </div>`;
  toolShell('datumTransform','Transformación aproximada de 3 parámetros (traslación geocéntrica) entre PSAD56 y SIRGAS/WGS84. En Chile los parámetros varían por zona porque PSAD56 ajusta mal el territorio: por defecto se eligen según la latitud entre los tres juegos oficiales de EPSG (6949 al norte de 26°S, 6950 entre 26°S y 36°S, 6951 entre 36°S y 43,5°S; precisión ~5 m). Usar el juego equivocado desplaza el punto decenas de metros. Para deslindes, catastro o trabajo legal usa el transformador oficial de SIRGAS-Chile o el programa Transdatum del IGM; esta calculadora es solo para estimación y estudio.', body);
  const DATUM_ZONAS = {'6949':[-302,272,-360], '6950':[-328,340,-329], '6951':[-352,403,-287]};   // EPSG: PSAD56 → SIRGAS-Chile 2002
  const datumZonaPorLat = lat => lat>=-26 ? '6949' : (lat>=-36 ? '6950' : '6951');
  const zonaSel = document.getElementById('dt_zona'), idsParam = ['dt_dx','dt_dy','dt_dz'];
  const aplicarZona = ()=>{
    let z = zonaSel.value; if(z==='manual') return;
    if(z==='auto'){ const la = val('dt_lat'); if(isNaN(la)) return; z = datumZonaPorLat(la); }
    idsParam.forEach((id,i)=>{ document.getElementById(id).value = DATUM_ZONAS[z][i]; });
  };
  zonaSel.addEventListener('change', aplicarZona);
  document.getElementById('dt_lat').addEventListener('input', ()=>{ if(zonaSel.value==='auto') aplicarZona(); });
  idsParam.forEach(id=>document.getElementById(id).addEventListener('input', ()=>{ zonaSel.value='manual'; }));   // editar a mano => modo manual
  document.getElementById('btnDT').addEventListener('click', ()=>{
    aplicarZona();
    const lat=val('dt_lat'), lon=val('dt_lon'), h=val('dt_h'), dx=val('dt_dx'), dy=val('dt_dy'), dz=val('dt_dz');
    const dir=document.getElementById('dt_dir').value;
    const box=document.getElementById('resDT');
    if([lat,lon,h,dx,dy,dz].some(isNaN)){ box.innerHTML=`<p class="err-msg">Completa todos los campos.</p>`; return; }
    const r = calcDatumTransform(lat,lon,h,dx,dy,dz,dir);
    const zonaLat = datumZonaPorLat(lat); let aviso = '';
    if(lat>-17.5 || lat<-43.5) aviso = 'La latitud está fuera de Chile continental (17,5°S a 43,5°S): los parámetros EPSG no aplican, usa parámetros propios.';
    else if(zonaSel.value==='manual'){ const zm = Object.keys(DATUM_ZONAS).find(k=>DATUM_ZONAS[k][0]===dx && DATUM_ZONAS[k][1]===dy && DATUM_ZONAS[k][2]===dz); if(zm && zm!==zonaLat) aviso = `Ojo: ΔX, ΔY y ΔZ son los de EPSG:${zm}, pero para esta latitud corresponde EPSG:${zonaLat}.`; }
    const usados = zonaSel.value==='manual' ? 'Manuales' : `EPSG:${zonaSel.value==='auto' ? zonaLat : zonaSel.value}`;
    box.innerHTML = `<div class="results" style="margin-top:14px;">
      <div class="result-row"><span class="k">Latitud transformada</span><span class="v accent big">${fmtDMS(r.lat,'N','S')}</span></div>
      <div class="result-row"><span class="k">Longitud transformada</span><span class="v accent big">${fmtDMS(r.lon,'E','W')}</span></div>
      <div class="result-row"><span class="k">Altura</span><span class="v">${fmtNum(r.h,3)} m</span></div>
      <div class="result-row"><span class="k">Decimal</span><span class="v">${fmtNum(r.lat,7)}, ${fmtNum(r.lon,7)}</span></div>
      <div class="result-row"><span class="k">Parámetros aplicados</span><span class="v">${usados} (${dx}, ${dy}, ${dz})</span></div>
      ${aviso ? `<p class="hint" style="margin-top:8px;">${aviso}</p>` : ''}
    </div>`;
  });
}

/* Diagrama esquemático de dos puntos sobre el elipsoide, con "rosas" de azimut en cada extremo */
function svgGeodesicaEsquema(az1Deg, az2Deg, label1, label2, fuente){
  const w=300,h=190,pad=34;
  const x1=pad+16, x2=w-pad-16, ymid=h/2+18;
  const bulge=16;
  const path=`M${x1} ${ymid} Q${w/2} ${ymid-bulge} ${x2} ${ymid}`;
  const rose=(cx,cy,azDeg,color)=>{
    if(azDeg===undefined||azDeg===null||isNaN(azDeg)) return '';
    const r=16, a=toRad(azDeg);
    const ex=cx+r*Math.sin(a), ey=cy-r*Math.cos(a);
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="0.8"/>
      <line x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${color}" stroke-width="1.6"/>
      <text x="${cx}" y="${(cy-r-5).toFixed(1)}" font-size="7.5" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">N</text>
      <text x="${cx}" y="${(cy+r+11).toFixed(1)}" font-size="7.5" font-family="var(--font-mono)" fill="${color}" text-anchor="middle">Az=${fmtNum(azDeg,2)}°</text>`;
  };
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <path d="${path}" stroke="var(--blueprint)" stroke-width="2" fill="none"/>
    <circle cx="${x1}" cy="${ymid}" r="3.4" fill="var(--ink)"/>
    <circle cx="${x2}" cy="${ymid}" r="3.4" fill="var(--ink)"/>
    <text x="${x1}" y="${ymid+22}" font-size="9" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">${label1}</text>
    <text x="${x2}" y="${ymid+22}" font-size="9" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">${label2}</text>
    ${rose(x1,ymid-46,az1Deg,'var(--accent)')}
    ${rose(x2,ymid-46,az2Deg,'var(--blueprint)')}
    ${fuente?svgFuente(fuente,w,h):''}
  </svg>`;
}

  const w=300,h=210;
  const A={x:50,y:160}, B={x:110,y:30}, C={x:260,y:55}, D={x:225,y:175};
  const pts=[A,B,C,D];
  const poly = pts.map(p=>p.x+','+p.y).join(' ');
  let labels='';
  if(mode==='tri'){
    const names=['A1,B1','A2,B2','A3,B3','A4,B4'];
    pts.forEach((p,i)=>{
      const dx=p.x-161, dy=p.y-105, len=Math.hypot(dx,dy)||1;
      const lx=p.x+dx/len*20, ly=p.y+dy/len*20;
      labels += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="8.5" font-family="var(--font-mono)" fill="var(--accent-text)" text-anchor="middle">${names[i]}</text>`;
    });
  } else {
    const sideNames=['a','b','c','d'];
    for(let i=0;i<4;i++){
      const p1=pts[i], p2=pts[(i+1)%4];
      const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
      labels += `<text x="${mx.toFixed(1)}" y="${(my-6).toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--accent-text)" text-anchor="middle">${sideNames[i]}</text>`;
    }
    labels += `<text x="${((A.x+C.x)/2).toFixed(1)}" y="${((A.y+C.y)/2-6).toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--blueprint)" text-anchor="middle">e</text>`;
    labels += `<text x="${((B.x+D.x)/2+12).toFixed(1)}" y="${((B.y+D.y)/2).toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--blueprint)" text-anchor="middle">f</text>`;
  }
  const vNames=['A','B','C','D'];
  const dots = pts.map((p,i)=>{
    const dx=p.x-161, dy=p.y-105, len=Math.hypot(dx,dy)||1;
    const lx=p.x+dx/len*-16, ly=p.y+dy/len*-16;
    return `<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--ink)"/><text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9" font-family="var(--font-mono)" fill="var(--ink-soft)" text-anchor="middle">${vNames[i]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <polygon points="${poly}" fill="var(--blueprint-soft)" fill-opacity="0.25" stroke="var(--blueprint)" stroke-width="1.8"/>
    <line x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="${B.x}" y1="${B.y}" x2="${D.x}" y2="${D.y}" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="3 3"/>
    ${dots}${labels}
    ${fuente?svgFuente(fuente,w,h):''}
  </svg>`;
}

function renderRadiacion(){
  const body = `<div class="field-card">

      <div class="plot-wrap">${svgRadiacion(E0,N0,pts)}</div>
    </div>`;

    const csvRows = ['nombre,este,norte,cota'];
    pts.forEach((p,i)=> csvRows.push(`P${i+1},${p.E},${p.N},`));
    addCSVButton(box, 'radiacion.csv', csvRows.join('\n'));

    const btnGuardar = document.createElement('button');
    btnGuardar.type='button'; btnGuardar.className='btn-sm'; btnGuardar.style.marginTop='8px'; btnGuardar.style.marginLeft='8px';
    btnGuardar.textContent='💾 Guardar puntos en la Libreta';

      pts.forEach((p,i)=> agregarPunto(`P${i+1}`, p.E, p.N, null));
      btnGuardar.textContent = `Guardado (${pts.length} puntos) ✓`;
    });
    box.appendChild(btnGuardar);
  });
}

    </div>
  </div>
  <div id="aiPoints"></div>
  <button class="btn" id="btnAI" type="button">Calcular Área</button>
  <div id="resAI"></div>`;
  toolShell('areaIrregular','Área de un lote con lindero irregular (ej. borde de río o quebrada): mide ordenadas perpendiculares a intervalos iguales desde una línea base hasta el lindero, y calcula el área por Trapecios y por Simpson (más precisa; requiere número par de intervalos, es decir, número impar de ordenadas).', body);
  const draw = ()=>{
    let html='';
    for(let i=0;i<airN;i++){
      const def = (i===0||i===airN-1) ? 0 : round(3+2*Math.sin(i),2);
      html += fieldRow(`Ordenada y${i} (m)`, `ai_y_${i}`, def);
    }
    document.getElementById('aiPoints').innerHTML = html;
  };
  draw();
  document.getElementById('aiMinus').addEventListener('click', ()=>{ if(airN>3){airN--; document.getElementById('aiNVal').textContent=airN; draw();}});
  document.getElementById('aiPlus').addEventListener('click', ()=>{ if(airN<40){airN++; document.getElementById('aiNVal').textContent=airN; draw();}});
  document.getElementById('btnAI').addEventListener('click', ()=>{
    const h=val('ai_h'); const box=document.getElementById('resAI');
    const ys=[];
    for(let i=0;i<airN;i++) ys.push(val(`ai_y_${i}`));
    if(isNaN(h)||h<=0||ys.some(isNaN)){ box.innerHTML=`<p class="err-msg">Completa el intervalo y todas las ordenadas.</p>`; return; }
    const areaTrap = calcAreaTrapecios(h,ys);
    const areaSimp = calcAreaSimpson(h,ys);
    box.innerHTML = `<div class="results" style="margin-top:14px;">
      <div class="result-row"><span class="k">Área por Trapecios</span><span class="v">${fmtNum(areaTrap,2)} m²</span></div>
      <div class="result-row"><span class="k">Área por Simpson</span><span class="v accent big">${areaSimp!==null?fmtNum(areaSimp,2)+' m²':'requiere N° impar de ordenadas'}</span></div>
      <div class="plot-wrap">${svgAreaOrdenadas(h,ys)}</div>
    </div>`;
    const csvRows = ['estacion,distancia_acumulada_m,ordenada_m'];
    ys.forEach((y,i)=> csvRows.push(`y${i},${i*h},${y}`));
    addCSVButton(box, 'area_irregular.csv', csvRows.join('\n'));
  });
}

/* ---------- ESCALA DE PLANO ---------- */
function renderEscalaPlano(){
  const body = `
  <div class="field-card">
    ${fieldRow('Distancia real (m)','ep_real',250)}
    ${fieldRow('Distancia en el plano (cm)','ep_plano',5)}
    ${fieldRow('Escala (1:n)','ep_n',5000)}
  </div>`;
  toolShell('escalaPlano','Relación entre una distancia real y su representación en un plano o mapa (escala = distancia real ÷ distancia en el plano).', body);
  const realEl=document.getElementById('ep_real'), planoEl=document.getElementById('ep_plano'), nEl=document.getElementById('ep_n');
  let updating=false;
  // Regla fija (sin estado oculto de "qué se editó antes", para que el resultado sea siempre
  // predecible): Distancia real y Distancia en el plano son las 2 magnitudes medidas — al tocar
  // cualquiera de las 2 se recalcula la Escala a partir de ambas. La Escala es la magnitud derivada:
  // al tocarla se recalcula la Distancia en el plano, manteniendo fija la Distancia real (mismo
  // criterio que la 3ª tarjeta del diseño anterior: "Escala + distancia real → Distancia en el plano").
  const roundNum = (v,d)=> Math.round(v*Math.pow(10,d))/Math.pow(10,d);
  function recalcularEscala(){
    if(updating) return;
    const real=val('ep_real'), plano=val('ep_plano');
    if(isNaN(real)||isNaN(plano)||plano<=0) return;
    updating=true;
    nEl.value = roundNum(calcEscalaDesdeDistancias(real,plano),2);
    updating=false;
  }
  function recalcularPlano(){
    if(updating) return;
    const n=val('ep_n'), real=val('ep_real');
    if(isNaN(n)||isNaN(real)||n<=0) return;
    updating=true;
    planoEl.value = roundNum(calcDistanciaPlanoDesdeEscala(n,real),4);
    updating=false;
  }
  realEl.addEventListener('input', recalcularEscala);
  planoEl.addEventListener('input', recalcularEscala);
  nEl.addEventListener('input', recalcularPlano);
}

/* ===================== ACCESIBILIDAD ===================== */
let _idAuto = 0;
function mejorarAccesibilidad(){
  const main = document.getElementById('main'); if(!main) return;
  main.querySelectorAll('label:not([for])').forEach(l => {
    if(l.querySelector('input,select,textarea')) return;
    const c = l.parentElement && l.parentElement.querySelector('input:not([type=hidden]),select,textarea');
    if(!c) return;
    if(!c.id) c.id = 'a11y-' + (++_idAuto);
    l.setAttribute('for', c.id);
  });
  const sufijo = {d:'grados', m:'minutos', s:'segundos'};
  main.querySelectorAll('input:not([type=hidden]),select,textarea').forEach(c => {
    if(c.getAttribute('aria-label') || c.getAttribute('aria-labelledby') || c.title || c.closest('label')) return;
    if(c.id && main.querySelector('label[for="'+c.id+'"]')) return;
    const fila = c.closest('.field-row') || c.parentElement, et = fila && fila.querySelector('label');
    const suf = c.id && sufijo[(c.id.match(/_([dms])$/)||[])[1]];
    if(et && suf) c.setAttribute('aria-label', et.textContent.trim() + ' — ' + suf);
    else if(et) c.setAttribute('aria-label', et.textContent.trim());
  });
}
try{ new MutationObserver(()=>mejorarAccesibilidad()).observe(document.getElementById('main'), {childList:true, subtree:true}); }catch(e){}

function render(){
  const route = currentRoute();
  const goingHome = (route === 'home' || !RENDERERS[route]);
  if(!goingHome) window.scrollTo(0,0);
  if(route !== 'mapaInteractivo') stopMapaGPS();
  if(route !== 'utm') stopUtmGps();
  if(route !== 'brujula'){
    cerrarVistaAR();
    if(brujulaStop){ brujulaStop(); brujulaStop=null; }
  }
  registrarAperturaParaAnuncios(route);
  if(goingHome){
    renderHome();
    // Restaura el scroll donde estaba antes de entrar a la herramienta, en vez de volver arriba del todo.
    requestAnimationFrame(()=> window.scrollTo(0, homeScrollY));
    mejorarAccesibilidad();
    return;
  }
  RENDERERS[route]();
  mejorarAccesibilidad();
}

function applyThemeIcon(mode){
  const icon = document.getElementById('themeIcon');
  if(mode==='dark'){
    icon.innerHTML = `<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>`;
  } else if(mode==='light'){
    icon.innerHTML = `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>`;
  } else {
    icon.innerHTML = `<path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/>`;
  }
}
function loadTheme(){
  try{ return localStorage.getItem('topocalc-theme') || 'auto'; }catch(e){ return 'auto'; }
}
function saveTheme(mode){
  try{ localStorage.setItem('topocalc-theme', mode); }catch(e){}
}
let themeMode = loadTheme();
function aplicarColorBarra(){       // color de la barra del navegador según el tema que realmente se ve
  const oscuro = themeMode==='dark' || (themeMode!=='light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', oscuro ? '#10161D' : '#F4F3EF');
}
function setTheme(mode){
  themeMode = mode;
  if(mode==='auto'){ document.documentElement.removeAttribute('data-theme'); }
  else { document.documentElement.setAttribute('data-theme', mode); }
  applyThemeIcon(mode);
  aplicarColorBarra();
  saveTheme(mode);
}
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarColorBarra); }catch(e){}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const order = ['auto','light','dark'];
  const next = order[(order.indexOf(themeMode)+1) % order.length];
  setTheme(next);
});
