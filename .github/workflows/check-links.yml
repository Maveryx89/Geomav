name: Revisar enlaces rotos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Todos los lunes a las 09:00 UTC, para detectar enlaces externos
    # que se hayan caído aunque no haya cambios en el repo.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Revisar enlaces
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --config .lychee.toml
            --no-progress
            './**/*.html'
          fail: true
